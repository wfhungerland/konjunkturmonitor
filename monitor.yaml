  - id: struktur
    title: Struktur
    part: struktur
    ask: "Wie steht es um die Grundlagen des Wachstums?"
    charts:
      - {chart: potential, years: 30, forecast_after_bars: true, caption: "Das Produktionspotenzial ist die Wirtschaftsleistung, die bei normaler Auslastung von Arbeitskräften und Maschinen möglich wäre. Es lässt sich nicht beobachten, sondern wird geschätzt, hier von der Europäischen Kommission (AMECO, Frühjahrsprognose 2026) aus Arbeitsvolumen, Kapitalbestand und Produktivität. Wächst das BIP (Balken) schneller als das Potenzial (Linie), steigt die Auslastung; die Differenz der Niveaus heißt Produktionslücke. Ist sie positiv, droht eher Inflation, ist sie negativ, sind Kapazitäten ungenutzt. Gestrichelt: Prognosejahre."}
      - {chart: productivity, years: 26, caption: "Reale Wirtschaftsleistung je Erwerbstätigen und je geleisteter Arbeitsstunde. Langfristig bestimmt die Produktivität den Wohlstand."}
      - {chart: inv_ratio, years: 30, caption: "Bruttoanlageinvestitionen (Maschinen, Bauten, Software und Forschung) in Prozent des BIP, Deutschland im Vergleich zur Europäischen Union."}
      - {chart: emp_sector, type: since, base: "2022-04-01", unit: "Tsd. Personen, Veränderung seit dem 2. Quartal 2022", bar_name: "Veränderung seit 2. Quartal 2022", caption: "Veränderung der Zahl der Erwerbstätigen je Wirtschaftsbereich seit dem 2. Quartal 2022, in Tausend. Zeigt die Verschiebung von der Industrie zu den Dienstleistungen."}
      - {chart: migration, years: 30, scale: 0.000001, unit: "Mio. Personen", decimals: 2, caption: "Zuzüge minus Fortzüge über die Grenzen Deutschlands in Millionen Personen, einschließlich statistischer Anpassung. Die Zuwanderung trägt seit 2011 maßgeblich zum Wachstum der Erwerbsbevölkerung bei; 2015 und 2022 prägen die Fluchtbewegungen aus Syrien und der Ukraine."}
      - {chart: migration_groups, years: 20, scale: 0.001, unit: "Tsd. Personen", decimals: 0, ref: 0, caption: "Zuzüge minus Fortzüge nach Staatsangehörigkeit, in Tausend. Deutsche wandern seit Jahren netto ab; die Zuwanderung aus Staaten außerhalb der EU prägen Fluchtbewegungen, die aus der EU vor allem Arbeitsmigration. Ohne statistische Anpassung, deshalb weicht die Summe von Abb. zur Nettozuwanderung ab."}
      - {chart: cit, years: 30, emphasis: cit_deu, context_grey: true, caption: "Tarifliche Gesamtsteuerbelastung von Kapitalgesellschaften (Körperschaftsteuer einschließlich Zuschläge und Steuern nachgeordneter Ebenen, in Deutschland Gewerbesteuer), nach OECD. Hervorgehoben: Deutschland; grau: Vergleichsländer."}
