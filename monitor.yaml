# Konjunkturmonitor: Inhalt der Seite.
# Jede Frage bekommt eine Antwort aus den Daten (Satz, Zahl, Vergleich) und eine Erklärung in Alltagssprache.
# Die Zahlen kommen aus series.yaml (Katalog im Format von konjunkturwolf), die Sätze baut monitor/answers.py.

site:
  title: Konjunkturmonitor
  claim: "Wie steht es um die deutsche Wirtschaft? Die wichtigsten Kennzahlen mit kurzer Einordnung, werktäglich aktualisiert aus amtlichen und frei zugänglichen Daten."
  author: "Hungerland, Wolf-Fabian"
  license: "Texte und eigene Abbildungen: CC BY 4.0 (Namensnennung: Wolf-Fabian Hungerland, Konjunkturmonitor). Die Daten unterliegen den Lizenzen der jeweiligen Quellen."
  url: "https://wfhungerland.github.io/konjunkturmonitor/"

# Darstellung nach Tufte. Jeder Schalter lässt sich einzeln mit false zurücknehmen.
layout:
  start_table: true       # Startseite als Kennzahlentabelle mit Wortsparklines (false: acht Fragekarten)
  minimal: true           # ohne Kartenrahmen und Urteilsetiketten; Erläuterungen als Randnotiz
  direct_labels: true     # Beschriftung am Linienende statt Legende (bis vier Linien)
  small_multiples: true   # Abbildungen mit multiples: true als kleine Einzeldiagramme auf gleicher Skala
  compare_band: false     # Spanne 2015 bis 2019 als graues Band in Zeitreihen (true: wieder einblenden)
  uniform_years: 6        # einheitliches Zeitfenster in Jahren für Abbildungen mit 3 bis 8 Jahren (false: wie je Abbildung angegeben)
  lead_chart_only: true   # je Thema eine Leitgrafik, weitere Abbildungen aufklappbar
  overview: true          # Antwort auf die Titelfrage in zwei bis drei Sätzen über der Tabelle
  red_zero_line: false    # Nulllinie rot wie im Grafikstandard (false: dunkelgrau, Rot bleibt Warnsignalen vorbehalten)
  word_export: false      # ganze Seite als Word-Datei zum Bearbeiten (true: wieder an; dann im Workflow den Schritt „python -m monitor.shots site“ ergänzen)
  main_nav: [wachstum, preise, arbeit, industrie, konsum, insolvenzen]   # Themen in der Kopfzeile; alle übrigen unter „Alle Themen“

# Kennzahlentabelle der Startseite, gruppiert nach den Abschnitten der Seite (topic).
# kind rate: Vergleiche als Differenz; kind level: als prozentuale Veränderung. up_bad: steigender Wert ist ungünstig (rotes ▲).
start_table:
  - {label: "BIP, real", series: de_gdp_index, kind: level, scale: 1, unit: "Index 2020 = 100", mom_from: de_gdp_qoq, yoy_from: de_gdp_yoy, topic: wachstum}
  - {label: "Inflationsrate (VPI)", series: de_cpi_yoy, kind: rate, unit: "% ggü. Vorjahresmonat", up_bad: true, topic: preise}
  - {more: true, label: "Kernrate (ohne Energie und Nahrungsmittel)", series: de_vpi_core_yoy, kind: rate, unit: "% ggü. Vorjahresmonat", up_bad: true, topic: preise}
  - {more: true, label: "Erzeugerpreise", series: de_ppi_yoy, kind: rate, unit: "% ggü. Vorjahresmonat", up_bad: true, topic: preise}
  - {label: "Arbeitslosenquote", series: de_alq_sa, kind: rate, unit: "%", up_bad: true, topic: arbeit}
  - {more: true, label: "Erwerbstätige", series: de_emp_m, kind: level, scale: 0.001, decimals: 2, unit: "Mio.", change: diff, change_unit: "Tsd.", change_decimals: 0, topic: arbeit}
  - {more: true, label: "Gemeldete offene Stellen", series: de_vac_sa, kind: level, decimals: 0, unit: "Tsd.", topic: arbeit}
  - {more: true, label: "Rezessionssignal (Schwelle 0,25)", series: de_sahm, kind: rate, unit: "Pp", decimals: 2, change_decimals: 2, up_bad: true, topic: arbeit}
  - {label: "Produktion der Industrie", series: de_ip, kind: level, unit: "Index 2021 = 100", topic: industrie}
  - {label: "Auftragseingang der Industrie", series: de_orders, kind: level, unit: "Index 2021 = 100", topic: industrie}
  - {label: "Produktion im Baugewerbe", series: de_bau_prod, kind: level, unit: "Index 2021 = 100", topic: bau}
  - {label: "Einzelhandelsumsatz, real", series: de_retail, kind: level, unit: "Index 2021 = 100", topic: konsum}
  - {more: true, label: "Verbrauchervertrauen", series: de_consumer_conf, kind: rate, unit: "Saldo in Pp", topic: konsum}
  - {label: "Warenexporte, nominal", series: de_exports, kind: level, unit: "Mrd. €", topic: export}
  - {label: "Wirtschaftsklima (ESI)", series: de_esi, kind: rate, unit: "Punkte", topic: stimmung}
  - {label: "Unternehmensinsolvenzen", series: de_insolv, kind: level, decimals: 0, unit: "Anträge", seasonal: true, up_bad: true, topic: insolvenzen}
  - {label: "Rendite Bundesanleihen, 10 Jahre", series: de_bund10, kind: rate, unit: "%", decimals: 2, change_decimals: 2, topic: zinsen}
  - {label: "Rohöl Brent", series: w_brent, kind: level, unit: "US-$ je Barrel", decimals: 0, topic: energie}

questions:
  - id: wachstum
    ask: "Wächst die Wirtschaft?"
    kind: growth
    series: de_gdp_qoq
    yoy: de_gdp_yoy
    explain: "Das Bruttoinlandsprodukt (BIP) ist der Wert aller Waren und Dienstleistungen, die in Deutschland hergestellt werden. Steigt es, wird mehr produziert und mehr Einkommen erzielt."
    topic: wachstum

  - id: preise
    ask: "Steigen die Preise?"
    kind: inflation
    series: de_cpi_yoy
    index: de_vpi
    core: de_vpi_core_yoy
    parts: {Energie: de_vpi_energy_yoy, Nahrungsmittel: de_vpi_food_yoy, "Waren ohne Energie": de_vpi_goods_yoy, "Dienstleistungen ohne Mieten": de_vpi_serv_yoy, Wohnungsmiete: de_vpi_rent_yoy}
    explain: "Die Inflationsrate gibt an, um wie viel Prozent die Preise eines typischen Warenkorbs höher sind als ein Jahr zuvor. Gemessen wird sie mit dem Verbraucherpreisindex (VPI) des Statistischen Bundesamts. Die Europäische Zentralbank strebt mittelfristig 2 % an."
    topic: preise

  - id: arbeit
    ask: "Wie entwickelt sich der Arbeitsmarkt?"
    kind: unemployment
    series: de_alq_sa
    level: de_alo_sa
    explain: "Die Arbeitslosenquote ist der Anteil der bei der Bundesagentur für Arbeit gemeldeten Arbeitslosen an allen zivilen Erwerbspersonen."
    topic: arbeit

  - id: industrie
    ask: "Wie entwickelt sich die Industrie?"
    kind: index_mom
    series: de_ip
    orders: de_orders
    explain: "Die Produktion misst, wie viel die Industrie herstellt. Der Auftragseingang misst neue Bestellungen; er läuft der Produktion einige Monate voraus."
    topic: industrie

  - id: konsum
    ask: "Wie entwickelt sich der private Konsum?"
    kind: index_mom
    series: de_retail
    mood: de_consumer_conf
    explain: "Der preisbereinigte Einzelhandelsumsatz misst, wie viel die Geschäfte verkaufen. Das Verbrauchervertrauen beruht auf einer Befragung der Haushalte zu ihrer finanziellen Lage und ihren Erwartungen."
    topic: konsum

  - id: export
    ask: "Wie entwickeln sich die Exporte?"
    kind: level_mom
    series: de_exports
    explain: "Exporte sind ins Ausland verkaufte Waren. Die Exporte von Waren und Dienstleistungen entsprechen in Deutschland fast der Hälfte des Bruttoinlandsprodukts."
    topic: export

  - id: stimmung
    ask: "Wie schätzen Unternehmen und Haushalte die Lage ein?"
    kind: sentiment
    series: de_esi
    explain: "Jeden Monat fragt die EU-Kommission Unternehmen und Haushalte nach ihrer Lage und ihren Erwartungen. Der Wirtschaftsklimaindikator ist so normiert, dass 100 dem langjährigen Durchschnitt entspricht; höhere Werte zeigen eine überdurchschnittliche Stimmung."
    topic: stimmung

  - id: insolvenzen
    ask: "Wie viele Unternehmen beantragen Insolvenz?"
    kind: insolvency
    series: de_insolv
    employees: de_insolv_emp
    claims: de_insolv_claims
    explain: "Ein Insolvenzverfahren wird beantragt, wenn ein Unternehmen zahlungsunfähig oder überschuldet ist. Da die Zahl der Anträge im Jahresverlauf schwankt, vergleicht der Monitor mit demselben Monat früherer Jahre."
    topic: insolvenzen

  - id: zinsen
    ask: "Wie entwickeln sich die Zinsen?"
    kind: level
    series: de_bund10
    name: "die Rendite zehnjähriger Bundesanleihen"
    unit: "%"
    decimals: 2
    explain: "Die Rendite von Bundesanleihen ist der Zins, den der Bund für neue Kredite am Kapitalmarkt zahlt. Sie dient als Richtwert für langfristige Kredite an Unternehmen und für Baufinanzierungen."
    topic: zinsen

  - id: energie
    ask: "Wie entwickeln sich die Energiepreise?"
    kind: level
    series: w_brent
    name: "der Preis für Rohöl der Sorte Brent"
    unit: "US-Dollar je Barrel"
    decimals: 1
    also: [{series: w_gas_eu, label: "Erdgas in Europa (TTF)", unit: "US-Dollar je MMBtu", decimals: 1}]
    explain: "Öl- und Gaspreise wirken schnell auf die Verbraucherpreise für Kraftstoffe und Heizung und mit Verzögerung auf die Kosten der Industrie. Die Preise werden in US-Dollar gehandelt; ein schwächerer Euro verteuert sie in Euro gerechnet."
    topic: energie

# Themen: je Frage ein Abschnitt mit Abbildungen. type: line (Standard), bars, stacked, clock, forecast, threshold.
topics:
  - id: wachstum
    title: Wachstum
    charts:
      - {chart: gdp_contrib, ask: "Welche Nachfrage trägt das Wachstum?", type: stacked, total: de_gdp_qoq, years: 3, keep_years: true, groups: {Konsum: [P31_S14_S15, P3_S13], Investitionen: [P51G], Außenhandel: [P6, P7], Lager: [P52_P53]}, caption: "Balken: Beiträge der Verwendungsseite zum Wachstum ggü. Vorquartal in Prozentpunkten: Konsum der Haushalte und des Staates, Investitionen, Außenhandel (Exporte minus Importe) und Vorratsveränderung (Lager). Linie: Wachstum des BIP insgesamt in %. Die Summe der Balken ergibt bis auf Rundung die Linie."}
      - {chart: wai, ask: "Was zeigen die Wochendaten zur Wirtschaftsleistung?", years: 3, ref: 0, caption: "Der Aktivitätsindex der Bundesbank schätzt aus wöchentlichen Daten (etwa Lkw-Maut, Stromverbrauch, Suchanfragen), wie stark die Wirtschaftsleistung in den letzten 13 Wochen gegenüber den 13 Wochen davor gewachsen ist. Er liegt früher vor als das BIP, ist aber eine Schätzung."}
      - {chart: maut, ask: "Wie viel fahren die Lkw auf den Autobahnen?", years: 6, ma3: true, caption: "Fahrleistung mautpflichtiger Lkw ab vier Achsen auf Autobahnen, ermittelt aus den Mautdaten. Der Index liegt wenige Tage nach Monatsende vor und folgt eng der Industrieproduktion, weil diese Lkw vor allem Vorleistungen und Waren transportieren. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: gdp_level, ask: "Wo steht die Wirtschaftsleistung im längeren Vergleich?", years: 12, caption: "Wirtschaftsleistung, preisbereinigt, 2020 = 100. Der Einbruch 2020 geht auf die Corona-Pandemie zurück. Die Veränderung gegenüber dem Vorjahr ist hier saison- und kalenderbereinigt; die Übersicht nennt wie die Schnellmeldung des Statistischen Bundesamts die unbereinigte Rate, daher können beide um 0,1 Prozentpunkte abweichen."}
      - {chart: gdp_use, ask: "Wie haben sich die Verwendungskomponenten im letzten Quartal entwickelt?", type: latest, years: 2, caption: "Balken: Veränderung im letzten Quartal, preisbereinigt. Raute: das Quartal davor. Investitionen aufgeteilt in Ausrüstungen (Maschinen, Fahrzeuge, Waffensysteme), Bauten und sonstige Anlagen (vor allem Software und Forschung)."}
  - id: preise
    title: Preise
    charts:
      - {chart: cpi, ask: "Welche Bereiche werden teurer?", multiples: true, up_bad: true, years: 6, emphasis: de_cpi_yoy, ref: 2, caption: "Inflationsrate nach dem Verbraucherpreisindex (VPI) des Statistischen Bundesamts, insgesamt und für fünf Bereiche. Je Feld ist ein Bereich dunkelblau hervorgehoben, die übrigen stehen grau zum Vergleich dahinter; alle Felder haben dieselbe Skala. Über jedem Feld: jüngster Wert mit Tendenz zum Vormonat sowie die Mittel der letzten 3 und 12 Monate. Gestrichelt: 2 %, das Ziel der EZB (es bezieht sich auf den europäischen HVPI, der in Deutschland meist nahe am VPI liegt). „Dienstleistungen ohne Mieten“ schließt tatsächliche und unterstellte Wohnungsmieten aus und weicht deshalb von der Rate für Dienstleistungen insgesamt ab, die das Statistische Bundesamt meldet."}
      - {chart: cpi_contrib, ask: "Woraus setzt sich die Inflationsrate zusammen?", type: contrib, total: de_vpi, years: 3, parts: {Energie: de_vpi_energy, Nahrungsmittel: de_vpi_food, "Waren ohne Energie": de_vpi_goods, "Dienstleistungen und Miete": [de_vpi_serv, de_vpi_rent]}, caption: "Anteil der Bereiche an der Inflationsrate in Prozentpunkten; umschaltbar zwischen Vorjahres- und Vormonatsvergleich. Eigene Berechnung: Gewichte der Bereiche aus den VPI-Teilindizes seit 2020 geschätzt; Rest gleicht Rundung und nicht getrennt erfasste Teile aus."}
      - {chart: cpi_core, ask: "Wie hoch ist der zugrunde liegende Preisauftrieb?", years: 6, up_bad: true, emphasis: de_vpi_core_yoy, ref: 2, caption: "Dicke Linie: Kernrate, die Inflationsrate des VPI ohne die stark schwankenden Preise für Energie und Nahrungsmittel; sie zeigt den zugrunde liegenden Preistrend. Dünne Linien: VPI insgesamt und der europäische HVPI, auf den sich das Ziel der EZB bezieht. Gestrichelt: 2 %, das Ziel der EZB."}
      - {chart: deflator, ask: "Wie entwickeln sich die Preise in der Gesamtrechnung?", up_bad: true, years: 8, caption: "Deflatoren der Volkswirtschaftlichen Gesamtrechnungen: Preisentwicklung aller im Inland erzeugten Güter (BIP-Deflator) und des privaten Konsums."}
      - {chart: pipeline_prices, ask: "Steigen die Preise auf den Vorstufen?", years: 6, up_bad: true, caption: "Preise auf vorgelagerten Stufen: Erzeugerpreise im Inlandsabsatz und Einfuhrpreise. Sie laufen den Verbraucherpreisen häufig voraus."}
      - {chart: pipeline_core, ask: "Breiten sich Kostensteigerungen über Energie hinaus aus?", up_bad: true, years: 6, caption: "Vorstufenpreise ohne Energie zeigen, ob sich Kostensteigerungen über Energie hinaus ausbreiten. Agrarpreise wirken mit Verzögerung auf die Nahrungsmittelpreise."}
      - {chart: enso, ask: "Treibt El Niño die Nahrungsmittelpreise?", type: event, caption: "Ereignisstudie: Verlauf der Preise ab dem Beginn sehr starker El-Niño-Ereignisse (Monat 0 = 100), bereinigt um die allgemeine Teuerung. Links: Nahrungsmittel im Verbraucherpreisindex im Verhältnis zum Gesamtindex (ab 1995). Rechts: Erzeugerpreise landwirtschaftlicher Produkte im Verhältnis zu den Verbraucherpreisen (bis 1990 früheres Bundesgebiet, Deflator dort der OECD-Verbraucherpreisindex). Graue Fläche: Spanne früherer sehr starker Ereignisse; Linien: einzelne Ereignisse, dick das laufende. Beginn: erster Monat einer Folge, in der der Relative Oceanic Niño Index (RONI) der NOAA mindestens 0,5 °C erreicht; sehr stark: Höchstwert ab 2 °C. El Niño verknappt über Dürren und Starkregen vor allem in Südasien, Afrika und Südamerika Ernten; in Deutschland wirkt das über Weltmarktpreise für Getreide, Pflanzenöle, Kakao und Kaffee, abgeschwächt und verzögert."}
      - {chart: price_exp, ask: "Welche Preise erwarten Unternehmen und Verbraucher?", multiples: true, up_bad: true, years: 6, caption: "Saldo aus Anteilen der Befragten, die steigende beziehungsweise sinkende Preise erwarten (EU-Umfragen). Unternehmen: nächste drei Monate; Verbraucher: nächste zwölf Monate. Je Feld ist ein Bereich dunkelblau hervorgehoben, die übrigen stehen grau zum Vergleich dahinter; alle Felder haben dieselbe Skala. Über jedem Feld: jüngster Wert mit Tendenz zum Vormonat sowie die Mittel der letzten 3 und 12 Monate."}
  - id: arbeit
    title: Arbeit
    charts:
      - {chart: labour, ask: "Wie hoch ist die Arbeitslosigkeit?", up_bad: [de_alq_sa, de_ilo], years: 12, caption: "Zwei Messungen der Arbeitslosigkeit. Die registrierte Quote der Bundesagentur für Arbeit zählt Menschen, die bei einer Arbeitsagentur oder einem Jobcenter arbeitslos gemeldet sind. Die Erwerbslosenquote nach der Definition der Internationalen Arbeitsorganisation (ILO) beruht auf einer Befragung: erwerbslos ist, wer keine Arbeit hat, aktiv sucht und kurzfristig verfügbar ist. Sie liegt in Deutschland deutlich niedriger und ist international vergleichbar. Beide saisonbereinigt."}
      - {chart: labour_flows, ask: "Wie entwickeln sich Arbeitslose und offene Stellen?", up_bad: [de_alo_sa], years: 12, caption: "Steigt die Arbeitslosigkeit, während die Zahl offener Stellen sinkt, deutet dies auf eine Abkühlung des Arbeitsmarkts hin."}
      - {chart: employment_m, ask: "Wie viele Menschen sind erwerbstätig?", years: 6, caption: "Erwerbstätige umfassen auch Selbständige und Beamte; sozialversicherungspflichtig Beschäftigte sind der größte Teil davon."}
      - {chart: sahm, ask: "Deutet der Arbeitsmarkt auf eine Rezession hin?", up_bad: true, years: 20, type: threshold, threshold: 0.25, caption: "Eigene Berechnung nach Michaillat und Saez (2025). Das Signal ist der kleinere von zwei Werten. Erstens: Arbeitslosenquote einschließlich Kurzarbeit (in Vollzeitäquivalenten), gleitendes Dreimonatsmittel, minus ihr Tief der letzten zwölf Monate. Zweitens: Hoch der Quote offener Stellen in den letzten zwölf Monaten minus ihr aktuelles Dreimonatsmittel. Das Signal steigt also nur, wenn die Arbeitslosigkeit zunimmt und zugleich die offenen Stellen abnehmen. Die Schwelle von 0,25 Prozentpunkten ist eigene Wahl für Deutschland; Michaillat und Saez nennen für die USA 0,29. Rot gestrichelt: Schwelle. Graue Flächen: Rezessionen nach der Datierung des Sachverständigenrats. Jede Rezession seit 2001 überschritt die Schwelle, teils mit erheblicher Verzögerung. Literatur: Michaillat, P. und Saez, E. (2025), Has the Recession Started?, Oxford Bulletin of Economics and Statistics; Sahm, C. (2019), Direct Stimulus Payments to Individuals, Brookings Institution."}
      - {chart: kurzarbeit, ask: "Wie viele Beschäftigte sind in Kurzarbeit?", up_bad: true, years: 12, scale: 0.001, unit: "Tsd. Personen", decimals: 0, caption: "Beschäftigte in Kurzarbeit aus wirtschaftlichen Gründen (§ 96 SGB III), in Tausend. Kurzarbeit hält Beschäftigte im Betrieb, wenn Aufträge vorübergehend fehlen; sie steigt in Abschwüngen früher als die Arbeitslosigkeit. Die jüngsten Monate beruhen auf Hochrechnungen der Bundesagentur für Arbeit."}
      - {chart: sv_yoy, ask: "In welchen Bereichen wächst die Beschäftigung?", years: 6, caption: "Sozialversicherungspflichtig Beschäftigte nach Bereichen, Veränderung gegenüber dem Vorjahresmonat. Leiharbeit reagiert als Erstes auf eine schwächere Nachfrage, weil Betriebe zuerst ausgeliehene Kräfte abbauen."}
  - id: industrie
    title: Industrie
    charts:
      - {chart: industry, ask: "Wie entwickeln sich Produktion und Aufträge der Industrie?", years: 6, ma3: true, caption: "Dünn: Monatswerte. Dick: gleitendes Dreimonatsmittel. Der Auftragseingang läuft der Produktion voraus."}
      - {chart: orders_split, ask: "Kommen die Aufträge aus dem Inland oder aus dem Ausland?", years: 6, ma3: true, caption: "Auftragseingang nach Herkunft. Großaufträge, etwa für Flugzeuge, Schiffe oder Rüstungsgüter, führen zu einzelnen starken Ausschlägen. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: orders_euro, ask: "Wie entwickeln sich die Aufträge aus dem Euroraum und von außerhalb?", years: 6, ma3: true, caption: "Aufträge aus dem Ausland, getrennt nach Euroraum und übriger Welt. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: rhine, ask: "Ist der Rhein für Frachtschiffe gut befahrbar?", daily: true, years: 3, threshold: 78, recessions: false, caption: "Wasserstand am Pegel Kaub, dem Engpass für die Rheinschifffahrt zwischen Mainz und Koblenz, Tagesmittel in cm. Über den Rhein transportieren Chemie, Stahl, Mineralöl und Kohle große Mengen. Rot gestrichelt: 78 cm. Nach einer Faustregel des IfW Kiel sinkt die Industrieproduktion um etwa 1 %, wenn der Pegel einen Monat lang unter dieser Marke liegt. Bis Ende des Vorjahres geprüfte Pegeldaten der WSV (Bundesanstalt für Gewässerkunde), danach PEGELONLINE."}
      - {chart: rhine_low, ask: "Wie oft war der Rhein seit 1970 zu flach?", years: 57, recessions: false, caption: "Zahl der Tage je Kalenderjahr, an denen der Wasserstand am Pegel Kaub im Tagesmittel unter 78 cm lag; laufendes Jahr bis zum jüngsten Tag. Lange Niedrigwasserphasen wie 2018 und 2022 verteuerten Transporte und bremsten die Industrie. Quelle: geprüfte Pegeldaten der WSV, bereitgestellt durch die Bundesanstalt für Gewässerkunde (R-Paket hyd1d); jüngste Werte aus PEGELONLINE."}
      - {chart: branch_heat, ask: "Welche Branchen produzieren mehr, welche weniger?", type: heat, months: 12, caption: "Tabelle: Produktion je Branche ggü. Vorjahresmonat in %; orange: Zunahme, blau: Abnahme. Sortiert nach dem Dreimonatsvergleich (letzte drei Monate ggü. den drei Monaten davor). Rechte Spalten: Dreimonatsvergleich und Niveau ggü. dem Durchschnitt 2019; beide als Balken in der folgenden Abbildung."}
      - {chart: orders_heat, ask: "Welche Branchen erhalten mehr Aufträge?", type: heat, months: 12, caption: "Tabelle: Auftragseingang je Branche ggü. Vorjahresmonat in %, preisbereinigt; orange: Zunahme, blau: Abnahme. Sortiert nach dem Dreimonatsvergleich. Rechte Spalten: Dreimonatsvergleich und Niveau ggü. dem Durchschnitt 2019; beide als Balken in der folgenden Abbildung. Großaufträge, vor allem im sonstigen Fahrzeugbau, verzerren einzelne Monate."}
      - {chart: prod_groups, ask: "Welche Gütergruppen tragen die Produktion?", years: 6, ma3: true, caption: "Vorleistungsgüter werden weiterverarbeitet (etwa Stahl, Chemie), Investitionsgüter sind vor allem Maschinen und Fahrzeuge, Konsumgüter werden von privaten Haushalten gekauft. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: sales, ask: "Wie entwickelt sich der Umsatz der Industrie?", years: 6, ma3: true, caption: "Umsatz der Industrie in jeweiligen Preisen, also nicht preisbereinigt; insgesamt, nach Absatzgebiet und für Investitionsgüter. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
  - id: bau
    title: Bau
    ask: "Wie entwickelt sich der Bau?"
    charts:
      - {chart: bau_orders, ask: "Wie entwickeln sich die Aufträge im Bau?", years: 6, ma3: true, caption: "Aufträge im Bauhauptgewerbe, preisbereinigt, insgesamt und nach Bauart. Einzelne Großprojekte führen zu starken Ausschlägen. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: permits, ask: "Wird bald mehr gebaut?", years: 6, ma3: true, recessions: false, caption: "Zahl der genehmigten Wohnungen je Monat in Tausend (Statistisches Bundesamt), in neuen Gebäuden und durch Baumaßnahmen an bestehenden Gebäuden. Genehmigungen laufen dem Wohnungsbau um etwa ein bis zwei Jahre voraus; nicht jede Genehmigung wird gebaut."}
      - {chart: house_prices, ask: "Wie entwickeln sich die Preise für Wohnimmobilien?", years: 12, ref: 0, caption: "Häuserpreisindex des Statistischen Bundesamts: Preise für neu erstellte und bestehende Wohnimmobilien (Häuser und Eigentumswohnungen), ggü. dem Vorjahresquartal. Erscheint mit rund drei Monaten Abstand zum Quartalsende."}
      - {chart: weather, ask: "War das Wetter für den Bau ungewöhnlich?", multiples: true, no_yoy: true, own_scale: true, years: 6, ref: 0, recessions: false, caption: "Monatswerte des Deutschen Wetterdienstes für ganz Deutschland. Temperatur: Abweichung vom Mittel desselben Monats 1991 bis 2020 in °C. Niederschlag: in % des Mittels desselben Monats 1991 bis 2020. Ein sehr kalter, frostiger oder nasser Wintermonat drückt die Bauproduktion, ein milder hebt sie; die Ausschläge gleichen sich meist in den Folgemonaten aus. Auffällige Monate erscheinen in der Abbildung zur Bauproduktion unter „Ausschläge und Sondereffekte“."}
      - {chart: bau_prod, ask: "Wie viel wird gebaut?", years: 6, ma3: true, caption: "Bauproduktion. Das Ausbaugewerbe umfasst Installation, Elektrik und Innenausbau. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
  - id: dienstleistungen
    title: Dienstleistungen
    ask: "Wie entwickeln sich die Dienstleister?"
    charts:
      - {chart: services, ask: "Wie entwickelt sich die Produktion der Dienstleister?", years: 6, ma3: true, caption: "Preisbereinigte Produktion ausgewählter Dienstleistungsbereiche. „Insgesamt“ umfasst Verkehr und Lagerei, Gastgewerbe, Information und Kommunikation, Grundstücks- und Wohnungswesen sowie freiberufliche, technische und sonstige Unternehmensdienste; Handel, Finanzen und Staat sind nicht enthalten. Dienstleister erzeugen gut zwei Drittel der Wertschöpfung, werden aber monatlich nur lückenhaft erfasst. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
  - id: konsum
    title: Konsum
    charts:
      - {chart: retail, ask: "Wie viel verkauft der Einzelhandel?", years: 6, ma3: true, caption: "Umsatz des Einzelhandels ohne Kfz-Handel, preisbereinigt, also die verkaufte Menge. Der Einzelhandel steht für rund ein Drittel des privaten Konsums; Dienstleistungen, Mieten und Autos sind nicht enthalten. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: retail_split, ask: "Welche Sortimente verkaufen sich besser?", years: 6, ma3: true, caption: "Umsatz nach Sortimenten, preisbereinigt. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: hospitality, ask: "Wie entwickelt sich das Gastgewerbe?", years: 6, ma3: true, caption: "Umsatz von Restaurants und Hotels, preisbereinigt. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: cars, ask: "Kaufen die Haushalte neue Autos?", years: 6, ma3: true, caption: "Neu zugelassene Pkw privater Halter in Tausend je Monat. Ein Indikator für die Bereitschaft der Haushalte zu größeren Anschaffungen. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: consumer, ask: "Wie zuversichtlich sind die Verbraucher?", years: 12, caption: "Saldo aus positiven und negativen Antworten der Haushalte. Werte unter null bedeuten, dass negative Einschätzungen überwiegen."}
  - id: einkommen
    title: Einkommen
    ask: "Wie entwickeln sich Einkommen und Verteilung?"
    charts:
      - {chart: wages, ask: "Steigen die Löhne schneller als die Preise?", years: 12, ref: 0, caption: "Nominallohnindex: durchschnittliche Bruttomonatsverdienste einschließlich Sonderzahlungen; Reallohnindex: Nominallohnindex bereinigt um die Entwicklung der Verbraucherpreise. Liegt die Reallohnrate über null, steigen die Löhne schneller als die Preise. Veränderung gegenüber dem Vorjahresquartal."}
      - {chart: hh_income, ask: "Wie entwickeln sich die Einkommen der Haushalte?", years: 12, caption: "Verfügbares Einkommen der privaten Haushalte je Einwohner, also Löhne, Gewinne, Vermögenseinkommen und Sozialleistungen nach Steuern und Abgaben, bereinigt um die Preisentwicklung des Konsums. 2010 = 100."}
      - {chart: saving, ask: "Wie viel sparen die Haushalte?", years: 12, caption: "Anteil des verfügbaren Einkommens, den die Haushalte nicht für Konsum ausgeben. Eine steigende Sparquote dämpft den Konsum, oft aus Vorsicht in unsicheren Zeiten."}
      - {chart: profit_share, ask: "Wie verteilt sich die Wertschöpfung auf Gewinne und Löhne?", years: 12, caption: "Bruttobetriebsüberschuss der nichtfinanziellen Unternehmen in Prozent ihrer Wertschöpfung. Steigt die Gewinnquote, entfällt ein größerer Teil der Wertschöpfung auf Gewinne und ein kleinerer auf Löhne."}
  - id: export
    title: Export
    charts:
      - {chart: trade, ask: "Wie entwickeln sich Exporte und Importe?", years: 6, ma3: true, caption: "Warenexporte, Warenimporte und ihr Saldo (Exporte minus Importe) in Milliarden Euro je Monat. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: trade_region, ask: "Wohin exportiert Deutschland?", years: 6, ma3: true, caption: "Warenexporte in die wichtigsten Kundenregionen in Milliarden Euro je Monat. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: trade_prices, ask: "Wie entwickeln sich die Außenhandelspreise?", years: 6, caption: "Ausfuhrpreise und Terms of Trade, also die Ausfuhrpreise im Verhältnis zu den Einfuhrpreisen. Steigen die Terms of Trade, kann Deutschland mit derselben Exportmenge mehr Importe finanzieren."}
      - {chart: balances, ask: "Wie hoch ist der Leistungsbilanzüberschuss?", years: 6, caption: "Saldo der Leistungsbilanz (Waren, Dienstleistungen, Primär- und Sekundäreinkommen) je Monat, nicht saisonbereinigt."}
      - {chart: esi, recessions: false, ask: "Wer konkurriert mit ähnlichen Waren wie Deutschland?", emphasis: esi_chn, caption: "Ähnlichkeit der Warenstruktur der Exporte eines Landes mit derjenigen Deutschlands: 0 bedeutet keine Überschneidung, 100 eine identische Struktur (Finger und Kreinin 1979, je Warengruppe zählt der kleinere Anteil). Hohe Werte bedeuten, dass beide Länder auf den Weltmärkten mit ähnlichen Waren konkurrieren. Hervorgehoben: China."}
  - id: welt
    title: Welt
    ask: "Wie entwickelt sich die Weltwirtschaft?"
    charts:
      - {chart: world_gdp, recessions: false, ask: "Wie wachsen die großen Wirtschaftsräume?", years: 8, ref: 0, caption: "Reales BIP gegenüber dem Vorjahresquartal. Der Euroraum nimmt rund 37 % der deutschen Warenexporte auf, die USA rund 10 %."}
      - {chart: ez_gdp, ask: "Wächst Deutschland schneller oder langsamer als seine Nachbarn?", multiples: true, years: 6, ref: 0, caption: "Reales BIP ggü. dem Vorjahresquartal, saison- und kalenderbereinigt (Eurostat), für Deutschland, Frankreich, Italien, Spanien und den Euroraum. Je Feld ist ein Land dunkelblau hervorgehoben, die übrigen stehen grau dahinter; alle Felder haben dieselbe Skala. Zusammen erwirtschaften die vier Länder rund drei Viertel der Wirtschaftsleistung des Euroraums."}
      - {chart: ez_hicp, ask: "Ist die Inflation in Deutschland höher als bei den Nachbarn?", multiples: true, up_bad: true, years: 6, ref: 2, caption: "Harmonisierter Verbraucherpreisindex (HVPI) ggü. dem Vorjahresmonat (Eurostat, ab 2026 nach der neuen Gütergliederung ECOICOP 2). Der HVPI ist international vergleichbar und Grundlage des Inflationsziels der EZB von 2 % (gestrichelt). Für Deutschland weicht er vom nationalen VPI meist nur wenig ab. Je Feld ein Land hervorgehoben, alle Felder auf derselben Skala."}
      - {chart: ez_unemp, ask: "Wie hoch ist die Arbeitslosigkeit im Vergleich?", multiples: true, up_bad: true, years: 6, caption: "Erwerbslosenquote nach der Definition der Internationalen Arbeitsorganisation (ILO), saisonbereinigt (Eurostat, Euroraum: EZB): Anteil der Erwerbslosen an allen Erwerbspersonen. Sie ist international vergleichbar und liegt in Deutschland deutlich unter der registrierten Arbeitslosenquote der Bundesagentur für Arbeit. Je Feld ein Land hervorgehoben, alle Felder auf derselben Skala."}
      - {chart: uncertainty, ask: "Wie unsicher ist die Wirtschaftspolitik?", up_bad: true, years: 8, caption: "Index der wirtschaftspolitischen Unsicherheit nach Baker, Bloom und Davis, ermittelt aus der Häufigkeit einschlägiger Begriffe in Zeitungsartikeln; Mittel 1997 bis 2015 = 100. Hohe Unsicherheit lässt Unternehmen Investitionen aufschieben."}
  - id: stimmung
    title: Stimmung
    charts:
      - {chart: clock, ask: "In welcher Konjunkturphase steht die Industrie?", type: clock, x: de_ind_orderbooks, y: de_ind_prodexp, months: 24, caption: "Waagerecht: Wie bewerten Industrieunternehmen ihre Aufträge heute? Senkrecht: Was erwarten sie für die nächsten drei Monate? Beides als Abstand zum Durchschnitt 2005 bis 2019. Die Spur zeigt die letzten 24 Monate, der große Punkt den jüngsten Monat, die Pfeile die Richtung. Im typischen Konjunkturzyklus bewegt sich der Punkt im Uhrzeigersinn durch die vier farbig hinterlegten Phasen: Aufschwung, Boom, Abschwung, Rezession."}
      - {chart: sentiment, ask: "Wie ist die Stimmung in den Wirtschaftsbereichen?", years: 6, caption: "Saldo aus positiven und negativen Antworten je Bereich (EU-Umfragen)."}
      - {chart: sector_now, ask: "Wie bewerten die Bereiche ihre aktuelle Lage?", multiples: true, years: 6, caption: "Einschätzung der Geschäftsentwicklung der vergangenen drei Monate, Saldo aus positiven und negativen Antworten (EU-Umfragen). Je Feld ist ein Bereich dunkelblau hervorgehoben, die übrigen stehen grau zum Vergleich dahinter; alle Felder haben dieselbe Skala. Über jedem Feld: jüngster Wert mit Tendenz zum Vormonat sowie die Mittel der letzten 3 und 12 Monate."}
      - {chart: sector_next, ask: "Was erwarten die Bereiche für die nächsten Monate?", multiples: true, years: 6, caption: "Erwartungen für die kommenden drei Monate, Saldo aus positiven und negativen Antworten (EU-Umfragen). Im Bau erfasst die Umfrage hierzu die Beschäftigungspläne. Je Feld ist ein Bereich dunkelblau hervorgehoben, die übrigen stehen grau zum Vergleich dahinter; alle Felder haben dieselbe Skala. Über jedem Feld: jüngster Wert mit Tendenz zum Vormonat sowie die Mittel der letzten 3 und 12 Monate."}
      - {chart: capacity, ask: "Wie stark sind die Kapazitäten der Industrie ausgelastet?", years: 12, caption: "Auslastung der Produktionskapazitäten in der Industrie in Prozent, vierteljährliche Umfrage."}
  - id: insolvenzen
    title: Insolvenzen
    charts:
      - {chart: insolv, ask: "Wie viele Unternehmen beantragen Insolvenz?", type: seasonal, series: de_insolv, years: 11, caption: "Beantragte Insolvenzverfahren von Unternehmen je Monat. Dünn: Monatswerte. Dick: gleitendes Zwölfmonatsmittel, das saisonale Schwankungen ausgleicht. Gestrichelt: Vorkrisenniveau, gemessen als Durchschnitt desselben Monats 2015 bis 2019."}
      - {chart: insolv_land, ask: "In welchen Ländern steigen die Insolvenzen?", type: tiles, prefix: de_insolv_land_, what: "Zahl der Insolvenzanträge", caption: "Beantragte Unternehmensinsolvenzen je Land, Veränderung ggü. demselben Zeitraum ein Jahr zuvor; umschaltbar zwischen 12 und 6 Monaten. Orange: Zunahme, blau: Abnahme. Die Liste rechts ordnet die Länder nach der Veränderung."}
      - {chart: insolv_emp, ask: "Wie viele Beschäftigte sind betroffen?", type: seasonal, series: de_insolv_emp, years: 11, caption: "Beschäftigte in Unternehmen, die Insolvenz beantragt haben. Einzelne Großinsolvenzen führen zu starken Ausschlägen. Dünn: Monatswerte. Dick: gleitendes Zwölfmonatsmittel, das saisonale Schwankungen ausgleicht. Gestrichelt: Vorkrisenniveau, gemessen als Durchschnitt desselben Monats 2015 bis 2019."}
      - {chart: insolv_claims, ask: "Wie hoch sind die Forderungen der Gläubiger?", type: seasonal, series: de_insolv_claims, years: 11, caption: "Voraussichtliche Forderungen der Gläubiger in Milliarden Euro. Dünn: Monatswerte. Dick: gleitendes Zwölfmonatsmittel, das saisonale Schwankungen ausgleicht. Gestrichelt: Vorkrisenniveau, gemessen als Durchschnitt desselben Monats 2015 bis 2019."}
      - {chart: gruend_land, ask: "Wo werden mehr Betriebe gegründet?", type: tiles, prefix: de_gruend_land_, what: "Zahl der Betriebsgründungen", caption: "Gründungen von Betrieben mit größerer wirtschaftlicher Bedeutung (Hauptniederlassung) je Land, Veränderung ggü. demselben Zeitraum ein Jahr zuvor. Orange: Zunahme, blau: Abnahme. Die Liste rechts ordnet die Länder nach der Veränderung."}
      - {chart: aufgabe_land, ask: "Wo werden mehr Betriebe aufgegeben?", type: tiles, prefix: de_aufgabe_land_, what: "Zahl der Betriebsaufgaben", caption: "Vollständige Aufgaben von Betrieben mit größerer wirtschaftlicher Bedeutung (Hauptniederlassung) je Land, Veränderung ggü. demselben Zeitraum ein Jahr zuvor. Orange: Zunahme, blau: Abnahme. Die Liste rechts ordnet die Länder nach der Veränderung."}
  - id: zinsen
    title: Zinsen und Kredite
    charts:
      - {chart: credit_rates, ask: "Wie teuer sind Kredite?", years: 10, caption: "Effektive Zinssätze der Banken in Deutschland für neu vergebene Kredite (Neugeschäft), gewichtet über alle Laufzeiten: an nichtfinanzielle Unternehmen und an private Haushalte für den Wohnungsbau (EZB, MFI-Zinsstatistik). Sie folgen den Leitzinsen der EZB und den Kapitalmarktzinsen mit Verzögerung."}
      - {chart: credit_growth, ask: "Vergeben die Banken mehr Kredite?", years: 10, ref: 0, caption: "Bestand der Bankkredite an nichtfinanzielle Unternehmen und der Wohnungsbaukredite an private Haushalte in Deutschland, ggü. dem Vorjahresmonat, bereinigt um Umbuchungen und Bewertungsänderungen (EZB, Bilanzstatistik). Ein schwaches Kreditwachstum deutet auf geringe Investitionen oder strenge Kreditvergabe hin."}
      - {chart: yields, ask: "Wie hoch sind die Zinsen für Bundesanleihen?", years: 10, caption: "Rendite von Bundesanleihen mit 10 und 2 Jahren Restlaufzeit, Monatsmittel. Sie beeinflusst die Finanzierungskosten von Staat, Unternehmen und privaten Bauherren."}
  - id: wechselkurse
    title: Wechselkurse
    ask: "Wie entwickelt sich der Euro?"
    charts:
      - {chart: fx_usd, ask: "Wie viel US-Dollar kostet ein Euro?", daily: true, years: 3, keep_years: true, recessions: false, caption: "Referenzkurs der Europäischen Zentralbank: wie viele US-Dollar ein Euro kostet, an jedem Arbeitstag gegen 16 Uhr festgestellt. Steigt die Linie, wird der Euro teurer: Importe aus dem Dollarraum, auch Rohöl und Gas, werden in Euro billiger, deutsche Exporte im Dollarraum teurer."}
      - {chart: fx_eer, ask: "Wird der Euro gegenüber allen Handelspartnern teurer?", daily: true, years: 3, keep_years: true, recessions: false, caption: "Nominaler effektiver Wechselkurs der EZB: ein gewichteter Durchschnitt der Euro-Kurse gegenüber den Währungen der Handelspartner des Euroraums, gewichtet nach deren Anteil am Handel. 1. Quartal 1999 = 100. Die breite Gruppe umfasst 41 Partner, die enge 18 (unter anderem USA, China, Vereinigtes Königreich, Schweiz, Japan). Steigt der Index, wird der Euro im Durchschnitt teurer; das verteuert Exporte und verbilligt Importe. Die breite Gruppe liegt höher, weil viele Währungen aufstrebender Länder seit 1999 gegenüber dem Euro an Wert verloren haben."}
      - {chart: fx, ask: "Wie entwickelt sich der Euro gegenüber wichtigen Währungen?", daily: true, multiples: true, own_scale: true, years: 3, keep_years: true, recessions: false, caption: "Referenzkurse der EZB: Einheiten der jeweiligen Währung je Euro, an jedem Arbeitstag. Je Feld eine Währung mit eigener Skala, weil die Kurse sehr verschieden hoch sind. Steigt eine Linie, wird der Euro gegenüber dieser Währung teurer. Über jedem Feld: jüngster Kurs mit Tendenz zum Vortag sowie die Mittel der letzten 3 und 12 Monate."}
  - id: energie
    title: Energie
    charts:
      - {chart: oil, ask: "Wie teuer ist Rohöl?", years: 6, caption: "Preis je Barrel (159 Liter) Rohöl der Nordseesorte Brent, Monatsmittel."}
      - {chart: power, ask: "Wie viel Strom wird verbraucht, und was kostet er im Großhandel?", multiples: true, own_scale: true, years: 6, recessions: false, caption: "Stromverbrauch (Netzlast) in Deutschland ggü. dem Vorjahresmonat und Großhandelspreis für Strom am Day-Ahead-Markt (Gebotszone Deutschland/Luxemburg), Monatsmittel in € je MWh. Der Verbrauch folgt eng der Industrieproduktion, liegt aber schon wenige Tage nach Monatsende vor; Wetter und Feiertage verzerren einzelne Monate. Quelle: Bundesnetzagentur | SMARD.de, Lizenz CC BY 4.0."}
      - {chart: gas_storage, ask: "Wie voll sind die Gasspeicher?", daily: true, years: 3, keep_years: true, recessions: false, caption: "Füllstand der deutschen Gasspeicher in % der Arbeitsgaskapazität, Tageswerte. Die Speicher werden im Sommer gefüllt und im Winter geleert; ein niedriger Stand zu Winterbeginn erhöht das Risiko von Preisspitzen. Gesetzlich vorgegeben sind Mindestfüllstände zu Stichtagen im Herbst. Quelle: GIE (AGSI)."}
      - {chart: hdd, ask: "Wie viel muss geheizt werden?", no_yoy: true, years: 6, ref: 100, recessions: false, caption: "Heizgradtage messen den Heizbedarf: Je kälter ein Tag unter 15 °C, desto mehr Gradtage (VDI 3807, Raumtemperatur 20 °C). Hier in % des Mittels desselben Monats 2015 bis 2019; über 100 heißt kälter und mehr Heizbedarf als üblich. Ein kalter Winter erhöht den Verbrauch von Gas und Heizöl und die Energieerzeugung, ein milder senkt sie. Ungewichtetes Mittel aller Stationen des Deutschen Wetterdienstes, da der DWD keinen Deutschlandwert veröffentlicht."}
      - {chart: gas, ask: "Wie teuer ist Erdgas?", years: 6, caption: "Großhandelspreis für Erdgas in Europa (Handelsplatz TTF), Monatsmittel. MMBtu ist eine Energiemenge von rund 293 Kilowattstunden."}
  - id: aussichten
    title: Aussichten
    ask: "Was erwarten die Prognosen?"
    charts:
      - {chart: forecast, ask: "Was erwarten die Prognosen für das Wachstum?", type: forecast, measure: gdp, title: "Prognosen für das Wachstum", caption: "Prognosen für das Wachstum des realen BIP ggü. Vorjahr, je Zieljahr. Linie: jüngste Projektion der Bundesregierung, die Grundlage für Haushalt und Steuerschätzung. Graue Fläche: Spanne aller jüngsten Prognosen, vom niedrigsten bis zum höchsten Wert. Weitere Herausgeber lassen sich über die Legende einblenden. Gemeinschaftsdiagnose: gemeinsame Prognose von DIW, ifo, IfW Kiel, IWH und RWI. Einzelne Werte stammen aus Presseberichten zu den Veröffentlichungen und sind im Tooltip gekennzeichnet."}
      - {chart: forecast_infl, ask: "Was erwarten die Prognosen für die Inflation?", type: forecast, measure: inflation, title: "Prognosen für die Inflationsrate", caption: "Prognosen für die Inflationsrate ggü. Vorjahr, je Zieljahr; in der Regel gemessen am Verbraucherpreisindex (VPI). Die Bundesbank prognostiziert den europäischen HVPI, der meist nahe am VPI liegt. Linie: Bundesregierung. Graue Fläche: Spanne aller jüngsten Prognosen. Weitere Herausgeber über die Legende. Einzelne Werte stammen aus Presseberichten und sind im Tooltip gekennzeichnet."}
      - {chart: forecast_core, ask: "Was erwarten die Prognosen für die Kerninflation?", type: forecast, measure: core, title: "Prognosen für die Kerninflation", caption: "Prognosen für die Inflationsrate ohne Energie und Nahrungsmittel. Erscheint, sobald mindestens zwei Herausgeber einen Wert veröffentlicht haben."}
  - id: struktur
    title: Struktur
    part: struktur
    ask: "Wie steht es um die Grundlagen des Wachstums?"
    charts:
      - {chart: potential, ask: "Wächst die Wirtschaft schneller als ihr Potenzial?", years: 30, forecast_after_bars: true, caption: "Das Produktionspotenzial ist die Wirtschaftsleistung, die bei normaler Auslastung von Arbeitskräften und Maschinen möglich wäre. Es lässt sich nicht beobachten, sondern wird geschätzt, hier von der Europäischen Kommission (AMECO, Frühjahrsprognose 2026) aus Arbeitsvolumen, Kapitalbestand und Produktivität. Wächst das BIP (Balken) schneller als das Potenzial (Linie), steigt die Auslastung; die Differenz der Niveaus heißt Produktionslücke. Ist sie positiv, droht eher Inflation, ist sie negativ, sind Kapazitäten ungenutzt. Gestrichelt: Prognosejahre."}
      - {chart: productivity, ask: "Wie entwickelt sich die Produktivität?", years: 26, caption: "Reale Wirtschaftsleistung je Erwerbstätigen und je geleisteter Arbeitsstunde. Langfristig bestimmt die Produktivität den Wohlstand."}
      - {chart: inv_ratio, ask: "Wie viel investiert Deutschland im Vergleich zur EU?", years: 30, caption: "Bruttoanlageinvestitionen (Maschinen, Bauten, Software und Forschung) in Prozent des BIP, Deutschland im Vergleich zur Europäischen Union."}
      - {chart: emp_sector, ask: "In welchen Bereichen entstehen Arbeitsplätze?", type: since, base: "2022-04-01", unit: "Tsd. Personen, Veränderung seit dem 2. Quartal 2022", bar_name: "Veränderung seit 2. Quartal 2022", caption: "Veränderung der Zahl der Erwerbstätigen je Wirtschaftsbereich seit dem 2. Quartal 2022, in Tausend. Zeigt die Verschiebung von der Industrie zu den Dienstleistungen."}
      - {chart: migration, ask: "Wie viele Menschen wandern zu?", years: 30, scale: 0.000001, unit: "Mio. Personen", decimals: 2, caption: "Zuzüge minus Fortzüge über die Grenzen Deutschlands in Millionen Personen, einschließlich statistischer Anpassung. Die Zuwanderung trägt seit 2011 maßgeblich zum Wachstum der Erwerbsbevölkerung bei; 2015 und 2022 prägen die Fluchtbewegungen aus Syrien und der Ukraine."}
      - {chart: migration_groups, ask: "Wer wandert zu und wer ab?", years: 20, scale: 0.001, unit: "Tsd. Personen", decimals: 0, ref: 0, caption: "Zuzüge minus Fortzüge nach Staatsangehörigkeit, in Tausend. Deutsche wandern seit Jahren netto ab; die Zuwanderung aus Staaten außerhalb der EU prägen Fluchtbewegungen, die aus der EU vor allem Arbeitsmigration. Ohne statistische Anpassung, deshalb weicht die Summe von der Abbildung zur Nettozuwanderung ab."}
      - {chart: cit, recessions: false, ask: "Wie hoch besteuert Deutschland Unternehmensgewinne im Vergleich?", years: 30, emphasis: cit_deu, context_grey: true, caption: "Tarifliche Gesamtsteuerbelastung von Kapitalgesellschaften (Körperschaftsteuer einschließlich Zuschläge und Steuern nachgeordneter Ebenen, in Deutschland Gewerbesteuer), nach OECD. Hervorgehoben: Deutschland; grau: Vergleichsländer."}
  - id: staat
    title: Staat
    part: struktur
    ask: "Wie stehen die öffentlichen Finanzen da?"
    charts:
      - {chart: gov_balance, ask: "Wie hoch ist das Defizit des Staates?", years: 12, caption: "Einnahmen minus Ausgaben von Bund, Ländern, Gemeinden und Sozialversicherung in Prozent des BIP, vierteljährlich, saisonbereinigt. Negative Werte bedeuten ein Defizit."}
