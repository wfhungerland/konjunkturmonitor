# Konjunkturmonitor: Inhalt der Seite.
# Jede Frage bekommt eine Antwort aus den Daten (Satz, Zahl, Vergleich) und eine Erklärung in Alltagssprache.
# Die Zahlen kommen aus series.yaml (Katalog im Format von konjunkturwolf), die Sätze baut monitor/answers.py.

site:
  title: Konjunkturmonitor
  claim: "Wie steht es um die deutsche Wirtschaft? Die wichtigsten Kennzahlen mit kurzer Einordnung, werktäglich aktualisiert aus amtlichen und frei zugänglichen Daten."
  author: "Hungerland, Wolf-Fabian"
  license: "Texte und eigene Abbildungen: CC BY 4.0 (Namensnennung: Wolf-Fabian Hungerland, Konjunkturmonitor). Die Daten unterliegen den Lizenzen der jeweiligen Quellen."
  url: "https://wfhungerland.github.io/konjunkturmonitor/"
  repo: "https://github.com/wfhungerland/konjunkturmonitor"

# Darstellung nach Tufte. Jeder Schalter lässt sich einzeln mit false zurücknehmen.
layout:
  start_table: true       # Startseite als Kennzahlentabelle mit Wortsparklines (false: acht Fragekarten)
  minimal: true           # ohne Kartenrahmen und Urteilsetiketten; Erläuterungen als Randnotiz
  direct_labels: true     # Beschriftung am Linienende statt Legende (bis vier Linien)
  small_multiples: true   # Abbildungen mit multiples: true als kleine Einzeldiagramme auf gleicher Skala
  compare_band: false     # Spanne 2015 bis 2019 als graues Band in Zeitreihen (true: wieder einblenden)
  uniform_years: 6        # einheitliches Zeitfenster in Jahren für Abbildungen mit 3 bis 8 Jahren (false: wie je Abbildung angegeben)
  freq_years: {M: 6, Q: 10, D: 3}  # feste Zeitfenster je Takt ab Jahresanfang (Monat, Quartal, Tag); keep_years oder x_start je Abbildung gehen vor
  lead_chart_only: true   # je Thema eine Leitgrafik, weitere Abbildungen aufklappbar
  overview: true          # Antwort auf die Titelfrage in zwei bis drei Sätzen über der Tabelle
  brief_topics: [wachstum, preise, arbeit, industrie, konsum, export, stimmung, zinsen]  # Kurzfassung: Leitabbildungen dieser Abschnitte
  window_start: {short: "2019-01-01", mid: "2005-01-01"}  # Linien beginnen am Jahresanfang: bis 8 Jahre ab short, 10 bis 12 Jahre ab mid, längere ab Jahresanfang (false: vom jüngsten Wert zurückzählen)
  red_zero_line: false    # Nulllinie schwarz (true: rot wie im früheren Grafikstandard)

# Kennzahlentabelle der Startseite, gruppiert nach den Abschnitten der Seite (topic).
# kind rate: Vergleiche als Differenz; kind level: als prozentuale Veränderung. up_bad: steigender Wert ist ungünstig (rotes ▲).
start_table:
  - {label: "BIP, real", series: de_gdp_index, kind: level, scale: 1, unit: "Index 2020 = 100", mom_from: de_gdp_qoq, yoy_from: de_gdp_yoy, topic: wachstum}
  - {label: "Inflationsrate (VPI)", series: de_cpi_yoy, kind: rate, unit: "% ggü. Vorjahresmonat", up_bad: true, topic: preise}
  - {more: true, label: "Kernrate (ohne Energie und Nahrungsmittel)", series: de_vpi_core_yoy, kind: rate, unit: "% ggü. Vorjahresmonat", up_bad: true, topic: preise}
  - {more: true, label: "Erzeugerpreise", series: de_ppi_yoy, kind: rate, unit: "% ggü. Vorjahresmonat", up_bad: true, topic: preise}
  - {label: "Arbeitslosenquote", series: de_alq_sa, kind: rate, unit: "%", up_bad: true, topic: arbeit}
  - {more: true, label: "Erwerbstätige", series: de_emp_m, kind: level, scale: 0.001, decimals: 2, unit: "Mio.", change: diff, change_unit: "Tsd.", change_decimals: 0, topic: arbeit}
  - {more: true, label: "Gemeldete offene Stellen", series: de_vac_sa, kind: level, decimals: 0, unit: "Tsd.", topic: arbeit}
  - {more: true, label: "Rezessionssignal (Schwelle 0,25)", series: de_sahm, kind: rate, unit: "Pp", decimals: 2, change_decimals: 2, up_bad: true, topic: rezession}
  - {label: "Produktion der Industrie", series: de_ip, kind: level, unit: "Index 2021 = 100", topic: industrie}
  - {label: "Auftragseingang der Industrie", series: de_orders, kind: level, unit: "Index 2021 = 100", topic: industrie}
  - {label: "Produktion im Baugewerbe", series: de_bau_prod, kind: level, unit: "Index 2021 = 100", topic: bau}
  - {label: "Einzelhandelsumsatz, real", series: de_retail, kind: level, unit: "Index 2021 = 100", topic: konsum}
  - {more: true, label: "Verbrauchervertrauen", series: de_consumer_conf, kind: rate, unit: "Saldo in Pp", topic: konsum}
  - {label: "Warenexporte, nominal", series: de_exports, kind: level, unit: "Mrd. €", topic: export}
  - {label: "Wirtschaftsklima (ESI)", series: de_esi, kind: rate, unit: "Punkte", topic: stimmung}
  - {label: "Unternehmensinsolvenzen", series: de_insolv, kind: level, decimals: 0, unit: "Anträge", seasonal: true, up_bad: true, topic: insolvenzen}
  - {label: "Rendite Bundesanleihen, 10 Jahre", series: de_bund10, kind: rate, unit: "%", decimals: 2, change_decimals: 2, topic: zinsen}
  - {label: "Rohöl Brent", series: w_brent, kind: level, unit: "US-$ je Barrel", decimals: 0, topic: energie}

questions:
  - id: wachstum
    ask: "Wächst die Wirtschaft?"
    kind: growth
    series: de_gdp_qoq
    yoy: de_gdp_yoy
    explain: "Das Bruttoinlandsprodukt (BIP) ist der Wert aller Waren und Dienstleistungen, die in Deutschland hergestellt werden. Steigt es, wird mehr produziert und mehr Einkommen erzielt."
    topic: wachstum

  - id: preise
    ask: "Steigen die Preise?"
    kind: inflation
    series: de_cpi_yoy
    index: de_vpi
    core: de_vpi_core_yoy
    parts: {Energie: de_vpi_energy_yoy, Nahrungsmittel: de_vpi_food_yoy, "Waren ohne Energie": de_vpi_goods_yoy, "Dienstleistungen ohne Mieten": de_vpi_serv_yoy, Wohnungsmiete: de_vpi_rent_yoy}
    explain: "Die Inflationsrate gibt an, um wie viel Prozent die Preise eines typischen Warenkorbs höher sind als ein Jahr zuvor. Gemessen wird sie mit dem Verbraucherpreisindex (VPI) des Statistischen Bundesamts. Die Europäische Zentralbank strebt mittelfristig 2 % an."
    topic: preise

  - id: arbeit
    ask: "Wie entwickelt sich der Arbeitsmarkt?"
    kind: unemployment
    series: de_alq_sa
    level: de_alo_sa
    explain: "Die Arbeitslosenquote ist der Anteil der bei der Bundesagentur für Arbeit gemeldeten Arbeitslosen an allen zivilen Erwerbspersonen."
    topic: arbeit

  - id: industrie
    ask: "Wie entwickelt sich die Industrie?"
    kind: index_mom
    series: de_ip
    orders: de_orders
    explain: "Die Produktion misst, wie viel die Industrie herstellt. Der Auftragseingang misst neue Bestellungen; er läuft der Produktion einige Monate voraus."
    topic: industrie

  - id: konsum
    ask: "Wie entwickelt sich der private Konsum?"
    kind: index_mom
    series: de_retail
    mood: de_consumer_conf
    explain: "Der preisbereinigte Einzelhandelsumsatz misst, wie viel die Geschäfte verkaufen. Das Verbrauchervertrauen beruht auf einer Befragung der Haushalte zu ihrer finanziellen Lage und ihren Erwartungen."
    topic: konsum

  - id: export
    ask: "Wie entwickeln sich die Exporte?"
    kind: level_mom
    series: de_exports
    explain: "Exporte sind ins Ausland verkaufte Waren. Die Exporte von Waren und Dienstleistungen entsprechen in Deutschland fast der Hälfte des Bruttoinlandsprodukts."
    topic: export

  - id: stimmung
    ask: "Wie schätzen Unternehmen und Haushalte die Lage ein?"
    kind: sentiment
    series: de_esi
    explain: "Jeden Monat fragt die EU-Kommission Unternehmen und Haushalte nach ihrer Lage und ihren Erwartungen. Der Wirtschaftsklimaindikator ist so normiert, dass 100 dem langjährigen Durchschnitt entspricht; höhere Werte zeigen eine überdurchschnittliche Stimmung."
    topic: stimmung

  - id: insolvenzen
    ask: "Wie viele Unternehmen beantragen Insolvenz?"
    kind: insolvency
    series: de_insolv
    employees: de_insolv_emp
    claims: de_insolv_claims
    explain: "Ein Insolvenzverfahren wird beantragt, wenn ein Unternehmen zahlungsunfähig oder überschuldet ist. Da die Zahl der Anträge im Jahresverlauf schwankt, vergleicht der Monitor mit demselben Monat früherer Jahre."
    topic: insolvenzen

  - id: zinsen
    code: Zinsen
    ask: "Wie entwickeln sich die Zinsen?"
    kind: level
    series: de_bund10
    name: "die Rendite zehnjähriger Bundesanleihen"
    unit: "%"
    decimals: 2
    explain: "Die Rendite von Bundesanleihen ist der Zins, den der Bund für neue Kredite am Kapitalmarkt zahlt. Sie dient als Richtwert für langfristige Kredite an Unternehmen und für Baufinanzierungen."
    topic: zinsen

  - id: energie
    ask: "Wie entwickeln sich die Energiepreise?"
    kind: level
    series: w_brent
    name: "der Preis für Rohöl der Sorte Brent"
    unit: "US-Dollar je Barrel"
    decimals: 1
    also: [{series: w_gas_eu, label: "Erdgas in Europa (TTF)", unit: "US-Dollar je MMBtu", decimals: 1}]
    explain: "Öl- und Gaspreise wirken schnell auf die Verbraucherpreise für Kraftstoffe und Heizung und mit Verzögerung auf die Kosten der Industrie. Die Preise werden in US-Dollar gehandelt; ein schwächerer Euro verteuert sie in Euro gerechnet."
    topic: energie

# Themen: je Frage ein Abschnitt mit Abbildungen. type: line (Standard), bars, stacked, clock, forecast, threshold.
topics:
  - id: wachstum
    group: gesamt
    title: Wachstum
    charts:
      - {chart: gdp_contrib, ask: "Welche Nachfrage trägt das Wachstum?", type: stacked, total: de_gdp_qoq, years: 3, keep_years: true, groups: {Konsum: [P31_S14_S15, P3_S13], Investitionen: [P51G], Außenhandel: [P6, P7], Lager: [P52_P53]}, caption: "Balken: Beiträge der Verwendungsseite zum Wachstum ggü. Vorquartal in Prozentpunkten: Konsum der Haushalte und des Staates, Investitionen, Außenhandel (Exporte minus Importe) und Vorratsveränderung (Lager). Linie: Wachstum des BIP insgesamt in %. Die Summe der Balken ergibt bis auf Rundung die Linie."}
      - {chart: wai, zoom_toggle: true, zoom_default: true, ask: "Was zeigen die Wochendaten zur Wirtschaftsleistung?", years: 3, ref: 0, caption: "Der Aktivitätsindex der Bundesbank schätzt aus wöchentlichen Daten (etwa Lkw-Maut, Stromverbrauch, Suchanfragen), wie stark die Wirtschaftsleistung in den letzten 13 Wochen gegenüber den 13 Wochen davor gewachsen ist. Er liegt früher vor als das BIP, ist aber eine Schätzung."}
      - {chart: maut, toggle: {chart: maut_d, base: Monatswerte, label: Tageswerte, base_en: Monthly, label_en: Daily}, zoom_toggle: true, zoom_default: true, ask: "Wie viel fahren die Lkw auf den Autobahnen?", years: 6, ma3: true, caption: "Fahrleistung mautpflichtiger Lkw ab vier Achsen auf Autobahnen, ermittelt aus den Mautdaten. Der Index liegt wenige Tage nach Monatsende vor und folgt eng der Industrieproduktion, weil diese Lkw vor allem Vorleistungen und Waren transportieren. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: maut_d, daily: true, all_days: true, no_texts: true, ma_days: 7, years: 3, keep_years: true, recessions: false, ask: "Wie viel fahren die Lkw in den letzten Wochen?", caption: "Täglicher Index der Fahrleistung, kalender- und saisonbereinigt (experimentell, Destatis und BALM, bereinigt von der Bundesbank). Er liegt mit fünf bis zwölf Tagen Abstand vor und wird donnerstags aktualisiert. Dünn: Tageswerte, dick: gleitendes Mittel über sieben Tage. Die Tageswerte schwanken stark und sind nicht direkt mit dem Monatsindex vergleichbar."}
      - {chart: gdp_level, ask: "Wo steht die Wirtschaftsleistung im längeren Vergleich?", years: 12, caption: "Wirtschaftsleistung, preisbereinigt, 2020 = 100. Der Einbruch 2020 geht auf die Corona-Pandemie zurück. Die Veränderung gegenüber dem Vorjahr ist hier saison- und kalenderbereinigt; die Übersicht nennt wie die Schnellmeldung des Statistischen Bundesamts die unbereinigte Rate, daher können beide um 0,1 Prozentpunkte abweichen."}
      - {chart: gdp_use, combine: {lead: "veränderten sich die Verwendungskomponenten preisbereinigt ggü. dem Vorquartal:", lead_en: "the expenditure components changed in real terms on the previous quarter:"}, ask: "Wie haben sich die Verwendungskomponenten im letzten Quartal entwickelt?", type: latest, years: 2, caption: "Balken: Veränderung im letzten Quartal, preisbereinigt. Raute: das Quartal davor. Investitionen aufgeteilt in Ausrüstungen (Maschinen, Fahrzeuge, Waffensysteme), Bauten und sonstige Anlagen (vor allem Software und Forschung)."}
  - id: industrie
    group: produktion
    title: Industrie
    charts:
      - {chart: industry, zoom_toggle: true, zoom_default: true, name_labels: true, ask: "Wie entwickeln sich Produktion und Aufträge der Industrie?", years: 6, ma3: true, caption: "Dünn: Monatswerte. Dick: gleitendes Dreimonatsmittel. Der Auftragseingang läuft der Produktion voraus."}
      - {chart: orders_split, zoom_toggle: true, zoom_default: true, pick: [de_orders_dom, de_orders_euro, de_orders_noneuro], ask: "Woher kommen die Aufträge: aus dem Inland, dem Euroraum oder von außerhalb?", years: 6, ma3: true, caption: "Auftragseingang der Industrie nach Herkunft: Inland, Euroraum und übrige Welt, preis-, saison- und kalenderbereinigt. Großaufträge, etwa für Flugzeuge, Schiffe oder Rüstungsgüter, verursachen einzelne starke Ausschläge. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: branch_heat, toggle: {chart: branch_heat_bars, base: Tabelle, label: Balken, base_en: Table, label_en: Bars}, ask: "Welche Branchen produzieren mehr, welche weniger?", type: heat, months: 12, caption: "Tabelle: Produktion je Branche ggü. Vorjahresmonat in %; orange: Zunahme, blau: Abnahme. Sortiert nach dem Dreimonatsvergleich (letzte drei Monate ggü. den drei Monaten davor). Rechte Spalten: Dreimonatsvergleich und Niveau ggü. dem Durchschnitt 2019; beide als Balken in der folgenden Abbildung."}
      - {chart: orders_heat, toggle: {chart: orders_heat_bars, base: Tabelle, label: Balken, base_en: Table, label_en: Bars}, volatile: ["Sonstiger Fahrzeugbau"], ask: "Welche Branchen erhalten mehr Aufträge?", type: heat, months: 12, caption: "Tabelle: Auftragseingang je Branche ggü. Vorjahresmonat in %, preisbereinigt; orange: Zunahme, blau: Abnahme. Sortiert nach dem Dreimonatsvergleich. Rechte Spalten: Dreimonatsvergleich und Niveau ggü. dem Durchschnitt 2019; beide als Balken in der folgenden Abbildung. Großaufträge, vor allem im sonstigen Fahrzeugbau, verzerren einzelne Monate."}
      - {chart: prod_groups, zoom_toggle: true, zoom_default: true, ask: "Welche Gütergruppen tragen die Produktion?", years: 6, ma3: true, caption: "Vorleistungsgüter werden weiterverarbeitet (etwa Stahl, Chemie), Investitionsgüter sind vor allem Maschinen und Fahrzeuge, Konsumgüter werden von privaten Haushalten gekauft. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
  - id: bau
    group: produktion
    title: Bau
    ask: "Wie entwickelt sich der Bau?"
    charts:
      - {chart: bau_orders, sent_ma3: true, ask: "Wie entwickeln sich die Aufträge im Bau?", years: 6, ma3: true, caption: "Aufträge im Bauhauptgewerbe, preisbereinigt, insgesamt und nach Bauart. Einzelne Großprojekte führen zu starken Ausschlägen. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: permits, ask: "Wird bald mehr gebaut?", years: 6, ma3: true, recessions: false, caption: "Zahl der genehmigten Wohnungen je Monat in Tausend (Statistisches Bundesamt), in neuen Gebäuden und durch Baumaßnahmen an bestehenden Gebäuden. Genehmigungen laufen dem Wohnungsbau um etwa ein bis zwei Jahre voraus; nicht jede Genehmigung wird gebaut."}
      - {chart: house_prices, ask: "Wie entwickeln sich die Preise für Wohnimmobilien?", years: 12, ref: 0, caption: "Häuserpreisindex des Statistischen Bundesamts: Preise für neu erstellte und bestehende Wohnimmobilien (Häuser und Eigentumswohnungen), ggü. dem Vorjahresquartal. Erscheint mit rund drei Monaten Abstand zum Quartalsende."}
      - {chart: bau_prod, ask: "Wie viel wird gebaut?", years: 6, ma3: true, caption: "Bauproduktion. Das Ausbaugewerbe umfasst Installation, Elektrik und Innenausbau. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: long_hpi, x_start: "1871-01-01", crisis_toggle: true, decade_mean: true, ask: "Wie teuer sind Wohnimmobilien im langen Vergleich?", years: 154, keep_years: true, recessions: false, blank_years: [[1914, 1918], [1939, 1945]], crises: hist_bank_deu, caption: "Hauspreisindex bereinigt um die Verbraucherpreise. Die zugrunde liegenden Preisreihen wechseln über die Zeit; der Index zeigt Trends, keine genauen Niveaus. Quelle der langen Reihen: Global Macro Database (Müller, Xu, Lehbib und Chen 2025), Deutschland in den jeweiligen Grenzen. Hellgrau: Mittel je Jahrzehnt, das laufende gestrichelt. Einblendbar: Bankenkrisen (rot) nach derselben Datenbank und Rezessionen (grau), hier Jahre mit sinkendem realem BIP. Ausgelassen sind die Weltkriege 1914 bis 1918 und 1939 bis 1945; Lücken danach stammen aus der Datenbank. Diese Abbildung und ihr Download stehen unter CC BY-NC-SA 4.0, weil die Global Macro Database diese Lizenz verlangt."}
  - id: dienstleistungen
    group: produktion
    title: Dienstleistungen
    ask: "Wie entwickeln sich die Dienstleister?"
    charts:
      - {chart: services, ask: "Wie entwickelt sich die Produktion der Dienstleister?", years: 6, ma3: true, caption: "Preisbereinigte Produktion ausgewählter Dienstleistungsbereiche. „Insgesamt“ umfasst Verkehr und Lagerei, Gastgewerbe, Information und Kommunikation, Grundstücks- und Wohnungswesen sowie freiberufliche, technische und sonstige Unternehmensdienste; Handel, Finanzen und Staat sind nicht enthalten. Dienstleister erzeugen gut zwei Drittel der Wertschöpfung, werden aber monatlich nur lückenhaft erfasst. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
  - id: arbeit
    group: haushalte
    title: Arbeit
    charts:
      - {chart: labour, name_labels: true, ask: "Wie hoch ist die Arbeitslosigkeit?", up_bad: [de_alq_sa, de_ilo], years: 12, caption: "Zwei Messungen der Arbeitslosigkeit. Die registrierte Quote der Bundesagentur für Arbeit zählt Menschen, die bei einer Arbeitsagentur oder einem Jobcenter arbeitslos gemeldet sind. Die Erwerbslosenquote nach der Definition der Internationalen Arbeitsorganisation (ILO) beruht auf einer Befragung: erwerbslos ist, wer keine Arbeit hat, aktiv sucht und kurzfristig verfügbar ist. Sie liegt in Deutschland deutlich niedriger und ist international vergleichbar. Beide saisonbereinigt. Seit 2020 beruht die Erwerbslosenquote auf dem neu gestalteten Mikrozensus; der Übergang ist ein Bruch in der Reihe."}
      - {chart: alq_land, ask: "In welchen Ländern ist die Arbeitslosigkeit hoch, wo steigt sie?", type: tiles, prefix: de_alq_land_, measure: diff, what: "Arbeitslosenquote", caption: "Arbeitslosenquote je Land im Jahresdurchschnitt, bezogen auf alle zivilen Erwerbspersonen (Bundesagentur für Arbeit über das Statistische Bundesamt). Die Zahl nennt die Quote, die Farbe die Veränderung ggü. dem Vorjahr: orange gestiegen, blau gesunken. Monatswerte je Land bietet die amtliche Datenbank nicht an; die Karte ändert sich deshalb einmal im Jahr."}
      - {chart: labour_flows, zoom_toggle: true, zoom_default: true, unit: "Tsd.", ask: "Wie entwickeln sich Arbeitslose und offene Stellen?", up_bad: [de_alo_sa], years: 12, caption: "Steigt die Arbeitslosigkeit, während die Zahl offener Stellen sinkt, deutet dies auf eine Abkühlung des Arbeitsmarkts hin."}
      - {chart: indeed, daily: true, all_days: true, years: 3, keep_years: true, recessions: false, ask: "Schreiben die Unternehmen mehr oder weniger Stellen aus?", caption: "Zahl der Stellenanzeigen auf der Plattform Indeed in Deutschland, saisonbereinigt, 1. Februar 2020 = 100; gleitendes Mittel über sieben Tage, wöchentlich aktualisiert. Die Reihe liegt Wochen vor der Statistik der Bundesagentur für Arbeit vor, bildet aber nur eine Plattform ab. Quelle: Indeed Hiring Lab, Lizenz CC BY 4.0."}
      - {chart: employment_m, transform: yoy, unit: "% ggü. Vorjahresmonat", decimals: 1, ref: 0, name_labels: true, ask: "Wie viele Menschen sind erwerbstätig?", years: 6, caption: "Erwerbstätige umfassen auch Selbständige und Beamte; sozialversicherungspflichtig Beschäftigte sind der größte Teil davon. Veränderung ggü. dem Vorjahresmonat in %."}
      - {chart: kurzarbeit, zoom_toggle: true, ask: "Wie viele Beschäftigte sind in Kurzarbeit?", up_bad: true, years: 12, scale: 0.001, unit: "Tsd. Personen", decimals: 0, caption: "Beschäftigte in Kurzarbeit aus konjunkturellen (wirtschaftlichen) Gründen (§ 96 SGB III), in Tausend. Kurzarbeit hält Beschäftigte im Betrieb, wenn Aufträge vorübergehend fehlen; sie steigt in Abschwüngen früher als die Arbeitslosigkeit. Die jüngsten Monate beruhen auf Hochrechnungen der Bundesagentur für Arbeit."}
      - {chart: sv_yoy, multiples: true, scale_toggle: true, ref: 0, combine: {lead: "veränderte sich die Beschäftigung ggü. dem Vorjahresmonat:", lead_en: "employment changed on a year earlier:"}, ask: "In welchen Bereichen wächst die Beschäftigung?", years: 6, caption: "Sozialversicherungspflichtig Beschäftigte nach Bereichen, Veränderung gegenüber dem Vorjahresmonat. Leiharbeit reagiert als Erstes auf eine schwächere Nachfrage, weil Betriebe zuerst ausgeliehene Kräfte abbauen."}
  - id: einkommen
    group: haushalte
    title: Einkommen
    ask: "Wie entwickeln sich Einkommen und Verteilung?"
    charts:
      - {chart: wages, ask: "Steigen die Löhne schneller als die Preise?", years: 12, ref: 0, caption: "Nominallohnindex: durchschnittliche Bruttomonatsverdienste einschließlich Sonderzahlungen; Reallohnindex: Nominallohnindex bereinigt um die Entwicklung der Verbraucherpreise. Liegt die Reallohnrate über null, steigen die Löhne schneller als die Preise. Veränderung gegenüber dem Vorjahresquartal."}
      - {chart: tarif, ask: "Steigen die Tariflöhne schneller als die Preise?", pick: [de_tarif_yoy, de_cpi_yoy], years: 8, keep_years: true, ref: 0, recessions: false, caption: "Tarifliche Monatsverdienste einschließlich Sonderzahlungen in der Gesamtwirtschaft (Statistisches Bundesamt) und Verbraucherpreise, jeweils ggü. dem Vorjahresmonat. Liegen die Tarifverdienste über der Inflationsrate, steigen die Tariflöhne real. Einmalzahlungen wie die Inflationsausgleichsprämie 2023 und 2024 lassen die Reihe springen."}
      - {chart: ulc, ask: "Steigen die Lohnkosten je Einheit stärker als im Euroraum?", years: 12, ref: 0, caption: "Lohnstückkosten: Arbeitnehmerentgelt je Arbeitnehmer im Verhältnis zur realen Wirtschaftsleistung je Erwerbstätigen, ggü. dem Vorjahresquartal (Eurostat). Steigen sie in Deutschland dauerhaft stärker als im Euroraum, verliert die deutsche Wirtschaft an preislicher Wettbewerbsfähigkeit; sie steigen, wenn die Löhne schneller wachsen als die Produktivität."}
      - {chart: hh_income, ask: "Wie entwickeln sich die Einkommen der Haushalte?", years: 12, caption: "Verfügbares Einkommen der privaten Haushalte je Einwohner, also Löhne, Gewinne, Vermögenseinkommen und Sozialleistungen nach Steuern und Abgaben, bereinigt um die Preisentwicklung des Konsums. 2010 = 100."}
      - {chart: saving, ask: "Wie viel sparen die Haushalte?", years: 12, caption: "Anteil des verfügbaren Einkommens, den die Haushalte nicht für Konsum ausgeben. Eine steigende Sparquote dämpft den Konsum, oft aus Vorsicht in unsicheren Zeiten. Gezeigt ist die Brutto-Sparquote nach Eurostat (Sparen einschließlich Abschreibungen im Verhältnis zum verfügbaren Bruttoeinkommen); die bekanntere Sparquote des Statistischen Bundesamts ist anders abgegrenzt und liegt deutlich niedriger."}
      - {chart: profit_share, ask: "Wie verteilt sich die Wertschöpfung auf Gewinne und Löhne?", years: 12, caption: "Bruttobetriebsüberschuss der nichtfinanziellen Unternehmen in Prozent ihrer Wertschöpfung. Steigt die Gewinnquote, entfällt ein größerer Teil der Wertschöpfung auf Gewinne und ein kleinerer auf Löhne."}
  - id: konsum
    group: haushalte
    title: Konsum
    charts:
      - {chart: retail, ask: "Wie viel verkauft der Einzelhandel?", years: 6, ma3: true, caption: "Umsatz des Einzelhandels ohne Kfz-Handel, preisbereinigt, also die verkaufte Menge. Der Einzelhandel steht für rund ein Drittel des privaten Konsums; Dienstleistungen, Mieten und Autos sind nicht enthalten. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: retail_split, name_labels: true, ask: "Welche Sortimente verkaufen sich besser?", years: 6, ma3: true, caption: "Umsatz nach Sortimenten, preisbereinigt, Daten des Statistischen Bundesamts über Eurostat. Lebensmittel: Einzelhandel mit Nahrungsmitteln, Getränken und Tabakwaren; Nicht-Lebensmittel ohne Tankstellen. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: hospitality, zoom_toggle: true, ask: "Wie entwickelt sich das Gastgewerbe?", years: 6, ma3: true, caption: "Umsatz von Restaurants und Hotels, preisbereinigt. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: cars, ask: "Kaufen die Haushalte neue Autos?", years: 6, ma3: true, caption: "Neu zugelassene Pkw privater Halter in Tausend je Monat. Ein Indikator für die Bereitschaft der Haushalte zu größeren Anschaffungen. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: consumer, ask: "Wie zuversichtlich sind die Verbraucher?", years: 12, caption: "Saldo aus positiven und negativen Antworten der Haushalte. Werte unter null bedeuten, dass negative Einschätzungen überwiegen."}
  - id: preise
    group: preise
    title: Preise
    charts:
      - {chart: cpi, scale_toggle: true, multi_colors: true, ask: "Welche Bereiche werden teurer?", multiples: true, up_bad: true, years: 6, emphasis: de_cpi_yoy, ref: 2, caption: "Inflationsrate nach dem Verbraucherpreisindex (VPI) des Statistischen Bundesamts, insgesamt und für fünf Bereiche. Je Feld ist ein Bereich dunkelblau hervorgehoben, jedes Feld hat eine eigene Skala; mit „Gemeinsame Skala“ stehen die übrigen grau zum Vergleich dahinter. Über jedem Feld: jüngster Wert mit Tendenz zum Vormonat sowie die Mittel der letzten 3 und 12 Monate. Gestrichelt: 2 %, das Ziel der EZB (es bezieht sich auf den europäischen HVPI, der in Deutschland meist nahe am VPI liegt). „Dienstleistungen ohne Mieten“ schließt tatsächliche und unterstellte Wohnungsmieten aus und weicht deshalb von der Rate für Dienstleistungen insgesamt ab, die das Statistische Bundesamt meldet."}
      - {chart: cpi_contrib, ask: "Woraus setzt sich die Inflationsrate zusammen?", type: contrib, total: de_vpi, years: 3, parts: {Energie: de_vpi_energy, Nahrungsmittel: de_vpi_food, "Waren ohne Energie": de_vpi_goods, "Dienstleistungen und Miete": [de_vpi_serv, de_vpi_rent]}, caption: "Beitrag der Bereiche zur Inflationsrate in Prozentpunkten; umschaltbar zwischen Vorjahres- und Vormonatsvergleich. Eigene Berechnung: Gewichte der Bereiche aus den VPI-Teilindizes seit 2020 geschätzt; Rest gleicht Rundung und nicht getrennt erfasste Teile aus."}
      - {chart: cpi_core, ask: "Wie hoch ist der zugrunde liegende Preisauftrieb?", years: 6, up_bad: true, emphasis: de_vpi_core_yoy, ref: 2, caption: "Dicke Linie: Kernrate, die Inflationsrate des VPI ohne die stark schwankenden Preise für Energie und Nahrungsmittel; sie zeigt den zugrunde liegenden Preistrend. Dünne Linien: VPI insgesamt und der europäische HVPI, auf den sich das Ziel der EZB bezieht. Gestrichelt: 2 %, das Ziel der EZB."}
      - {chart: pipeline_prices, toggle: {chart: pipeline_core, base: insgesamt, label: ohne Energie, base_en: Total, label_en: Excluding energy}, ask: "Steigen die Preise auf den Vorstufen?", years: 6, up_bad: true, caption: "Preise auf vorgelagerten Stufen: Erzeugerpreise im Inlandsabsatz und Einfuhrpreise. Sie laufen den Verbraucherpreisen häufig voraus."}
      - {chart: pipeline_core, ask: "Breiten sich Kostensteigerungen über Energie hinaus aus?", up_bad: true, years: 6, caption: "Vorstufenpreise ohne Energie zeigen, ob sich Kostensteigerungen über Energie hinaus ausbreiten. Agrarpreise wirken mit Verzögerung auf die Nahrungsmittelpreise."}
      - {chart: price_exp, combine: {lead: "lauteten die Salden der Preiserwartungen:", pre: "", lead_en: "the price expectation balances were:"}, ask: "Welche Preise erwarten Unternehmen und Verbraucher?", multiples: true, up_bad: true, years: 6, caption: "Saldo aus Anteilen der Befragten, die steigende beziehungsweise sinkende Preise erwarten (EU-Umfragen). Unternehmen: nächste drei Monate; Verbraucher: nächste zwölf Monate. Je Feld ist ein Bereich dunkelblau hervorgehoben, jedes Feld hat eine eigene Skala; mit „Gemeinsame Skala“ stehen die übrigen grau zum Vergleich dahinter. Über jedem Feld: jüngster Wert mit Tendenz zum Vormonat sowie die Mittel der letzten 3 und 12 Monate."}
      - {chart: spf, ask: "Vertrauen Fachleute darauf, dass die Inflation auf 2 % zurückgeht?", years: 20, keep_years: true, ref: 2, recessions: false, caption: "Erwartete Inflationsrate im Euroraum in vier bis fünf Jahren, Mittel der Punktprognosen aus der vierteljährlichen Umfrage der EZB unter Fachleuten aus Banken, Forschung und Verbänden (Survey of Professional Forecasters). Blau gestrichelt: Ziel der EZB von 2 %. Liegt die Erwartung nahe am Ziel, gilt die Inflationserwartung als verankert."}
  - id: energie
    group: preise
    title: Energie
    charts:
      - {chart: oil_d, toggle: {chart: oil, base: Tageswerte, label: Monatsmittel, base_en: Daily, label_en: Monthly average}, daily: true, ma_days: 5, years: 3, keep_years: true, recessions: false, ask: "Wie teuer ist Rohöl?", caption: "Preis je Barrel (159 Liter) Rohöl der Nordseesorte Brent in US-Dollar, wie international üblich notiert. Dünn: Tageswerte an Handelstagen, dick: gleitendes Mittel über fünf Handelstage. Die Tageswerte liegen mit etwa einer Woche Abstand vor."}
      - {chart: oil, ask: "Wie teuer ist Rohöl?", years: 6, caption: "Preis je Barrel (159 Liter) Rohöl der Nordseesorte Brent, Monatsmittel, in US-Dollar wie international üblich notiert."}
      - {chart: fuel, years: 3, keep_years: true, recessions: false, name_labels: true, ask: "Was kosten Benzin, Diesel und Heizöl?", caption: "Verbraucherpreise in Deutschland einschließlich Steuern und Abgaben, in € je Liter, Stand jeweils montags. Quelle: Europäische Kommission, Weekly Oil Bulletin."}
      - {chart: power, toggle: {chart: power_d, base: Monatswerte, label: Tageswerte, base_en: Monthly, label_en: Daily}, ask: "Wie viel Strom wird verbraucht, und was kostet er im Großhandel?", multiples: true, own_scale: true, years: 6, recessions: false, caption: "Stromverbrauch (Netzlast) in Deutschland ggü. dem Vorjahresmonat und Großhandelspreis für Strom am Day-Ahead-Markt (Gebotszone Deutschland/Luxemburg), Monatsmittel in € je MWh. Der Verbrauch folgt eng der Industrieproduktion, liegt aber schon wenige Tage nach Monatsende vor; Wetter und Feiertage verzerren einzelne Monate. Quelle: Bundesnetzagentur | SMARD.de, Lizenz CC BY 4.0."}
      - {chart: power_d, daily: true, all_days: true, no_texts: true, ma_days: 7, multiples: true, own_scale: true, years: 3, keep_years: true, recessions: false, ask: "Wie viel Strom wird in den letzten Wochen verbraucht, und was kostet er?", caption: "Stromverbrauch (Netzlast) in GWh je Tag und Großhandelspreis am Day-Ahead-Markt (Gebotszone Deutschland/Luxemburg), Tagesmittel in € je MWh. Dünn: Tageswerte, dick: gleitendes Mittel über sieben Tage. Wochenenden und Feiertage drücken Verbrauch und Preis. Quelle: Bundesnetzagentur | SMARD.de, Lizenz CC BY 4.0."}
      - {chart: energy_intensive, ask: "Wie produzieren die energieintensiven Branchen?", pick: [de_prod_wz_17, de_prod_wz_19, de_prod_wz_20, de_prod_wz_23, de_prod_wz_24], years: 8, ma3: true, keep_years: true, multiples: true, combine: Branchen, caption: "Produktionsindex der fünf energieintensiven Industriezweige (Statistisches Bundesamt über Bundesbank, saison- und kalenderbereinigt, 2021 = 100): Papier, Kokerei und Mineralölverarbeitung, Chemie, Glas und Keramik sowie Metallerzeugung. Sie verbrauchen den größten Teil der Energie in der Industrie und reagieren besonders auf Gas- und Strompreise. Je Feld ist ein Zweig dunkelblau hervorgehoben, jedes Feld hat eine eigene Skala; mit „Gemeinsame Skala“ stehen die übrigen grau zum Vergleich dahinter. Dünn: Monatswerte, dick: gleitendes Dreimonatsmittel."}
      - {chart: gas_storage, y_range: [0, 100], ask: "Wie voll sind die Gasspeicher?", daily: true, years: 3, keep_years: true, recessions: false, caption: "Füllstand der deutschen Gasspeicher in % der Arbeitsgaskapazität, Tageswerte. Die Speicher werden im Sommer gefüllt und im Winter geleert; ein niedriger Stand zu Winterbeginn erhöht das Risiko von Preisspitzen. Gesetzlich vorgegeben sind Mindestfüllstände zu Stichtagen im Herbst. Quelle: GIE (AGSI)."}
      - {chart: gas, fx_factor: 0.293071, ask: "Wie teuer ist Erdgas?", years: 6, fx: fx_usd, unit: "€ je MWh", caption: "Großhandelspreis für Erdgas in Europa (Handelsplatz TTF), Monatsmittel. Der IWF meldet den Preis in US-Dollar je MMBtu; umgerechnet in Euro je Megawattstunde, der in Europa üblichen Einheit, mit dem Monatsmittel des Referenzkurses der EZB (1 MMBtu = 0,293071 MWh)."}
  - id: export
    group: aussen
    title: Export
    charts:
      - {chart: trade, name_labels: true, ask: "Wie entwickeln sich Exporte und Importe?", years: 6, ma3: true, caption: "Warenexporte, Warenimporte und ihr Saldo (Exporte minus Importe) in Milliarden Euro je Monat. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar). Werte nominal, also in jeweiligen Preisen; ein Teil der Veränderung geht auf die Preise zurück (Abbildung zu den Außenhandelspreisen)."}
      - {chart: trade_region, name_labels: true, ask: "Wohin exportiert Deutschland?", years: 6, ma3: true, caption: "Warenexporte in die wichtigsten Kundenregionen in Milliarden Euro je Monat. Dick: gleitendes Dreimonatsmittel, dünn: Monatswerte (über den Knopf ausblendbar). Werte nominal, in jeweiligen Preisen."}
      - {chart: trade_prices, pick: [de_export_prices_yoy, de_import_prices_yoy, de_tot_yoy], ask: "Wie entwickeln sich die Außenhandelspreise?", years: 6, caption: "Ausfuhrpreise und Terms of Trade, also die Ausfuhrpreise im Verhältnis zu den Einfuhrpreisen. Steigen die Terms of Trade, kann Deutschland mit derselben Exportmenge mehr Importe finanzieren."}
      - {chart: balances, transform: sum12, scale: 0.001, unit: "Mrd. €", decimals: 0, ask: "Wie hoch ist der Leistungsbilanzüberschuss?", years: 6, caption: "Saldo der Leistungsbilanz (Waren, Dienstleistungen, Primär- und Sekundäreinkommen) in Mrd. €, Summe der jeweils letzten zwölf Monate; das gleicht die starken saisonalen Schwankungen der Monatswerte aus."}
      - {chart: long_open, x_start: "1871-01-01", crisis_toggle: true, decade_mean: true, ask: "Wie stark hängt Deutschland heute vom Außenhandel ab?", years: 154, keep_years: true, recessions: false, blank_years: [[1914, 1918], [1939, 1945]], crises: hist_bank_deu, long_mean: true, ref: 0, name_labels: true, caption: "Exporte von Waren und Dienstleistungen und Saldo der Leistungsbilanz, jeweils in % des BIP. Quelle der langen Reihen: Global Macro Database (Müller, Xu, Lehbib und Chen 2025), Deutschland in den jeweiligen Grenzen. Hellgrau: Mittel je Jahrzehnt, das laufende gestrichelt. Einblendbar: Bankenkrisen (rot) nach derselben Datenbank und Rezessionen (grau), hier Jahre mit sinkendem realem BIP. Ausgelassen sind die Weltkriege 1914 bis 1918 und 1939 bis 1945; Lücken danach stammen aus der Datenbank. Diese Abbildung und ihr Download stehen unter CC BY-NC-SA 4.0, weil die Global Macro Database diese Lizenz verlangt."}
  - id: welt
    group: aussen
    title: Welt
    ask: "Wie entwickelt sich die Weltwirtschaft?"
    charts:
      - {chart: world_gdp, zoom_toggle: true, name_labels: true, recessions: false, ask: "Wie wachsen die großen Wirtschaftsräume?", years: 8, ref: 0, caption: "Reales BIP gegenüber dem Vorjahresquartal. Der Euroraum nimmt rund 37 % der deutschen Warenexporte auf, die USA rund 10 %."}
      - {chart: ez_gdp, combine: {lead: "betrug das Wachstum des realen BIP ggü. dem Vorjahresquartal", pre: "in ", lead_en: "real GDP growth on a year earlier was", pre_en: "in "}, ask: "Wächst Deutschland schneller oder langsamer als seine Nachbarn?", multiples: true, years: 6, ref: 0, caption: "Reales BIP ggü. dem Vorjahresquartal, saison- und kalenderbereinigt (Eurostat), für Deutschland, Frankreich, Italien, Spanien und den Euroraum. Je Feld ist ein Land dunkelblau hervorgehoben, jedes Feld hat eine eigene Skala; mit „Gemeinsame Skala“ stehen die übrigen grau zum Vergleich dahinter. Zusammen erwirtschaften die vier Länder rund drei Viertel der Wirtschaftsleistung des Euroraums."}
      - {chart: ez_hicp, combine: {lead: "betrug die Inflationsrate (HVPI)", pre: "in ", sign: false, lead_en: "HICP inflation was", pre_en: "in "}, ask: "Ist die Inflation in Deutschland höher als bei den Nachbarn?", multiples: true, up_bad: true, years: 6, ref: 2, caption: "Harmonisierter Verbraucherpreisindex (HVPI) ggü. dem Vorjahresmonat (Eurostat, ab 2026 nach der neuen Gütergliederung ECOICOP 2). Der HVPI ist international vergleichbar und Grundlage des Inflationsziels der EZB von 2 % (gestrichelt). Für Deutschland weicht er vom nationalen VPI meist nur wenig ab. Je Feld ein Land mit eigener Skala; mit „Gemeinsame Skala“ stehen die übrigen Länder grau zum Vergleich dahinter."}
      - {chart: ez_unemp, combine: {lead: "betrug die Erwerbslosenquote", pre: "in ", sign: false, lead_en: "the unemployment rate was", pre_en: "in "}, ask: "Wie hoch ist die Arbeitslosigkeit im Vergleich?", multiples: true, up_bad: true, years: 6, caption: "Erwerbslosenquote nach der Definition der Internationalen Arbeitsorganisation (ILO), saisonbereinigt (Eurostat, Euroraum: EZB): Anteil der Erwerbslosen an allen Erwerbspersonen. Sie ist international vergleichbar und liegt in Deutschland deutlich unter der registrierten Arbeitslosenquote der Bundesagentur für Arbeit. Je Feld ein Land mit eigener Skala; mit „Gemeinsame Skala“ stehen die übrigen Länder grau zum Vergleich dahinter."}
      - {chart: ez_ip, combine: {common: true, lead: "veränderte sich die Produktion im Verarbeitenden Gewerbe ggü. dem Vorjahresmonat", pre: "in ", lead_en: "manufacturing output changed on a year earlier", pre_en: "in "}, ask: "Läuft die Industrie in Deutschland schlechter als bei den Nachbarn?", multiples: true, years: 4, keep_years: true, ref: 0, caption: "Produktion im Verarbeitenden Gewerbe ggü. dem Vorjahresmonat, kalenderbereinigt (Eurostat), für Deutschland, Frankreich, Italien, Spanien und den Euroraum (seit 2026 mit 21 Ländern). Die Werte für Deutschland können wegen anderer Bereinigung leicht von den Angaben der Bundesbank im Abschnitt Industrie abweichen. Je Feld ein Land mit eigener Skala; mit „Gemeinsame Skala“ stehen die übrigen Länder grau zum Vergleich dahinter."}
      - {chart: ez_esi, zoom_toggle: true, zoom_default: true, combine: {common: true, lead: "erreichte die Wirtschaftliche Einschätzung (ESI; langjähriger Durchschnitt = 100)", pre: "in ", sign: false, lead_en: "the Economic Sentiment Indicator (long-term average = 100) was", pre_en: "in "}, ask: "Ist die Stimmung in Deutschland schlechter als bei den Nachbarn?", multiples: true, years: 6, ref: 100, caption: "Wirtschaftliche Einschätzung (Economic Sentiment Indicator, ESI) der EU-Kommission, saisonbereinigt: gewichtetes Mittel aus Umfragen in Industrie, Dienstleistungen, Handel, Bau und bei Verbrauchern. 100 ist der langjährige Durchschnitt des jeweiligen Landes (gestrichelt); der Indikator zeigt also, ob die Stimmung besser oder schlechter als üblich ist, nicht den Abstand zwischen Ländern. Je Feld ein Land mit eigener Skala; mit „Gemeinsame Skala“ stehen die übrigen Länder grau zum Vergleich dahinter."}
  - id: wechselkurse
    group: aussen
    title: Wechselkurse
    ask: "Wie entwickelt sich der Euro?"
    charts:
      - {chart: fx_eer, ask: "Wird der Euro gegenüber allen Handelspartnern teurer?", daily: true, years: 3, keep_years: true, recessions: false, caption: "Nominaler effektiver Wechselkurs der EZB: ein gewichteter Durchschnitt der Euro-Kurse gegenüber den Währungen der Handelspartner des Euroraums, gewichtet nach deren Anteil am Handel. 1. Quartal 1999 = 100. Die breite Gruppe umfasst 41 Partner, die enge 18 (unter anderem USA, China, Vereinigtes Königreich, Schweiz, Japan). Steigt der Index, wird der Euro im Durchschnitt teurer; das verteuert Exporte und verbilligt Importe. Die breite Gruppe liegt höher, weil viele Währungen aufstrebender Länder seit 1999 gegenüber dem Euro an Wert verloren haben. Für die preisliche Wettbewerbsfähigkeit maßgeblich ist der reale Kurs, der auch die Preisentwicklung berücksichtigt."}
      - {chart: fx, ask: "Wie entwickelt sich der Euro gegenüber wichtigen Währungen?", daily: true, multiples: true, own_scale: true, years: 3, keep_years: true, recessions: false, caption: "Referenzkurse der EZB: Einheiten der jeweiligen Währung je Euro, an jedem Arbeitstag. Je Feld eine Währung mit eigener Skala, weil die Kurse sehr verschieden hoch sind. Steigt eine Linie, wird der Euro gegenüber dieser Währung teurer. Über jedem Feld: jüngster Kurs mit Tendenz zum Vortag sowie die Mittel der letzten 3 und 12 Monate."}
  - id: zinsen
    group: finanz
    title: Zinsen und Kredite
    charts:
      - {chart: credit_rates, ask: "Wie teuer sind Kredite?", years: 10, caption: "Effektive Zinssätze der Banken in Deutschland für neu vergebene Kredite (Neugeschäft), gewichtet über alle Laufzeiten: an nichtfinanzielle Unternehmen und an private Haushalte für den Wohnungsbau (EZB, MFI-Zinsstatistik). Sie folgen den Leitzinsen der EZB und den Kapitalmarktzinsen mit Verzögerung."}
      - {chart: credit_growth, ask: "Vergeben die Banken mehr Kredite?", years: 10, ref: 0, caption: "Bestand der Bankkredite an nichtfinanzielle Unternehmen und der Wohnungsbaukredite an private Haushalte in Deutschland, ggü. dem Vorjahresmonat, bereinigt um Umbuchungen und Bewertungsänderungen (EZB, Bilanzstatistik). Ein schwaches Kreditwachstum deutet auf geringe Investitionen oder strenge Kreditvergabe hin."}
      - {chart: yields, toggle: {chart: yields_d, base: Monatsmittel, label: Tageswerte, base_en: Monthly average, label_en: Daily}, unsigned: true, name_labels: true, ask: "Wie hoch sind die Zinsen für Bundesanleihen?", years: 10, caption: "Rendite von Bundesanleihen mit 10 und 2 Jahren Restlaufzeit, Monatsmittel. Sie beeinflusst die Finanzierungskosten von Staat, Unternehmen und privaten Bauherren."}
      - {chart: yields_d, daily: true, unsigned: true, name_labels: true, years: 3, keep_years: true, recessions: false, ask: "Wie haben sich die Zinsen in den letzten Wochen bewegt?", caption: "Rendite von Bundesanleihen mit 10 und 2 Jahren Restlaufzeit (Zinsstrukturkurve der Bundesbank) und Euro-Kurzfristzins €STR, zu dem Banken einander über Nacht Geld leihen, Tageswerte. Der €STR folgt eng dem Einlagezins der EZB."}
      - {chart: long_rr, x_start: "1871-01-01", mean_skip: [[1919, 1924]], mean_note: "ohne Kriegsjahre und Hyperinflation 1919 bis 1924", mean_note_en: "excluding war years and the 1919 to 1924 hyperinflation", crisis_toggle: true, decade_mean: true, y_range: [-30, 30], ask: "Sind die Realzinsen heute historisch hoch?", years: 154, keep_years: true, recessions: false, blank_years: [[1914, 1918], [1939, 1945]], crises: hist_bank_deu, long_mean: true, ref: 0, caption: "Realzins: Rendite langfristiger Staatsanleihen minus Inflationsrate desselben Jahres, in %. Das ist der Realzins im Nachhinein; die Inflation, mit der Anleger beim Kauf rechneten, ist nicht beobachtbar. Die Achse ist auf ±30 % begrenzt; in der Hyperinflation Anfang der 1920er-Jahre lag der Realzins weit darunter. Quelle der langen Reihen: Global Macro Database (Müller, Xu, Lehbib und Chen 2025), Deutschland in den jeweiligen Grenzen. Hellgrau: Mittel je Jahrzehnt, das laufende gestrichelt. Einblendbar: Bankenkrisen (rot) nach derselben Datenbank und Rezessionen (grau), hier Jahre mit sinkendem realem BIP. Ausgelassen sind die Weltkriege 1914 bis 1918 und 1939 bis 1945; Lücken danach stammen aus der Datenbank. Diese Abbildung und ihr Download stehen unter CC BY-NC-SA 4.0, weil die Global Macro Database diese Lizenz verlangt."}
  - id: insolvenzen
    group: finanz
    title: Insolvenzen
    charts:
      - {chart: insolv, ask: "Wie viele Unternehmen beantragen Insolvenz?", type: seasonal, series: de_insolv, years: 11, caption: "Beantragte Insolvenzverfahren von Unternehmen je Monat. Dünn: Monatswerte. Dick: gleitendes Zwölfmonatsmittel, das saisonale Schwankungen ausgleicht. Gestrichelt: Vorkrisenniveau, gemessen als Durchschnitt desselben Monats 2015 bis 2019."}
      - {chart: insolv_land, count_noun: Anträge, ask: "In welchen Ländern steigen die Insolvenzen?", type: tiles, prefix: de_insolv_land_, what: "Zahl der Insolvenzanträge", caption: "Beantragte Unternehmensinsolvenzen je Land, Veränderung ggü. demselben Zeitraum ein Jahr zuvor; umschaltbar zwischen 12 und 6 Monaten. Orange: Zunahme, blau: Abnahme. Die Liste rechts ordnet die Länder nach der Veränderung."}
      - {chart: insolv_emp, toggle: {chart: insolv_claims, base: Beschäftigte, label: Forderungen, base_en: Employees, label_en: Claims}, ask: "Wie viele Beschäftigte sind betroffen?", type: seasonal, series: de_insolv_emp, years: 11, caption: "Beschäftigte in Unternehmen, die Insolvenz beantragt haben. Einzelne Großinsolvenzen führen zu starken Ausschlägen. Dünn: Monatswerte. Dick: gleitendes Zwölfmonatsmittel, das saisonale Schwankungen ausgleicht. Gestrichelt: Vorkrisenniveau, gemessen als Durchschnitt desselben Monats 2015 bis 2019."}
      - {chart: insolv_claims, ask: "Wie hoch sind die Forderungen der Gläubiger?", type: seasonal, series: de_insolv_claims, years: 11, caption: "Voraussichtliche Forderungen der Gläubiger in Milliarden Euro. Dünn: Monatswerte. Dick: gleitendes Zwölfmonatsmittel, das saisonale Schwankungen ausgleicht. Gestrichelt: üblich vor Corona, gemessen als Durchschnitt desselben Monats 2015 bis 2019. Beträge nominal; die Preise sind seit 2019 um rund ein Viertel gestiegen."}
      - {chart: gruend_land, toggle: {chart: aufgabe_land, base: Gründungen, label: Aufgaben, base_en: Start-ups, label_en: Closures}, count_noun: Gründungen, ask: "Wo werden mehr Betriebe gegründet?", type: tiles, prefix: de_gruend_land_, what: "Zahl der Betriebsgründungen", caption: "Gründungen von Betrieben mit größerer wirtschaftlicher Bedeutung (Hauptniederlassung) je Land, Veränderung ggü. demselben Zeitraum ein Jahr zuvor. Orange: Zunahme, blau: Abnahme. Die Liste rechts ordnet die Länder nach der Veränderung."}
      - {chart: aufgabe_land, count_noun: Aufgaben, ask: "Wo werden mehr Betriebe aufgegeben?", type: tiles, prefix: de_aufgabe_land_, what: "Zahl der Betriebsaufgaben", caption: "Vollständige Aufgaben von Betrieben mit größerer wirtschaftlicher Bedeutung (Hauptniederlassung) je Land, Veränderung ggü. demselben Zeitraum ein Jahr zuvor. Orange: Zunahme, blau: Abnahme. Die Liste rechts ordnet die Länder nach der Veränderung."}
  - id: stimmung
    group: ausblick
    title: Stimmung
    charts:
      - {chart: sentiment, multiples: true, combine: {lead: "lauteten die Salden der Vertrauensindikatoren:", lead_en: "the confidence balances were:"}, ask: "Wie ist die Stimmung in den Wirtschaftsbereichen?", years: 6, caption: "Saldo aus positiven und negativen Antworten je Bereich (EU-Umfragen). Die Niveaus der Bereiche sind nicht direkt vergleichbar, weil die Fragen sich unterscheiden; aussagekräftig ist die Veränderung."}
      - {chart: sector_now, toggle: {chart: sector_next, base: Lage, label: Erwartungen, base_en: Current situation, label_en: Expectations}, combine: {lead: "lauteten die Salden zur Lage:", lead_en: "the balances on the current situation were:"}, ask: "Wie bewerten die Bereiche ihre aktuelle Lage?", multiples: true, years: 6, caption: "Einschätzung der Geschäftsentwicklung der vergangenen drei Monate, Saldo aus positiven und negativen Antworten (EU-Umfragen). Je Feld ist ein Bereich dunkelblau hervorgehoben, jedes Feld hat eine eigene Skala; mit „Gemeinsame Skala“ stehen die übrigen grau zum Vergleich dahinter. Über jedem Feld: jüngster Wert mit Tendenz zum Vormonat sowie die Mittel der letzten 3 und 12 Monate."}
      - {chart: sector_next, combine: {lead: "lauteten die Salden zu den Erwartungen:", lead_en: "the balances on expectations were:"}, ask: "Was erwarten die Bereiche für die nächsten Monate?", multiples: true, years: 6, caption: "Erwartungen für die kommenden drei Monate, Saldo aus positiven und negativen Antworten (EU-Umfragen). Im Bau erfasst die Umfrage hierzu die Beschäftigungspläne. Je Feld ist ein Bereich dunkelblau hervorgehoben, jedes Feld hat eine eigene Skala; mit „Gemeinsame Skala“ stehen die übrigen grau zum Vergleich dahinter. Über jedem Feld: jüngster Wert mit Tendenz zum Vormonat sowie die Mittel der letzten 3 und 12 Monate."}
      - {chart: capacity, ref_mean: [2005, 2019], ask: "Wie stark sind die Kapazitäten der Industrie ausgelastet?", years: 12, caption: "Auslastung der Produktionskapazitäten in der Industrie in Prozent, vierteljährliche Umfrage. Grau gestrichelt: Mittel 2005 bis 2019."}
  - id: aussichten
    group: ausblick
    title: Aussichten
    ask: "Was erwarten die Prognosen?"
    charts:
      - {chart: forecast, ask: "Was erwarten die Prognosen für das Wachstum?", type: forecast, measure: gdp, title: "Prognosen für das Wachstum", caption: "Prognosen für das Wachstum des realen BIP ggü. Vorjahr, je Zieljahr. Je Zieljahr ein Punkt je Herausgeber, jeweils die jüngste Prognose. Dunkelblau mit Zahl: Projektion der Bundesregierung, die Grundlage für Haushalt und Steuerschätzung; grau: weitere Herausgeber, hellgrau, wenn die Prognose älter als vier Monate ist. Graues Feld: Spanne vom niedrigsten bis zum höchsten Wert. Herausgeber und Datum im Tooltip. Gemeinschaftsdiagnose: gemeinsame Prognose von DIW, ifo, IfW Kiel, IWH und RWI. Einzelne Werte stammen aus Presseberichten zu den Veröffentlichungen und sind im Tooltip gekennzeichnet."}
      - {chart: forecast_infl, ask: "Was erwarten die Prognosen für die Inflation?", type: forecast, measure: inflation, title: "Prognosen für die Inflationsrate", caption: "Prognosen für die Inflationsrate ggü. Vorjahr, je Zieljahr; in der Regel gemessen am Verbraucherpreisindex (VPI). Die Bundesbank prognostiziert den europäischen HVPI, der meist nahe am VPI liegt. Je Zieljahr ein Punkt je Herausgeber, jeweils die jüngste Prognose. Dunkelblau mit Zahl: Bundesregierung; grau: weitere Herausgeber, hellgrau, wenn älter als vier Monate. Graues Feld: Spanne aller jüngsten Prognosen. Herausgeber und Datum im Tooltip. Einzelne Werte stammen aus Presseberichten und sind im Tooltip gekennzeichnet."}
      - {chart: forecast_core, ask: "Was erwarten die Prognosen für die Kerninflation?", type: forecast, measure: core, title: "Prognosen für die Kerninflation", caption: "Prognosen für die Inflationsrate ohne Energie und Nahrungsmittel. Erscheint, sobald mindestens zwei Herausgeber einen Wert veröffentlicht haben."}
  - id: rezession
    code: Rezession
    title: Rezessionsrisiko
    part: analysen
    ask: "Droht eine Rezession?"
    charts:
      - {chart: sahm, ask: "Deutet der Arbeitsmarkt auf eine Rezession hin?", up_bad: true, years: 25, type: threshold, threshold: 0.25, caption: "Eigene Berechnung nach Michaillat und Saez (2025). Das Signal ist der kleinere von zwei Werten. Erstens: Arbeitslosenquote einschließlich Kurzarbeit (in Vollzeitäquivalenten), gleitendes Dreimonatsmittel, minus ihr Tief der letzten zwölf Monate. Zweitens: Hoch der Quote offener Stellen in den letzten zwölf Monaten minus ihr aktuelles Dreimonatsmittel. Das Signal steigt also nur, wenn die Arbeitslosigkeit zunimmt und zugleich die offenen Stellen abnehmen. Die Schwelle von 0,25 Prozentpunkten ist eigene Wahl für Deutschland; Michaillat und Saez nennen für die USA 0,29. Rot gestrichelt: Schwelle. Graue Flächen: Rezessionen nach der Datierung des Sachverständigenrats. Jede Rezession seit 2001 überschritt die Schwelle, teils mit erheblicher Verzögerung. Literatur: Michaillat, P. und Saez, E. (2025), Has the Recession Started?, Oxford Bulletin of Economics and Statistics; Sahm, C. (2019), Direct Stimulus Payments to Individuals, Brookings Institution."}
      - {chart: clock, ask: "In welcher Konjunkturphase steht die Industrie?", type: clock, x: de_ind_orderbooks, y: de_ind_prodexp, months: 24, caption: "Waagerecht: Wie bewerten Industrieunternehmen ihre Aufträge heute? Senkrecht: Was erwarten sie für die nächsten drei Monate? Beides als Abstand zum Durchschnitt 2005 bis 2019. Die Spur zeigt die letzten 24 Monate, der große Punkt den jüngsten Monat, die Pfeile die Richtung. Im typischen Konjunkturzyklus bewegt sich der Punkt im Uhrzeigersinn durch die vier farbig hinterlegten Phasen: Aufschwung, Boom, Abschwung, Rezession."}
      - {chart: downturns, toggle: {chart: downturns_hist, base: "seit 2008, Monate", label: "seit 1879, Jahre", base_en: "since 2008, months", label_en: "since 1879, years"}, ask: "Wie tief ist der aktuelle Abschwung im Vergleich zu früheren Krisen?", type: event, kind: downturn, months: 36, episodes: [{label: "Finanzkrise 2008", start: "2008-01-01"}, {label: "Corona 2020", start: "2020-02-01"}], caption: "Verlauf ab dem Hoch der Industrieproduktion vor früheren Krisen und im aktuellen Abschwung (dunkelblau, dick). Produktion und BIP als Index mit dem Hoch = 100, Arbeitslosenquote als Veränderung in Prozentpunkten seit diesem Hoch. Das aktuelle Hoch ist der höchste Stand der Produktion in den letzten fünf Jahren. Die Zeitpunkte der Hochs sind gesetzt, keine amtliche Datierung. Die Energiekrise ab Ende 2021 ist nicht eigens gezeigt, weil sie in den laufenden Abschwung übergeht."}
      - {chart: downturns_hist, ask: "Wie tief waren die Abschwünge seit dem 19. Jahrhundert?", type: event, kind: history, title: "Abschwünge seit 1879 im Vergleich, Jahreswerte", years: 8, stop_before: [1914, 1939], band_label: "Spanne der übrigen Abschwünge", episodes: [{peak: 1879}, {peak: 1898}, {peak: 1928, label: "Weltwirtschaftskrise 1929", highlight: true}, {peak: 1966}, {peak: 1974}, {peak: 1981}, {peak: 1992}, {peak: 2001}, {peak: 2008, label: "Finanzkrise 2009", highlight: true}, {peak: 2019, label: "Corona 2020", highlight: true}], caption: "Jahreswerte ab dem letzten Jahr vor einem Rückgang des realen BIP (Jahr des Hochs). Links: reales BIP, Jahr des Hochs = 100. Rechts: Veränderung der Arbeitslosenquote in Prozentpunkten seit diesem Jahr. Hervorgehoben: Weltwirtschaftskrise, Finanzkrise, Corona und der laufende Abschwung (dick); grau: Spanne der übrigen Abschwünge mit Hochs 1879, 1898, 1966, 1974, 1981, 1992 und 2001. Kriegsjahre sind ausgelassen, Verläufe enden vor 1914 und 1939. Historische Werte aus der Global Macro Database (Müller, Xu, Lehbib und Chen 2025), Deutschland in den jeweiligen Grenzen; die Arbeitslosenquote wechselt über die Zeit Quelle und Abgrenzung. Der laufende Abschwung beruht auf amtlichen Jahreswerten (BIP des Statistischen Bundesamts, Erwerbslosenquote nach ILO als Jahresmittel) und ist deshalb nicht vollständig vergleichbar. Diese Abbildung und ihr Download stehen unter CC BY-NC-SA 4.0, weil die Global Macro Database diese Lizenz verlangt."}
  - id: pruefung
    code: Prognosen
    title: Prognosen und Revisionen
    part: analysen
    ask: "Wie verlässlich sind die ersten Zahlen und die Projektion?"
    charts:
      - {chart: proj_gap, type: projection, title: "BIP und Projektion der Bundesregierung", ask: "Erreicht das Wachstum die Projektion der Bundesregierung?", caption: "Balken: reales BIP ggü. dem Vorjahresquartal in %, unbereinigt wie die Jahresrate der Projektion. Hell: Rate, die das BIP in den noch fehlenden Quartalen des Jahres je erreichen müsste, damit das Jahr die jüngste Projektion der Bundesregierung trifft (gestrichelte Linie). Die Jahresrate ist näherungsweise das Mittel der vier Quartalsraten, gewichtet mit dem Anteil jedes Quartals am Vorjahr. Revisionen früherer Quartale ändern die nötige Rate. Liegen alle vier Quartale vor, zeigt die Abbildung bis zum ersten Quartal des Folgejahres das Ergebnis des abgelaufenen Jahres. Umschaltbar auf die saison- und kalenderbereinigte Rate ggü. dem Vorquartal: Dann zeigen die hellen Balken, um wie viel das bereinigte BIP in jedem fehlenden Quartal wachsen müsste, damit es die nötige Rate ggü. dem Vorjahresquartal erreicht; ein Kalendereffekt ist dabei nicht berücksichtigt."}
      - {chart: gdp_rev, unit: "Pp", styles: {gdp_rt_first: hover, gdp_rt_latest: hover}, mad_band: true, title: "Korrektur des BIP-Wachstums seit der ersten Meldung", ask: "Wie stark wird das BIP-Wachstum nachträglich korrigiert?", years: 8, keep_years: true, ref: 0, recessions: false, caption: "Balken: Korrektur des Wachstums des realen BIP ggü. dem Vorquartal zwischen der ersten Meldung des Statistischen Bundesamts und dem jüngsten Datenstand, in Prozentpunkten (positiv: nach oben korrigiert). Graues Band: mittlere Korrektur ohne Vorzeichen über den gezeigten Zeitraum. Erste Meldung und heutigen Stand zeigt der Tooltip; beide stehen auch im Download. Grundlage sind die gespeicherten Datenstände der Echtzeitdatenbank der Bundesbank seit 2005. Die erste Meldung eines Quartals beruht auf unvollständigen Angaben; spätere Rechenstände und große Revisionen ändern sie oft um mehrere Zehntel."}
  - id: breite
    code: Breite
    title: Breite und Vergleich
    part: analysen
    ask: "Wie breit ist die Entwicklung, und wie ungewöhnlich ist sie?"
    charts:
      - {chart: diffusion, type: diffusion, groups: {Produktion: branch_heat, Auftragseingang: orders_heat}, title: "Breite: Anteil der Industriebranchen mit Zuwachs", ask: "Wächst die Industrie in der Breite oder nur in einzelnen Branchen?", caption: "Anteil der Branchen des Verarbeitenden Gewerbes, deren Produktion (24 Branchen) oder Auftragseingang (9 Branchen) in den letzten drei Monaten über den drei Monaten davor lag, in %. Jede Branche zählt gleich, unabhängig von ihrer Größe. Über 50 % wächst die Mehrheit der Branchen. Linien: gleitendes Dreimonatsmittel; die Monatswerte lassen sich einblenden. Graue Flächen: Rezessionen nach der Datierung des Sachverständigenrats."}
      - {chart: infl_hist, ask: "Wie schnell gingen frühere Inflationsschübe zurück?", type: event, kind: history, years: 8, band_label: "Spanne der übrigen Schübe", panels: [{title: "Inflationsrate", sub: "in %; waagerecht: Jahre seit dem Inflationshoch", hist: hist_infl_deu, cur: de_hicp_yoy, per_year: 12, mode: level}], episodes: [{peak: 1951, label: "Korea-Boom 1951"}, {peak: 1974, label: "Ölkrise 1974", highlight: true}, {peak: 1981, label: "Zweite Ölkrise 1981", highlight: true}, {peak: 1992, label: "Wiedervereinigung 1992", highlight: true}], caption: "Jahresinflationsrate ab dem Jahr des Inflationshochs: nach dem Korea-Boom 1951 (grau), den Ölkrisen 1974 und 1981, der Wiedervereinigung 1992 und im laufenden Schub seit 2022 (dick). Die Abbildung zeigt, wie viele Jahre es jeweils dauerte, bis die Rate wieder nahe 2 % lag. Historische Werte aus der Global Macro Database (Müller, Xu, Lehbib und Chen 2025); der laufende Schub als Jahresmittel des harmonisierten Verbraucherpreisindex (HVPI, Deutsche Bundesbank), nur vollständige Jahre. Diese Abbildung und ihr Download stehen unter CC BY-NC-SA 4.0, weil die Global Macro Database diese Lizenz verlangt."}
  - id: wettbewerb
    title: Wettbewerb
    part: analysen
    ask: "Wer konkurriert mit Deutschland auf den Weltmärkten?"
    charts:
      - {chart: esi, context_grey: true, recessions: false, ask: "Wer konkurriert mit ähnlichen Waren wie Deutschland?", emphasis: esi_chn, caption: "Ähnlichkeit der Warenstruktur der Exporte eines Landes mit derjenigen Deutschlands: 0 bedeutet keine Überschneidung, 100 eine identische Struktur (Finger und Kreinin 1979, je Warengruppe zählt der kleinere Anteil). Hohe Werte bedeuten, dass beide Länder auf den Weltmärkten mit ähnlichen Waren konkurrieren. Hervorgehoben: China."}
  - id: bedrohung
    title: Bedrohung
    part: geopolitik
    ask: "Wie stark gerät Deutschland ins Visier?"
    charts:
      - {chart: hybrid, annual_count: {verb: "zählt die Datenbank der Universität Leiden", series: {leiden_ops_de: "Vorfälle mit Ziel in Deutschland", leiden_ops_eu: "im übrigen Europa"}}, annual_count_en: {verb: "the Leiden University database counts", series: {leiden_ops_de: "incidents with a target in Germany", leiden_ops_eu: "in the rest of Europe"}}, ask: "Wie oft trifft russische Sabotage Ziele in Europa?", x_start: "2022-01-01", keep_years: true, years: 4, recessions: false, no_yoy: true, caption: "Vorfälle je Quartal, die Behörden oder belastbare Berichte Russland zuschreiben: Sabotage, Brandstiftung, Ausspähung, Mordanschläge und gesteuerte Störaktionen im physischen Raum, ohne die meisten Cyberangriffe und Spionagefälle. Blau: Vorfälle mit Ziel in Deutschland. Die Zählung hängt an der Zuschreibung; andere Datenbanken kommen mit anderen Abgrenzungen auf deutlich andere Zahlen. Viele Fälle werden erst nach Abschluss der Ermittlungen bekannt; jüngste Quartale fallen deshalb zu niedrig aus."}
      - {chart: gpr, tpl_en: {gpr_de: "{when}, the geopolitical risk index for Germany stood at {v} points; the 1985–2019 average is 100.", gpr_world: "{when}, the global geopolitical risk index stood at {v} points."}, ask: "Wie viel berichten Zeitungen über geopolitische Risiken?", up_bad: true, years: 8, refs: [{y: 100, label: "Mittel 1985–2019 = 100"}], caption: "Geopolitical Risk Index nach Caldara und Iacoviello: Anteil der Artikel in zehn großen englischsprachigen Zeitungen über Kriegsgefahr, Kriege, Aufrüstung und Terror; Länderindex nur Artikel, die auch Deutschland nennen. Mittel 1985 bis 2019 = 100. Hohe Werte gehen in der Forschung mit geringeren Investitionen und mehr Zurückhaltung von Unternehmen einher."}
  - id: ruestung
    title: Rüstung
    part: geopolitik
    ask: "Wie viel gibt Deutschland für Verteidigung aus?"
    charts:
      - {chart: milex, tpl_en: {milex_deu: "{when}, Germany's military expenditure amounted to {v}% of GDP, {chg} pp {more} than a year earlier."}, ask: "Wie hoch sind die Militärausgaben im Vergleich?", x_start: "1990-01-01", keep_years: true, years: 36, recessions: false, emphasis: milex_deu, context_grey: true, name_labels: true, refs: [{y: 2, label: "NATO-Ziel 2 %"}, {y: 3.5, label: "NATO-Ziel 3,5 % bis 2035"}], caption: "Militärausgaben in % des BIP nach der Abgrenzung des Stockholmer Friedensforschungsinstituts SIPRI, einschließlich Militärrenten und Militärhilfe. Die NATO rechnet anders; ihre Quoten für Deutschland liegen meist etwas höher. Grau gestrichelt: das Ziel von 2 % und das 2025 in Den Haag vereinbarte Ziel von 3,5 % für die Kernausgaben bis 2035. Hervorgehoben: Deutschland."}
      - {chart: cinc, tpl_en: {cinc_deu: "{when}, Germany's share in the CINC capability index was {v}% of the world, {chg} pp {more} than a year earlier."}, ask: "Wie viel Gewicht hat Deutschland unter den Mächten der Welt?", x_start: "1816-01-01", keep_years: true, years: 207, recessions: false, emphasis: cinc_deu, context_grey: true, name_labels: true, caption: "Anteil am Composite Index of National Capability des Correlates-of-War-Projekts in Prozent der Welt: Mittel der Weltanteile an Bevölkerung, Stadtbevölkerung, Stahlproduktion, Energieverbrauch, Soldaten und Militärausgaben. Deutschland 1955 bis 1990 Bundesrepublik und DDR zusammen, Russland bis 1991 Sowjetunion. Der Index misst Masse, keine Technik und keine Bündnisse."}
  - id: ukraine
    title: Ukraine-Hilfe
    part: geopolitik
    ask: "Wie viel hilft Deutschland der Ukraine?"
    charts:
      - {chart: ukraine_aid, tpl_en: {kiel_de_mil: "{when}, Germany allocated military aid worth €{v} bn to Ukraine.", kiel_de_other: "{when}, financial and humanitarian aid worth €{v} bn was added."}, ask: "Wie viel Hilfe teilt Deutschland der Ukraine zu?", x_start: "2022-01-01", keep_years: true, years: 5, recessions: false, no_yoy: true, caption: "Bilaterale Hilfe Deutschlands, die geliefert oder für die Lieferung festgelegt ist, in Milliarden Euro je Quartal nach dem Monat der Zuteilung. Militärhilfe einschließlich Geldern für Waffenkäufe. Ohne den deutschen Anteil an der Hilfe der EU und ohne Ausgaben für Geflüchtete in Deutschland. Große Pakete werden oft auf Jahre festgelegt und erscheinen dann gebündelt."}
  - id: handel
    title: Handelskonflikte
    part: geopolitik
    ask: "Wie oft treffen Handelshemmnisse deutsche Exporte?"
    charts:
      - {chart: trade_harm, annual_count: {verb: "zählt Global Trade Alert", per_year: 1, series: {gta_de_chn: "schädliche Eingriffe Chinas mit Wirkung auf Deutschland", gta_de_usa: "der USA", gta_de_other: "anderer Staaten"}}, annual_count_en: {verb: "Global Trade Alert counts", per_year: 1, series: {gta_de_chn: "harmful interventions by China affecting Germany", gta_de_usa: "by the USA", gta_de_other: "by other states"}}, ask: "Wie viele schädliche Handelseingriffe treffen Deutschland?", x_start: "2009-01-01", keep_years: true, years: 17, recessions: false, no_yoy: true, caption: "Zahl der Eingriffe je Jahr, die Global Trade Alert als schädlich oder wahrscheinlich schädlich für den Handel einstuft und bei denen Deutschland unter den betroffenen Ländern steht: Zölle, Subventionen, Vorgaben für öffentliche Aufträge, Exportbeschränkungen und Auflagen für Investitionen. Gezählt nach Jahr des Inkrafttretens, nur abgeschlossene Jahre. Jeder Eingriff zählt einmal, gleich wie viel Handel er betrifft. Global Trade Alert erfasst neue Fälle oft mit Verzögerung; das jüngste Jahr fällt deshalb eher zu niedrig aus."}
  - id: struktur
    title: Struktur
    part: struktur
    ask: "Wie steht es um die Grundlagen des Wachstums?"
    charts:
      - {chart: potential, pot_band: [de_potential, de_potential_oecd, de_potential_imf], zoom_toggle: true, zoom_years: 12, ask: "Wächst die Wirtschaft schneller als ihr Potenzial?", years: 30, forecast_after_bars: true, caption: "Das Produktionspotenzial ist die Wirtschaftsleistung, die bei normaler Auslastung von Arbeitskräften und Maschinen möglich wäre. Es lässt sich nicht beobachten, sondern wird geschätzt. Die Fläche zeigt die Spanne der Schätzungen von Europäischer Kommission (AMECO), OECD und IWF, die Einzelwerte stehen im Tooltip; heller: Prognosejahre. Die Schätzungen unterscheiden sich in Methode und Stand und werden mit jeder Ausgabe revidiert. Wächst das BIP (Balken) schneller als das Potenzial, steigt die Auslastung; die Differenz der Niveaus heißt Produktionslücke. Ist sie positiv, droht eher Inflation, ist sie negativ, sind Kapazitäten ungenutzt."}
      - {chart: productivity, ask: "Wie entwickelt sich die Produktivität?", years: 26, name_labels: true, caption: "Reale Wirtschaftsleistung je Erwerbstätigen und je geleisteter Arbeitsstunde. Langfristig bestimmt die Produktivität den Wohlstand."}
      - {chart: long_growth, x_start: "1871-01-01", crisis_toggle: true, decade_mean: true, ask: "Ist eine so lange Wachstumsschwäche historisch ungewöhnlich?", transform: cagr10, unit: "% p. a.", years: 154, keep_years: true, recessions: false, blank_years: [[1914, 1918], [1939, 1945]], crises: hist_bank_deu, long_mean: true, ref: 0, caption: "Durchschnittliches jährliches Wachstum des realen BIP je Einwohner in den jeweils zehn Jahren bis zum genannten Jahr, in %. Je Einwohner, damit Bevölkerungs- und Gebietsänderungen den Vergleich nicht verzerren. Quelle der langen Reihen: Global Macro Database (Müller, Xu, Lehbib und Chen 2025), Deutschland in den jeweiligen Grenzen. Hellgrau: Mittel je Jahrzehnt, das laufende gestrichelt. Einblendbar: Bankenkrisen (rot) nach derselben Datenbank und Rezessionen (grau), hier Jahre mit sinkendem realem BIP. Ausgelassen sind die Weltkriege 1914 bis 1918 und 1939 bis 1945; Zehnjahreswerte danach schließen die Kriegsjahre noch ein. Diese Abbildung und ihr Download stehen unter CC BY-NC-SA 4.0, weil die Global Macro Database diese Lizenz verlangt."}
      - {chart: inv_ratio, ask: "Wie viel investiert Deutschland im Vergleich zur EU?", years: 30, name_labels: true, caption: "Bruttoanlageinvestitionen (Maschinen, Bauten, Software und Forschung) in Prozent des BIP, Deutschland im Vergleich zur Europäischen Union."}
      - {chart: long_inv, x_start: "1871-01-01", crisis_toggle: true, decade_mean: true, ask: "Investiert Deutschland heute weniger als früher?", years: 154, keep_years: true, recessions: false, blank_years: [[1914, 1918], [1939, 1945]], crises: hist_bank_deu, long_mean: true, caption: "Investitionen in % des BIP, in jeweiligen Preisen. Bis 1950 Bruttoinvestitionen nach historischen Schätzungen, danach Volkswirtschaftliche Gesamtrechnungen; die Abgrenzung ändert sich über die Zeit. Quelle der langen Reihen: Global Macro Database (Müller, Xu, Lehbib und Chen 2025), Deutschland in den jeweiligen Grenzen. Hellgrau: Mittel je Jahrzehnt, das laufende gestrichelt. Einblendbar: Bankenkrisen (rot) nach derselben Datenbank und Rezessionen (grau), hier Jahre mit sinkendem realem BIP. Ausgelassen sind die Weltkriege 1914 bis 1918 und 1939 bis 1945; Lücken danach stammen aus der Datenbank. Diese Abbildung und ihr Download stehen unter CC BY-NC-SA 4.0, weil die Global Macro Database diese Lizenz verlangt."}
      - {chart: emp_sector, ask: "In welchen Bereichen entstehen Arbeitsplätze?", type: since, base: "2022-04-01", unit: "Tsd. Personen, Veränderung seit dem 2. Quartal 2022", bar_name: "Veränderung seit 2. Quartal 2022", caption: "Veränderung der Zahl der Erwerbstätigen je Wirtschaftsbereich seit dem 2. Quartal 2022, in Tausend; in Klammern in Prozent des Stands im 2. Quartal 2022. Zeigt die Verschiebung von der Industrie zu den Dienstleistungen."}
      - {chart: migration, toggle: {chart: migration_groups, base: Insgesamt, label: nach Staatsangehörigkeit, base_en: Total, label_en: By citizenship}, ask: "Wie viele Menschen wandern zu?", years: 30, scale: 0.000001, unit: "Mio. Personen", decimals: 2, caption: "Zuzüge minus Fortzüge über die Grenzen Deutschlands in Millionen Personen, einschließlich statistischer Anpassung. Die Zuwanderung trägt seit 2011 maßgeblich zum Wachstum der Erwerbsbevölkerung bei; 2015 und 2022 prägen die Fluchtbewegungen aus Syrien und der Ukraine."}
      - {chart: migration_groups, ask: "Wer wandert zu und wer ab?", years: 20, name_labels: true, scale: 0.001, unit: "Tsd. Personen", decimals: 0, ref: 0, caption: "Zuzüge minus Fortzüge nach Staatsangehörigkeit, in Tausend. Deutsche wandern seit Jahren netto ab; die Zuwanderung aus Staaten außerhalb der EU prägen Fluchtbewegungen, die aus der EU vor allem Arbeitsmigration. Ohne statistische Anpassung, deshalb weicht die Summe von der Abbildung zur Nettozuwanderung ab."}
      - {chart: cit, type: dumbbell, recessions: false, ask: "Wie hoch besteuert Deutschland Unternehmensgewinne im Vergleich?", years: 30, emphasis: cit_deu, context_grey: true, caption: "Tarifliche Gesamtsteuerbelastung von Kapitalgesellschaften (Körperschaftsteuer einschließlich Zuschläge und Steuern nachgeordneter Ebenen, in Deutschland Gewerbesteuer), nach OECD. Hohler Punkt: Satz im ersten Jahr der Reihe, voller Punkt mit Zahl: jüngster Satz; Jahre in der Legende. Geordnet nach dem jüngsten Satz, Deutschland hervorgehoben."}
  - id: staat
    title: Staat
    part: struktur
    ask: "Wie stehen die öffentlichen Finanzen da?"
    charts:
      - {chart: gov_balance, ask: "Wie hoch ist das Defizit des Staates?", years: 12, refs: [{y: -3, label: "Referenzwert −3 %"}], caption: "Einnahmen minus Ausgaben von Bund, Ländern, Gemeinden und Sozialversicherung in Prozent des BIP, vierteljährlich, saisonbereinigt. Negative Werte bedeuten ein Defizit. Grau gestrichelt: Referenzwert des Maastricht-Vertrags von −3 % des BIP; er gilt für das Defizit eines ganzen Jahres, nicht für einzelne Quartale."}
      - {chart: gov_spend, ask: "Wie viel gibt der Staat für Zinsen und Investitionen aus?", years: 25, name_labels: true, caption: "Zinsausgaben und Bruttoanlageinvestitionen des Staates in Prozent des BIP, Jahreswerte. Steigende Zinsen engen den Spielraum für Investitionen ein."}
      - {chart: gov_debt, ask: "Wie hoch ist der Schuldenstand?", up_bad: true, years: 12, refs: [{y: 60, label: "Referenzwert 60 %"}], caption: "Bruttoschulden des Staates in der Abgrenzung des Maastricht-Vertrags in Prozent des BIP. Grau gestrichelt: Referenzwert des Maastricht-Vertrags von 60 %."}
      - {chart: long_debt, x_start: "1871-01-01", crisis_toggle: true, decade_mean: true, ask: "Wie hoch war die Staatsverschuldung früher?", years: 154, keep_years: true, recessions: false, blank_years: [[1914, 1918], [1939, 1945]], crises: hist_bank_deu, long_mean: true, refs: [{y: 60, label: "Referenzwert 60 %"}], caption: "Bruttoschulden des Gesamtstaats in % des BIP. Nach beiden Weltkriegen wurden die Schulden durch Inflation und Währungsreform weitgehend entwertet. Grau gestrichelt: Referenzwert des Maastricht-Vertrags. Quelle der langen Reihen: Global Macro Database (Müller, Xu, Lehbib und Chen 2025), Deutschland in den jeweiligen Grenzen. Hellgrau: Mittel je Jahrzehnt, das laufende gestrichelt. Einblendbar: Bankenkrisen (rot) nach derselben Datenbank und Rezessionen (grau), hier Jahre mit sinkendem realem BIP. Ausgelassen sind die Weltkriege 1914 bis 1918 und 1939 bis 1945; Lücken danach stammen aus der Datenbank. Diese Abbildung und ihr Download stehen unter CC BY-NC-SA 4.0, weil die Global Macro Database diese Lizenz verlangt."}
  - id: sachverstaendigenrat
    title: Sachverständigenrat
    part: struktur
    ask: "Was hat der Sachverständigenrat vorhergesagt und empfohlen?"
    charts:
      - {chart: svr_bip, styles: {svr_bip_band_lo: band_lo, svr_bip_band_hi: band_hi}, band_label: "übliche Spanne des Fehlers", band_label_en: "usual error range", say: ["Seit 1966 lag die Wachstumsprognose des Sachverständigenrats im Mittel 1,2 Prozentpunkte neben der ersten Meldung. Die Regel „wie im Vorjahr“ lag 1,9 Prozentpunkte daneben."], say_en: ["Since 1966 the Council of Economic Experts has missed the first release of growth by 1.2 percentage points on average. The rule \"same as last year\" missed by 1.9 points."], ask: "Wie gut traf der Sachverständigenrat das Wachstum?", title: "Wachstumsprognosen des Sachverständigenrats und erste Meldung", years: 62, keep_years: true, recessions: false, ref: 0, unit: "% ggü. Vorjahr", caption: "Prognose des Sachverständigenrats für das Wachstum des realen BIP im Folgejahr, jeweils aus dem Jahresgutachten im November, und die erste Meldung für dasselbe Jahr, wie sie das Jahresgutachten ein Jahr später druckt. Bis 1991 Westdeutschland, bei den Prognosen für 1992 bis 1994 ebenfalls das frühere Bundesgebiet; bis etwa 1990 meist reales Bruttosozialprodukt. Für 1965 und 1968 gab der Rat nur Halbjahresprognosen, dort fehlt die Prognose. Violette Fläche: übliche Spanne um die Prognose; in zwei Dritteln der Jahre seit 1966 lag die erste Meldung darin. Die Fläche ist asymmetrisch, weil der Rat das Wachstum im Mittel überschätzte (Prognose minus 1,7 bis plus 1,0 Prozentpunkte). Jeder Wert ist mit Ziffer oder Tabelle und gedruckter Seite belegt; die Tabelle mit allen Fundstellen steht im Repository unter data/static/svr_prognosen.csv."}
      - {chart: svr_vpi, say: ["Seit 1966 lag die Inflationsprognose des Sachverständigenrats im Mittel 0,7 Prozentpunkte neben der ersten Meldung. Die Regel „wie im Vorjahr“ lag 0,9 Prozentpunkte daneben."], say_en: ["Since 1966 the Council of Economic Experts has missed the first release of inflation by 0.7 percentage points on average. The rule \"same as last year\" missed by 0.9 points."], ask: "Wie gut traf der Sachverständigenrat die Inflation?", title: "Inflationsprognosen des Sachverständigenrats und erste Meldung", years: 62, keep_years: true, recessions: false, unit: "% ggü. Vorjahr", caption: "Prognose des Sachverständigenrats für den Anstieg der Verbraucherpreise im Jahresdurchschnitt des Folgejahres und die erste Meldung aus dem Jahresgutachten ein Jahr später. Wo der Rat nur den Deflator des privaten Verbrauchs vorhersagte, steht auch als Ist-Wert der Deflator. Bis 1991 Westdeutschland. Fehlt im Folgegutachten eine Jahresrate, steht der heutige Stand; der Verbraucherpreisindex wird kaum überarbeitet."}
      - {chart: svr_alo, say: ["In 42 Jahren mit gedruckter Zahl lag die Arbeitslosenprognose des Sachverständigenrats im Mittel rund 170 000 Personen neben der ersten Meldung. Die Regel „wie im Vorjahr“ lag rund 250 000 daneben."], say_en: ["In 42 years with a printed figure the Council of Economic Experts missed the first release of unemployment by about 170,000 people on average. The rule \"same as last year\" missed by about 250,000."], ask: "Wie gut traf der Sachverständigenrat die Arbeitslosigkeit?", title: "Arbeitslosenprognosen des Sachverständigenrats und erste Meldung", years: 62, keep_years: true, recessions: false, decimals: 0, unit: "Tsd. Personen", caption: "Prognose des Sachverständigenrats für die Zahl der registrierten Arbeitslosen im Jahresdurchschnitt des Folgejahres und die erste Meldung aus dem Jahresgutachten ein Jahr später. Bis 1991 Westdeutschland, danach Deutschland; der Sprung 1991/92 kommt aus dem Gebiet. Ab 2005 zählen auch Bezieher von Arbeitslosengeld II, das hebt die Zahl. Die Prognoselinie zeigt nur Jahre, für die der Rat eine Zahl gedruckt hat; Jahre mit nur einer Veränderung oder einer unscharfen Grenze fehlen dort."}
      - {chart: svr_rat, type: stance, attach: svr_positionen.json, years: 62, keep_years: true, recessions: false, ask: "Was empfahl der Sachverständigenrat zu Löhnen, Geld, Finanzen und Arbeitsmarkt?", say: ["Lohnzurückhaltung empfahl der Sachverständigenrat in 28 von 62 Jahresgutachten, durchgehend von 1993 bis 2011. Mehr Flexibilität am Arbeitsmarkt fordert er seit 1983 fast in jedem Jahr."], say_en: ["The Council of Economic Experts recommended wage restraint in 28 of 62 annual reports, without a break from 1993 to 2011. It has called for more labour-market flexibility almost every year since 1983."], caption: "Empfehlung der Ratsmehrheit im Jahresgutachten für das Folgejahr, je Frage auf einer festen Stufe. Lohnpolitik: blau unter dem Verteilungsspielraum (Produktivität plus Preisanstieg), grau im Rahmen, rot darüber. Geldpolitik: blau straffer, grau beibehalten, rot lockerer. Finanzpolitik: blau Konsolidierung, grau konjunkturneutral, rot Impulse. Arbeitsmarkt und Sozialstaat: blau mehr Schutz oder Leistungen, grau beibehalten, rot Flexibilisierung, Leistungskürzung oder Anreize zur Arbeitsaufnahme. Weiß: keine Empfehlung erkennbar. Antippen zeigt die Empfehlung in einem Satz mit Ziffer und Seite. Balken darunter: Stellen mit Minderheitsvotum je Jahresgutachten, gezählt je Sachpunkt. Eigene Erfassung aus allen Jahresgutachten 1964/65 bis 2025/26; die Einordnung ist eine Deutung, die Fundstellen stehen in data/static/svr_positionen_dauerfragen.csv."}
      - {chart: svr_fiskal, type: stance_bars, pick: [svr_bip_prog, svr_stance_f], attach: svr_positionen.json, years: 62, keep_years: true, recessions: false, ref: 0, unit: "% ggü. Vorjahr", ask: "Riet der Sachverständigenrat auch bei schwachem Wachstum zum Sparen?", say: ["In zehn Jahren erwartete der Sachverständigenrat weniger als 1 % Wachstum. In sechs davon empfahl er trotzdem eine restriktivere Finanzpolitik, zuletzt für 2013."], say_en: ["In ten years the Council of Economic Experts expected growth below 1%. In six of them it still recommended tighter fiscal policy, most recently for 2013."], caption: "Balken: Wachstum des realen BIP, das der Sachverständigenrat im Jahresgutachten für das Folgejahr erwartete. Farbe: Kurs der Finanzpolitik, den er im selben Gutachten für dieses Jahr empfahl; blau Konsolidierung, grau konjunkturneutral (automatische Stabilisatoren wirken lassen), rot Impulse, hellgrau keine Empfehlung erkennbar. Bis 1991 Westdeutschland. Antippen zeigt die Empfehlung mit Ziffer und Seite."}
  - id: sonderfaktoren
    title: Sonderfaktoren
    part: anhang
    ask: "Welche Sonderfaktoren wirken auf die Konjunktur?"
    charts:
      - {chart: rhine, y_range: [0, null], unsigned: true, threshold_label: "78 cm", ask: "Ist der Rhein für Frachtschiffe gut befahrbar?", daily: true, years: 3, threshold: 78, recessions: false, caption: "Wasserstand am Pegel Kaub, dem Engpass für die Rheinschifffahrt zwischen Mainz und Koblenz, Tagesmittel in cm. Über den Rhein transportieren Chemie, Stahl, Mineralöl und Kohle große Mengen. Rot gestrichelt: 78 cm. Nach einer Faustregel des IfW Kiel sinkt die Industrieproduktion um etwa 1 %, wenn der Pegel einen Monat lang unter dieser Marke liegt. Bis Ende des Vorjahres geprüfte Pegeldaten der WSV (Bundesanstalt für Gewässerkunde), danach PEGELONLINE."}
      - {chart: rhine_low, partial_last: true, ask: "Wie oft war der Rhein seit 1970 zu flach?", years: 57, recessions: false, caption: "Zahl der Tage je Kalenderjahr, an denen der Wasserstand am Pegel Kaub im Tagesmittel unter 78 cm lag; laufendes Jahr bis zum jüngsten Tag. Lange Niedrigwasserphasen wie 2018 und 2022 verteuerten Transporte und bremsten die Industrie. Quelle: geprüfte Pegeldaten der WSV, bereitgestellt durch die Bundesanstalt für Gewässerkunde (R-Paket hyd1d); jüngste Werte aus PEGELONLINE."}
      - {chart: weather, series_ref: {de_rain_pct: 100}, signed: [de_temp_anom], no_tend: true, labels: {de_temp_anom: "Temperatur, Abweichung vom Mittel", de_rain_pct: "Niederschlag in % der üblichen Menge"}, ref_labels: {de_temp_anom: "Mittel 1991–2020", de_rain_pct: "übliche Menge (100 %)"}, ref_labels_en: {de_temp_anom: "1991–2020 average", de_rain_pct: "usual amount (100%)"}, ask: "War das Wetter für den Bau ungewöhnlich?", multiples: true, no_yoy: true, own_scale: true, years: 6, ref: 0, recessions: false, caption: "Monatswerte des Deutschen Wetterdienstes für ganz Deutschland. Temperatur: Abweichung vom Mittel desselben Monats 1991 bis 2020 in °C. Niederschlag: in % des Mittels desselben Monats 1991 bis 2020. Ein sehr kalter, frostiger oder nasser Wintermonat drückt die Bauproduktion, ein milder hebt sie; die Ausschläge gleichen sich meist in den Folgemonaten aus. Auffällige Monate erscheinen in der Abbildung zur Bauproduktion unter „Ausschläge und Sondereffekte“. Gestrichelt im Feld Niederschlag: 100 % des Mittels."}
      - {chart: hdd, ask: "Wie viel muss geheizt werden?", no_yoy: true, years: 6, norm: [2015, 2019], recessions: false, caption: "Heizgradtage messen den Heizbedarf: Je kälter ein Tag unter 15 °C, desto mehr Gradtage (VDI 3807, Raumtemperatur 20 °C), hier je Monat in Kelvin mal Tagen. Balken: Monatswerte; schwarze Striche: Mittel desselben Monats 2015 bis 2019. Reicht ein Balken über den Strich, war der Monat kälter als üblich. Die Sommermonate fallen kaum ins Gewicht, weil dann wenig geheizt wird. Ein kalter Winter erhöht den Verbrauch von Gas und Heizöl und die Energieerzeugung, ein milder senkt sie. Ungewichtetes Mittel aller Stationen des Deutschen Wetterdienstes, da der DWD keinen Deutschlandwert veröffentlicht."}
      - {chart: enso, ask: "Treibt El Niño die Nahrungsmittelpreise?", type: event, caption: "Ereignisstudie: Verlauf der Preise ab dem Beginn sehr starker El-Niño-Ereignisse (Monat 0 = 100), bereinigt um die allgemeine Teuerung. Links: Nahrungsmittel im Verbraucherpreisindex im Verhältnis zum Gesamtindex (ab 1995). Rechts: Erzeugerpreise landwirtschaftlicher Produkte im Verhältnis zu den Verbraucherpreisen (bis 1990 früheres Bundesgebiet, Deflator dort der OECD-Verbraucherpreisindex). Graue Fläche: Spanne früherer sehr starker Ereignisse; Linien: einzelne Ereignisse, dick das laufende. Beginn: erster Monat einer Folge, in der der Relative Oceanic Niño Index (RONI) der NOAA mindestens 0,5 °C erreicht; sehr stark: Höchstwert ab 2 °C. El Niño verknappt über Dürren und Starkregen vor allem in Südasien, Afrika und Südamerika Ernten; in Deutschland wirkt das über Weltmarktpreise für Getreide, Pflanzenöle, Kakao und Kaffee, abgeschwächt und verzögert."}
      - {chart: enso_comm, type: enso_comm, lag: 6, items: {wb_soybeans: "Sojabohnen", wb_maize: "Mais", wb_rice: "Reis", wb_wheat: "Weizen", wb_cocoa: "Kakao", wb_coffee: "Kaffee (Robusta)", wb_palmoil: "Palmöl", wb_sugar: "Zucker"}, items_en: {wb_soybeans: "Soybeans", wb_maize: "Maize", wb_rice: "Rice", wb_wheat: "Wheat", wb_cocoa: "Cocoa", wb_coffee: "Coffee (Robusta)", wb_palmoil: "Palm oil", wb_sugar: "Sugar"}, ask: "Welche Rohstoffe werden nach El Niño teurer?", caption: "Mittlere Veränderung der Weltmarktpreise ggü. dem Vorjahr, gemessen sechs Monate nach Monaten mit El Niño (dunkel) und nach neutralen Monaten (grau). El Niño: Relativer Oceanic Niño Index (RONI) der NOAA mindestens 0,5 °C; neutral: zwischen −0,5 und 0,5 °C. Preise in US-Dollar aus dem Pink Sheet der Weltbank. Stern: Unterschied statistisch deutlich (Welch-t-Test, |t| > 1,96). Idee nach einer Auswertung der Weltbank (Prospects Group); die Rechnung ist eigene."}
      - {chart: uncertainty, refs: [{y: 100, label: "Mittel 1997–2015 = 100"}], ask: "Wie unsicher ist die Wirtschaftspolitik?", up_bad: true, years: 8, caption: "Index der wirtschaftspolitischen Unsicherheit nach Baker, Bloom und Davis, ermittelt aus der Häufigkeit einschlägiger Begriffe in Zeitungsartikeln; Mittel 1997 bis 2015 = 100. Hohe Unsicherheit lässt Unternehmen Investitionen aufschieben. Die Reihen werden mit unterschiedlichem Abstand aktualisiert und enden deshalb nicht im selben Monat."}
      - {chart: deflator, ask: "Wie entwickeln sich die Preise in der Gesamtrechnung?", up_bad: true, years: 8, caption: "Deflatoren der Volkswirtschaftlichen Gesamtrechnungen: Preisentwicklung aller im Inland erzeugten Güter (BIP-Deflator) und des privaten Konsums."}
  - id: kalender
    title: Kalender
    part: service
    ask: "Wann erscheinen die nächsten Zahlen?"
    charts:
      - {chart: calendar, ask: "Wann erscheinen welche Zahlen?", type: calendar, weeks: 12, title: "Veröffentlichungskalender: die nächsten zwölf Wochen", caption: "Termine geschätzt nach dem üblichen Veröffentlichungsrhythmus der Quellen und mit hochgestelltem e gekennzeichnet. Verbindlich sind die verlinkten Kalender der Quellen. Die Verweise führen zu den Abbildungen, die mit dem Termin neue Werte erhalten."}
