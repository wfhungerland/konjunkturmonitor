# Konjunkturmonitor: Inhalt der Seite.
# Jede Frage bekommt eine Antwort aus den Daten (Satz, Zahl, Vergleich) und eine Erklärung in Alltagssprache.
# Die Zahlen kommen aus series.yaml (Katalog im Format von konjunkturwolf), die Sätze baut monitor/answers.py.

site:
  title: Konjunkturmonitor
  claim: "Wie steht es um die deutsche Wirtschaft? Die wichtigsten Kennzahlen mit kurzer Einordnung, werktäglich aktualisiert aus amtlichen und frei zugänglichen Daten."
  author: "Hungerland, Wolf-Fabian"
  license: "Texte und eigene Abbildungen: CC BY 4.0 (Namensnennung: Wolf-Fabian Hungerland, Konjunkturmonitor). Die Daten unterliegen den Lizenzen der jeweiligen Quellen."
  url: "https://wfhungerland.github.io/konjunkturmonitor/"
  repo: "https://github.com/wfhungerland/konjunkturmonitor"
  kommentar: false        # Knopf „Kommentar“ und Kommentarsatz; vorläufig offline
  feedback: "mqpqkgqp"     # Formspree-Kennung (öffentlich) für den Knopf „Rückmeldung“; leer: kein Knopf

# Darstellung nach Tufte. Jeder Schalter lässt sich einzeln mit false zurücknehmen.
layout:
  start_table: true       # Startseite als Kennzahlentabelle mit Wortsparklines (false: acht Fragekarten)
  minimal: true           # ohne Kartenrahmen und Urteilsetiketten; Erläuterungen als Randnotiz
  direct_labels: true     # Beschriftung am Linienende statt Legende (bis vier Linien)
  small_multiples: true   # Abbildungen mit multiples: true als kleine Einzeldiagramme auf gleicher Skala
  compare_band: false     # Spanne 2015 bis 2019 als graues Band in Zeitreihen (true: wieder einblenden)
  uniform_years: 6        # einheitliches Zeitfenster in Jahren für Abbildungen mit 3 bis 8 Jahren (false: wie je Abbildung angegeben)
  freq_years: {M: 6, Q: 10, D: 3}  # feste Zeitfenster je Takt ab Jahresanfang (Monat, Quartal, Tag); keep_years oder x_start je Abbildung gehen vor
  lead_chart_only: true   # je Thema eine Leitgrafik, weitere Abbildungen aufklappbar
  overview: true          # Antwort auf die Titelfrage in zwei bis drei Sätzen über der Tabelle
  brief_topics: [wachstum, preise, arbeit, industrie, konsum, export, stimmung, zinsen]  # Kurzfassung: Leitabbildungen dieser Abschnitte
  window_start: {short: "2019-01-01", mid: "2005-01-01"}  # Linien beginnen am Jahresanfang: bis 8 Jahre ab short, 10 bis 12 Jahre ab mid, längere ab Jahresanfang (false: vom jüngsten Wert zurückzählen)
  red_zero_line: false    # Nulllinie schwarz (true: rot wie im früheren Grafikstandard)

# Kennzahlentabelle der Startseite, gruppiert nach den Abschnitten der Seite (topic).
# kind rate: Vergleiche als Differenz; kind level: als prozentuale Veränderung. up_bad: steigender Wert ist ungünstig (rotes ▲).
start_table:
  - {label: "BIP, real", series: de_gdp_index, kind: level, scale: 1, unit: "Index 2020 = 100", mom_from: de_gdp_qoq, yoy_from: de_gdp_yoy, topic: wachstum}
  - {label: "Inflationsrate (VPI)", series: de_cpi_yoy, kind: rate, unit: "% ggü. Vorjahresmonat", up_bad: true, topic: preise}
  - {more: true, label: "Kernrate (ohne Energie und Nahrungsmittel)", series: de_vpi_core_yoy, kind: rate, unit: "% ggü. Vorjahresmonat", up_bad: true, topic: preise}
  - {more: true, label: "Erzeugerpreise", series: de_ppi_yoy, kind: rate, unit: "% ggü. Vorjahresmonat", up_bad: true, topic: preise}
  - {label: "Arbeitslosenquote", series: de_alq_sa, kind: rate, unit: "%", up_bad: true, topic: arbeit}
  - {more: true, label: "Erwerbstätige", series: de_emp_m, kind: level, scale: 0.001, decimals: 2, unit: "Mio.", change: diff, change_unit: "Tsd.", change_decimals: 0, topic: arbeit}
  - {more: true, label: "Gemeldete offene Stellen", series: de_vac_sa, kind: level, decimals: 0, unit: "Tsd.", topic: arbeit}
  - {more: true, label: "Rezessionssignal (Schwelle 0,25)", series: de_sahm, kind: rate, unit: "Pp", decimals: 2, change_decimals: 2, up_bad: true, topic: rezession}
  - {label: "Produktion der Industrie", series: de_ip, kind: level, unit: "Index 2021 = 100", topic: industrie}
  - {label: "Auftragseingang der Industrie", series: de_orders, kind: level, unit: "Index 2021 = 100", topic: industrie}
  - {label: "Produktion im Baugewerbe", series: de_bau_prod, kind: level, unit: "Index 2021 = 100", topic: bau}
  - {label: "Einzelhandelsumsatz, real", series: de_retail, kind: level, unit: "Index 2021 = 100", topic: konsum}
  - {more: true, label: "Verbrauchervertrauen", series: de_consumer_conf, kind: rate, unit: "Saldo in Pp", topic: konsum}
  - {label: "Warenexporte, nominal", series: de_exports, kind: level, unit: "Mrd. €", topic: export}
  - {label: "Wirtschaftsklima (ESI)", series: de_esi, kind: rate, unit: "Punkte", topic: stimmung}
  - {label: "Unternehmensinsolvenzen", series: de_insolv, kind: level, decimals: 0, unit: "Anträge", seasonal: true, up_bad: true, topic: wachstum}
  - {label: "Rendite Bundesanleihen, 10 Jahre", series: de_bund10, kind: rate, unit: "%", decimals: 2, change_decimals: 2, topic: zinsen}
  - {label: "Rohöl Brent", series: w_brent, kind: level, unit: "US-$ je Barrel", decimals: 0, topic: energie}

questions:
  - id: wachstum
    ask: "Wächst die Wirtschaft?"
    kind: growth
    series: de_gdp_qoq
    yoy: de_gdp_yoy
    explain: "Das Bruttoinlandsprodukt (BIP) ist der Wert aller Waren und Dienstleistungen, die in Deutschland hergestellt werden. Steigt es, wird mehr produziert und mehr Einkommen erzielt."
    topic: wachstum

  - id: preise
    ask: "Steigen die Preise?"
    kind: inflation
    series: de_cpi_yoy
    index: de_vpi
    core: de_vpi_core_yoy
    parts: {Energie: de_vpi_energy_yoy, Nahrungsmittel: de_vpi_food_yoy, "Waren ohne Energie": de_vpi_goods_yoy, "Dienstleistungen ohne Mieten": de_vpi_serv_yoy, Wohnungsmiete: de_vpi_rent_yoy}
    explain: "Die Inflationsrate gibt an, um wie viel Prozent die Preise eines typischen Warenkorbs höher sind als ein Jahr zuvor. Gemessen wird sie mit dem Verbraucherpreisindex (VPI) des Statistischen Bundesamts. Die Europäische Zentralbank strebt mittelfristig 2 % an."
    topic: preise

  - id: arbeit
    ask: "Wie entwickelt sich der Arbeitsmarkt?"
    kind: unemployment
    series: de_alq_sa
    level: de_alo_sa
    explain: "Die Arbeitslosenquote ist der Anteil der bei der Bundesagentur für Arbeit gemeldeten Arbeitslosen an allen zivilen Erwerbspersonen."
    topic: arbeit

  - id: industrie
    ask: "Wie entwickelt sich die Industrie?"
    kind: index_mom
    series: de_ip
    orders: de_orders
    explain: "Die Produktion misst, wie viel die Industrie herstellt. Der Auftragseingang misst neue Bestellungen; er läuft der Produktion einige Monate voraus."
    topic: industrie

  - id: konsum
    ask: "Wie entwickelt sich der private Konsum?"
    kind: index_mom
    series: de_retail
    mood: de_consumer_conf
    explain: "Der preisbereinigte Einzelhandelsumsatz misst, wie viel die Geschäfte verkaufen. Das Verbrauchervertrauen beruht auf einer Befragung der Haushalte zu ihrer finanziellen Lage und ihren Erwartungen."
    topic: konsum

  - id: export
    ask: "Wie entwickeln sich die Exporte?"
    kind: level_mom
    series: de_exports
    explain: "Exporte sind ins Ausland verkaufte Waren. Die Exporte von Waren und Dienstleistungen entsprechen in Deutschland fast der Hälfte des Bruttoinlandsprodukts."
    topic: export

  - id: stimmung
    ask: "Wie schätzen Unternehmen und Haushalte die Lage ein?"
    kind: sentiment
    series: de_esi
    explain: "Jeden Monat fragt die EU-Kommission Unternehmen und Haushalte nach ihrer Lage und ihren Erwartungen. Der Wirtschaftsklimaindikator ist so normiert, dass 100 dem langjährigen Durchschnitt entspricht; höhere Werte zeigen eine überdurchschnittliche Stimmung."
    topic: stimmung

  - id: insolvenzen
    ask: "Wie viele Unternehmen beantragen Insolvenz?"
    kind: insolvency
    series: de_insolv
    employees: de_insolv_emp
    claims: de_insolv_claims
    explain: "Ein Insolvenzverfahren wird beantragt, wenn ein Unternehmen zahlungsunfähig oder überschuldet ist. Da die Zahl der Anträge im Jahresverlauf schwankt, vergleicht der Monitor mit demselben Monat früherer Jahre."
    topic: wachstum

  - id: zinsen
    ask: "Wie entwickeln sich die Zinsen?"
    kind: level
    series: de_bund10
    name: "die Rendite zehnjähriger Bundesanleihen"
    unit: "%"
    decimals: 2
    explain: "Die Rendite von Bundesanleihen ist der Zins, den der Bund für neue Kredite am Kapitalmarkt zahlt. Sie dient als Richtwert für langfristige Kredite an Unternehmen und für Baufinanzierungen."
    topic: zinsen

  - id: energie
    ask: "Wie entwickeln sich die Energiepreise?"
    kind: level
    series: w_brent
    name: "der Preis für Rohöl der Sorte Brent"
    unit: "US-Dollar je Barrel"
    decimals: 1
    also: [{series: w_gas_eu, label: "Erdgas in Europa (TTF)", unit: "US-Dollar je MMBtu", decimals: 1}]
    explain: "Öl- und Gaspreise wirken schnell auf die Verbraucherpreise für Kraftstoffe und Heizung und mit Verzögerung auf die Kosten der Industrie. Die Preise werden in US-Dollar gehandelt; ein schwächerer Euro verteuert sie in Euro gerechnet."
    topic: energie

# Themen: je Frage ein Abschnitt mit Abbildungen. type: line (Standard), bars, stacked, clock, forecast, threshold.
topics:
  - id: wachstum
    group: gesamt
    title: Wachstum
    charts:
      - {chart: gdp_contrib, ask: "Welche Nachfrage trägt das Wachstum?", type: stacked, total: de_gdp_qoq, years: 3, keep_years: true, groups: {Konsum: [P31_S14_S15, P3_S13], Investitionen: [P51G], Außenhandel: [P6, P7], Lager: [P52_P53]}, caption: "Die Balken zeigen, wie viele Prozentpunkte jeder Teil der Nachfrage zum Wachstum gegenüber dem Vorquartal beiträgt. Dazu zählen der Konsum der Haushalte und des Staates, die Investitionen, der Außenhandel (Exporte minus Importe) und die Vorratsveränderung, also der Auf- oder Abbau von Lagern. Die Linie zeigt das Wachstum des Bruttoinlandsprodukts (der Wirtschaftsleistung) insgesamt in Prozent. Zusammen ergeben die Balken die Linie, bis auf Rundung."}
      - {chart: wai, zoom_toggle: true, zoom_default: true, ask: "Was zeigen die Wochendaten zur Wirtschaftsleistung?", years: 3, ref: 0, caption: "Der Aktivitätsindex der Bundesbank schätzt, wie stark die Wirtschaftsleistung in den letzten 13 Wochen gegenüber den 13 Wochen davor gewachsen ist. Er nutzt dafür wöchentliche Daten, etwa Lkw-Maut, Stromverbrauch und Suchanfragen im Internet. Er liegt früher vor als das Bruttoinlandsprodukt, bleibt aber eine Schätzung."}
      - {chart: maut, toggle: {chart: maut_d, base: Monatswerte, label: Tageswerte, base_en: Monthly, label_en: Daily}, zoom_toggle: true, zoom_default: true, ask: "Wie viel fahren die Lkw auf den Autobahnen?", years: 6, ma3: true, caption: "Der Index zeigt, wie viel mautpflichtige Lkw ab vier Achsen auf Autobahnen fahren; er beruht auf den Mautdaten. Er liegt wenige Tage nach Monatsende vor. Er folgt eng der Industrieproduktion, weil diese Lkw vor allem Vorleistungen (Teile und Rohstoffe für andere Betriebe) und Waren transportieren. Dick: gleitender Durchschnitt über drei Monate, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: maut_d, daily: true, all_days: true, no_texts: true, ma_days: 7, years: 3, keep_years: true, recessions: false, ask: "Wie viel fahren die Lkw in den letzten Wochen?", caption: "Der Index zeigt die tägliche Fahrleistung der Lkw, kalender- und saisonbereinigt, also ohne die üblichen Einflüsse von Feiertagen und Jahreszeiten. Er ist experimentell und stammt von Destatis und dem Bundesamt für Logistik und Mobilität (BALM); die Bundesbank bereinigt ihn. Er liegt mit fünf bis zwölf Tagen Verzögerung vor und wird donnerstags aktualisiert. Dünn: Tageswerte, dick: gleitender Durchschnitt über sieben Tage. Die Tageswerte schwanken stark und lassen sich nicht direkt mit dem Monatsindex vergleichen."}
      - {chart: gdp_level, ask: "Wo steht die Wirtschaftsleistung im längeren Vergleich?", years: 12, caption: "Gezeigt ist die Wirtschaftsleistung, preisbereinigt (also ohne den Einfluss steigender Preise), 2020 = 100. Der Einbruch 2020 geht auf die Corona-Pandemie zurück. Die Veränderung gegenüber dem Vorjahr ist hier saison- und kalenderbereinigt. Die Übersicht nennt dagegen wie die Schnellmeldung des Statistischen Bundesamts die unbereinigte Rate. Deshalb können beide um 0,1 Prozentpunkte voneinander abweichen."}
      - {chart: gdp_use, combine: {extremes: true, tail: "jeweils preisbereinigt ggü. dem Vorquartal", names: {"Konsum der Haushalte": "die Konsumausgaben der Haushalte", "Konsum des Staates": "die Konsumausgaben des Staates", "Exporte": "die Exporte", "Importe": "die Importe", "Investitionen: Ausrüstungen": "die Ausrüstungsinvestitionen", "Investitionen: Bauten": "die Bauinvestitionen", "Investitionen: Sonstige Anlagen": "die Investitionen in sonstige Anlagen"}, lead: "veränderten sich die Verwendungskomponenten preisbereinigt ggü. dem Vorquartal:", lead_en: "the expenditure components changed in real terms on the previous quarter:"}, ask: "Wie haben sich die Verwendungskomponenten im letzten Quartal entwickelt?", type: latest, years: 2, caption: "Die Balken zeigen, wie sich die einzelnen Teile der Nachfrage im letzten Quartal verändert haben, preisbereinigt. Die Raute zeigt den Wert des Quartals davor. Die Investitionen sind aufgeteilt in Ausrüstungen (Maschinen, Fahrzeuge, Waffensysteme), Bauten und sonstige Anlagen (vor allem Software und Forschung)."}
      - {chart: insolv, ask: "Wie viele Unternehmen beantragen Insolvenz?", type: seasonal, series: de_insolv, years: 11, caption: "Die Abbildung zeigt, wie viele Unternehmen je Monat ein Insolvenzverfahren beantragen. Dünn: Monatswerte. Dick: gleitendes Zwölfmonatsmittel, das saisonale Schwankungen ausgleicht. Gestrichelt: Vorkrisenniveau, also der Durchschnitt desselben Monats in den Jahren 2015 bis 2019."}
      - {chart: insolv_land, count_noun: Anträge, ask: "In welchen Ländern steigen die Insolvenzen?", type: tiles, prefix: de_insolv_land_, what: "Zahl der Insolvenzanträge", caption: "Die Abbildung zeigt je Bundesland, wie sich die beantragten Unternehmensinsolvenzen gegenüber demselben Zeitraum ein Jahr zuvor verändert haben. Ein Schalter wechselt zwischen Zeiträumen von 12 und 6 Monaten. Orange heißt Zunahme, blau Abnahme. Die Liste rechts ordnet die Länder nach der Veränderung."}
      - {chart: insolv_emp, toggle: {chart: insolv_claims, base: Beschäftigte, label: Forderungen, base_en: Employees, label_en: Claims}, ask: "Wie viele Beschäftigte sind betroffen?", type: seasonal, series: de_insolv_emp, years: 11, caption: "Die Abbildung zeigt, wie viele Menschen in Unternehmen arbeiten, die Insolvenz beantragt haben. Einzelne große Insolvenzen führen zu starken Ausschlägen. Dünn: Monatswerte, dick: gleitendes Zwölfmonatsmittel, das saisonale Schwankungen ausgleicht. Gestrichelt: Vorkrisenniveau, also der Durchschnitt desselben Monats in den Jahren 2015 bis 2019."}
      - {chart: insolv_claims, ask: "Wie hoch sind die Forderungen der Gläubiger?", type: seasonal, series: de_insolv_claims, years: 11, caption: "Die Abbildung zeigt, wie viel Geld die Gläubiger in Insolvenzverfahren voraussichtlich fordern, in Milliarden Euro. Dünn: Monatswerte, dick: gleitendes Zwölfmonatsmittel, das saisonale Schwankungen ausgleicht. Gestrichelt: üblicher Wert vor Corona, also der Durchschnitt desselben Monats in den Jahren 2015 bis 2019. Die Beträge sind nicht um Preise bereinigt; die Preise sind seit 2019 um rund ein Viertel gestiegen."}
      - {chart: gruend_land, toggle: {chart: aufgabe_land, base: Gründungen, label: Aufgaben, base_en: Start-ups, label_en: Closures}, count_noun: Gründungen, ask: "Wo werden mehr Betriebe gegründet?", type: tiles, prefix: de_gruend_land_, what: "Zahl der Betriebsgründungen", caption: "Die Abbildung zeigt je Bundesland, wie sich die Gründungen von Betrieben mit größerer wirtschaftlicher Bedeutung (Hauptniederlassungen) gegenüber demselben Zeitraum ein Jahr zuvor verändert haben. Orange heißt Zunahme, blau Abnahme. Die Liste rechts ordnet die Länder nach der Veränderung."}
      - {chart: aufgabe_land, count_noun: Aufgaben, ask: "Wo werden mehr Betriebe aufgegeben?", type: tiles, prefix: de_aufgabe_land_, what: "Zahl der Betriebsaufgaben", caption: "Die Abbildung zeigt je Bundesland, wie sich die Zahl der Betriebe mit größerer wirtschaftlicher Bedeutung (Hauptniederlassungen), die vollständig aufgegeben werden, gegenüber demselben Zeitraum ein Jahr zuvor verändert hat. Orange heißt Zunahme, blau Abnahme. Die Liste rechts ordnet die Länder nach der Veränderung."}
      - {chart: services, ask: "Wie entwickelt sich die Produktion der Dienstleister?", years: 6, ma3: true, caption: "Gezeigt ist die preisbereinigte Produktion ausgewählter Dienstleistungsbereiche. „Insgesamt“ umfasst Verkehr und Lagerei, Gastgewerbe, Information und Kommunikation, Grundstücks- und Wohnungswesen sowie freiberufliche, technische und sonstige Unternehmensdienste. Handel, Finanzen und Staat sind nicht enthalten. Dienstleister erzeugen gut zwei Drittel der Wertschöpfung, werden aber monatlich nur lückenhaft erfasst. Dick: gleitender Durchschnitt über drei Monate, dünn: Monatswerte (über den Knopf ausblendbar)."}
  - id: industrie
    group: produktion
    title: Industrie
    charts:
      - {chart: industry, brief: {de_ip: "Produktion", de_orders: "Auftragseingang", de_orders_xbig: "Auftragseingang ohne Großaufträge"}, zoom_toggle: true, zoom_default: true, name_labels: true, ask: "Wie entwickeln sich Produktion und Aufträge der Industrie?", years: 6, ma3: true, caption: "Dünn: Monatswerte, dick: gleitender Durchschnitt über drei Monate. Der Auftragseingang läuft der Produktion voraus, denn was heute bestellt wird, wird meist erst später hergestellt."}
      - {chart: orders_split, brief: {de_orders_dom: "Aufträge aus dem Inland", de_orders_euro: "aus dem Euroraum", de_orders_noneuro: "von außerhalb des Euroraums"}, zoom_toggle: true, zoom_default: true, pick: [de_orders_dom, de_orders_euro, de_orders_noneuro], ask: "Woher kommen die Aufträge: aus dem Inland, dem Euroraum oder von außerhalb?", years: 6, ma3: true, caption: "Die Linien zeigen die Aufträge der Industrie nach Herkunft: aus dem Inland, dem Euroraum und der übrigen Welt. Sie sind um Preise, Saison und Kalender bereinigt. Großaufträge, etwa für Flugzeuge, Schiffe oder Rüstungsgüter, sorgen für einzelne starke Ausschläge. Dick: gleitender Durchschnitt über drei Monate, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: branch_heat, toggle: {chart: branch_heat_bars, base: Tabelle, label: Balken, base_en: Table, label_en: Bars}, ask: "Welche Branchen produzieren mehr, welche weniger?", type: heat, months: 12, caption: "Die Tabelle zeigt die Produktion je Branche gegenüber dem Vorjahresmonat in Prozent; orange heißt Zunahme, blau Abnahme. Sortiert ist sie nach dem Dreimonatsvergleich, also den letzten drei Monaten gegenüber den drei Monaten davor. Die rechten Spalten zeigen diesen Dreimonatsvergleich und das Niveau gegenüber dem Durchschnitt 2019. Beide Werte erscheinen als Balken in der folgenden Abbildung."}
      - {chart: orders_heat, toggle: {chart: orders_heat_bars, base: Tabelle, label: Balken, base_en: Table, label_en: Bars}, volatile: ["Sonstiger Fahrzeugbau"], ask: "Welche Branchen erhalten mehr Aufträge?", type: heat, months: 12, caption: "Die Tabelle zeigt den Auftragseingang je Branche gegenüber dem Vorjahresmonat in Prozent, preisbereinigt; orange heißt Zunahme, blau Abnahme. Sortiert ist sie nach dem Dreimonatsvergleich, also den letzten drei Monaten gegenüber den drei Monaten davor. Die rechten Spalten zeigen diesen Dreimonatsvergleich und das Niveau gegenüber dem Durchschnitt 2019; beide erscheinen als Balken in der folgenden Abbildung. Großaufträge, vor allem im sonstigen Fahrzeugbau (etwa Flugzeuge, Schiffe und Schienenfahrzeuge), verzerren einzelne Monate."}
      - {chart: prod_groups, brief: {de_prod_vorl: "Produktion von Vorleistungsgütern", de_prod_inve: "von Investitionsgütern", de_prod_kons: "von Konsumgütern"}, zoom_toggle: true, zoom_default: true, ask: "Welche Gütergruppen tragen die Produktion?", years: 6, ma3: true, caption: "Vorleistungsgüter werden weiterverarbeitet, etwa Stahl oder Chemie. Investitionsgüter sind vor allem Maschinen und Fahrzeuge. Konsumgüter kaufen private Haushalte. Dick: gleitender Durchschnitt über drei Monate, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: rhine, y_range: [0, null], unsigned: true, threshold_label: "78 cm", ask: "Ist der Rhein für Frachtschiffe gut befahrbar?", daily: true, years: 3, threshold: 78, recessions: false, caption: "Die Abbildung zeigt den Wasserstand am Pegel Kaub im Tagesmittel, in Zentimetern; Kaub ist der Engpass für die Rheinschifffahrt zwischen Mainz und Koblenz. Die Chemie-, Stahl-, Mineralöl- und Kohlebranche transportiert große Mengen über den Rhein. Rot gestrichelt ist die Marke von 78 Zentimetern: Liegt der Pegel einen Monat lang darunter, sinkt die Industrieproduktion nach einer Faustregel des IfW Kiel um etwa 1 %. Bis Ende des Vorjahres stammen die Werte aus geprüften Pegeldaten der Wasserstraßen- und Schifffahrtsverwaltung des Bundes (WSV, Bundesanstalt für Gewässerkunde), danach aus PEGELONLINE."}
      - {chart: rhine_low, partial_last: true, upto_series: rhine_kaub, ask: "Wie oft war der Rhein seit 1970 zu flach?", years: 57, recessions: false, caption: "Die Abbildung zählt je Kalenderjahr die Tage, an denen der Wasserstand am Pegel Kaub im Tagesmittel unter 78 Zentimetern lag; das laufende Jahr reicht bis zum jüngsten Tag. Lange Phasen mit Niedrigwasser wie 2018 und 2022 machten Transporte teurer und bremsten die Industrie. Die Werte sind geprüfte Pegeldaten der Wasserstraßen- und Schifffahrtsverwaltung des Bundes (WSV), bereitgestellt durch die Bundesanstalt für Gewässerkunde (R-Paket hyd1d); die jüngsten Werte stammen aus PEGELONLINE."}
  - id: bau
    group: produktion
    title: Bau
    ask: "Wie entwickelt sich der Bau?"
    charts:
      - {chart: bau_orders, sent_ma3: true, ask: "Wie entwickeln sich die Aufträge im Bau?", years: 6, ma3: true, caption: "Die Linien zeigen die Aufträge im Bauhauptgewerbe (vor allem Hoch- und Tiefbau), preisbereinigt, insgesamt und nach Bauart. Einzelne Großprojekte sorgen für starke Ausschläge. Dick: gleitender Durchschnitt über drei Monate, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: permits, ask: "Wird bald mehr gebaut?", years: 6, ma3: true, recessions: false, caption: "Gezeigt ist, wie viele Wohnungen je Monat genehmigt werden, in Tausend (Statistisches Bundesamt). Gezählt werden Wohnungen in neuen Gebäuden und solche, die durch Baumaßnahmen an bestehenden Gebäuden entstehen. Genehmigungen laufen dem Wohnungsbau um etwa ein bis zwei Jahre voraus. Nicht jede Genehmigung wird auch gebaut."}
      - {chart: house_prices, ask: "Wie entwickeln sich die Preise für Wohnimmobilien?", years: 12, ref: 0, caption: "Der Häuserpreisindex des Statistischen Bundesamts zeigt die Preise für neu gebaute und bestehende Wohnimmobilien, also Häuser und Eigentumswohnungen. Gezeigt ist die Veränderung gegenüber dem Vorjahresquartal. Die Zahlen erscheinen rund drei Monate nach dem Ende eines Quartals."}
      - {chart: bau_prod, ask: "Wie viel wird gebaut?", years: 6, ma3: true, caption: "Gezeigt ist die Bauproduktion. Zum Ausbaugewerbe gehören Installation, Elektrik und Innenausbau. Dick: gleitender Durchschnitt über drei Monate, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: long_hpi, x_start: "1871-01-01", crisis_toggle: true, decade_mean: true, ask: "Wie teuer sind Wohnimmobilien im langen Vergleich?", years: 154, keep_years: true, recessions: false, blank_years: [[1914, 1918], [1939, 1945]], crises: hist_bank_deu, caption: "Der Index zeigt die Hauspreise bereinigt um die Verbraucherpreise; weil die zugrunde liegenden Preisreihen über die Zeit wechseln, zeigt er Trends und keine genauen Niveaus. Die langen Reihen stammen aus der Global Macro Database (Müller, Xu, Lehbib und Chen 2025), Deutschland in den jeweiligen Grenzen. Hellgrau: Mittel je Jahrzehnt, das laufende gepunktet; einblendbar sind Bankenkrisen (rot) nach derselben Datenbank und Rezessionen (grau), hier Jahre mit sinkender preisbereinigter Wirtschaftsleistung. Die Weltkriege 1914 bis 1918 und 1939 bis 1945 sind ausgelassen; spätere Lücken stammen aus der Datenbank. Diese Abbildung und ihr Download stehen unter der Lizenz CC BY-NC-SA 4.0, weil die Global Macro Database diese Lizenz verlangt."}
      - {chart: weather, series_ref: {de_rain_pct: 100}, signed: [de_temp_anom], no_tend: true, labels: {de_temp_anom: "Temperatur, Abweichung vom Mittel", de_rain_pct: "Niederschlag in % der üblichen Menge"}, ref_labels: {de_temp_anom: "Mittel 1991–2020", de_rain_pct: "übliche Menge (100 %)"}, ref_labels_en: {de_temp_anom: "1991–2020 average", de_rain_pct: "usual amount (100%)"}, ask: "War das Wetter für den Bau ungewöhnlich?", multiples: true, no_yoy: true, own_scale: true, years: 6, ref: 0, recessions: false, caption: "Die Abbildung zeigt Monatswerte des Deutschen Wetterdienstes für ganz Deutschland. Die Temperatur steht als Abweichung vom Mittel desselben Monats 1991 bis 2020 in °C, der Niederschlag in Prozent des Mittels desselben Monats 1991 bis 2020; gestrichelt im Feld Niederschlag sind 100 % des Mittels. Ein sehr kalter, frostiger oder nasser Wintermonat drückt die Bauproduktion, ein milder hebt sie; meist gleichen sich die Ausschläge in den Folgemonaten aus. Auffällige Monate erscheinen in der Abbildung zur Bauproduktion unter „Ausschläge und Sondereffekte“."}
  - id: arbeit
    group: haushalte
    title: Arbeit
    charts:
      - {chart: labour, name_labels: true, each_last: true, ask: "Wie hoch ist die Arbeitslosigkeit?", up_bad: [de_alq_sa, de_ilo], years: 12, caption: "Die Abbildung zeigt zwei Messungen der Arbeitslosigkeit, beide saisonbereinigt. Die registrierte Quote der Bundesagentur für Arbeit zählt Menschen, die bei einer Arbeitsagentur oder einem Jobcenter arbeitslos gemeldet sind. Die Erwerbslosenquote nach der Definition der Internationalen Arbeitsorganisation (ILO) beruht auf einer Befragung: erwerbslos ist, wer keine Arbeit hat, aktiv sucht und kurzfristig verfügbar ist. Sie liegt in Deutschland deutlich niedriger und ist international vergleichbar. Seit 2020 beruht sie auf dem neu gestalteten Mikrozensus, einer großen amtlichen Haushaltsbefragung; der Übergang ist ein Bruch in der Reihe."}
      - {chart: alq_land, ask: "In welchen Ländern ist die Arbeitslosigkeit hoch, wo steigt sie?", type: tiles, prefix: de_alq_land_, measure: diff, what: "Arbeitslosenquote", caption: "Die Karte zeigt die Arbeitslosenquote je Bundesland im Jahresdurchschnitt, bezogen auf alle zivilen Erwerbspersonen, also alle, die arbeiten oder Arbeit suchen, ohne Soldaten (Bundesagentur für Arbeit über das Statistische Bundesamt). Die Zahl nennt die Quote, die Farbe die Veränderung gegenüber dem Vorjahr: orange heißt gestiegen, blau gesunken. Die amtliche Datenbank bietet keine Monatswerte je Land an; deshalb ändert sich die Karte nur einmal im Jahr."}
      - {chart: labour_flows, zoom_toggle: true, tpl: ["{when} waren {v[de_alo_sa]} Menschen arbeitslos gemeldet ({chg[de_alo_sa]} ggü. dem Vorjahresmonat); die Betriebe meldeten {full[de_vac_sa]} offene Stellen ({chg[de_vac_sa]}).", "Auf eine offene Stelle kamen {q[de_alo_sa/de_vac_sa]} Arbeitslose, ein Jahr zuvor {q0[de_alo_sa/de_vac_sa]}."], zoom_default: true, unit: "Tsd.", ask: "Wie entwickeln sich Arbeitslose und offene Stellen?", up_bad: [de_alo_sa], years: 12, caption: "Die Abbildung zeigt die Zahl der Arbeitslosen und der offenen Stellen. Steigt die Arbeitslosigkeit, während die Zahl offener Stellen sinkt, spricht das dafür, dass sich der Arbeitsmarkt abkühlt."}
      - {chart: indeed, daily: true, tpl: ["{when} lag die Zahl der Stellenanzeigen auf Indeed {pabs[de_indeed]} % {ueber[de_indeed]} dem Stand von vor einem Jahr und {abs100[de_indeed]} % {ueber100[de_indeed]} dem Stand vom 1. Februar 2020."], all_days: true, years: 3, keep_years: true, recessions: false, ask: "Schreiben die Unternehmen mehr oder weniger Stellen aus?", caption: "Gezeigt ist die Zahl der Stellenanzeigen auf der Plattform Indeed in Deutschland, saisonbereinigt, 1. Februar 2020 = 100. Die Werte sind ein gleitender Durchschnitt über die jeweils letzten sieben Tage und werden wöchentlich aktualisiert. Die Reihe liegt Wochen vor der Statistik der Bundesagentur für Arbeit vor, bildet aber nur eine Plattform ab. Quelle: Indeed Hiring Lab, Lizenz CC BY 4.0."}
      - {chart: employment_m, transform: yoy, unit: "% ggü. Vorjahresmonat", decimals: 1, ref: 0, name_labels: true, ask: "Wie viele Menschen sind erwerbstätig?", years: 6, caption: "Zu den Erwerbstätigen zählen auch Selbständige und Beamte; den größten Teil stellen die sozialversicherungspflichtig Beschäftigten. Gezeigt ist die Veränderung gegenüber dem Vorjahresmonat in Prozent."}
      - {chart: kurzarbeit, zoom_toggle: true, tpl: ["{when} waren {full[de_ka_sa]} Beschäftigte in Kurzarbeit, {pabs[de_ka_sa]} % {mehr[de_ka_sa]} als ein Jahr zuvor; die jüngsten Monate sind Hochrechnungen der Bundesagentur für Arbeit."], ask: "Wie viele Beschäftigte sind in Kurzarbeit?", up_bad: true, years: 12, scale: 0.001, unit: "Tsd. Personen", decimals: 0, caption: "Gezeigt sind Beschäftigte in Kurzarbeit aus konjunkturellen, also wirtschaftlichen Gründen (§ 96 Drittes Buch Sozialgesetzbuch), in Tausend. Kurzarbeit hält Beschäftigte im Betrieb, wenn Aufträge vorübergehend fehlen. In Abschwüngen steigt sie früher als die Arbeitslosigkeit. Die jüngsten Monate beruhen auf Hochrechnungen der Bundesagentur für Arbeit."}
      - {chart: sv_yoy, multiples: true, scale_toggle: true, ref: 0, combine: {subj: "die sozialversicherungspflichtige Beschäftigung", where: {"Produzierendes Gewerbe": "im Produzierenden Gewerbe", "Dienstleistungen ohne Leiharbeit": "in den Dienstleistungen ohne Leiharbeit", "Leiharbeit": "in der Leiharbeit"}, lead: "veränderte sich die Beschäftigung ggü. dem Vorjahresmonat:", lead_en: "employment changed on a year earlier:"}, ask: "In welchen Bereichen wächst die Beschäftigung?", years: 6, caption: "Gezeigt sind sozialversicherungspflichtig Beschäftigte nach Bereichen, als Veränderung gegenüber dem Vorjahresmonat. Die Leiharbeit reagiert als Erstes auf eine schwächere Nachfrage, weil Betriebe zuerst ausgeliehene Kräfte abbauen."}
  - id: einkommen
    group: haushalte
    title: Einkommen
    ask: "Wie entwickeln sich Einkommen und Verteilung?"
    charts:
      - {chart: wages, tpl: ["{when} {up_pl[de_nominallohn_yoy]} die Nominallöhne um {abs[de_nominallohn_yoy]} % und die Reallöhne um {abs[de_reallohn_yoy]} % ggü. dem Vorjahresquartal; die Reallöhne {trend_pl[de_reallohn_yoy]} damit seit {streak[de_reallohn_yoy]}."], ask: "Steigen die Löhne schneller als die Preise?", years: 12, ref: 0, caption: "Der Nominallohnindex misst die durchschnittlichen Bruttomonatsverdienste einschließlich Sonderzahlungen. Der Reallohnindex ist der Nominallohnindex, bereinigt um die Entwicklung der Verbraucherpreise. Gezeigt ist jeweils die Veränderung gegenüber dem Vorjahresquartal. Liegt die Rate der Reallöhne über null, steigen die Löhne schneller als die Preise."}
      - {chart: tarif, tpl: ["{when} {up_pl[de_tarif_yoy]} die Tarifverdienste um {abs[de_tarif_yoy]} % ggü. dem Vorjahresmonat und damit {cmp[de_tarif_yoy-de_cpi_yoy]} die Verbraucherpreise ({sg[de_cpi_yoy]} %)."], ask: "Steigen die Tariflöhne schneller als die Preise?", pick: [de_tarif_yoy, de_cpi_yoy], years: 8, keep_years: true, ref: 0, recessions: false, caption: "Tarifliche Verdienste sind die Löhne, die Gewerkschaften und Arbeitgeber in Tarifverträgen vereinbaren. Gezeigt sind die tariflichen Monatsverdienste einschließlich Sonderzahlungen in der Gesamtwirtschaft (Statistisches Bundesamt) und die Verbraucherpreise, jeweils gegenüber dem Vorjahresmonat. Liegt der Anstieg der Tarifverdienste über der Inflationsrate, steigen die Tariflöhne real, also auch nach Abzug der Preissteigerung. Einmalzahlungen wie die Inflationsausgleichsprämie 2023 und 2024 lassen die Reihe springen."}
      - {chart: ulc, combine: {subj: "die Lohnstückkosten in Deutschland", pl: true, where: {"Euroraum": "im Euroraum"}, lead: "veränderten sich die Lohnstückkosten ggü. dem Vorjahresquartal:"}, ask: "Steigen die Lohnkosten je Einheit stärker als im Euroraum?", years: 12, ref: 0, caption: "Lohnstückkosten zeigen, was die Arbeit je erzeugter Einheit kostet: das Arbeitnehmerentgelt je Arbeitnehmer im Verhältnis zur realen Wirtschaftsleistung je Erwerbstätigen. Gezeigt ist die Veränderung gegenüber dem Vorjahresquartal (Eurostat). Sie steigen, wenn die Löhne schneller wachsen als die Produktivität, also die Wirtschaftsleistung je Erwerbstätigen. Steigen sie in Deutschland dauerhaft stärker als im Euroraum, verliert die deutsche Wirtschaft an preislicher Wettbewerbsfähigkeit."}
      - {chart: hh_income, ref_year: 2019, ask: "Wie entwickeln sich die Einkommen der Haushalte?", years: 12, caption: "Gezeigt ist das verfügbare Einkommen der privaten Haushalte je Einwohner, 2010 = 100. Dazu zählen Löhne, Gewinne, Vermögenseinkommen (etwa Zinsen und Dividenden) und Sozialleistungen, nach Abzug von Steuern und Abgaben. Das Einkommen ist um die Preisentwicklung des Konsums bereinigt."}
      - {chart: saving, ref_year: 2019, ask: "Wie viel sparen die Haushalte?", years: 12, caption: "Die Sparquote ist der Anteil des verfügbaren Einkommens, den die Haushalte nicht für Konsum ausgeben. Steigt sie, dämpft das den Konsum; oft sparen Haushalte so aus Vorsicht in unsicheren Zeiten. Gezeigt ist die Brutto-Sparquote nach Eurostat: das Sparen einschließlich Abschreibungen (des Wertverlusts von Gebäuden und Anlagen) im Verhältnis zum verfügbaren Bruttoeinkommen. Die bekanntere Sparquote des Statistischen Bundesamts ist anders abgegrenzt und liegt deutlich niedriger."}
      - {chart: profit_share, ref_year: 2019, ask: "Wie verteilt sich die Wertschöpfung auf Gewinne und Löhne?", years: 12, caption: "Die Gewinnquote ist der Bruttobetriebsüberschuss der nichtfinanziellen Unternehmen, also der Unternehmen außerhalb der Finanzbranche, in Prozent ihrer Wertschöpfung. Steigt die Gewinnquote, geht ein größerer Teil der Wertschöpfung an Gewinne und ein kleinerer an Löhne."}
  - id: konsum
    group: haushalte
    title: Konsum
    charts:
      - {chart: retail, tpl: ["{when} veränderte sich der reale Umsatz des Einzelhandels ggü. dem Vorjahresmonat um {chg[de_retail]}; in den drei Monaten bis {per} um {m3[de_retail]} ggü. den drei Monaten davor."], ask: "Wie viel verkauft der Einzelhandel?", years: 6, ma3: true, caption: "Gezeigt ist der Umsatz des Einzelhandels ohne Handel mit Kraftfahrzeugen, preisbereinigt, also die verkaufte Menge. Der Einzelhandel steht für rund ein Drittel des privaten Konsums; Dienstleistungen, Mieten und Autos sind nicht enthalten. Dick: gleitender Durchschnitt über drei Monate, dünn: Monatswerte (über den Knopf ausblendbar)."}
      - {chart: retail_split, name_labels: true, brief: {de_retail_food: "realer Umsatz mit Lebensmitteln", de_retail_nonfood: "mit Nicht-Lebensmitteln", de_retail_online: "im Versand- und Internethandel"}, ask: "Welche Sortimente verkaufen sich besser?", years: 6, ma3: true, caption: "Das Bild zeigt den Umsatz im Einzelhandel nach Sortimenten, bereinigt um Preisänderungen. Die Daten stammen vom Statistischen Bundesamt und kommen über Eurostat. Lebensmittel heißt hier: Handel mit Nahrungsmitteln, Getränken und Tabakwaren; Nicht-Lebensmittel zählt ohne Tankstellen. Dick: gleitendes Dreimonatsmittel, also der Durchschnitt über drei Monate; dünn: Monatswerte, die sich über den Knopf ausblenden lassen."}
      - {chart: hospitality, zoom_toggle: true, tpl: ["{when} veränderte sich der reale Umsatz des Gastgewerbes ggü. dem Vorjahresmonat um {chg[de_hospitality]}; in den drei Monaten bis {per} um {m3[de_hospitality]} ggü. den drei Monaten davor."], ask: "Wie entwickelt sich das Gastgewerbe?", years: 6, ma3: true, caption: "Das Bild zeigt den Umsatz von Restaurants und Hotels, bereinigt um Preisänderungen. Dick: gleitendes Dreimonatsmittel, also der Durchschnitt über drei Monate; dünn: Monatswerte, die sich über den Knopf ausblenden lassen."}
      - {chart: cars, tpl: ["{when} ließen private Halter {full[de_cars_private]} neue Pkw zu, {pabs[de_cars_private]} % {mehr[de_cars_private]} als ein Jahr zuvor; in den drei Monaten bis {per} waren es {m3y_abs[de_cars_private]} % {m3y_mehr[de_cars_private]} als im Vorjahreszeitraum."], ask: "Kaufen die Haushalte neue Autos?", years: 6, ma3: true, caption: "Das Bild zeigt, wie viele neue Autos (Pkw) private Halter je Monat zulassen, in Tausend. Die Zahl gibt einen Hinweis darauf, ob Haushalte bereit sind, größere Dinge zu kaufen. Dick: gleitendes Dreimonatsmittel, also der Durchschnitt über drei Monate; dünn: Monatswerte, die sich über den Knopf ausblenden lassen."}
      - {chart: consumer, ask: "Wie zuversichtlich sind die Verbraucher?", years: 12, caption: "Die Linie zeigt den Saldo, also die Differenz aus positiven und negativen Antworten der Haushalte. Liegt er unter null, überwiegen die negativen Einschätzungen."}
      - {chart: hh_spend, name_labels: true, years: 30, keep_years: true, recessions: false, ask: "Wofür geben die Haushalte ihr Geld aus?", caption: "Die Linien zeigen vier große Ausgabenbereiche der privaten Haushalte in Prozent ihrer gesamten Konsumausgaben, nach der Volkswirtschaftlichen Gesamtrechnung. Wohnen und Energie enthält auch den Mietwert selbst genutzter Wohnungen. Es sind Durchschnitte aller Haushalte; einzelne Haushalte weichen je nach Einkommen und Wohnform stark ab."}
  - id: preise
    group: preise
    title: Preise
    charts:
      - {chart: cpi, scale_toggle: true, multi_colors: true, ask: "Welche Bereiche werden teurer?", multiples: true, up_bad: true, years: 6, emphasis: de_cpi_yoy, ref: 2, caption: "Das Bild zeigt die Inflationsrate nach dem Verbraucherpreisindex des Statistischen Bundesamts, insgesamt und für fünf Bereiche. Jedes Feld hebt einen Bereich dunkelblau hervor und hat eine eigene Skala; mit „Gemeinsame Skala“ stehen die übrigen grau zum Vergleich dahinter. Über jedem Feld stehen der jüngste Wert mit der Tendenz zum Vormonat und die Mittel der letzten 3 und 12 Monate. Gestrichelt: 2 %, das Ziel der Europäischen Zentralbank; es gilt für den europäischen harmonisierten Verbraucherpreisindex, der in Deutschland meist nahe am nationalen Index liegt. „Dienstleistungen ohne Mieten“ lässt tatsächliche und unterstellte Wohnungsmieten (für selbst genutztes Wohneigentum) weg und weicht deshalb von der Rate für alle Dienstleistungen ab, die das Statistische Bundesamt meldet."}
      - {chart: cpi_contrib, ask: "Woraus setzt sich die Inflationsrate zusammen?", type: contrib, total: de_vpi, years: 3, parts: {Energie: de_vpi_energy, Nahrungsmittel: de_vpi_food, "Waren ohne Energie": de_vpi_goods, "Dienstleistungen und Miete": [de_vpi_serv, de_vpi_rent]}, caption: "Das Bild zeigt, wie viele Prozentpunkte jeder Bereich zur Inflationsrate beiträgt. Man kann umschalten zwischen dem Vergleich mit dem Vorjahr und dem Vergleich mit dem Vormonat. Die Werte sind eine eigene Berechnung: Die Gewichte der Bereiche sind aus den Teilindizes des Verbraucherpreisindex seit 2020 geschätzt. Der Rest gleicht Rundungen und nicht getrennt erfasste Teile aus."}
      - {chart: cpi_core, ask: "Wie hoch ist der zugrunde liegende Preisauftrieb?", years: 6, up_bad: true, emphasis: de_vpi_core_yoy, ref: 2, caption: "Die dicke Linie zeigt die Kernrate: die Inflationsrate des Verbraucherpreisindex ohne die stark schwankenden Preise für Energie und Nahrungsmittel. Sie zeigt den zugrunde liegenden Preistrend. Die dünnen Linien zeigen den Verbraucherpreisindex insgesamt und den europäischen harmonisierten Verbraucherpreisindex, auf den sich das Ziel der Europäischen Zentralbank bezieht. Gestrichelt: 2 %, dieses Ziel."}
      - {chart: pipeline_prices, toggle: {chart: pipeline_core, base: insgesamt, label: ohne Energie, base_en: Total, label_en: Excluding energy}, ask: "Steigen die Preise auf den Vorstufen?", years: 6, up_bad: true, caption: "Das Bild zeigt Preise auf den Stufen, bevor Waren beim Verbraucher ankommen: Erzeugerpreise für den Absatz im Inland und Einfuhrpreise. Erzeugerpreise sind die Preise, die Hersteller für ihre Waren verlangen. Diese Preise laufen den Verbraucherpreisen häufig voraus."}
      - {chart: pipeline_core, ask: "Breiten sich Kostensteigerungen über Energie hinaus aus?", up_bad: true, years: 6, caption: "Vorstufenpreise sind Preise, bevor Waren beim Verbraucher ankommen. Ohne Energie zeigen sie, ob sich Kostensteigerungen über Energie hinaus ausbreiten. Agrarpreise wirken mit Verzögerung auf die Preise für Nahrungsmittel."}
      - {chart: price_exp, combine: {lead: "lauteten die Salden der Preiserwartungen:", pre: "", lead_en: "the price expectation balances were:"}, ask: "Welche Preise erwarten Unternehmen und Verbraucher?", multiples: true, up_bad: true, years: 6, caption: "Das Bild zeigt den Saldo aus dem Anteil der Befragten, die steigende Preise erwarten, und dem Anteil, der sinkende Preise erwartet (Umfragen der EU). Unternehmen schauen auf die nächsten drei Monate, Verbraucher auf die nächsten zwölf Monate. Jedes Feld hebt einen Bereich dunkelblau hervor und hat eine eigene Skala; mit „Gemeinsame Skala“ stehen die übrigen grau zum Vergleich dahinter. Über jedem Feld stehen der jüngste Wert mit der Tendenz zum Vormonat und die Mittel der letzten 3 und 12 Monate."}
      - {chart: spf, ask: "Vertrauen Fachleute darauf, dass die Inflation auf 2 % zurückgeht?", years: 20, keep_years: true, ref: 2, recessions: false, caption: "Das Bild zeigt, welche Inflationsrate Fachleute für den Euroraum in vier bis fünf Jahren erwarten. Grundlage ist das Mittel der Punktprognosen aus der vierteljährlichen Umfrage der Europäischen Zentralbank unter Fachleuten aus Banken, Forschung und Verbänden (Survey of Professional Forecasters). Blau gestrichelt: das Ziel der Europäischen Zentralbank von 2 %. Liegt die Erwartung nahe am Ziel, gilt die Inflationserwartung als verankert, also als fest am Ziel ausgerichtet."}
      - {chart: enso, ask: "Treibt El Niño die Nahrungsmittelpreise?", type: event, caption: "Die Abbildung ist eine Ereignisstudie: Sie verfolgt die Preise ab dem Beginn sehr starker El-Niño-Ereignisse (Monat 0 = 100), bereinigt um die allgemeine Teuerung. Links stehen die Nahrungsmittel im Verbraucherpreisindex im Verhältnis zum Gesamtindex (ab 1995), rechts die Erzeugerpreise landwirtschaftlicher Produkte im Verhältnis zu den Verbraucherpreisen (bis 1990 früheres Bundesgebiet, dort im Verhältnis zum Verbraucherpreisindex der OECD). Die graue Fläche zeigt die Spanne früherer sehr starker Ereignisse, die Linien einzelne Ereignisse, dick das laufende. Ein Ereignis beginnt im ersten Monat einer Folge, in der der Relative Oceanic Niño Index (RONI) der NOAA mindestens 0,5 °C erreicht; sehr stark heißt ein Höchstwert ab 2 °C. El Niño, eine Erwärmung des tropischen Pazifiks, verknappt über Dürren und Starkregen vor allem in Südasien, Afrika und Südamerika Ernten; in Deutschland wirkt das über Weltmarktpreise für Getreide, Pflanzenöle, Kakao und Kaffee, abgeschwächt und verzögert."}
      - {chart: deflator, ask: "Wie entwickeln sich die Preise in der Gesamtrechnung?", up_bad: true, years: 8, caption: "Die Abbildung zeigt zwei Deflatoren der Volkswirtschaftlichen Gesamtrechnungen, also Preismaße aus der Gesamtrechnung. Der Deflator des Bruttoinlandsprodukts zeigt, wie sich die Preise aller im Inland erzeugten Güter entwickeln, der zweite Deflator die Preise des privaten Konsums."}
  - id: energie
    group: preise
    title: Energie
    charts:
      - {chart: oil_d, toggle: {chart: oil, base: Tageswerte, label: Monatsmittel, base_en: Daily, label_en: Monthly average}, daily: true, ma_days: 5, years: 3, keep_years: true, recessions: false, ask: "Wie teuer ist Rohöl?", caption: "Das Bild zeigt den Preis für ein Barrel (159 Liter) Rohöl der Nordseesorte Brent in US-Dollar, wie international üblich. Dünn: Tageswerte an Handelstagen, dick: gleitendes Mittel über fünf Handelstage. Die Tageswerte erscheinen mit etwa einer Woche Abstand."}
      - {chart: oil, ask: "Wie teuer ist Rohöl?", years: 6, caption: "Das Bild zeigt den Preis für ein Barrel (159 Liter) Rohöl der Nordseesorte Brent als Monatsmittel. Der Preis ist in US-Dollar angegeben, wie international üblich."}
      - {chart: fuel, years: 3, keep_years: true, recessions: false, name_labels: true, ask: "Was kosten Benzin, Diesel und Heizöl?", caption: "Das Bild zeigt Verbraucherpreise in Deutschland in Euro je Liter, einschließlich Steuern und Abgaben. Die Preise gelten jeweils für Montag. Quelle: Europäische Kommission, Weekly Oil Bulletin."}
      - {chart: power, toggle: {chart: power_d, base: Monatswerte, label: Tageswerte, base_en: Monthly, label_en: Daily}, ask: "Wie viel Strom wird verbraucht, und was kostet er im Großhandel?", multiples: true, own_scale: true, years: 6, recessions: false, caption: "Das Bild zeigt den Stromverbrauch (Netzlast) in Deutschland gegenüber dem Vorjahresmonat und den Großhandelspreis für Strom am Day-Ahead-Markt (Gebotszone Deutschland/Luxemburg), als Monatsmittel in Euro je Megawattstunde. Am Day-Ahead-Markt wird Strom für den nächsten Tag gehandelt. Der Verbrauch folgt eng der Industrieproduktion, liegt aber schon wenige Tage nach Monatsende vor. Wetter und Feiertage verzerren einzelne Monate. Quelle: Bundesnetzagentur | SMARD.de, Lizenz CC BY 4.0."}
      - {chart: power_d, daily: true, all_days: true, no_texts: true, ma_days: 7, multiples: true, own_scale: true, years: 3, keep_years: true, recessions: false, ask: "Wie viel Strom wird in den letzten Wochen verbraucht, und was kostet er?", caption: "Das Bild zeigt den Stromverbrauch (Netzlast) in Gigawattstunden je Tag und den Großhandelspreis am Day-Ahead-Markt (Gebotszone Deutschland/Luxemburg), als Tagesmittel in Euro je Megawattstunde. Am Day-Ahead-Markt wird Strom für den nächsten Tag gehandelt. Dünn: Tageswerte, dick: gleitendes Mittel über sieben Tage. Wochenenden und Feiertage drücken Verbrauch und Preis. Quelle: Bundesnetzagentur | SMARD.de, Lizenz CC BY 4.0."}
      - {chart: energy_intensive, ask: "Wie produzieren die energieintensiven Branchen?", pick: [de_prod_wz_17, de_prod_wz_19, de_prod_wz_20, de_prod_wz_23, de_prod_wz_24], years: 8, ma3: true, keep_years: true, multiples: true, combine: Branchen, caption: "Das Bild zeigt die Produktion der fünf energieintensiven Industriezweige: Papier, Kokerei und Mineralölverarbeitung, Chemie, Glas und Keramik sowie Metallerzeugung. Der Index stammt vom Statistischen Bundesamt über die Bundesbank, ist saison- und kalenderbereinigt und setzt 2021 = 100. Diese Zweige verbrauchen den größten Teil der Energie in der Industrie und reagieren besonders auf Gas- und Strompreise. Jedes Feld hebt einen Zweig dunkelblau hervor und hat eine eigene Skala; mit „Gemeinsame Skala“ stehen die übrigen grau zum Vergleich dahinter. Dünn: Monatswerte, dick: gleitendes Dreimonatsmittel."}
      - {chart: gas_storage, y_range: [0, 100], ask: "Wie voll sind die Gasspeicher?", daily: true, years: 3, keep_years: true, recessions: false, caption: "Das Bild zeigt täglich, wie voll die deutschen Gasspeicher sind, in % der Arbeitsgaskapazität, also der nutzbaren Speichermenge. Im Sommer werden die Speicher gefüllt, im Winter geleert. Ist der Stand zu Winterbeginn niedrig, steigt das Risiko von Preisspitzen. Das Gesetz schreibt Mindestfüllstände zu Stichtagen im Herbst vor. Quelle: GIE (AGSI)."}
      - {chart: gas, fx_factor: 0.293071, ask: "Wie teuer ist Erdgas?", years: 6, fx: fx_usd, unit: "€ je MWh", caption: "Das Bild zeigt den Großhandelspreis für Erdgas in Europa am Handelsplatz TTF als Monatsmittel. Der Internationale Währungsfonds meldet den Preis in US-Dollar je MMBtu, einer in den USA üblichen Energieeinheit. Hier ist er umgerechnet in Euro je Megawattstunde, die in Europa übliche Einheit, mit dem Monatsmittel des Referenzkurses der Europäischen Zentralbank (1 MMBtu = 0,293071 Megawattstunden)."}
      - {chart: hdd, ask: "Wie viel muss geheizt werden?", no_yoy: true, years: 6, norm: [2015, 2019], recessions: false, caption: "Heizgradtage messen, wie viel geheizt werden muss: Je kälter ein Tag unter 15 °C ist, desto mehr Gradtage zählt er (VDI 3807, Raumtemperatur 20 °C), hier je Monat in Kelvin mal Tagen. Die Balken zeigen die Monatswerte, die schwarzen Striche das Mittel desselben Monats 2015 bis 2019; reicht ein Balken über den Strich, war der Monat kälter als üblich. Die Sommermonate fallen kaum ins Gewicht, weil dann wenig geheizt wird. Ein kalter Winter erhöht den Verbrauch von Gas und Heizöl und die Energieerzeugung, ein milder senkt sie. Die Werte sind das ungewichtete Mittel aller Stationen des Deutschen Wetterdienstes, da dieser keinen Wert für ganz Deutschland veröffentlicht."}
  - id: export
    group: aussen
    title: Export
    charts:
      - {chart: trade, name_labels: true, ask: "Wie entwickeln sich Exporte und Importe?", years: 6, ma3: true, caption: "Das Bild zeigt Exporte und Importe von Waren und ihren Saldo (Exporte minus Importe) in Milliarden Euro je Monat. Dick: gleitendes Dreimonatsmittel, also der Durchschnitt über drei Monate; dünn: Monatswerte, die sich über den Knopf ausblenden lassen. Die Werte sind nominal, also in jeweiligen Preisen; ein Teil der Veränderung geht daher auf die Preise zurück (siehe die Abbildung zu den Außenhandelspreisen)."}
      - {chart: trade_region, name_labels: true, ask: "Wohin exportiert Deutschland?", years: 6, ma3: true, caption: "Das Bild zeigt die Exporte von Waren in die wichtigsten Kundenregionen in Milliarden Euro je Monat. Dick: gleitendes Dreimonatsmittel, also der Durchschnitt über drei Monate; dünn: Monatswerte, die sich über den Knopf ausblenden lassen. Die Werte sind nominal, also in jeweiligen Preisen."}
      - {chart: trade_prices, pick: [de_export_prices_yoy, de_import_prices_yoy, de_tot_yoy], ask: "Wie entwickeln sich die Außenhandelspreise?", years: 6, caption: "Das Bild zeigt die Ausfuhrpreise und die Terms of Trade, also die Ausfuhrpreise im Verhältnis zu den Einfuhrpreisen. Steigen die Terms of Trade, kann Deutschland mit derselben Exportmenge mehr Importe bezahlen."}
      - {chart: balances, transform: sum12, scale: 0.001, unit: "Mrd. €", decimals: 0, ask: "Wie hoch ist der Leistungsbilanzüberschuss?", years: 6, caption: "Das Bild zeigt den Saldo der Leistungsbilanz in Milliarden Euro. Die Leistungsbilanz umfasst Waren, Dienstleistungen sowie Primär- und Sekundäreinkommen. Jeder Wert ist die Summe der jeweils letzten zwölf Monate; das gleicht die starken saisonalen Schwankungen der Monatswerte aus."}
      - {chart: long_open, x_start: "1871-01-01", crisis_toggle: true, decade_mean: true, ask: "Wie stark hängt Deutschland heute vom Außenhandel ab?", years: 154, keep_years: true, recessions: false, blank_years: [[1914, 1918], [1939, 1945]], crises: hist_bank_deu, long_mean: true, ref: 0, name_labels: true, caption: "Das Bild zeigt die Exporte von Waren und Dienstleistungen und den Saldo der Leistungsbilanz, jeweils in % des Bruttoinlandsprodukts, also der Wirtschaftsleistung. Die langen Reihen stammen aus der Global Macro Database (Müller, Xu, Lehbib und Chen 2025) und zeigen Deutschland in den jeweiligen Grenzen. Hellgrau: Mittel je Jahrzehnt, das laufende Jahrzehnt gepunktet; einblendbar sind Bankenkrisen (rot) nach derselben Datenbank und Rezessionen (grau), hier Jahre mit sinkendem realem Bruttoinlandsprodukt. Die Weltkriege 1914 bis 1918 und 1939 bis 1945 sind ausgelassen; Lücken danach stammen aus der Datenbank. Diese Abbildung und ihr Download stehen unter der Lizenz CC BY-NC-SA 4.0, weil die Global Macro Database diese Lizenz verlangt."}
      - {chart: esi, context_grey: true, recessions: false, ask: "Wer konkurriert mit ähnlichen Waren wie Deutschland?", emphasis: esi_chn, caption: "Der Wert misst, wie ähnlich die Exporte eines Landes nach Warenarten denen Deutschlands sind: 0 heißt keine Überschneidung, 100 eine gleiche Zusammensetzung. Berechnet wird er nach Finger und Kreinin (1979): Für jede Warengruppe zählt der kleinere der beiden Anteile. Hohe Werte bedeuten, dass beide Länder auf den Weltmärkten mit ähnlichen Waren konkurrieren. Hervorgehoben ist China."}
  - id: welt
    group: aussen
    title: Welt
    ask: "Wie entwickelt sich die Weltwirtschaft?"
    charts:
      - {chart: world_gdp, zoom_toggle: true, name_labels: true, recessions: false, ask: "Wie wachsen die großen Wirtschaftsräume?", years: 8, ref: 0, caption: "Das Bild zeigt das reale Bruttoinlandsprodukt, also die Wirtschaftsleistung ohne Preiseffekte, gegenüber dem Vorjahresquartal. Der Euroraum nimmt rund 37 % der deutschen Warenexporte auf, die USA rund 10 %."}
      - {chart: ez_gdp, combine: {lead: "betrug das Wachstum des realen BIP ggü. dem Vorjahresquartal", pre: "in ", lead_en: "real GDP growth on a year earlier was", pre_en: "in "}, ask: "Wächst Deutschland schneller oder langsamer als seine Nachbarn?", multiples: true, years: 6, ref: 0, caption: "Das Bild zeigt das reale Bruttoinlandsprodukt gegenüber dem Vorjahresquartal für Deutschland, Frankreich, Italien, Spanien und den Euroraum, saison- und kalenderbereinigt (Eurostat). Jedes Feld hebt ein Land dunkelblau hervor und hat eine eigene Skala; mit „Gemeinsame Skala“ stehen die übrigen grau zum Vergleich dahinter. Zusammen erwirtschaften die vier Länder rund drei Viertel der Wirtschaftsleistung des Euroraums."}
      - {chart: ez_hicp, combine: {lead: "betrug die Inflationsrate (HVPI)", pre: "in ", sign: false, lead_en: "HICP inflation was", pre_en: "in "}, ask: "Ist die Inflation in Deutschland höher als bei den Nachbarn?", multiples: true, up_bad: true, years: 6, ref: 2, caption: "Das Bild zeigt den harmonisierten Verbraucherpreisindex gegenüber dem Vorjahresmonat (Eurostat, ab 2026 nach der neuen Gütergliederung ECOICOP 2). Dieser Index ist international vergleichbar und Grundlage des Inflationsziels der Europäischen Zentralbank von 2 % (gestrichelt). Für Deutschland weicht er meist nur wenig vom nationalen Verbraucherpreisindex ab. Jedes Feld zeigt ein Land mit eigener Skala; mit „Gemeinsame Skala“ stehen die übrigen Länder grau zum Vergleich dahinter."}
      - {chart: ez_unemp, combine: {lead: "betrug die Erwerbslosenquote", pre: "in ", sign: false, lead_en: "the unemployment rate was", pre_en: "in "}, ask: "Wie hoch ist die Arbeitslosigkeit im Vergleich?", multiples: true, up_bad: true, years: 6, caption: "Das Bild zeigt die Erwerbslosenquote nach der Definition der Internationalen Arbeitsorganisation (ILO), saisonbereinigt (Eurostat, für den Euroraum: Europäische Zentralbank). Sie gibt den Anteil der Erwerbslosen an allen Erwerbspersonen an, also an allen, die arbeiten oder Arbeit suchen. Die Quote ist international vergleichbar und liegt in Deutschland deutlich unter der registrierten Arbeitslosenquote der Bundesagentur für Arbeit. Jedes Feld zeigt ein Land mit eigener Skala; mit „Gemeinsame Skala“ stehen die übrigen Länder grau zum Vergleich dahinter."}
      - {chart: ez_ip, combine: {common: true, lead: "veränderte sich die Produktion im Verarbeitenden Gewerbe ggü. dem Vorjahresmonat", pre: "in ", lead_en: "manufacturing output changed on a year earlier", pre_en: "in "}, ask: "Läuft die Industrie in Deutschland schlechter als bei den Nachbarn?", multiples: true, years: 4, keep_years: true, ref: 0, caption: "Das Bild zeigt die Produktion im Verarbeitenden Gewerbe gegenüber dem Vorjahresmonat, kalenderbereinigt (Eurostat), für Deutschland, Frankreich, Italien, Spanien und den Euroraum (seit 2026 mit 21 Ländern). Die Werte für Deutschland können leicht von den Angaben der Bundesbank im Abschnitt Industrie abweichen, weil sie anders bereinigt sind. Jedes Feld zeigt ein Land mit eigener Skala; mit „Gemeinsame Skala“ stehen die übrigen Länder grau zum Vergleich dahinter."}
      - {chart: ez_esi, zoom_toggle: true, zoom_default: true, combine: {common: true, lead: "erreichte die Wirtschaftliche Einschätzung (ESI; langjähriger Durchschnitt = 100)", pre: "in ", sign: false, lead_en: "the Economic Sentiment Indicator (long-term average = 100) was", pre_en: "in "}, ask: "Ist die Stimmung in Deutschland schlechter als bei den Nachbarn?", multiples: true, years: 6, ref: 100, caption: "Das Bild zeigt die wirtschaftliche Einschätzung der EU-Kommission (Economic Sentiment Indicator, ESI), saisonbereinigt. Der Indikator ist ein gewichtetes Mittel aus Umfragen in Industrie, Dienstleistungen, Handel und Bau sowie bei Verbrauchern. 100 ist der langjährige Durchschnitt des jeweiligen Landes (gestrichelt); der Indikator zeigt also, ob die Stimmung besser oder schlechter ist als üblich. Den Abstand zwischen Ländern zeigt er nicht. Jedes Feld zeigt ein Land mit eigener Skala; mit „Gemeinsame Skala“ stehen die übrigen Länder grau zum Vergleich dahinter."}
      - {chart: enso_comm, type: enso_comm, lag: 6, items: {wb_soybeans: "Sojabohnen", wb_maize: "Mais", wb_rice: "Reis", wb_wheat: "Weizen", wb_cocoa: "Kakao", wb_coffee: "Kaffee (Robusta)", wb_palmoil: "Palmöl", wb_sugar: "Zucker"}, items_en: {wb_soybeans: "Soybeans", wb_maize: "Maize", wb_rice: "Rice", wb_wheat: "Wheat", wb_cocoa: "Cocoa", wb_coffee: "Coffee (Robusta)", wb_palmoil: "Palm oil", wb_sugar: "Sugar"}, ask: "Welche Rohstoffe werden nach El Niño teurer?", caption: "Die Abbildung zeigt die mittlere Veränderung der Weltmarktpreise gegenüber dem Vorjahr, gemessen sechs Monate nach Monaten mit El Niño (dunkel) und nach neutralen Monaten (grau). El Niño heißt hier: Relative Oceanic Niño Index (RONI) der NOAA mindestens 0,5 °C; neutral heißt zwischen −0,5 und 0,5 °C. Die Preise in US-Dollar stammen aus dem Pink Sheet der Weltbank. Ein Stern zeigt einen statistisch deutlichen Unterschied, der sich kaum durch Zufall erklären lässt (Welch-t-Test, |t| > 1,96). Die Idee folgt einer Auswertung der Weltbank (Prospects Group), die Rechnung ist eigene."}
  - id: wechselkurse
    group: aussen
    title: Wechselkurse
    ask: "Wie entwickelt sich der Euro?"
    charts:
      - {chart: fx_eer, ask: "Wird der Euro gegenüber allen Handelspartnern teurer?", daily: true, years: 3, keep_years: true, recessions: false, caption: "Das Bild zeigt den nominalen effektiven Wechselkurs der Europäischen Zentralbank: einen Durchschnitt der Euro-Kurse gegenüber den Währungen der Handelspartner des Euroraums, gewichtet nach deren Anteil am Handel, mit 1. Quartal 1999 = 100. Die breite Gruppe umfasst 41 Partner, die enge 18 (unter anderem USA, China, Vereinigtes Königreich, Schweiz, Japan). Steigt der Index, wird der Euro im Durchschnitt teurer; das verteuert Exporte und verbilligt Importe. Die breite Gruppe liegt höher, weil viele Währungen aufstrebender Länder seit 1999 gegenüber dem Euro an Wert verloren haben. Für die preisliche Wettbewerbsfähigkeit zählt der reale Kurs, der auch die Preisentwicklung berücksichtigt."}
      - {chart: fx, ask: "Wie entwickelt sich der Euro gegenüber wichtigen Währungen?", daily: true, multiples: true, own_scale: true, years: 3, keep_years: true, recessions: false, caption: "Die Abbildung zeigt die Referenzkurse der Europäischen Zentralbank für jeden Arbeitstag: wie viele Einheiten einer Währung man für einen Euro bekommt. Jedes Feld zeigt eine Währung mit eigener Skala, weil die Kurse sehr verschieden hoch sind. Steigt eine Linie, wird der Euro gegenüber dieser Währung teurer. Über jedem Feld stehen der jüngste Kurs mit der Tendenz zum Vortag und die Mittel der letzten 3 und 12 Monate."}
  - id: stimmung
    group: ausblick
    title: Stimmung
    charts:
      - {chart: sentiment, multiples: true, combine: {lead: "lauteten die Salden der Vertrauensindikatoren:", lead_en: "the confidence balances were:"}, ask: "Wie ist die Stimmung in den Wirtschaftsbereichen?", years: 6, caption: "Die Abbildung zeigt je Wirtschaftsbereich den Saldo aus positiven und negativen Antworten in Umfragen der EU. Die Höhe der Bereiche lässt sich nicht direkt vergleichen, weil die Fragen sich unterscheiden. Aussagekräftig ist die Veränderung."}
      - {chart: sector_now, toggle: {chart: sector_next, base: Lage, label: Erwartungen, base_en: Current situation, label_en: Expectations}, combine: {lead: "lauteten die Salden zur Lage:", lead_en: "the balances on the current situation were:"}, ask: "Wie bewerten die Bereiche ihre aktuelle Lage?", multiples: true, years: 6, caption: "Die Abbildung zeigt, wie die Wirtschaftsbereiche ihre Geschäfte in den vergangenen drei Monaten einschätzen, als Saldo aus positiven und negativen Antworten (Umfragen der EU). Jedes Feld hebt einen Bereich dunkelblau hervor und hat eine eigene Skala. Mit der Schaltfläche „Gemeinsame Skala“ stehen die übrigen Bereiche grau zum Vergleich dahinter. Über jedem Feld stehen der jüngste Wert mit der Tendenz zum Vormonat und die Mittel der letzten 3 und 12 Monate."}
      - {chart: sector_next, combine: {lead: "lauteten die Salden zu den Erwartungen:", lead_en: "the balances on expectations were:"}, ask: "Was erwarten die Bereiche für die nächsten Monate?", multiples: true, years: 6, caption: "Die Abbildung zeigt, was die Wirtschaftsbereiche für die kommenden drei Monate erwarten, als Saldo aus positiven und negativen Antworten (Umfragen der EU). Im Bau fragt die Umfrage hier nach den Beschäftigungsplänen. Jedes Feld hebt einen Bereich dunkelblau hervor und hat eine eigene Skala. Mit der Schaltfläche „Gemeinsame Skala“ stehen die übrigen Bereiche grau zum Vergleich dahinter. Über jedem Feld stehen der jüngste Wert mit der Tendenz zum Vormonat und die Mittel der letzten 3 und 12 Monate."}
      - {chart: capacity, ref_mean: [2005, 2019], ask: "Wie stark sind die Kapazitäten der Industrie ausgelastet?", years: 12, caption: "Die Abbildung zeigt in Prozent, wie stark die Industrie ihre Produktionskapazitäten auslastet, also wie viel von dem, was sie herstellen könnte, sie tatsächlich herstellt. Grundlage ist eine Umfrage, die jedes Vierteljahr stattfindet. Grau gestrichelt: Mittel 2005 bis 2019."}
      - {chart: uncertainty, refs: [{y: 100, label: "Mittel 1997–2015 = 100"}], ask: "Wie unsicher ist die Wirtschaftspolitik?", up_bad: true, years: 8, caption: "Der Index nach Baker, Bloom und Davis misst die Unsicherheit in der Wirtschaftspolitik: Er beruht darauf, wie oft einschlägige Begriffe in Zeitungsartikeln vorkommen; das Mittel 1997 bis 2015 ist 100. Ist die Unsicherheit hoch, schieben Unternehmen Investitionen auf. Die Reihen werden mit unterschiedlichem Abstand aktualisiert und enden deshalb nicht im selben Monat."}
  - id: geldpolitik
    title: Geldpolitik
    part: staat
    ask: "Wie straff ist die Geldpolitik?"
    charts:
      - {chart: ecb_rates, events: true, emphasis: ecb_dfr, subj_en: {ecb_dfr: "the ECB deposit rate"}, unsigned: true, name_labels: true, ask: "Wo stehen die Leitzinsen der EZB?", years: 28, keep_years: true, recessions: false, caption: "Die Abbildung zeigt die drei Leitzinsen der Europäischen Zentralbank als Monatsmittel. Den Einlagesatz bekommen Banken für Geld, das sie über Nacht bei der Zentralbank parken. Zum Hauptrefinanzierungssatz leihen sie sich Geld für eine Woche, zum Spitzenrefinanzierungssatz über Nacht. Seit die Banken sehr viel Geld bei der Zentralbank halten, steuert vor allem der Einlagesatz die Zinsen am Geldmarkt. Dazu kommt der Euro-Kurzfristzins €STR, zu dem Banken einander über Nacht Geld leihen."}
      - {chart: ecb_bs, area: true, events: true, area_groups: {"Anleihekäufe (APP, PEPP)": [ecb_bs_sec], "Kredite an Banken": [ecb_bs_loans], "Sonstige Wertpapiere": [ecb_bs_secall, "-ecb_bs_sec", ecb_bs_gov], "Gold und Devisen": [ecb_bs_gold, ecb_bs_fx1, ecb_bs_fx2, ecb_bs_fx3], "Übrige": [ecb_bs_oth_ci, ecb_bs_other]}, whole: "die Bilanzsumme des Eurosystems", whole_en: "the Eurosystem's total assets", unit: "Bio. €", ask: "Wie groß ist die Bilanz der Zentralbanken?", years: 20, keep_years: true, caption: "Die Fläche zeigt die Aktivseite des Eurosystems, also der Europäischen Zentralbank und der nationalen Zentralbanken des Euroraums, in Billionen Euro. Zusammen ergeben die Teile die Bilanzsumme. Anleihekäufe sind Wertpapiere aus den Ankaufprogrammen APP (ab 2009, breit ab 2015) und PEPP (ab 2020). Kredite an Banken stammen aus geldpolitischen Geschäften, etwa den langfristigen Tendern (TLTRO). Sonstige Wertpapiere hält das Eurosystem nicht aus geldpolitischen Gründen. Der Schalter „Ereignisse“ blendet wichtige Entscheidungen ein. Monatsmittel der Wochenausweise."}
      - {chart: qe_prog, area: true, events: true, scale: 0.001, unit: "Bio. €", decimals: 2, whole: "der Bestand aus den Ankaufprogrammen", whole_en: "holdings under the purchase programmes", ask: "Was hat die EZB mit ihren Programmen gekauft?", years: 12, keep_years: true, caption: "Die Fläche zeigt die Bestände der Ankaufprogramme des Eurosystems zum Monatsende in Billionen Euro, zum Buchwert. Das Programm für Staatsanleihen (PSPP) ist der größte Teil des 2015 gestarteten Programms APP. Hinzu kommen Unternehmensanleihen (CSPP), gedeckte Bankanleihen (CBPP3) und Kreditverbriefungen (ABSPP). Das Pandemieprogramm PEPP lief von 2020 an. Seit Juli 2023 ersetzt die EZB fällige Anleihen im APP nicht mehr, seit Anfang 2025 auch im PEPP nicht; die Bestände schrumpfen. Quelle sind die Monatsdaten der Europäischen Zentralbank zu den Ankaufprogrammen."}
      - {chart: qe_land, events: true, unsigned: true, name_labels: true, combine: {lead: "summierten sich die Nettokäufe von Staatsanleihen durch das Eurosystem seit 2015 auf:", sign: false, lead_en: "the Eurosystem's cumulative net purchases of government bonds since 2015 amounted to:"}, ask: "Wessen Staatsanleihen hat die EZB gekauft?", years: 12, keep_years: true, caption: "Die Linien zeigen, für wie viel Geld das Eurosystem seit 2015 Staatsanleihen der vier größten Euroländer gekauft hat, abzüglich fälliger Anleihen, die es nicht ersetzt hat, in Milliarden Euro. Gezählt sind das Programm für Staatsanleihen (PSPP) und der staatliche Teil des Pandemieprogramms (PEPP). Die EZB kauft grob im Verhältnis der Kapitalanteile der Länder an der EZB, nicht nach der Höhe ihrer Schulden. Die Werte sind aufsummierte Nettokäufe zum Buchwert; Bewertungsänderungen fehlen. Quelle sind die Monatsdaten der Europäischen Zentralbank zu den Ankaufprogrammen."}
      - {chart: spreads, events: true, subj_en: {spread_it: "the spread of ten-year Italian bonds over Bunds", spread_fr: "the spread of ten-year French bonds over Bunds", spread_es: "the spread of ten-year Spanish bonds over Bunds"}, unsigned: true, name_labels: true, ref: 0, ask: "Wie viel mehr zahlen andere Euroländer als Deutschland?", years: 27, keep_years: true, caption: "Die Abbildung zeigt, um wie viele Prozentpunkte die Rendite zehnjähriger Staatsanleihen Italiens, Frankreichs und Spaniens über der Rendite deutscher Bundesanleihen liegt, als Monatsmittel. Ein größerer Abstand zeigt, dass Anleger für das Risiko eines Landes mehr Zins verlangen. In der Eurokrise 2011 und 2012 stieg er für Italien und Spanien auf über 5 Prozentpunkte. Die Renditen stammen aus der Statistik der Europäischen Zentralbank zum Zinskriterium der Konvergenzprüfung."}
      - {chart: tpi, type: tpi, attach: tpi.json, recessions: false, title: "Bedingungen für das TPI", ask: "Welche Länder könnten Hilfe aus dem TPI bekommen?", caption: "Mit dem Instrument zum Schutz der Transmission (TPI) kann die EZB seit Juli 2022 Staatsanleihen eines Landes kaufen, wenn dessen Zinsen ohne guten Grund stark steigen. Eine feste Zinsschwelle nennt sie nicht. Sie verlangt aber vier Bedingungen: Das Land hält die EU-Haushaltsregeln ein, hat keine schweren wirtschaftlichen Ungleichgewichte, seine Schulden sind tragfähig, und es setzt seine Reformzusagen um. Die Tabelle zeigt zwei messbare Teile davon: ob ein Defizitverfahren der EU läuft (Seite der Europäischen Kommission) sowie Finanzierungssaldo und Schulden des Staates im jüngsten Jahr (Eurostat). Rot sind ein laufendes Verfahren, ein Defizit über 3 % und Schulden über 60 % des BIP, die Grenzen des Stabilitätspakts. Ein laufendes Verfahren schließt das TPI nicht aus, wenn das Land den Empfehlungen folgt; das prüft die EZB im Einzelfall. Der Abstand zu Bund ist die Rendite zehnjähriger Staatsanleihen minus der deutschen, im jüngsten Monat. Ein Klick auf einen Spaltenkopf sortiert die Tabelle."}
      - {chart: zinskurven, type: curve, attach: zinskurven.json, recessions: false, title: "Zinskurven von Staatsanleihen", ask: "Wie viel Zins zahlen Staaten für kurze und lange Laufzeiten?", caption: "Die Linien zeigen, wie viel Rendite Staatsanleihen Deutschlands, Italiens und Spaniens je nach Restlaufzeit bringen, in Prozent. Durchgezogen ist der jüngste Monat, gepunktet derselbe Monat ein Jahr zuvor. Steigt die Linie nach rechts, bringen lange Laufzeiten mehr als kurze; das ist der Normalfall. Liegt die Linie eines Landes höher, verlangen Anleger dort mehr Zins. Die Werte sind Monatsmittel; für Italien sind es die Renditen der jeweils maßgeblichen Anleihe je Laufzeit (Benchmark). Quellen sind die Deutsche Bundesbank, die Banca d'Italia und die Banco de España. Für Frankreich fehlen frei nutzbare Daten: Die Kurve der Banque de France (TEC-Indizes) darf ohne Zustimmung des Indexanbieters Euronext nicht weiterverbreitet werden."}
      - {chart: curve_slope, events: true, unsigned: true, name_labels: true, ref: 0, combine: {common: true, lead: "lag die Rendite zehnjähriger Staatsanleihen so weit über der dreijähriger:", sign: true, lead_en: "the ten-year yield exceeded the three-year yield by:"}, ask: "Bringen lange Laufzeiten mehr Zins als kurze?", years: 22, keep_years: true, caption: "Die Linien zeigen je Land die Rendite zehnjähriger Staatsanleihen minus die Rendite dreijähriger, in Prozentpunkten und als Monatswert. Über null bringen lange Laufzeiten mehr als kurze; das ist der Normalfall. Unter null erwarten Anleger meist sinkende Leitzinsen; das ging oft einer Rezession voraus. Steigt der Abstand eines Landes stark, kann auch ein höherer Risikoaufschlag für lange Laufzeiten dahinterstehen. Quellen sind die Deutsche Bundesbank, die Banca d'Italia und die Banco de España."}
  - id: frankreich
    title: Krisenmonitor Frankreich
    code: Frankreich
    part: staat
    ask: "Droht in Frankreich eine Schuldenkrise, und was hieße das für Deutschland?"
    charts:
      - {chart: fr_gauge, type: gauge, recessions: false, title: "Wie nah ist Frankreich an der Eurokrise?", ask: "Wie nah ist Frankreich an der Eurokrise von 2011?", who: "Frankreich", who_en: "France", base: [2015, 2019], peak: ["2011-07-01", "2012-12-31"],
         rows: [{id: spread_fr, group: "Frankreich", group_en: "France", label: "Renditeabstand zum Bund", label_en: "Spread over Bunds", phrase: "beim Renditeabstand zum Bund", phrase_en: "on the spread over Bunds", unit: "Pp", unit_en: "pp", decimals: 2},
                {id: fr_deficit, invert: true, group: "Frankreich", group_en: "France", label: "Staatsdefizit", label_en: "Budget deficit", phrase: "beim Staatsdefizit", phrase_en: "on the budget deficit", unit: "% des BIP", unit_en: "% of GDP", decimals: 1},
                {id: ciss_fr, group: "Frankreich", group_en: "France", label: "Stress an den Finanzmärkten", label_en: "Financial market stress", phrase: "beim Stress an den Finanzmärkten", phrase_en: "on financial market stress", unit: "Punkte, Skala 0 bis 1", unit_en: "points, scale 0 to 1", decimals: 2},
                {id: ciss_de, group: "Übergreifen auf andere Länder", group_en: "Contagion", label: "Finanzstress Deutschland", label_en: "Financial stress Germany", phrase: "der Finanzstress in Deutschland", phrase_en: "financial stress in Germany", unit: "Punkte, Skala 0 bis 1", unit_en: "points, scale 0 to 1", decimals: 2},
                {id: ciss_it, group: "Übergreifen auf andere Länder", group_en: "Contagion", label: "Finanzstress Italien", label_en: "Financial stress Italy", phrase: "in Italien", phrase_en: "in Italy", unit: "Punkte, Skala 0 bis 1", unit_en: "points, scale 0 to 1", decimals: 2},
                {id: ciss_es, group: "Übergreifen auf andere Länder", group_en: "Contagion", label: "Finanzstress Spanien", label_en: "Financial stress Spain", phrase: "in Spanien", phrase_en: "in Spain", unit: "Punkte, Skala 0 bis 1", unit_en: "points, scale 0 to 1", decimals: 2},
                {id: spread_it, group: "Übergreifen auf andere Länder", group_en: "Contagion", label: "Renditeabstand Italiens", label_en: "Italy's spread over Bunds", phrase: "der Renditeabstand Italiens", phrase_en: "Italy's spread over Bunds", unit: "Pp", unit_en: "pp", decimals: 2}],
         calm: "Ein Übergreifen ist bisher nicht zu sehen", calm_en: "There is no sign of contagion so far",
         caption: "Jede Zeile zeigt, wie weit ein Indikator vom Normalniveau (0 %, Mittel 2015 bis 2019) zum schlimmsten Wert der Eurokrise (100 %, Juli 2011 bis Dezember 2012) gewandert ist. Voller Punkt: jüngster Wert, hohler Punkt: ein Jahr zuvor. Über 100 % ist ein Wert schlechter als in der Eurokrise. Der Renditeabstand ist die Rendite zehnjähriger Staatsanleihen minus der deutschen (EZB). Das Staatsdefizit ist der Finanzierungssaldo des Staates im jüngsten Jahr (Eurostat). Der Stress an den Finanzmärkten ist der Finanzstress-Index der EZB (Composite Indicator of Systemic Stress, CISS): Er fasst Schwankungen und Risikoaufschläge an Aktien-, Anleihe-, Geld- und Devisenmärkten zu einer Zahl zwischen 0 und 1 zusammen. Die Schuldenquote fehlt, weil sie 2011/12 niedriger war als später; sie liegt heute bei rund 116 % des BIP, 2012 waren es rund 92 %. Die Grafik zeigt den Abstand zu einer früheren Krise, keine Wahrscheinlichkeit für eine neue. Für Deutschland zählt vor allem, ob der Stress auf andere Länder übergreift; die untere Gruppe misst das."}
      - {chart: fr_stress, events: true, subj_en: {ciss_fr: "the ECB financial stress index for France"}, unsigned: true, name_labels: true, emphasis: ciss_fr, ask: "Steigt der Stress an Frankreichs Finanzmärkten?", years: 22, keep_years: true, caption: "Die Linien zeigen den Finanzstress-Index der Europäischen Zentralbank (Composite Indicator of Systemic Stress, CISS) für Frankreich, Deutschland, Italien und Spanien, als Monatsmittel. Der Index fasst Schwankungen und Risikoaufschläge an Aktien-, Anleihe-, Geld- und Devisenmärkten zu einer Zahl zwischen 0 und 1 zusammen; 1 ist höchster Stress. Laufen die Linien gemeinsam nach oben, greift Stress von einem Land auf andere über, wie 2008 und 2011. Der Schalter „Ereignisse“ blendet geldpolitische Wendepunkte ein."}
      - {chart: fr_exports, subj_en: {de_exp_share_fr: "France's share of German goods exports"}, unsigned: true, ask: "Wie wichtig ist Frankreich für deutsche Exporte?", years: 22, keep_years: true, caption: "Die Linie zeigt den Anteil Frankreichs an allen deutschen Warenexporten, berechnet über die jeweils letzten zwölf Monate, in Prozent. Eine Krise in Frankreich träfe Deutschland zuerst über diesen Handel: Fällt die Nachfrage dort, sinken die deutschen Exporte. Hinzu kämen Verluste von Banken und Anlegern, die französische Anleihen halten; dafür gibt es keine frei nutzbaren monatlichen Daten. Quelle ist die Außenhandelsstatistik der Deutschen Bundesbank, unbereinigt; der Anteil ist eigene Berechnung."}
  - id: zinsen
    title: Zinsen und Kredite
    part: staat
    charts:
      - {chart: credit_rates, ask: "Wie teuer sind Kredite?", years: 10, caption: "Die Abbildung zeigt, wie viel Zins Banken in Deutschland für neu vergebene Kredite effektiv verlangen, gewichtet über alle Laufzeiten. Gezeigt sind Kredite an Unternehmen außerhalb der Finanzbranche und Kredite an private Haushalte für den Wohnungsbau. Die Zinsen folgen den Leitzinsen der Europäischen Zentralbank und den Zinsen am Kapitalmarkt mit Verzögerung. Quelle ist die Zinsstatistik der monetären Finanzinstitute der Europäischen Zentralbank."}
      - {chart: credit_growth, ask: "Vergeben die Banken mehr Kredite?", years: 10, ref: 0, caption: "Die Abbildung zeigt, wie stark der Bestand an Bankkrediten in Deutschland gegenüber dem Vorjahresmonat wächst: Kredite an Unternehmen außerhalb der Finanzbranche und Wohnungsbaukredite an private Haushalte. Die Werte sind um Umbuchungen und Bewertungsänderungen bereinigt (Europäische Zentralbank, Bilanzstatistik). Wachsen die Kredite nur schwach, deutet das auf geringe Investitionen oder eine strenge Kreditvergabe hin."}
      - {chart: yields, toggle: {chart: yields_d, base: Monatsmittel, label: Tageswerte, base_en: Monthly average, label_en: Daily}, unsigned: true, name_labels: true, ask: "Wie hoch sind die Zinsen für Bundesanleihen?", years: 10, caption: "Die Abbildung zeigt die Rendite von Bundesanleihen, die noch 10 oder 2 Jahre bis zur Rückzahlung laufen, als Monatsmittel. Die Rendite ist der jährliche Ertrag, den eine Anleihe Käufern von heute bringt. Sie beeinflusst, wie viel Staat, Unternehmen und private Bauherren für ihre Finanzierung zahlen."}
      - {chart: yields_d, daily: true, unsigned: true, name_labels: true, years: 3, keep_years: true, recessions: false, ask: "Wie haben sich die Zinsen in den letzten Wochen bewegt?", caption: "Die Abbildung zeigt Tageswerte für die Rendite von Bundesanleihen, die noch 10 oder 2 Jahre bis zur Rückzahlung laufen (Zinsstrukturkurve der Bundesbank). Dazu kommt der Euro-Kurzfristzins €STR: Zu diesem Zins leihen Banken einander über Nacht Geld. Der €STR folgt eng dem Einlagezins der Europäischen Zentralbank, also dem Zins, den Banken für Geld bei der Zentralbank bekommen."}
      - {chart: long_rr, x_start: "1871-01-01", mean_skip: [[1919, 1924]], mean_note: "ohne Kriegsjahre und Hyperinflation 1919 bis 1924", mean_note_en: "excluding war years and the 1919 to 1924 hyperinflation", crisis_toggle: true, decade_mean: true, y_range: [-30, 30], ask: "Sind die Realzinsen heute historisch hoch?", years: 154, keep_years: true, recessions: false, blank_years: [[1914, 1918], [1939, 1945]], crises: hist_bank_deu, long_mean: true, ref: 0, caption: "Der Realzins ist hier die Rendite langfristiger Staatsanleihen minus die Inflationsrate desselben Jahres, in Prozent, also im Nachhinein gemessen. Die Achse endet bei plus und minus 30 Prozent; in der Hyperinflation Anfang der 1920er-Jahre, als das Geld rasend schnell an Wert verlor, lag der Realzins weit darunter. Hellgrau ist das Mittel je Jahrzehnt, das des laufenden Jahrzehnts gepunktet; per Schalter lassen sich Bankenkrisen (rot) und Rezessionen (grau) einblenden, hier Jahre mit sinkender realer Wirtschaftsleistung. Die Weltkriege 1914 bis 1918 und 1939 bis 1945 fehlen, spätere Lücken stammen aus der Datenbank. Quelle ist die Global Macro Database (Müller, Xu, Lehbib und Chen 2025), auch für die Bankenkrisen, mit Deutschland in den jeweiligen Grenzen; Abbildung und Download stehen unter der Lizenz CC BY-NC-SA 4.0, weil die Global Macro Database diese Lizenz verlangt."}
      - {chart: corp_yields, subj_en: {de_corp_yield: "the yield on corporate bonds", de_pub_yield: "the yield on public-sector bonds"}, unsigned: true, name_labels: true, ask: "Wie viel zahlen Unternehmen für Anleihen?", years: 26, keep_years: true, caption: "Die Abbildung zeigt die Umlaufsrendite inländischer Anleihen von Unternehmen außerhalb der Bankenbranche und von Anleihen der öffentlichen Hand, als Monatswert über alle Restlaufzeiten. Die Umlaufsrendite ist die Rendite, die bereits gehandelte Anleihen Käufern heute bringen. Zum Mai 2020 hat die Bundesbank den Kreis der einbezogenen Unternehmensanleihen angepasst."}
      - {chart: corp_spread, subj_en: {de_corp_spread: "the spread of corporate bonds over public-sector bonds"}, unsigned: true, ref: 0, ask: "Wie viel Aufschlag verlangen Anleger von Unternehmen?", years: 26, keep_years: true, caption: "Die Abbildung zeigt, um wie viele Prozentpunkte die Umlaufsrendite inländischer Unternehmensanleihen (ohne Banken) über der Rendite von Anleihen der öffentlichen Hand liegt. Steigt der Abstand, verlangen Anleger mehr Ausgleich für das Ausfallrisiko der Unternehmen; das war etwa in der Finanzkrise 2008 und 2009 so. Die Restlaufzeiten beider Gruppen unterscheiden sich, der Abstand ist deshalb nur ein grobes Maß. Zum Mai 2020 hat die Bundesbank den Kreis der einbezogenen Unternehmensanleihen angepasst."}
      - {chart: bls_std, subj_en: {bls_std_nfc: "the net balance for credit standards on loans to enterprises", bls_std_hh: "the net balance for credit standards on housing loans", bls_dem_nfc: "the net balance for loan demand from enterprises", bls_dem_hh: "the net balance for housing loan demand"}, toggle: {chart: bls_dem, base: Kreditstandards, label: Kreditnachfrage, base_en: Credit standards, label_en: Loan demand}, name_labels: true, ref: 0, ask: "Vergeben die Banken Kredite strenger?", years: 24, keep_years: true, caption: "Die Abbildung zeigt aus der Umfrage zum Kreditgeschäft (Bank Lending Survey) des Eurosystems, ob Banken in Deutschland ihre Kreditstandards in den letzten drei Monaten verschärft oder gelockert haben. Der Saldo ist der Anteil der Banken mit strengeren Standards minus den Anteil mit lockereren, in Prozent. Über null heißt: Mehr Banken haben verschärft. Befragt werden rund 35 Banken, jedes Quartal."}
      - {chart: bls_dem, subj_en: {bls_dem_nfc: "the net balance for loan demand from enterprises", bls_dem_hh: "the net balance for housing loan demand"}, name_labels: true, ref: 0, ask: "Fragen Unternehmen und Haushalte mehr Kredite nach?", years: 24, keep_years: true, caption: "Die Abbildung zeigt aus der Umfrage zum Kreditgeschäft (Bank Lending Survey) des Eurosystems, wie die Nachfrage nach Krediten bei Banken in Deutschland in den letzten drei Monaten verlaufen ist. Der Saldo ist der Anteil der Banken mit steigender Nachfrage minus den Anteil mit sinkender, in Prozent. Über null heißt: Mehr Banken sehen eine steigende Nachfrage."}
  - id: staat
    title: Staatsfinanzen
    part: staat
    ask: "Wie stehen die öffentlichen Finanzen da?"
    charts:
      - {chart: gov_balance, ask: "Wie hoch ist das Defizit des Staates?", years: 12, refs: [{y: -3, label: "Referenzwert −3 %"}], caption: "Die Abbildung zeigt Einnahmen minus Ausgaben von Bund, Ländern, Gemeinden und Sozialversicherung, in Prozent der Wirtschaftsleistung, je Quartal und saisonbereinigt (ohne die üblichen Schwankungen im Jahreslauf). Liegt der Wert unter null, gibt der Staat mehr aus, als er einnimmt: Er hat ein Defizit. Grau gestrichelt ist der Referenzwert des Maastricht-Vertrags von −3 % der Wirtschaftsleistung. Er gilt für das Defizit eines ganzen Jahres, nicht für einzelne Quartale."}
      - {chart: gov_spend, ask: "Wie viel gibt der Staat für Zinsen und Investitionen aus?", years: 25, name_labels: true, caption: "Die Abbildung zeigt, wie viel der Staat für Zinsen ausgibt und wie viel er investiert (Bruttoanlageinvestitionen), jeweils in Prozent der Wirtschaftsleistung und als Jahreswerte. Steigen die Zinsen, bleibt weniger Spielraum für Investitionen."}
      - {chart: gov_debt, ask: "Wie hoch ist der Schuldenstand?", up_bad: true, years: 12, refs: [{y: 60, label: "Referenzwert 60 %"}], caption: "Die Abbildung zeigt die Bruttoschulden des Staates in Prozent der Wirtschaftsleistung, abgegrenzt wie im Maastricht-Vertrag. Grau gestrichelt ist der Referenzwert dieses Vertrags von 60 %."}
      - {chart: long_debt, x_start: "1871-01-01", crisis_toggle: true, decade_mean: true, ask: "Wie hoch war die Staatsverschuldung früher?", years: 154, keep_years: true, recessions: false, blank_years: [[1914, 1918], [1939, 1945]], crises: hist_bank_deu, long_mean: true, refs: [{y: 60, label: "Referenzwert 60 %"}], caption: "Die Abbildung zeigt die Bruttoschulden des Gesamtstaats in Prozent der Wirtschaftsleistung; grau gestrichelt ist der Referenzwert des Maastricht-Vertrags. Nach beiden Weltkriegen haben Inflation und Währungsreform die Schulden weitgehend entwertet. Hellgrau ist das Mittel je Jahrzehnt, das laufende Jahrzehnt gepunktet; einblenden lassen sich Bankenkrisen (rot) und Rezessionen (grau), hier Jahre mit sinkendem realem Bruttoinlandsprodukt. Die langen Reihen und die Bankenkrisen stammen aus der Global Macro Database (Müller, Xu, Lehbib und Chen 2025), für Deutschland in den jeweiligen Grenzen; die Weltkriege 1914 bis 1918 und 1939 bis 1945 fehlen, spätere Lücken stammen aus der Datenbank. Weil diese Datenbank es verlangt, stehen die Abbildung und ihr Download unter der Lizenz CC BY-NC-SA 4.0."}
      - {chart: gov_debt_level, toggle: {chart: gov_debt_instr, base: "nach Ebene", label: "nach Instrument", base_en: "By level", label_en: "By instrument"}, name_labels: true, years: 26, keep_years: true, recessions: false, ask: "Wer im Staat hat die Schulden?", caption: "Die Linien zeigen die Bruttoschulden von Bund, Ländern, Gemeinden und Sozialversicherung in Prozent der Wirtschaftsleistung, abgegrenzt wie im Maastricht-Vertrag. Zum Bund zählen seine Sondervermögen und Extrahaushalte. Jede Ebene ist für sich gerechnet; Kredite zwischen den Ebenen stehen deshalb doppelt, und die Summe liegt etwas über dem Schuldenstand des Staates."}
      - {chart: gov_debt_instr, type: stacked, years: 31, keep_years: true, recessions: false, ask: "In welcher Form schuldet der Staat?", caption: "Die Balken teilen die Bruttoschulden des Staates zum Jahresende in Wertpapiere (Anleihen, Obligationen, Schatzanweisungen), Kredite (vor allem Bankkredite an Länder und Gemeinden) sowie Bargeld und Einlagen (vor allem Münzen), jeweils in Prozent der Wirtschaftsleistung."}
      - {chart: gov_debt_holder, type: stacked, years: 31, keep_years: true, recessions: false, ask: "Bei wem ist der Staat verschuldet?", caption: "Die Balken teilen die Bruttoschulden des Staates zum Jahresende danach, wer die Anleihen und Kredite hält, in Prozent der Wirtschaftsleistung. Die Bundesbank hält Staatsanleihen vor allem aus den Ankaufprogrammen des Eurosystems seit 2015. Ausland umfasst alle Gläubiger außerhalb Deutschlands, auch ausländische Zentralbanken und Fonds."}
      - {chart: gov_debt_mat, emphasis: rmd_de, name_labels: true, years: 26, keep_years: true, recessions: false, ask: "Wie lange laufen die Staatsschulden?", caption: "Die Linien zeigen, wie viele Jahre die Schulden des Staates zum Jahresende im Durchschnitt noch laufen, gewichtet mit ihrem Betrag. Je länger, desto langsamer schlagen höhere Zinsen auf den Haushalt durch. Für Frankreich, Italien und Spanien meldet Eurostat Werte erst ab 2020."}
      - {chart: gov_debt_cost, pick: [de_gov_implicit, de_bund10], labels: {de_bund10: "Rendite zehnjähriger Bundesanleihen", de_gov_implicit: "Durchschnittszins der Schulden"}, x_start: "1996-01-01", keep_years: true, recessions: false, name_labels: true, ask: "Wie teuer sind die Staatsschulden?", caption: "Die dicke Linie zeigt den Durchschnittszins auf alle Staatsschulden: Zinsausgaben eines Jahres in Prozent der Schulden des Vorjahres. Die dünne Linie zeigt die Monatsrendite zehnjähriger Bundesanleihen, also etwa den Zins auf neue Schulden. Liegt die Rendite über dem Durchschnittszins, steigen die Zinsausgaben, je mehr alte Anleihen auslaufen und neu finanziert werden."}
  - id: staatsausgaben
    title: Staatsausgaben
    part: staat
    code: Ausgaben
    ask: "Wofür gibt der Staat sein Geld aus?"
    charts:
      - {chart: stx_share, toggle: {chart: stx_share_gdp, base: "Anteil an den Ausgaben", label: "in % des BIP", base_en: "Share of spending", label_en: "% of GDP"}, multiples: true, recessions: false, keep_years: true, years: 30, ask: "Wofür gibt der Staat sein Geld aus?", caption: "Die Felder zeigen, welchen Anteil die zehn Aufgaben an den Ausgaben des Staates haben, in Prozent, als Jahreswerte. Der Staat umfasst Bund, Länder, Gemeinden und Sozialversicherung; Zahlungen zwischen ihnen sind herausgerechnet. Die Aufgaben folgen der internationalen Gliederung COFOG (Classification of the Functions of Government) der Vereinten Nationen. Zinsen zählen zu Verwaltung. 1995 enthält die Übernahme der Schulden der Treuhandanstalt durch den Bund (rund 130 Mrd. EUR, bei Wirtschaft und Verkehr)."}
      - {chart: stx_share_gdp, multiples: true, recessions: false, keep_years: true, years: 30, ask: "Wie viel gibt der Staat für jede Aufgabe aus, gemessen an der Wirtschaftsleistung?", caption: "Die Felder zeigen die Ausgaben des Staates für jede Aufgabe in Prozent der Wirtschaftsleistung (Bruttoinlandsprodukt)."}
      - {chart: stx_tree, type: treemap, attach: staat_cofog_tree.json, sources: ["Eurostat (gov_10a_exp, nama_10_gdp)", "eigene Berechnung"], licenses: ["CC BY 4.0 (Eurostat)"], unit: "Mrd. EUR, in Preisen von 2024", ask: "Wie verteilen sich die Staatsausgaben im Einzelnen?", caption: "Die Baumkarte zeigt die Ausgaben des Staates nach zehn Aufgaben und 69 Unteraufgaben; die Fläche entspricht den Ausgaben. Jede Aufgabe hat eine Farbe, ihre Unteraufgaben hellere Töne. Antippen vergrößert eine Aufgabe, der Schieberegler wählt das Jahr, „Abspielen“ zeigt 2000 bis 2024 als Film. Die Werte sind mit dem Preisindex der Konsumausgaben des Staates in Preise von 2024 umgerechnet; die Fläche wächst mit den preisbereinigten Ausgaben, gestrichelt ist der höchste Stand. Die Unteraufgaben veröffentlicht Eurostat ab 2000."}
      - {chart: stx_levels, name_labels: true, recessions: false, keep_years: true, years: 30, ask: "Wie viel geben Bund, Länder, Gemeinden und Sozialversicherung aus?", caption: "Die Linien zeigen die Ausgaben jeder Ebene des Staates in Prozent der Wirtschaftsleistung. Die Werte enthalten die Zahlungen an andere Ebenen, etwa den Zuschuss des Bundes an die Rentenversicherung oder die Zuweisungen der Länder an die Gemeinden. Sie lassen sich deshalb nicht zu den Ausgaben des Staates insgesamt addieren; zusammen liegen sie um 14 bis 24 % darüber."}
      - {chart: bund_tree, type: treemap, attach: bund_tree.json, sources: ["Bundesministerium der Finanzen (bundeshaushalt.de: Haushaltsplan, Regierungsentwurf, Haushaltsrechnung)", "eigene Berechnung"], licenses: ["Datenlizenz Deutschland – Namensnennung – Version 2.0 (Bundesministerium der Finanzen)"], unit: "Mrd. EUR", ask: "Wofür gibt der Bund im Einzelnen aus?", caption: "Die Baumkarte zeigt die Ausgaben des Bundes; die Fläche entspricht den Ausgaben, Antippen vergrößert einen Block. Der Schalter „Gliederung“ wechselt zwischen drei Sichten: Funktion nach dem Funktionenplan (Aufgaben, in drei Ebenen), Ausgabenart nach dem Gruppierungsplan (Personal, Sachausgaben, Zuweisungen, Investitionen, in drei Ebenen) und Ressort nach Einzelplänen und Kapiteln; Einzelplan 60 (Allgemeine Finanzverwaltung) und 32 (Bundesschuld) gehören keinem Ministerium. Die Summe kann je Gliederung leicht abweichen, weil negative Ansätze innerhalb eines Blocks verrechnet werden. Ist ist das Ergebnis der Haushaltsrechnung, Soll der beschlossene Haushaltsplan, Entwurf der Regierungsentwurf. Ist und Soll sind nur begrenzt vergleichbar: Das Soll ist eine Obergrenze und enthält globale Ansätze, die sich erst im Ist auf Funktionen verteilen; negative Ansätze wie globale Minderausgaben fehlen in der Karte. Gezeigt ist der Kernhaushalt. Der Schalter „mit Sondervermögen“ fügt die Ausgaben der Sondervermögen hinzu, vor allem Sondervermögen Bundeswehr, Klima- und Transformationsfonds sowie Sondervermögen Infrastruktur und Klimaneutralität (schraffiert); Zahlungen des Kernhaushalts an Sondervermögen und zwischen ihnen sind herausgerechnet. EU-Eigenmittel, durchlaufende EU-Mittel und die Rücklagen für die Versorgung der Beamten bleiben draußen. Für 2024 enthält die Haushaltsrechnung als Datei keine Sondervermögen. Einige Bezeichnungen sind gekürzt oder aktualisiert, etwa Bürgergeld statt Arbeitslosengeld II."}
      - {chart: stx_pk, type: stacked, years: 30, keep_years: true, recessions: false, ask: "Wie viel gibt der Staat je Einwohner aus, und wofür?", caption: "Die Balken zeigen die Ausgaben von Bund, Ländern, Gemeinden und Sozialversicherung je Einwohner und Jahr, in Euro zu jeweiligen Preisen, nach Aufgaben. Soziale Sicherung umfasst Renten, Familienleistungen und Arbeitslosengeld; Verwaltung enthält die Zinsen auf die Staatsschulden; übrige Aufgaben sind Verteidigung, öffentliche Sicherheit, Wirtschaft und Verkehr, Umwelt, Wohnen sowie Kultur. Die Preise sind seit 1995 um rund zwei Drittel gestiegen; ein Teil des Anstiegs ist deshalb Inflation."}
  - id: struktur
    title: Wachstumsgrundlagen
    part: struktur
    ask: "Wie steht es um die Grundlagen des Wachstums?"
    charts:
      - {chart: potential, pot_band: [de_potential, de_potential_oecd, de_potential_imf], zoom_toggle: true, zoom_years: 12, ask: "Wächst die Wirtschaft schneller als ihr Potenzial?", years: 30, forecast_after_bars: true, caption: "Das Produktionspotenzial ist die Wirtschaftsleistung, die bei normaler Auslastung von Arbeitskräften und Maschinen möglich wäre; man kann es nicht beobachten, es wird geschätzt. Die Fläche zeigt die Spanne der Schätzungen von Europäischer Kommission (AMECO), OECD und Internationalem Währungsfonds, heller in Prognosejahren; die Einzelwerte stehen im Tooltip. Die Schätzungen unterscheiden sich in Methode und Datenstand und werden mit jeder Ausgabe überarbeitet. Wächst die Wirtschaftsleistung (Balken) schneller als das Potenzial, steigt die Auslastung; den Abstand der beiden Niveaus nennt man Produktionslücke. Ist sie positiv, droht eher Inflation, ist sie negativ, bleiben Kapazitäten ungenutzt."}
      - {chart: productivity, ask: "Wie entwickelt sich die Produktivität?", years: 26, name_labels: true, caption: "Die Abbildung zeigt die reale Wirtschaftsleistung je Erwerbstätigen und je geleisteter Arbeitsstunde, also wie viel eine erwerbstätige Person oder eine Stunde Arbeit im Schnitt preisbereinigt erwirtschaftet. Langfristig bestimmt diese Produktivität den Wohlstand."}
      - {chart: long_growth, x_start: "1871-01-01", crisis_toggle: true, decade_mean: true, ask: "Ist eine so lange Wachstumsschwäche historisch ungewöhnlich?", transform: cagr10, unit: "% p. a.", years: 154, keep_years: true, recessions: false, blank_years: [[1914, 1918], [1939, 1945]], crises: hist_bank_deu, long_mean: true, ref: 0, caption: "Die Linie zeigt, wie stark die reale Wirtschaftsleistung (Bruttoinlandsprodukt) je Einwohner in den zehn Jahren bis zum genannten Jahr im Durchschnitt jährlich gewachsen ist, in Prozent; je Einwohner, damit Änderungen von Bevölkerung und Staatsgebiet den Vergleich nicht verzerren. Hellgrau ist das Mittel je Jahrzehnt, das des laufenden Jahrzehnts gepunktet; per Schalter lassen sich Bankenkrisen (rot) und Rezessionen (grau) einblenden, hier Jahre mit sinkender realer Wirtschaftsleistung. Die Weltkriege 1914 bis 1918 und 1939 bis 1945 fehlen; die Zehnjahreswerte danach schließen die Kriegsjahre noch ein. Quelle ist die Global Macro Database (Müller, Xu, Lehbib und Chen 2025), auch für die Bankenkrisen, mit Deutschland in den jeweiligen Grenzen; Abbildung und Download stehen unter der Lizenz CC BY-NC-SA 4.0, weil die Global Macro Database diese Lizenz verlangt."}
      - {chart: inv_ratio, ask: "Wie viel investiert Deutschland im Vergleich zur EU?", years: 30, name_labels: true, caption: "Die Abbildung zeigt, wie viel Deutschland und die Europäische Union investieren, in Prozent der Wirtschaftsleistung (Bruttoinlandsprodukt). Gemeint sind Bruttoanlageinvestitionen: Ausgaben für Maschinen, Bauten, Software und Forschung."}
      - {chart: long_inv, x_start: "1871-01-01", crisis_toggle: true, decade_mean: true, ask: "Investiert Deutschland heute weniger als früher?", years: 154, keep_years: true, recessions: false, blank_years: [[1914, 1918], [1939, 1945]], crises: hist_bank_deu, long_mean: true, caption: "Die Abbildung zeigt die Investitionen in Prozent der Wirtschaftsleistung, in jeweiligen Preisen: bis 1950 Bruttoinvestitionen nach historischen Schätzungen, danach Werte der Volkswirtschaftlichen Gesamtrechnungen, wobei sich die Abgrenzung über die Zeit ändert. Hellgrau ist das Mittel je Jahrzehnt, das laufende Jahrzehnt gepunktet; einblenden lassen sich Bankenkrisen (rot) und Rezessionen (grau), hier Jahre mit sinkendem realem Bruttoinlandsprodukt. Die langen Reihen und die Bankenkrisen stammen aus der Global Macro Database (Müller, Xu, Lehbib und Chen 2025), für Deutschland in den jeweiligen Grenzen; die Weltkriege 1914 bis 1918 und 1939 bis 1945 fehlen, spätere Lücken stammen aus der Datenbank. Weil diese Datenbank es verlangt, stehen die Abbildung und ihr Download unter der Lizenz CC BY-NC-SA 4.0."}
      - {chart: emp_sector, ask: "In welchen Bereichen entstehen Arbeitsplätze?", type: since, base: "2022-04-01", unit: "Tsd. Personen, Veränderung seit dem 2. Quartal 2022", bar_name: "Veränderung seit 2. Quartal 2022", caption: "Die Abbildung zeigt, wie sich die Zahl der Erwerbstätigen in jedem Wirtschaftsbereich seit dem 2. Quartal 2022 verändert hat, in Tausend. In Klammern steht dasselbe in Prozent des Stands im 2. Quartal 2022. So sieht man, wie sich die Erwerbstätigkeit von der Industrie zu den Dienstleistungen verschiebt."}
      - {chart: migration, toggle: {chart: migration_groups, base: Insgesamt, label: nach Staatsangehörigkeit, base_en: Total, label_en: By citizenship}, ask: "Wie viele Menschen wandern zu?", years: 30, scale: 0.000001, unit: "Mio. Personen", decimals: 2, caption: "Die Abbildung zeigt Zuzüge minus Fortzüge über die Grenzen Deutschlands, in Millionen Personen und einschließlich statistischer Anpassung. Seit 2011 trägt die Zuwanderung maßgeblich dazu bei, dass die Erwerbsbevölkerung wächst. Die Jahre 2015 und 2022 prägt die Flucht von Menschen aus Syrien und der Ukraine."}
      - {chart: migration_groups, ask: "Wer wandert zu und wer ab?", years: 20, name_labels: true, scale: 0.001, unit: "Tsd. Personen", decimals: 0, ref: 0, caption: "Die Abbildung zeigt Zuzüge minus Fortzüge nach Staatsangehörigkeit, in Tausend. Deutsche wandern seit Jahren netto ab: Es ziehen mehr Deutsche fort als zu. Die Zuwanderung aus Staaten außerhalb der EU ist von Flucht geprägt, die aus der EU vor allem von Arbeitsmigration. Die Werte sind ohne statistische Anpassung, deshalb weicht die Summe von der Abbildung zur Nettozuwanderung ab."}
      - {chart: cit, type: dumbbell, recessions: false, ask: "Wie hoch besteuert Deutschland Unternehmensgewinne im Vergleich?", years: 30, emphasis: cit_deu, context_grey: true, caption: "Die Abbildung vergleicht nach Zahlen der OECD, wie stark der Steuertarif die Gewinne von Kapitalgesellschaften insgesamt belastet. Gemeint sind die Körperschaftsteuer mit Zuschlägen und die Steuern nachgeordneter Ebenen, in Deutschland die Gewerbesteuer. Der hohle Punkt zeigt den Satz im ersten Jahr der Reihe, der volle Punkt mit Zahl den jüngsten Satz; die Jahre stehen in der Legende. Die Länder sind nach dem jüngsten Satz geordnet, Deutschland ist hervorgehoben."}
  - id: haushalte
    title: Vermögen
    part: struktur
    ask: "Wie viel besitzen die Haushalte, und wie ist es verteilt?"
    charts:
      - {chart: hh_wealth, scale: 0.001, unit: "Tsd. €", name_labels: true, years: 16, keep_years: true, recessions: false, ask: "Wie viel besitzt ein typischer Haushalt?", caption: "Die Linien zeigen das Nettovermögen je Haushalt, also Immobilien, Ersparnisse und Wertpapiere abzüglich der Schulden, in Tausend Euro zu jeweiligen Preisen. Der Median ist das Vermögen des Haushalts in der Mitte: Die Hälfte der Haushalte besitzt mehr, die Hälfte weniger. Der Mittelwert liegt weit darüber, weil wenige sehr reiche Haushalte ihn nach oben ziehen. Die EZB schätzt die Werte, indem sie die Haushaltsbefragung der Bundesbank an die Vermögensrechnung der Volkswirtschaft anpasst."}
      - {chart: hh_balance, type: stacked, bar_colors: ["#0070C0", "#00B0F0", "#7030A0", "#D86DCD", "#47D359", "#51154A", "#002060", "#A6A6A6"], years: 16, keep_years: true, recessions: false, ask: "Woraus besteht das Vermögen eines mittleren Haushalts?", caption: "Die Balken zeigen Vermögen und Schulden eines Haushalts im mittleren Fünftel der Vermögensverteilung, in Tausend Euro je Haushalt: über null, was er besitzt, unter null, was er schuldet. Die Linie ist das Nettovermögen. Das mittlere Fünftel sind die Haushalte zwischen den reichsten 40 % und den ärmsten 40 %."}
      - {chart: hh_share, name_labels: true, years: 16, keep_years: true, recessions: false, ask: "Wie ungleich ist das Vermögen verteilt?", caption: "Die Linien zeigen, welchen Anteil am gesamten Nettovermögen der Haushalte die reichsten 10 % und die ärmere Hälfte der Haushalte besitzen. Die EZB schätzt die Spitze der Verteilung zusätzlich mit Listen sehr reicher Personen, weil diese in Befragungen selten vorkommen."}
  - id: bedrohung
    title: Bedrohung
    part: geopolitik
    ask: "Wie stark gerät Deutschland ins Visier?"
    charts:
      - {chart: hybrid, bar_colors: ["#002060", "#00B0F0"], annual_count: {verb: "zählt die Universität Leiden", series: {leiden_ops_de: "Vorfälle mit Ziel in Deutschland", leiden_ops_eu: "im übrigen Europa"}}, annual_count_en: {verb: "Leiden University counts", series: {leiden_ops_de: "incidents with a target in Germany", leiden_ops_eu: "in the rest of Europe"}}, ask: "Wie oft trifft russische Sabotage Ziele in Europa?", x_start: "2022-01-01", keep_years: true, years: 4, recessions: false, no_yoy: true, caption: "Gezählt sind Sabotage, Brandanschläge, Ausspähung und Anschlagspläne, die Behörden oder verlässliche Berichte Russland zuschreiben. Cyberangriffe und Spionage fehlen meist. Dunkelblau sind Fälle mit Ziel in Deutschland. Andere Datenbanken grenzen anders ab und kommen auf andere Zahlen. Viele Fälle werden erst später bekannt; die jüngsten Quartale sind deshalb zu niedrig."}
      - {chart: gpr, ma3: true, tpl_en: {gpr_de: "{when}, the geopolitical risk index for Germany stood at {v} points; the 1985–2019 average is 100.", gpr_world: "{when}, the global geopolitical risk index stood at {v} points."}, ask: "Wie viel berichten Zeitungen über Kriegsgefahr?", up_bad: true, years: 8, refs: [{y: 100, label: "Mittel 1985–2019 = 100"}], caption: "Der Index misst, wie oft große englischsprachige Zeitungen über Kriegsgefahr, Krieg und Terror berichten. Der Wert für Deutschland zählt nur Artikel, die auch Deutschland nennen. 100 ist das Mittel der Jahre 1985 bis 2019. Dick: Durchschnitt über drei Monate, dünn: Monatswerte. Hohe Werte gehen in Studien mit geringeren Investitionen einher."}
  - id: ruestung
    title: Rüstung
    part: geopolitik
    ask: "Wie viel gibt Deutschland für Verteidigung aus?"
    charts:
      - {chart: arms_overview, type: sparktable, sources: ["Eurostat (Staatsausgaben nach Aufgaben, Produktionsindex)", "Kiel Institut (Kiel Military Procurement Tracker)"], ask: "Wie kommt das Rüstungsgeld in der Fabrik an?", x_start: "2015-01-01", rows: [
          {label: "Verteidigungsausgaben des Staates", label_en: "Government defence spending", unit: "Mrd. €, Jahr", unit_en: "€ bn, year", ids: [def_staff, def_material, def_invest, def_transfer], say: "die Verteidigungsausgaben", say_en: "defence spending"},
          {label: "davon Material und Betrieb", label_en: "of which material and operations", unit: "Mrd. €, Jahr", unit_en: "€ bn, year", ids: [def_material], sub: true},
          {label: "Rüstungsaufträge des Bundes", label_en: "Federal defence orders", unit: "2021 = 100, Summe über 12 Monate", unit_en: "2021 = 100, 12-month sum", ids: [kmpt_de_orders_idx], base: 100, decimals: 0, say: "die Rüstungsaufträge", say_en: "defence orders"},
          {label: "davon an Firmen in Deutschland", label_en: "of which to companies in Germany", unit: "Mrd. €, Jahr", unit_en: "€ bn, year", ids: [kmpt_de_only, kmpt_de_partner], sub: true},
          {label: "Produktion Waffen und Munition", label_en: "Production of weapons and ammunition", unit: "2021 = 100, Mittel über 12 Monate", unit_en: "2021 = 100, 12-month average", ids: [arms_prod_12m], base: 100, decimals: 0, say: "die Produktion von Waffen und Munition", say_en: "production of weapons and ammunition"},
          {label: "Umsatz Waffen und Munition", label_en: "Turnover, weapons and ammunition", unit: "Mrd. €, Summe über 12 Monate", unit_en: "€ bn, 12-month sum", ids: [de_arms_turnover], sum12: true},
          {label: "davon im Ausland", label_en: "of which abroad", unit: "Mrd. €, Summe über 12 Monate", unit_en: "€ bn, 12-month sum", ids: [de_arms_turnover_abroad], sum12: true, sub: true},
          {label: "Beschäftigte Waffen und Munition", label_en: "Employment, weapons and ammunition", unit: "Personen", unit_en: "persons", ids: [de_arms_employment], decimals: 0},
          {label: "Industrie insgesamt", label_en: "Manufacturing as a whole", unit: "2021 = 100, Mittel über 12 Monate", unit_en: "2021 = 100, 12-month average", ids: [de_manuf_prod], mean12: true, base: 100, decimals: 0, tail: "die Industrie insgesamt kam auf das {f}-Fache", tail_en: "manufacturing as a whole reached {f} times its 2021 level"}],
        caption: "Jede Zeile vergleicht den jüngsten Stand mit dem Jahr 2021. Die kleinen Linien zeigen den Verlauf seit 2015 auf derselben Zeitachse; der Punkt markiert den jüngsten Wert. Ausgaben und Aufträge in Euro, Produktion als Menge. Die Aufträge umfassen auch Panzer, Flugzeuge und Schiffe, die Produktion nur Waffen und Munition. Die Zeitpunkte unterscheiden sich, weil die Quellen verschieden schnell melden."}
      - {chart: milex, tpl_en: {milex_deu: "{when}, Germany's military expenditure amounted to {v}% of GDP, {chg} pp {more} than a year earlier."}, ask: "Wie hoch sind die Militärausgaben im Vergleich?", x_start: "1990-01-01", keep_years: true, years: 36, recessions: false, emphasis: milex_deu, context_grey: true, name_labels: true, caption: "Militärausgaben in Prozent der Wirtschaftsleistung, nach der Abgrenzung des Stockholmer Friedensforschungsinstituts SIPRI. Sie schließt Militärrenten und Militärhilfe ein. Die Ziele der Nato von 2 Prozent und 3,5 Prozent bis 2035 beruhen auf einer anderen Abgrenzung. Nach Nato-Rechnung liegt Deutschland meist etwas höher. Hervorgehoben ist Deutschland."}
      - {chart: arms_cycle, each_last: true, name_labels: true, title: "Die Aufträge laufen der Produktion davon", refs: [{y: 100, label: "2021 = 100"}], tpl_en: {kmpt_de_orders_idx: "{when}, defence orders over the previous twelve months stood at {v} (2021 = 100).", arms_prod_12m: "{when}, production of weapons and ammunition stood at {v} (2021 = 100)."}, ask: "Kommt die Produktion den Rüstungsaufträgen hinterher?", x_start: "2021-12-01", keep_years: true, years: 5, recessions: false, caption: "Beide Linien zeigen zwölf Monate, verglichen mit dem Jahr 2021 (= 100). Aufträge: Bestellungen des Bundes für Rüstung in Euro (Kiel Institut). Produktion: Herstellung von Waffen und Munition (Eurostat). Die Aufträge haben sich fast vervierfacht, die Produktion nur gut verdoppelt. Die Auftragslinie springt, weil Großaufträge auf einen Schlag kommen. Der Abstand ist der Auftragsstau; Panzer, Flugzeuge und Schiffe fehlen allerdings in der Produktion."}
      - {chart: arms_turnover, transform: sum12, name_labels: true, each_last: true, ask: "Wie viel setzen die Hersteller von Waffen und Munition um?", x_start: "2019-12-01", keep_years: true, years: 7, recessions: false, tpl_en: {de_arms_turnover: "{when}, makers of weapons and ammunition had turnover of €{v} bn over the previous twelve months.", de_arms_turnover_abroad: "Of this, €{v} bn came from customers abroad."}, caption: "Umsatz der Werke, die Waffen und Munition herstellen, summiert über die jeweils letzten zwölf Monate, in Milliarden Euro; Betriebe ab 50 Beschäftigten. Gezählt wird je Werk, nicht je Firma; so verschiebt eine neue Zuordnung von Firmen die Zahlen nicht. Panzer und andere Kampffahrzeuge fehlen, weil das Statistische Bundesamt ihre Werte geheim hält. Der Auslandsumsatz umfasst Lieferungen an Kunden außerhalb Deutschlands."}
      - {chart: def_use, bar_colors: ["#002060", "#0070C0", "#00B0F0", "#D86DCD"], tpl_en: {def_staff: "{when}, the state spent €{v} bn on armed forces personnel.", def_material: "Material, maintenance and operations took €{v} bn.", def_invest: "New weapon systems and buildings took €{v} bn.", def_transfer: "Investment grants and other transfers to others amounted to €{v} bn."}, ask: "Wofür gibt der Staat das Verteidigungsgeld aus?", x_start: "2015-01-01", keep_years: true, years: 10, recessions: false, no_yoy: true, caption: "Ausgaben von Bund, Ländern und Gemeinden für Verteidigung nach Art, in Milliarden Euro. Seit 2021 wuchs vor allem der Posten für Material, Wartung und Betrieb, also Ersatzteile, Munition und Dienstleistungen. Die Investitionen in neue Waffensysteme blieben flach, weil sie erst bei Lieferung zählen. Der Sprung bei den Transfers an andere fällt mit der Militärhilfe für die Ukraine zusammen. Wie viel davon im Inland ankommt, zeigen die Daten nicht."}
      - {chart: orders_origin, bar_colors: ["#002060", "#0070C0", "#00B0F0", "#D86DCD"], annual_count: {verb: "vergab Deutschland Rüstungsaufträge über", per_year: 1, series: {kmpt_de_only: "Mrd. Euro an deutsche Unternehmen", kmpt_de_partner: "an deutsche mit ausländischen Partnern", kmpt_eu: "an andere europäische", kmpt_noneu: "an Unternehmen außerhalb Europas"}}, annual_count_en: {verb: "Germany awarded defence contracts worth", per_year: 1, series: {kmpt_de_only: "billion euros to German companies", kmpt_de_partner: "to German companies with foreign partners", kmpt_eu: "to other European ones", kmpt_noneu: "to companies outside Europe"}}, ask: "Wie viel Rüstungsgeld geht an Unternehmen im Inland?", x_start: "2020-01-01", keep_years: true, years: 6, recessions: false, no_yoy: true, caption: "Rüstungsaufträge des Bundes nach Jahr der Bekanntgabe und Sitz des Auftragnehmers, in Milliarden Euro. „Deutsch mit Partner“ heißt: ein deutsches und ein ausländisches Unternehmen gemeinsam, oder ein ausländisches Unternehmen mit Fertigung in Deutschland. Der Sitz sagt nicht, wo gefertigt wird; Zulieferungen aus dem Ausland sind nicht erfasst. Der Anteil von Auftragnehmern außerhalb Europas fiel von 42 Prozent im Jahr 2022 auf 4 Prozent im Jahr 2025. Aufträge mit unklarer Herkunft, seit 2020 rund 31 Milliarden Euro, fehlen."}
      - {chart: arms_prod, ma3: true, tpl_en: {de_arms_prod: "{when}, the production of weapons and ammunition stood at {v} points (2021 = 100).", de_manuf_prod: "Industry as a whole stood at {v} points."}, name_labels: true, ask: "Wie stark wächst die Produktion von Waffen und Munition?", x_start: "2015-01-01", keep_years: true, years: 12, caption: "Produktion von Waffen und Munition im Vergleich zur ganzen Industrie, 2021 = 100, bereinigt um Saison und Kalender. Panzer, Flugzeuge und Schiffe zählen zu anderen Branchen und fehlen hier. Dick: Durchschnitt über drei Monate, dünn: Monatswerte."}
      - {chart: milex_gov, tpl_en: {milex_gov_deu: "{when}, military spending accounted for {v}% of Germany's government spending, {chg} pp {more} than a year earlier."}, ask: "Welchen Vorrang hat die Verteidigung im Haushalt?", x_start: "1990-01-01", keep_years: true, years: 36, recessions: false, emphasis: milex_gov_deu, context_grey: true, name_labels: true, caption: "Anteil der Militärausgaben an allen Ausgaben des Staates, also von Bund, Ländern, Gemeinden und Sozialversicherung. Abgrenzung des Friedensforschungsinstituts SIPRI, Staatsausgaben nach dem Internationalen Währungsfonds. Hervorgehoben ist Deutschland."}
      - {chart: milex_eu_ru, tpl_en: {sipri_usd_cwe: "{when}, Central and Western Europe spent US${v} bn on the military at 2024 prices.", sipri_usd_rus: "Russia spent US${v} bn according to SIPRI estimates."}, ask: "Gibt Europa mehr für Verteidigung aus als Russland?", x_start: "1990-01-01", keep_years: true, years: 36, recessions: false, name_labels: true, caption: "Militärausgaben in Milliarden US-Dollar, zu Preisen und Wechselkursen von 2024. Mittel- und Westeuropa ist Europa ohne Russland, Belarus, die Ukraine und Moldau. Seit 2023 schätzt SIPRI die russischen Ausgaben, weil Teile des Haushalts geheim sind. In Dollar gerechnet wirkt Russlands Haushalt kleiner, als er an Kaufkraft im Land ist."}
      - {chart: cinc, tpl_en: {cinc_deu: "{when}, Germany's share in the CINC capability index was {v}% of the world, {chg} pp {more} than a year earlier."}, ask: "Wie viel Gewicht hat Deutschland unter den Mächten der Welt?", x_start: "1816-01-01", keep_years: true, years: 207, recessions: false, caption: "Der Index des Forschungsprojekts Correlates of War (CINC) misst das materielle Gewicht eines Staates. Er mittelt die Weltanteile an Bevölkerung, Stadtbevölkerung, Stahl, Energieverbrauch, Soldaten und Militärausgaben. Deutschland, bis 1870 Preußen, kam 1913 auf 14 Prozent und 1941 auf 20 Prozent; 2022 waren es 1,5 Prozent. 1955 bis 1989 sind Bundesrepublik und DDR zusammengerechnet. Der Index misst Masse, keine Technik und keine Bündnisse."}
      - {chart: ukraine_aid, bar_colors: ["#002060", "#00B0F0"], tpl_en: {kiel_de_mil: "{when}, Germany allocated military aid worth €{v} bn to Ukraine.", kiel_de_other: "{when}, financial and humanitarian aid worth €{v} bn was added."}, ask: "Wie viel Hilfe teilt Deutschland der Ukraine zu?", x_start: "2022-01-01", keep_years: true, years: 5, recessions: false, no_yoy: true, caption: "Hilfe Deutschlands, die geliefert oder fest für die Lieferung bestimmt ist, in Milliarden Euro je Quartal. Militärhilfe umfasst auch Geld für Waffenkäufe. Es fehlen der deutsche Anteil an der Hilfe der Europäischen Union und die Kosten für Geflüchtete. Große Pakete werden oft für mehrere Jahre auf einmal festgelegt."}
  - id: handel
    title: Handelskonflikte
    part: geopolitik
    ask: "Wie oft treffen Handelshemmnisse deutsche Exporte?"
    charts:
      - {chart: trade_harm, name_labels: true, annual_count: {verb: "zählt Global Trade Alert", per_year: 1, series: {gta_de_chn: "schädliche Eingriffe Chinas gegen deutsche Exporte", gta_de_usa: "der USA", gta_de_other: "anderer Staaten"}}, annual_count_en: {verb: "Global Trade Alert counts", per_year: 1, series: {gta_de_chn: "harmful interventions by China against German exports", gta_de_usa: "by the USA", gta_de_other: "by other states"}}, ask: "Wie viele schädliche Handelseingriffe treffen Deutschland?", x_start: "2009-01-01", keep_years: true, years: 17, recessions: false, no_yoy: true, caption: "Gezählt sind Eingriffe, die Global Trade Alert als schädlich für den Handel einstuft und die deutsche Exporte treffen: Zölle, Subventionen, Vorgaben für öffentliche Aufträge und Exportverbote. Jeder Eingriff zählt einmal, gleich wie viel Handel er betrifft. Maßnahmen der Europäischen Union fehlen, weil Deutschland Mitglied ist. Neue Fälle werden oft verspätet erfasst; das jüngste Jahr ist eher zu niedrig."}
      - {chart: trade_ru, name_labels: true, ask: "Fließen Exporte über Nachbarländer nach Russland?", x_start: "2019-01-01", keep_years: true, years: 8, recessions: false, no_yoy: true, tpl_en: {de_exp_rusblr: "{when}, Germany's exports to Russia and Belarus over the previous twelve months amounted to €{v} bn.", de_exp_cauca: "Exports to the Caucasus and Central Asia amounted to €{v} bn."}, caption: "Warenexporte Deutschlands, summiert über die jeweils letzten zwölf Monate, in Milliarden Euro. Nach Russland und Belarus brachen die Exporte nach Kriegsbeginn 2022 ein. Nach Armenien, Georgien, Kasachstan, Kirgisistan, Tadschikistan und Usbekistan stiegen sie zugleich kräftig. Studien der Osteuropabank (EBRD) sehen darin zum Teil umgeleitete Lieferungen nach Russland."}
  - id: rezession
    code: Rezession
    title: Rezessionsrisiko
    part: analysen
    ask: "Droht eine Rezession?"
    charts:
      - {chart: sahm, ask: "Deutet der Arbeitsmarkt auf eine Rezession hin?", up_bad: true, years: 25, type: threshold, threshold: 0.25, caption: "Eigene Berechnung nach Michaillat und Saez (2025): Das Signal steigt nur, wenn die Arbeitslosigkeit zunimmt und zugleich die offenen Stellen abnehmen. Es ist der kleinere von zwei Werten, nämlich dem Anstieg der Arbeitslosenquote einschließlich Kurzarbeit (in Vollzeitäquivalenten) über ihr Tief der letzten zwölf Monate und dem Rückgang der Quote offener Stellen unter ihr Hoch der letzten zwölf Monate, jeweils mit gleitenden Dreimonatsmitteln. Rot gestrichelt ist die Schwelle von 0,25 Prozentpunkten, eine eigene Wahl für Deutschland; Michaillat und Saez nennen für die USA 0,29. Graue Flächen zeigen Rezessionen nach der Datierung des Sachverständigenrats; jede Rezession seit 2001 überschritt die Schwelle, teils mit erheblicher Verzögerung. Literatur: Michaillat, P. und Saez, E. (2025), Has the Recession Started?, Oxford Bulletin of Economics and Statistics; Sahm, C. (2019), Direct Stimulus Payments to Individuals, Brookings Institution."}
      - {chart: clock, ask: "In welcher Konjunkturphase steht die Industrie?", type: clock, x: de_ind_orderbooks, y: de_ind_prodexp, months: 24, caption: "Waagerecht steht, wie Industrieunternehmen ihre Aufträge heute bewerten, senkrecht, was sie für die nächsten drei Monate erwarten, beides als Abstand zum Durchschnitt 2005 bis 2019. Die Spur zeigt die letzten 24 Monate, der große Punkt den jüngsten Monat, die Pfeile die Richtung. Im typischen Konjunkturzyklus wandert der Punkt im Uhrzeigersinn durch die vier farbig hinterlegten Phasen: Aufschwung, Boom, Abschwung, Rezession."}
      - {chart: downturns, toggle: {chart: downturns_hist, base: "seit 2008, Monate", label: "seit 1879, Jahre", base_en: "since 2008, months", label_en: "since 1879, years"}, ask: "Wie tief ist der aktuelle Abschwung im Vergleich zu früheren Krisen?", type: event, kind: downturn, months: 36, episodes: [{label: "Finanzkrise 2008", start: "2008-01-01"}, {label: "Corona 2020", start: "2020-02-01"}], caption: "Die Linien zeigen den Verlauf ab dem Hoch der Industrieproduktion vor früheren Krisen und im aktuellen Abschwung (dunkelblau, dick). Produktion und Wirtschaftsleistung (Bruttoinlandsprodukt) erscheinen als Index mit dem Hoch = 100, die Arbeitslosenquote als Veränderung in Prozentpunkten seit diesem Hoch. Das aktuelle Hoch ist der höchste Stand der Produktion in den letzten fünf Jahren. Die Zeitpunkte der Hochs sind vom Monitor gesetzt und keine amtliche Datierung. Die Energiekrise ab Ende 2021 ist nicht eigens gezeigt, weil sie in den laufenden Abschwung übergeht."}
      - {chart: downturns_hist, ask: "Wie tief waren die Abschwünge seit dem 19. Jahrhundert?", type: event, kind: history, title: "Abschwünge seit 1879 im Vergleich, Jahreswerte", years: 8, stop_before: [1914, 1939], band_label: "Spanne der übrigen Abschwünge", episodes: [{peak: 1879}, {peak: 1898}, {peak: 1928, label: "Weltwirtschaftskrise 1929", highlight: true}, {peak: 1966}, {peak: 1974}, {peak: 1981}, {peak: 1992}, {peak: 2001}, {peak: 2008, label: "Finanzkrise 2009", highlight: true}, {peak: 2019, label: "Corona 2020", highlight: true}], caption: "Die Abbildung zeigt Jahreswerte ab dem Jahr des Hochs, dem letzten Jahr, bevor die reale Wirtschaftsleistung (Bruttoinlandsprodukt) sank: links die Wirtschaftsleistung mit dem Jahr des Hochs = 100, rechts die Veränderung der Arbeitslosenquote in Prozentpunkten seit diesem Jahr. Hervorgehoben sind Weltwirtschaftskrise, Finanzkrise, Corona und der laufende Abschwung (dick); grau ist die Spanne der übrigen Abschwünge mit Hochs 1879, 1898, 1966, 1974, 1981, 1992 und 2001. Kriegsjahre fehlen, und die Verläufe enden vor 1914 und 1939. Die historischen Werte stammen aus der Global Macro Database (Müller, Xu, Lehbib und Chen 2025), mit Deutschland in den jeweiligen Grenzen und wechselnder Quelle und Abgrenzung der Arbeitslosenquote; der laufende Abschwung beruht auf amtlichen Jahreswerten (Bruttoinlandsprodukt des Statistischen Bundesamts, Erwerbslosenquote nach ILO im Jahresmittel) und ist deshalb nicht vollständig vergleichbar. Abbildung und Download stehen unter der Lizenz CC BY-NC-SA 4.0, weil die Global Macro Database diese Lizenz verlangt."}
  - id: breite
    code: Breite
    title: Breite und Vergleich
    part: analysen
    ask: "Wie breit ist die Entwicklung, und wie ungewöhnlich ist sie?"
    charts:
      - {chart: diffusion, type: diffusion, groups: {Produktion: branch_heat, Auftragseingang: orders_heat}, title: "Breite: Anteil der Industriebranchen mit Zuwachs", ask: "Wächst die Industrie in der Breite oder nur in einzelnen Branchen?", caption: "Die Linien zeigen den Anteil der Industriebranchen (Verarbeitendes Gewerbe), deren Produktion (24 Branchen) oder Auftragseingang (9 Branchen) in den letzten drei Monaten höher lag als in den drei Monaten davor, in Prozent. Jede Branche zählt gleich, egal wie groß sie ist. Über 50 Prozent wächst die Mehrheit der Branchen. Die Linien sind gleitende Dreimonatsmittel, die Monatswerte lassen sich einblenden. Graue Flächen zeigen Rezessionen nach der Datierung des Sachverständigenrats."}
      - {chart: infl_hist, ask: "Wie schnell gingen frühere Inflationsschübe zurück?", type: event, kind: history, years: 8, band_label: "Spanne der übrigen Schübe", panels: [{title: "Inflationsrate", sub: "in %; waagerecht: Jahre seit dem Inflationshoch", hist: hist_infl_deu, cur: de_hicp_yoy, per_year: 12, mode: level}], episodes: [{peak: 1951, label: "Korea-Boom 1951"}, {peak: 1974, label: "Ölkrise 1974", highlight: true}, {peak: 1981, label: "Zweite Ölkrise 1981", highlight: true}, {peak: 1992, label: "Wiedervereinigung 1992", highlight: true}], caption: "Die Linien zeigen die Jahresinflationsrate ab dem Jahr des Inflationshochs: nach dem Korea-Boom 1951 (grau), den Ölkrisen 1974 und 1981, der Wiedervereinigung 1992 und im laufenden Schub seit 2022 (dick). So sieht man, wie viele Jahre es jeweils dauerte, bis die Rate wieder nahe 2 Prozent lag. Die historischen Werte stammen aus der Global Macro Database (Müller, Xu, Lehbib und Chen 2025). Der laufende Schub ist das Jahresmittel des harmonisierten Verbraucherpreisindex (Deutsche Bundesbank), nur vollständige Jahre. Abbildung und Download stehen unter der Lizenz CC BY-NC-SA 4.0, weil die Global Macro Database diese Lizenz verlangt."}
  - id: aussichten
    part: prognosen
    title: Aussichten
    ask: "Was erwarten die Prognosen?"
    charts:
      - {chart: forecast, ask: "Was erwarten die Prognosen für das Wachstum?", type: forecast, measure: gdp, title: "Prognosen für das Wachstum", caption: "Jeder Punkt ist die jüngste Prognose eines Herausgebers für das Wachstum der realen, also preisbereinigten Wirtschaftsleistung (Bruttoinlandsprodukt) gegenüber dem Vorjahr, getrennt nach Zieljahr. Dunkelblau mit Zahl steht die Projektion der Bundesregierung, auf der Haushalt und Steuerschätzung beruhen; grau sind weitere Herausgeber, hellgrau, wenn ihre Prognose älter als vier Monate ist. Das graue Feld zeigt die Spanne vom niedrigsten bis zum höchsten Wert. Der Tooltip, das Feld beim Zeigen auf einen Punkt, nennt Herausgeber und Datum und kennzeichnet einzelne Werte, die aus Presseberichten zu den Veröffentlichungen stammen. Die Gemeinschaftsdiagnose ist die gemeinsame Prognose von DIW, ifo, IfW Kiel, IWH und RWI."}
      - {chart: forecast_infl, ask: "Was erwarten die Prognosen für die Inflation?", type: forecast, measure: inflation, title: "Prognosen für die Inflationsrate", caption: "Jeder Punkt ist die jüngste Prognose eines Herausgebers für die Inflationsrate gegenüber dem Vorjahr, getrennt nach Zieljahr, meist gemessen am Verbraucherpreisindex. Die Bundesbank prognostiziert den europäischen harmonisierten Verbraucherpreisindex, der meist nahe am Verbraucherpreisindex liegt. Dunkelblau mit Zahl steht die Bundesregierung; grau sind weitere Herausgeber, hellgrau, wenn ihre Prognose älter als vier Monate ist. Das graue Feld zeigt die Spanne aller jüngsten Prognosen. Der Tooltip beim Zeigen auf einen Punkt nennt Herausgeber und Datum und kennzeichnet einzelne Werte aus Presseberichten."}
      - {chart: forecast_core, ask: "Was erwarten die Prognosen für die Kerninflation?", type: forecast, measure: core, title: "Prognosen für die Kerninflation", caption: "Die Abbildung zeigt Prognosen für die Inflationsrate ohne Energie und Nahrungsmittel, die sogenannte Kerninflation. Gezeigt wird sie erst, sobald mindestens zwei Herausgeber einen Wert veröffentlicht haben."}
  - id: sachverstaendigenrat
    title: Sachverständigenrat
    part: prognosen
    ask: "Was rät der Sachverständigenrat, und wie gut lag er?"
    charts:
      - {chart: svr_rat, view: phasen, phases: true, heute: {attach: svr_positionen.json, who: svr}, type: stance, attach: svr_positionen.json, years: 62, keep_years: true, recessions: false, ask: "Was empfahl der Sachverständigenrat zu Löhnen, Geld, Finanzen und Arbeitsmarkt?", say: ["Lohnzurückhaltung empfahl der Sachverständigenrat in 28 von 62 Jahresgutachten, durchgehend von 1993 bis 2011. Mehr Flexibilität am Arbeitsmarkt fordert er seit 1983 fast in jedem Jahr."], say_en: ["The Council of Economic Experts recommended wage restraint in 28 of 62 annual reports, without a break from 1993 to 2011. It has called for more labour-market flexibility almost every year since 1983."], caption: "Oben steht die jüngste Empfehlung des Sachverständigenrats in Worten. Darunter zeigt jede Zeile, was er im Jahresgutachten für das Folgejahr empfahl. Rot steht für sozial-progressive Empfehlungen: kräftigere Löhne, lockerere Geldpolitik, Impulse aus dem Haushalt, mehr Schutz am Arbeitsmarkt. Blau steht für konservativ-liberale: Lohnzurückhaltung, straffere Geldpolitik, sparen, mehr Flexibilität. Grau heißt beibehalten. Die politische Zuordnung ist eine eigene Deutung. Breite Bänder sind Phasen ab drei Jahren, schmale Striche einzelne Jahre, Lücken Jahre ohne Empfehlung. Die Balken darunter zählen die Stellen mit Minderheitsvotum. Unten stehen die jüngsten Wendepunkte mit Fundstelle. Antippen zeigt die Empfehlung mit Fundstelle; die Einordnung ist eine eigene Auswertung."}
      - {chart: svr_fiskal, type: stance_bars, pick: [svr_bip_prog, svr_stance_f], attach: svr_positionen.json, years: 62, keep_years: true, recessions: false, ref: 0, unit: "% ggü. Vorjahr", ask: "Riet der Sachverständigenrat auch bei schwachem Wachstum zum Sparen?", say: ["In zehn Jahren erwartete der Sachverständigenrat weniger als 1 % Wachstum. In sechs davon empfahl er trotzdem eine restriktivere Finanzpolitik, zuletzt für 2013."], say_en: ["In ten years the Council of Economic Experts expected growth below 1%. In six of them it still recommended tighter fiscal policy, most recently for 2013."], caption: "Die Balken zeigen, welches Wachstum des realen Bruttoinlandsprodukts der Sachverständigenrat im Jahresgutachten für das Folgejahr erwartete. Die Farbe zeigt, welchen Kurs der Finanzpolitik er im selben Gutachten für dieses Jahr empfahl: blau Konsolidierung (Defizit abbauen), grau konjunkturneutral (automatische Stabilisatoren wirken lassen), rot Impulse, hellgrau keine Empfehlung erkennbar. Bis 1991 gilt Westdeutschland. Antippen zeigt die Empfehlung mit Ziffer und Seite."}
      - {chart: svr_treff, multiples: true, own_scale: true, years: 62, keep_years: true, recessions: false, ref: 0, no_tend: true, rail: "Treffsicherheit", ask: "Wie gut trafen die Prognosen des Rats?", unit: "Abweichung", say: ["Seit 1966 lag der Rat beim Wachstum im Mittel 1,2 Prozentpunkte neben der ersten Meldung, bei der Inflation 0,7 Prozentpunkte und bei den Arbeitslosen rund 170 000. Die einfache Regel „wie im Vorjahr“ lag jeweils weiter daneben."], say_en: ["Since 1966 the Council has missed the first release of growth by 1.2 percentage points on average, of inflation by 0.7 percentage points and of unemployment by about 170,000 people. The simple rule \"same as last year\" missed by more in each case."], caption: "Jedes Feld zeigt, wie weit die Prognose des Rats im Jahresgutachten für das Folgejahr von der ersten Meldung abwich: über null zu hoch, unter null zu niedrig. Wachstum und Inflation in Prozentpunkten, Arbeitslose in Tausend Personen. Die einzelnen Prognosen und Meldungen stehen unter „Downloads“."}
  - id: gemeinschaftsdiagnose
    title: Gemeinschaftsdiagnose
    part: prognosen
    code: Gemeinschaftsdiagnose
    ask: "Was raten die Wirtschaftsforschungsinstitute, und wie gut lagen sie?"
    charts:
      - {chart: "gd_rat", view: phasen, phases: true, heute: {attach: gd_positionen.json, who: gd}, rail: "Empfehlungen", type: "stance", stance_rows: ["gd_stance_a", "gd_stance_f", "gd_stance_g", "gd_stance_l"], attach: "gd_positionen.json", votes_id: "gd_voten_n", votes_label: "Abweichende Voten einzelner Institute", years: 76, keep_years: true, recessions: false, ask: "Was empfahlen die Institute zu Löhnen, Geld, Finanzen und Arbeitsmarkt?", say: ["In 31 von 65 Herbstgutachten mit Text forderten die Institute mehr Flexibilität am Arbeitsmarkt, zuletzt 2025. Lohnzurückhaltung empfahlen sie in 26 Gutachten, zuletzt 2008."], say_en: ["In 31 of 65 autumn reports with text the institutes called for more labour-market flexibility, most recently in 2025. They recommended wage restraint in 26 reports, most recently in 2008."], caption: "Oben steht die jüngste Empfehlung der Institute in Worten. Darunter zeigt jede Zeile, was sie im Herbstgutachten für das Folgejahr empfahlen. Rot steht für sozial-progressive Empfehlungen: kräftigere Löhne, lockerere Geldpolitik, Impulse aus dem Haushalt, mehr Schutz am Arbeitsmarkt. Blau steht für konservativ-liberale: Lohnzurückhaltung, straffere Geldpolitik, sparen, mehr Flexibilität. Grau heißt beibehalten. Die politische Zuordnung ist eine eigene Deutung. Breite Bänder sind Phasen ab drei Jahren, schmale Striche einzelne Jahre, Lücken Jahre ohne Empfehlung. Die Balken darunter zählen abweichende Voten einzelner Institute. Unten stehen die jüngsten Wendepunkte mit Fundstelle. Zwei Prüfer haben jede Empfehlung unabhängig eingeordnet; Antippen zeigt sie mit Fundstelle."}
      # Vorläufig offline, kommt in den künftigen Reiter „Gesamtschau“ (Vergleich Institute und Rat):
      # - {chart: "gd_vergleich", rail: "Vergleich mit dem Sachverständigenrat", type: "stance", attach: "gd_svr_positionen.json", pick: ["svr_stance_a", "gd_stance_a", "svr_stance_f", "gd_stance_f", "svr_stance_g", "gd_stance_g", "svr_stance_l", "gd_stance_l"], stance_rows: ["svr_stance_a", "gd_stance_a", "svr_stance_f", "gd_stance_f", "svr_stance_g", "gd_stance_g", "svr_stance_l", "gd_stance_l"], stance_keys: {"gd_stance_l": "GL", "gd_stance_g": "GG", "gd_stance_f": "GF", "gd_stance_a": "GA"}, labels: {"svr_stance_l": "Lohnpolitik, SVR", "svr_stance_g": "Geldpolitik, SVR", "svr_stance_f": "Finanzpolitik, SVR", "svr_stance_a": "Arbeitsmarkt, SVR", "gd_stance_l": "Lohnpolitik, GD", "gd_stance_g": "Geldpolitik, GD", "gd_stance_f": "Finanzpolitik, GD", "gd_stance_a": "Arbeitsmarkt, GD"}, votes_id: "keine", years: 62, keep_years: true, recessions: false, ask: "Empfahlen die Institute dasselbe wie der Sachverständigenrat?", say: ["Beim Arbeitsmarkt empfahlen Institute und Sachverständigenrat in 30 von 37 Jahren dasselbe, bei der Geldpolitik nur in 20 von 35."], say_en: ["On the labour market the institutes and the Council of Economic Experts recommended the same in 30 of 37 years, on monetary policy only in 20 of 35."], caption: "Je Frage stehen zwei Zeilen untereinander: oben die Institute, darunter der Sachverständigenrat. Gleiche Farbe heißt: Sie rieten dasselbe. Rot steht für sozial-progressive Empfehlungen: kräftigere Löhne, lockerere Geldpolitik, Impulse aus dem Haushalt, mehr Schutz am Arbeitsmarkt. Blau steht für konservativ-liberale: Lohnzurückhaltung, straffere Geldpolitik, sparen, mehr Flexibilität. Grau heißt beibehalten. Die politische Zuordnung ist eine eigene Deutung. Gezählt sind nur Jahre, in denen beide eine Empfehlung gaben. Antippen zeigt die Empfehlung mit Fundstelle."}
      - {chart: "gd_themen", toggle: {chart: gd_schwerpunkte, base: Seitenanteile, label: Schwerpunkte, base_en: Page shares, label_en: Focus topics}, rail: "Themen", type: "cellgrid", attach: "gd_themen_grid.json", sources: ["Gemeinschaftsdiagnose der Wirtschaftsforschungsinstitute, Gutachten 1950 bis Frühjahr 2026; eigene Auswertung mit Fundstellen"], licenses: ["Eigene Auswertung der Gutachten der Gemeinschaftsdiagnose; CC BY 4.0"], unit: "% der Seiten", ask: "Worüber schrieben die Institute?", say: ["Die Weltwirtschaft nahm bis in die 1980er Jahre fast ein Drittel der Seiten ein, in den 2020er Jahren 16 %. Wachstum und Potenzial kamen erst in den 2010er Jahren auf über 10 %."], say_en: ["The world economy took up almost a third of the pages until the 1980s, and 16% in the 2020s. Growth and potential only rose above 10% in the 2010s."], caption: "Anteil der Seiten je Thema an allen Seiten der Gutachten eines Jahres, ohne Tabellenanhang; je dunkler, desto mehr Platz. Jeder Abschnitt gehört zu genau einem Thema aus einem festen Katalog. Bis in die 1990er Jahre sind die Gutachten gröber gegliedert, die Anteile deshalb nur eingeschränkt vergleichbar. Antippen zeigt Anteil und Abschnitte. Zwei Prüfer haben jeden Abschnitt unabhängig eingeordnet. Jeder Eintrag ist mit Seite und Abschnitt belegt; alle Fundstellen stehen im Repository unter data/static/gd_themen.csv."}
      - {chart: "gd_schwerpunkte", rail: "Schwerpunktthemen", type: "cellgrid", attach: "gd_schwerpunkte_grid.json", sources: ["Gemeinschaftsdiagnose der Wirtschaftsforschungsinstitute, Gutachten 1950 bis Frühjahr 2026; eigene Auswertung mit Fundstellen"], licenses: ["Eigene Auswertung der Gutachten der Gemeinschaftsdiagnose; CC BY 4.0"], ask: "Welche Schwerpunktthemen griffen die Institute auf?", say: ["Seit 1995 hatten die Gutachten in 26 Jahren ein eigenes Schwerpunktthema; am häufigsten ging es um Wachstum und Potenzial."], say_en: ["Since 1995 the reports had a special topic in 26 years; most often it concerned growth and potential."], caption: "Ein Punkt je Jahr und Thema, wenn ein Gutachten dazu ein eigenes Kapitel oder einen als Schwerpunkt, Fokus oder Exkurs überschriebenen Abschnitt hat; Kästen zählen nicht. Antippen zeigt Titel und Seiten. Jeder Eintrag ist mit Seite und Abschnitt belegt; alle Fundstellen stehen im Repository unter data/static/gd_schwerpunkte.csv."}
      - {chart: "gd_dissens", rail: "Abweichende Voten", type: "cellgrid", attach: "gd_dissens.json", sources: ["Gemeinschaftsdiagnose der Wirtschaftsforschungsinstitute, Gutachten 1950 bis Frühjahr 2026; eigene Auswertung mit Fundstellen"], licenses: ["Eigene Auswertung der Gutachten der Gemeinschaftsdiagnose; CC BY 4.0"], unit: "Anzahl", ask: "Wie oft waren sich die Institute uneins?", say: ["In 44 von 71 Jahren mit Gutachtentext wich mindestens ein Institut von der gemeinsamen Position ab, zusammen an 161 Stellen. Die meisten Voten gab es 2004, nach 2020 keines mehr."], say_en: ["In 44 of 71 years with report text at least one institute departed from the joint position, at 161 points in total. Most dissenting votes came in 2004, none after 2020."], caption: "Zahl der Stellen, an denen einzelne Institute in den Gutachten eines Jahres von der gemeinsamen Position abweichen, je Sachpunkt eine Stelle, zur Prognose wie zur Wirtschaftspolitik. Mitgezählt sind Patt-Fälle, Sondergutachten und Enthaltungen. Antippen zeigt Institute und Thema. Jeder Eintrag ist mit Seite und Abschnitt belegt; alle Fundstellen stehen im Repository unter data/static/gd_voten.csv."}
      - {chart: "gd_ziel", rail: "Prognosen für ein Zieljahr", styles: {"gd_ziel_2023_ist": "half", "gd_ziel_2024_ist": "half", "gd_ziel_2025_ist": "half"}, of: {"gd_ziel_2023_ist": "gd_ziel_2023", "gd_ziel_2024_ist": "gd_ziel_2024", "gd_ziel_2025_ist": "gd_ziel_2025"}, emphasis: "gd_ziel_2026", x_start: "2021-01-01", recessions: false, ref: 0, unit: "% ggü. Vorjahr", ask: "Wie änderten die Institute ihre Prognose für ein bestimmtes Jahr?", title: "Wachstumsprognosen der Gemeinschaftsdiagnose für ein Zieljahr", say: ["Für 2026 erwarteten die Institute vom Herbst 2024 bis zum Herbst 2025 jeweils 1,3 % Wachstum, im Frühjahr 2026 noch 0,6 %. Für 2025 sank die Prognose von 1,5 % im Herbst 2023 auf 0,2 %; so hoch war auch die erste Meldung."], say_en: ["For 2026 the institutes expected growth of 1.3% in each report from autumn 2024 to autumn 2025, and 0.6% in spring 2026. For 2025 the forecast fell from 1.5% in autumn 2023 to 0.2%, the same as the first release."], caption: "Jede Linie zeigt, welches Wachstum des realen Bruttoinlandsprodukts die Gemeinschaftsdiagnose für ein bestimmtes Jahr erwartete, von der ersten Prognose bis zum Herbst dieses Jahres. Jeder Punkt ist ein Gutachten, gesetzt auf sein Abschlussdatum; der offene Kreis ist die erste Meldung im Frühjahrsgutachten des Folgejahres. Gezeigt sind die vier jüngsten Zieljahre, für 2026 steht die erste Meldung noch aus; alle Zieljahre seit 1950 stehen im Datensatz. Jeder Wert ist mit Datei, Seite und Tabelle belegt; alle Fundstellen stehen im Repository unter data/static/gd_prognosen.csv."}
      - {chart: gd_treff, multiples: true, own_scale: true, years: 64, keep_years: true, recessions: false, ref: 0, no_tend: true, rail: "Treffsicherheit", ask: "Wie gut trafen die Prognosen der Institute?", unit: "Abweichung", say: ["Seit 1963 lagen die Institute im Herbst beim Wachstum des Folgejahres im Mittel 1,4 Prozentpunkte neben der ersten Meldung, bei der Inflation 0,8 und beim Staatssaldo 0,9 Prozentpunkte, bei den Arbeitslosen rund 175 000. Am genauesten waren die Wachstumsprognosen in den 2010er Jahren, am ungenauesten von 2020 bis 2025."], say_en: ["Since 1963 the institutes' autumn forecast has missed the first release of next year's growth by 1.4 percentage points on average, of inflation by 0.8 and of the government balance by 0.9 percentage points, and of unemployment by about 175,000 people. Growth forecasts were most accurate in the 2010s and least accurate from 2020 to 2025."], caption: "Jedes Feld zeigt, wie weit die Herbstprognose der Institute für das Folgejahr von der ersten Meldung abwich: über null zu hoch, unter null zu niedrig. Wachstum, Inflation und Staatssaldo in Prozentpunkten, Arbeitslose in Tausend Personen. Die einzelnen Prognosen und Meldungen stehen unter „Downloads“."}
  - id: pruefung
    code: Prognosen
    title: Treffsicherheit
    part: prognosen
    ask: "Wie verlässlich sind die ersten Zahlen und die Projektion?"
    charts:
      - {chart: proj_gap, type: projection, title: "BIP und Projektion der Bundesregierung", ask: "Erreicht das Wachstum die Projektion der Bundesregierung?", caption: "Die Balken zeigen das Wachstum der realen Wirtschaftsleistung (Bruttoinlandsprodukt) gegenüber dem Vorjahresquartal in Prozent, unbereinigt wie die Jahresrate der Projektion der Bundesregierung. Die hellen Balken zeigen, welche Rate die noch fehlenden Quartale des Jahres jeweils erreichen müssten, damit das Jahr die jüngste Projektion trifft (gestrichelte Linie); Revisionen früherer Quartale ändern diese nötige Rate. Der Jahreswert ist die Summe der vier Quartale; gerechnet wird mit dem unbereinigten Volumenindex, nicht mit gerundeten Raten. Liegen alle vier Quartale vor, zeigt die Abbildung bis zum ersten Quartal des Folgejahres das Ergebnis des abgelaufenen Jahres. Ein Schalter stellt auf die saison- und kalenderbereinigte Rate gegenüber dem Vorquartal um: Dann zeigen die hellen Balken die gleiche Rate je fehlendem Quartal, mit der das bereinigte Jahr die kalenderbereinigte Rate der Projektion erreicht. Der Schalter fehlt, wenn die Projektion keine kalenderbereinigte Rate nennt."}
      - {chart: gdp_rev, unit: "Pp", styles: {gdp_rt_first: hover, gdp_rt_latest: hover}, mad_band: true, title: "Korrektur des BIP-Wachstums seit der ersten Meldung", ask: "Wie stark wird das BIP-Wachstum nachträglich korrigiert?", years: 8, keep_years: true, ref: 0, recessions: false, caption: "Die Balken zeigen, um wie viele Prozentpunkte das Wachstum der realen Wirtschaftsleistung (Bruttoinlandsprodukt) gegenüber dem Vorquartal zwischen der ersten Meldung des Statistischen Bundesamts und dem jüngsten Datenstand korrigiert wurde; positiv heißt nach oben korrigiert. Das graue Band zeigt die mittlere Korrektur ohne Vorzeichen über den gezeigten Zeitraum. Erste Meldung und heutigen Stand nennt der Tooltip, beide stehen auch im Download. Grundlage sind die gespeicherten Datenstände der Echtzeitdatenbank der Bundesbank seit 2005. Die erste Meldung eines Quartals beruht auf unvollständigen Angaben; spätere Rechenstände und große Revisionen ändern sie oft um mehrere Zehntel."}
  - id: kalender
    title: Kalender
    part: service
    ask: "Wann erscheinen die nächsten Zahlen?"
