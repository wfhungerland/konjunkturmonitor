# Konjunkturmonitor: Inhalt der Seite.
# Jede Frage bekommt eine Antwort aus den Daten (Satz, Zahl, Vergleich) und eine Erklärung in Alltagssprache.
# Die Zahlen kommen aus series.yaml (Katalog im Format von konjunkturwolf), die Sätze baut monitor/answers.py.

site:
  title: Konjunkturmonitor
  claim: "Wie steht es um die deutsche Wirtschaft? Die wichtigsten Kennzahlen mit kurzer Einordnung, werktäglich aktualisiert aus amtlichen und frei zugänglichen Daten."
  author: "Hungerland, Wolf-Fabian"
  license: "Texte und eigene Abbildungen: CC BY 4.0 (Namensnennung: Wolf-Fabian Hungerland, Konjunkturmonitor). Die Daten unterliegen den Lizenzen der jeweiligen Quellen."
  url: "https://wfhungerland.github.io/konjunkturmonitor/"

# Darstellung nach Tufte. Jeder Schalter lässt sich einzeln mit false zurücknehmen.
layout:
  start_table: true       # Startseite als Kennzahlentabelle mit Wortsparklines (false: acht Fragekarten)
  minimal: true           # ohne Kartenrahmen und Urteilsetiketten; Erläuterungen als Randnotiz
  direct_labels: true     # Beschriftung am Linienende statt Legende (bis vier Linien)
  small_multiples: true   # Abbildungen mit multiples: true als kleine Einzeldiagramme auf gleicher Skala
  compare_band: false     # Spanne 2015 bis 2019 als graues Band in Zeitreihen (true: wieder einblenden)
  uniform_years: 6        # einheitliches Zeitfenster in Jahren für Abbildungen mit 3 bis 8 Jahren (false: wie je Abbildung angegeben)
  lead_chart_only: true   # je Thema eine Leitgrafik, weitere Abbildungen aufklappbar
  overview: true          # Antwort auf die Titelfrage in zwei bis drei Sätzen über der Tabelle
  red_zero_line: false    # Nulllinie rot wie im Grafikstandard (false: dunkelgrau, Rot bleibt Warnsignalen vorbehalten)

# Kennzahlentabelle der Startseite, gruppiert nach den Abschnitten der Seite (topic).
# kind rate: Vergleiche als Differenz; kind level: als prozentuale Veränderung. up_bad: steigender Wert ist ungünstig (rotes ▲).
start_table:
  - {label: "BIP, real", series: de_gdp_index, kind: level, scale: 1, unit: "Index 2020 = 100", mom_from: de_gdp_qoq, yoy_from: de_gdp_yoy, topic: wachstum}
  - {label: "Inflationsrate (VPI)", series: de_cpi_yoy, kind: rate, unit: "% gg. Vorjahresmonat", up_bad: true, topic: preise}
  - {label: "Kernrate (ohne Energie und Nahrungsmittel)", series: de_vpi_core_yoy, kind: rate, unit: "% gg. Vorjahresmonat", up_bad: true, topic: preise}
  - {label: "Erzeugerpreise", series: de_ppi_yoy, kind: rate, unit: "% gg. Vorjahresmonat", up_bad: true, topic: preise}
  - {label: "Arbeitslosenquote", series: de_alq_sa, kind: rate, unit: "%", up_bad: true, topic: arbeit}
  - {label: "Erwerbstätige", series: de_emp_m, kind: level, scale: 0.001, decimals: 2, unit: "Mio.", change: diff, change_unit: "Tsd.", change_decimals: 0, topic: arbeit}
  - {label: "Gemeldete offene Stellen", series: de_vac_sa, kind: level, decimals: 0, unit: "Tsd.", topic: arbeit}
  - {label: "Rezessionssignal (Schwelle 0,25)", series: de_sahm, kind: rate, unit: "Pp", decimals: 2, change_decimals: 2, up_bad: true, topic: arbeit}
  - {label: "Produktion der Industrie", series: de_ip, kind: level, unit: "Index 2021 = 100", topic: industrie}
  - {label: "Auftragseingang der Industrie", series: de_orders, kind: level, unit: "Index 2021 = 100", topic: industrie}
  - {label: "Produktion im Baugewerbe", series: de_bau_prod, kind: level, unit: "Index 2021 = 100", topic: bau}
  - {label: "Einzelhandelsumsatz, real", series: de_retail, kind: level, unit: "Index 2021 = 100", topic: konsum}
  - {label: "Verbrauchervertrauen", series: de_consumer_conf, kind: rate, unit: "Saldo", topic: konsum}
  - {label: "Warenexporte, nominal", series: de_exports, kind: level, unit: "Mrd. €", topic: export}
  - {label: "Wirtschaftsklima (ESI)", series: de_esi, kind: rate, unit: "Punkte", topic: stimmung}
  - {label: "Unternehmensinsolvenzen", series: de_insolv, kind: level, decimals: 0, unit: "Anträge", seasonal: true, up_bad: true, topic: insolvenzen}
  - {label: "Rendite Bundesanleihen, 10 Jahre", series: de_bund10, kind: rate, unit: "%", decimals: 2, change_decimals: 2, topic: zinsen}
  - {label: "Rohöl Brent", series: w_brent, kind: level, unit: "US-$ je Barrel", decimals: 0, topic: energie}

questions:
  - id: wachstum
    ask: "Wächst die Wirtschaft?"
    kind: growth
    series: de_gdp_qoq
    yoy: de_gdp_yoy
    explain: "Das Bruttoinlandsprodukt (BIP) ist der Wert aller Waren und Dienstleistungen, die in Deutschland hergestellt werden. Steigt es, wird mehr produziert und mehr Einkommen erzielt."
    topic: wachstum

  - id: preise
    ask: "Steigen die Preise?"
    kind: inflation
    series: de_cpi_yoy
    index: de_vpi
    core: de_vpi_core_yoy
    parts: {Energie: de_vpi_energy_yoy, Nahrungsmittel: de_vpi_food_yoy, "Waren ohne Energie": de_vpi_goods_yoy, "Dienstleistungen ohne Mieten": de_vpi_serv_yoy, Wohnungsmiete: de_vpi_rent_yoy}
    explain: "Die Inflationsrate gibt an, um wie viel Prozent die Preise eines typischen Warenkorbs höher sind als ein Jahr zuvor. Gemessen wird sie mit dem Verbraucherpreisindex (VPI) des Statistischen Bundesamts. Die Europäische Zentralbank strebt mittelfristig 2 % an."
    topic: preise

  - id: arbeit
    ask: "Wie entwickelt sich der Arbeitsmarkt?"
    kind: unemployment
    series: de_alq_sa
    level: de_alo_sa
    explain: "Die Arbeitslosenquote ist der Anteil der bei der Bundesagentur für Arbeit gemeldeten Arbeitslosen an allen zivilen Erwerbspersonen."
    topic: arbeit

  - id: industrie
    ask: "Wie entwickelt sich die Industrie?"
    kind: index_mom
    series: de_ip
    orders: de_orders
    explain: "Die Produktion misst, wie viel die Industrie herstellt. Der Auftragseingang misst neue Bestellungen; er läuft der Produktion einige Monate voraus."
    topic: industrie

  - id: konsum
    ask: "Wie entwickelt sich der private Konsum?"
    kind: index_mom
    series: de_retail
    mood: de_consumer_conf
    explain: "Der preisbereinigte Einzelhandelsumsatz misst, wie viel die Geschäfte verkaufen. Das Verbrauchervertrauen beruht auf einer Befragung der Haushalte zu ihrer finanziellen Lage und ihren Erwartungen."
    topic: konsum

  - id: export
    ask: "Wie entwickeln sich die Exporte?"
    kind: level_mom
    series: de_exports
    explain: "Exporte sind ins Ausland verkaufte Waren. Die Exporte von Waren und Dienstleistungen entsprechen in Deutschland fast der Hälfte des Bruttoinlandsprodukts."
    topic: export

  - id: stimmung
    ask: "Wie schätzen Unternehmen und Haushalte die Lage ein?"
    kind: sentiment
    series: de_esi
    explain: "Jeden Monat fragt die EU-Kommission Unternehmen und Haushalte nach ihrer Lage und ihren Erwartungen. Der Wirtschaftsklimaindikator ist so normiert, dass 100 dem langjährigen Durchschnitt entspricht; höhere Werte zeigen eine überdurchschnittliche Stimmung."
    topic: stimmung

  - id: insolvenzen
    ask: "Wie viele Unternehmen beantragen Insolvenz?"
    kind: insolvency
    series: de_insolv
    employees: de_insolv_emp
    claims: de_insolv_claims
    explain: "Ein Insolvenzverfahren wird beantragt, wenn ein Unternehmen zahlungsunfähig oder überschuldet ist. Da die Zahl der Anträge im Jahresverlauf schwankt, vergleicht der Monitor mit demselben Monat früherer Jahre."
    topic: insolvenzen

  - id: zinsen
    ask: "Wie entwickeln sich die Zinsen?"
    kind: level
    series: de_bund10
    name: "die Rendite zehnjähriger Bundesanleihen"
    unit: "%"
    decimals: 2
    explain: "Die Rendite von Bundesanleihen ist der Zins, den der Bund für neue Kredite am Kapitalmarkt zahlt. Sie dient als Richtwert für langfristige Kredite an Unternehmen und für Baufinanzierungen."
    topic: zinsen

  - id: energie
    ask: "Wie entwickeln sich die Energiepreise?"
    kind: level
    series: w_brent
    name: "der Preis für Rohöl der Sorte Brent"
    unit: "US-Dollar je Barrel"
    decimals: 1
    also: [{series: w_gas_eu, label: "Erdgas in Europa (TTF)", unit: "US-Dollar je MMBtu", decimals: 1}]
    explain: "Öl- und Gaspreise wirken schnell auf die Verbraucherpreise für Kraftstoffe und Heizung und mit Verzögerung auf die Kosten der Industrie. Die Preise werden in US-Dollar gehandelt; ein schwächerer Euro verteuert sie in Euro gerechnet."
    topic: energie

# Themen: je Frage ein Abschnitt mit Abbildungen. type: line (Standard), bars, stacked, clock, forecast, threshold.
topics:
  - id: wachstum
    title: Wachstum
    charts:
      - {chart: gdp_contrib, type: stacked, total: de_gdp_qoq, years: 4, caption: "Balken: Beiträge der Verwendungskomponenten zum Wachstum in Prozentpunkten. Linie: Wachstum insgesamt. Importe gehen mit negativem Vorzeichen ein, da sie im Ausland erzeugt werden."}
      - {chart: wai, years: 3, ref: 0, caption: "Der Aktivitätsindex der Bundesbank schätzt aus wöchentlichen Daten (etwa Lkw-Maut, Stromverbrauch, Suchanfragen), wie stark die Wirtschaftsleistung in den letzten 13 Wochen gegenüber den 13 Wochen davor gewachsen ist. Er liegt früher vor als das BIP, ist aber eine Schätzung."}
      - {chart: maut, years: 6, ma3: true, caption: "Fahrleistung mautpflichtiger Lkw ab vier Achsen auf Autobahnen, ermittelt aus den Mautdaten. Der Index liegt wenige Tage nach Monatsende vor und folgt eng der Industrieproduktion, weil diese Lkw vor allem Vorleistungen und Waren transportieren. Gleitendes Dreimonatsmittel."}
      - {chart: gdp_level, years: 12, caption: "Wirtschaftsleistung, preisbereinigt, 2020 = 100. Der Einbruch 2020 geht auf die Corona-Pandemie zurück."}
      - {chart: gdp_use, type: latest, years: 2, caption: "Balken: Veränderung im letzten Quartal, preisbereinigt. Raute: das Quartal davor. Investitionen aufgeteilt in Ausrüstungen (Maschinen, Fahrzeuge, Waffensysteme), Bauten und sonstige Anlagen (vor allem Software und Forschung)."}
  - id: preise
    title: Preise
    charts:
      - {chart: cpi, multiples: true, up_bad: true, years: 6, emphasis: de_cpi_yoy, ref: 2, caption: "Verbraucherpreisindex (VPI) des Statistischen Bundesamts. Dicke Linie: Inflationsrate insgesamt. Dünne Linien: Teuerung einzelner Bereiche. Gestrichelt: 2 %, das Ziel der EZB (es bezieht sich auf den europäischen HVPI, der in Deutschland meist nahe am VPI liegt). „Dienstleistungen ohne Mieten“ schließt tatsächliche und unterstellte Wohnungsmieten aus und weicht deshalb von der Rate für Dienstleistungen insgesamt ab, die das Statistische Bundesamt meldet."}
      - {chart: cpi_contrib, type: contrib, total: de_vpi, years: 3, parts: {Energie: de_vpi_energy, Nahrungsmittel: de_vpi_food, "Waren ohne Energie": de_vpi_goods, "Dienstleistungen und Miete": [de_vpi_serv, de_vpi_rent]}, caption: "Anteil der Bereiche an der Inflationsrate in Prozentpunkten; umschaltbar zwischen Vorjahres- und Vormonatsvergleich. Eigene Berechnung: Gewichte der Bereiche aus den VPI-Teilindizes seit 2020 geschätzt; Rest gleicht Rundung und nicht getrennt erfasste Teile aus."}
      - {chart: cpi_core, years: 6, up_bad: true, emphasis: de_vpi_core_yoy, ref: 2, caption: "Die Kernrate klammert die stark schwankenden Preise für Energie und Nahrungsmittel aus und zeigt den zugrunde liegenden Preistrend. Der HVPI ist die europäische Messung, auf die sich das Ziel der EZB bezieht."}
      - {chart: deflator, years: 8, caption: "Deflatoren der Volkswirtschaftlichen Gesamtrechnungen: Preisentwicklung aller im Inland erzeugten Güter (BIP-Deflator) und des privaten Konsums."}
      - {chart: pipeline_prices, years: 6, up_bad: true, caption: "Preise auf vorgelagerten Stufen: Erzeugerpreise im Inlandsabsatz und Einfuhrpreise. Sie laufen den Verbraucherpreisen häufig voraus."}
      - {chart: pipeline_core, years: 6, caption: "Vorstufenpreise ohne Energie zeigen, ob sich Kostensteigerungen über Energie hinaus ausbreiten. Agrarpreise wirken mit Verzögerung auf die Nahrungsmittelpreise."}
      - {chart: price_exp, multiples: true, up_bad: true, years: 6, caption: "Saldo aus Anteilen der Befragten, die steigende beziehungsweise sinkende Preise erwarten (EU-Umfragen). Unternehmen: nächste drei Monate; Verbraucher: nächste zwölf Monate."}
  - id: arbeit
    title: Arbeit
    charts:
      - {chart: labour, years: 12}
      - {chart: labour_flows, years: 12, caption: "Steigt die Arbeitslosigkeit, während die Zahl offener Stellen sinkt, deutet dies auf eine Abkühlung des Arbeitsmarkts hin."}
      - {chart: employment_m, years: 6, caption: "Erwerbstätige umfassen auch Selbständige und Beamte; sozialversicherungspflichtig Beschäftigte sind der größte Teil davon."}
      - {chart: sahm, years: 20, type: threshold, threshold: 0.25, caption: "Eigene Berechnung nach Michaillat und Saez (2025). Das Signal ist der kleinere von zwei Werten. Erstens: Arbeitslosenquote einschließlich Kurzarbeit (in Vollzeitäquivalenten), gleitendes Dreimonatsmittel, minus ihr Tief der letzten zwölf Monate. Zweitens: Hoch der Quote offener Stellen in den letzten zwölf Monaten minus ihr aktuelles Dreimonatsmittel. Das Signal steigt also nur, wenn die Arbeitslosigkeit zunimmt und zugleich die offenen Stellen abnehmen. Die Schwelle von 0,25 Prozentpunkten ist eigene Wahl für Deutschland; Michaillat und Saez nennen für die USA 0,29. Graue Flächen: Rezessionen nach der Datierung des Sachverständigenrats. Jede Rezession seit 2001 überschritt die Schwelle, teils mit erheblicher Verzögerung. Literatur: Michaillat, P. und Saez, E. (2025), Has the Recession Started?, Oxford Bulletin of Economics and Statistics; Sahm, C. (2019), Direct Stimulus Payments to Individuals, Brookings Institution."}
      - {chart: kurzarbeit, years: 12, scale: 0.001, unit: "Tsd. Personen", decimals: 0, caption: "Beschäftigte in Kurzarbeit aus wirtschaftlichen Gründen (§ 96 SGB III), in Tausend. Kurzarbeit hält Beschäftigte im Betrieb, wenn Aufträge vorübergehend fehlen; sie steigt in Abschwüngen früher als die Arbeitslosigkeit. Die jüngsten Monate beruhen auf Hochrechnungen der Bundesagentur für Arbeit."}
      - {chart: sv_yoy, years: 6, caption: "Sozialversicherungspflichtig Beschäftigte nach Bereichen, Veränderung gegenüber dem Vorjahresmonat. Leiharbeit reagiert als Erstes auf eine schwächere Nachfrage, weil Betriebe zuerst ausgeliehene Kräfte abbauen."}
  - id: industrie
    title: Industrie
    charts:
      - {chart: industry, years: 6, ma3: true, caption: "Dünn: Monatswerte. Dick: gleitendes Dreimonatsmittel. Der Auftragseingang läuft der Produktion voraus."}
      - {chart: orders_split, years: 6, ma3: true, caption: "Auftragseingang nach Herkunft, gleitendes Dreimonatsmittel. Großaufträge, etwa für Flugzeuge, Schiffe oder Rüstungsgüter, führen zu einzelnen starken Ausschlägen."}
      - {chart: orders_euro, years: 6, ma3: true, caption: "Aufträge aus dem Ausland, getrennt nach Euroraum und übriger Welt, gleitendes Dreimonatsmittel."}
      - {chart: branch_heat, type: heat, months: 12, caption: "Produktion je Branche gegenüber dem Vorjahresmonat; violett: Zunahme, blau: Abnahme. Sortiert nach dem Dreimonatsvergleich (letzte drei Monate gegenüber den drei Monaten davor). Rechts: Niveau gegenüber dem Durchschnitt 2019."}
      - {chart: orders_heat, type: heat, months: 12, caption: "Auftragseingang je Branche gegenüber dem Vorjahresmonat, preisbereinigt; violett: Zunahme, blau: Abnahme. Sortiert nach dem Dreimonatsvergleich. Rechts: Niveau gegenüber dem Durchschnitt 2019. Großaufträge, vor allem im sonstigen Fahrzeugbau, verzerren einzelne Monate."}
      - {chart: prod_groups, years: 6, ma3: true, caption: "Vorleistungsgüter werden weiterverarbeitet (etwa Stahl, Chemie), Investitionsgüter sind vor allem Maschinen und Fahrzeuge, Konsumgüter werden von privaten Haushalten gekauft. Gleitendes Dreimonatsmittel."}
      - {chart: sales, years: 6, ma3: true, caption: "Umsatz der Industrie in jeweiligen Preisen, also nicht preisbereinigt. Gleitendes Dreimonatsmittel."}
  - id: bau
    title: Bau
    ask: "Wie entwickelt sich der Bau?"
    charts:
      - {chart: bau_orders, years: 6, ma3: true, caption: "Aufträge im Bauhauptgewerbe, preisbereinigt. Einzelne Großprojekte führen zu starken Ausschlägen; dick: gleitendes Dreimonatsmittel."}
      - {chart: bau_prod, years: 6, ma3: true, caption: "Bauproduktion. Das Ausbaugewerbe umfasst Installation, Elektrik und Innenausbau. Gleitendes Dreimonatsmittel."}
  - id: dienstleistungen
    title: Dienstleistungen
    ask: "Wie entwickeln sich die Dienstleister?"
    charts:
      - {chart: services, years: 6, ma3: true, caption: "Preisbereinigte Produktion ausgewählter Dienstleistungsbereiche: Verkehr und Lagerei, Gastgewerbe, Information und Kommunikation, Grundstücks- und Wohnungswesen, freiberufliche und technische sowie sonstige Unternehmensdienste. Handel, Finanzen und Staat sind nicht enthalten. Dienstleister erzeugen gut zwei Drittel der Wertschöpfung, werden aber monatlich nur lückenhaft erfasst. Gleitendes Dreimonatsmittel."}
  - id: konsum
    title: Konsum
    charts:
      - {chart: retail, years: 6, ma3: true}
      - {chart: retail_split, years: 6, ma3: true, caption: "Umsatz nach Sortimenten, preisbereinigt, gleitendes Dreimonatsmittel."}
      - {chart: hospitality, years: 6, ma3: true, caption: "Umsatz von Restaurants und Hotels, preisbereinigt, gleitendes Dreimonatsmittel."}
      - {chart: cars, years: 6, ma3: true, caption: "Neu zugelassene Pkw privater Halter in Tausend je Monat, gleitendes Dreimonatsmittel. Ein Indikator für die Bereitschaft der Haushalte zu größeren Anschaffungen."}
      - {chart: consumer, years: 12, caption: "Saldo aus positiven und negativen Antworten der Haushalte. Werte unter null bedeuten, dass negative Einschätzungen überwiegen."}
  - id: einkommen
    title: Einkommen
    ask: "Wie entwickeln sich Einkommen und Verteilung?"
    charts:
      - {chart: hh_income, years: 12, caption: "Verfügbares Einkommen der privaten Haushalte je Einwohner, also Löhne, Gewinne, Vermögenseinkommen und Sozialleistungen nach Steuern und Abgaben, bereinigt um die Preisentwicklung des Konsums. 2010 = 100."}
      - {chart: saving, years: 12, caption: "Anteil des verfügbaren Einkommens, den die Haushalte nicht für Konsum ausgeben. Eine steigende Sparquote dämpft den Konsum, oft aus Vorsicht in unsicheren Zeiten."}
      - {chart: profit_share, years: 12, caption: "Bruttobetriebsüberschuss der nichtfinanziellen Unternehmen in Prozent ihrer Wertschöpfung. Steigt die Gewinnquote, entfällt ein größerer Teil der Wertschöpfung auf Gewinne und ein kleinerer auf Löhne."}
  - id: export
    title: Export
    charts:
      - {chart: trade, years: 6, ma3: true, caption: "Warenexporte und -importe in Milliarden Euro je Monat, gleitendes Dreimonatsmittel."}
      - {chart: trade_region, years: 6, ma3: true, caption: "Die wichtigsten Kundenregionen, gleitendes Dreimonatsmittel."}
      - {chart: trade_prices, years: 6, caption: "Terms of Trade: Ausfuhrpreise im Verhältnis zu den Einfuhrpreisen. Steigen sie, kann Deutschland mit derselben Exportmenge mehr Importe finanzieren."}
      - {chart: balances, years: 6, caption: "Saldo der Leistungsbilanz (Waren, Dienstleistungen, Primär- und Sekundäreinkommen) je Monat, nicht saisonbereinigt."}
      - {chart: esi, emphasis: esi_chn, caption: "Ähnlichkeit der Warenstruktur der Exporte eines Landes mit derjenigen Deutschlands: 0 bedeutet keine Überschneidung, 100 eine identische Struktur (Finger und Kreinin 1979, je Warengruppe zählt der kleinere Anteil). Hohe Werte bedeuten, dass beide Länder auf den Weltmärkten mit ähnlichen Waren konkurrieren. Hervorgehoben: China."}
  - id: welt
    title: Welt
    ask: "Wie entwickelt sich die Weltwirtschaft?"
    charts:
      - {chart: world_gdp, years: 8, ref: 0, caption: "Reales BIP gegenüber dem Vorjahresquartal. Der Euroraum nimmt rund 37 % der deutschen Warenexporte auf, die USA rund 10 %."}
      - {chart: uncertainty, years: 8, caption: "Index der wirtschaftspolitischen Unsicherheit nach Baker, Bloom und Davis, ermittelt aus der Häufigkeit einschlägiger Begriffe in Zeitungsartikeln; Mittel 1997 bis 2015 = 100. Hohe Unsicherheit lässt Unternehmen Investitionen aufschieben."}
  - id: stimmung
    title: Stimmung
    charts:
      - {chart: clock, type: clock, x: de_ind_orderbooks, y: de_ind_prodexp, months: 24, caption: "Waagerecht: Wie bewerten Industrieunternehmen ihre Aufträge heute? Senkrecht: Was erwarten sie für die nächsten drei Monate? Beides als Abstand zum Durchschnitt 2005 bis 2019. Im typischen Konjunkturzyklus bewegt sich der Punkt im Uhrzeigersinn durch die vier Phasen des Konjunkturzyklus."}
      - {chart: sentiment, years: 6, caption: "Saldo aus positiven und negativen Antworten je Bereich (EU-Umfragen)."}
      - {chart: sector_now, multiples: true, years: 6, caption: "Einschätzung der Geschäftsentwicklung der vergangenen drei Monate, Saldo aus positiven und negativen Antworten (EU-Umfragen)."}
      - {chart: sector_next, multiples: true, years: 6, caption: "Erwartungen für die kommenden drei Monate. Im Bau erfasst die Umfrage hierzu die Beschäftigungspläne."}
      - {chart: capacity, years: 12, caption: "Auslastung der Produktionskapazitäten in der Industrie in Prozent, vierteljährliche Umfrage."}
  - id: insolvenzen
    title: Insolvenzen
    charts:
      - {chart: insolv, type: seasonal, series: de_insolv, years: 11, caption: "Dünn: Monatswerte. Dick: gleitendes Zwölfmonatsmittel, das saisonale Schwankungen ausgleicht. Gestrichelt: Vorkrisenniveau, gemessen als Durchschnitt desselben Monats 2016 bis 2019."}
      - {chart: insolv_land, type: tiles, prefix: de_insolv_land_, caption: "Veränderung gegenüber demselben Zeitraum ein Jahr zuvor; umschaltbar zwischen 12 und 6 Monaten. Violett: Zunahme, blau: Abnahme."}
      - {chart: insolv_emp, type: seasonal, series: de_insolv_emp, years: 11, caption: "Beschäftigte in Unternehmen, die Insolvenz beantragt haben. Einzelne Großinsolvenzen führen zu starken Ausschlägen; dick: gleitendes Zwölfmonatsmittel."}
      - {chart: insolv_claims, type: seasonal, series: de_insolv_claims, years: 11, caption: "Voraussichtliche Forderungen der Gläubiger in Milliarden Euro; dick: gleitendes Zwölfmonatsmittel."}
      - {chart: gruend_land, type: tiles, prefix: de_gruend_land_, caption: "Gründungen von Betrieben mit größerer wirtschaftlicher Bedeutung (Hauptniederlassung), gegenüber demselben Zeitraum ein Jahr zuvor. Violett: Zunahme, blau: Abnahme."}
