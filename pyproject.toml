[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "konjunkturmonitor"
version = "0.1.0"
description = "Konjunkturmonitor: Deutschlands Wirtschaft auf einen Blick, aus amtlichen und offenen Daten"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # Datenabruf, Katalog und Pipeline teilt der Monitor mit konjunkturwolf
  "konjunkturwolf @ git+https://github.com/wfhungerland/konjunkturwolf@main",
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
konjunkturmonitor = "monitor.cli:main"

[tool.setuptools]
packages = ["monitor"]

[tool.setuptools.package-data]
monitor = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
