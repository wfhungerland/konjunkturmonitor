[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "konjunkturmonitor"
version = "0.1.0"
description = "Konjunkturmonitor: Deutschlands Wirtschaft auf einen Blick, aus amtlichen und offenen Daten"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  # Datenabruf, Katalog und Pipeline teilt der Monitor mit konjunkturwolf
  "konjunkturwolf @ git+https://github.com/wfhungerland/konjunkturwolf@28c293191f133912e5b32b4f796cdc5d938775cb",  # fester Stand; Aktualisierung über .github/workflows/pipeline-stand.yml
  "pandas>=2.0",
  "PyYAML>=6.0",
  "python-pptx>=1.0",
  "XlsxWriter>=3.1",
  "pyreadr>=0.5",  # geprüfte Pegeldaten der BfG (RDS)
  "openpyxl>=3.1",  # täglicher Lkw-Maut-Index (Excel von Destatis)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
konjunkturmonitor = "monitor.cli:main"

[tool.setuptools]
packages = ["monitor"]

[tool.setuptools.package-data]
monitor = ["templates/*.html", "static/fonts/*", "static/plotly/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
