series:
  # --- Wachstum ------------------------------------------------------------
  - id: de_gdp_qoq
    block: wachstum
    source: eurostat
    key: namq_10_gdp
    params: {geo: DE, na_item: B1GQ, unit: CLV_PCH_PRE, s_adj: SCA}
    title: BIP real, % ggü. Vorquartal
    unit: "% ggü. Vorquartal"
    frequency: Q
    adjustment: preis-, saison- und kalenderbereinigt
    chart: gdp_qoq
    label: BIP
    style: bar

  - id: de_gdp_yoy
    block: wachstum
    source: eurostat
    key: namq_10_gdp
    params: {geo: DE, na_item: B1GQ, unit: CLV_PCH_SM, s_adj: NSA}
    title: BIP real, % ggü. Vorjahresquartal (Ursprungswerte wie in der Destatis-Meldung)
    unit: "% ggü. Vorjahresquartal"
    frequency: Q
    adjustment: preisbereinigt, nicht saison- und kalenderbereinigt

  - id: de_gdp_index
    block: wachstum
    source: eurostat
    key: namq_10_gdp
    params: {geo: DE, na_item: B1GQ, unit: CLV_I20, s_adj: SCA}
    title: BIP real, Index 2020 = 100
    unit: Index 2020=100
    frequency: Q
    adjustment: preis-, saison- und kalenderbereinigt
    chart: gdp_level
    label: BIP

  - id: de_gdp_contrib
    expand: {item: [P31_S14_S15, P3_S13, P51G, P52_P53, P6, P7]}
    block: wachstum
    source: eurostat
    key: namq_10_gdp
    params: {geo: DE, na_item: "{item}", unit: CON_PPCH_PRE, s_adj: SCA}
    title: Wachstumsbeitrag {item_name}
    unit: Pp ggü. Vorquartal
    frequency: Q
    adjustment: preis-, saison- und kalenderbereinigt
    chart: gdp_contrib
    label: "{item_name}"
    style: bar
    note: Beitrag zur Veränderung des realen BIP gegenüber dem Vorquartal in Prozentpunkten (Eurostat). Wegen der Verkettung weicht die Summe leicht von der BIP-Rate ab.

  # --- Preise --------------------------------------------------------------
  - id: de_cpi_yoy
    block: preise
    source: bundesbank
    key: BBDP1/M.DE.N.VPI.C.A00000.VGJ.LV
    title: Verbraucherpreise (VPI), % ggü. Vorjahresmonat
    unit: "% ggü. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    chart: cpi
    label: Insgesamt

  - id: de_vpi_food
    block: preise
    source: bundesbank
    key: BBDP1/M.DE.N.VPI.C.C2C011.I20.A
    title: VPI Nahrungsmittel, Index
    unit: Index 2020=100
    frequency: M
    adjustment: nicht bereinigt
    start: "1991-01-01"

  - id: de_vpi_food_yoy
    block: preise
    source: derived
    derive: {from: de_vpi_food, op: yoy_pct}
    title: VPI Nahrungsmittel, % ggü. Vorjahresmonat
    unit: "% ggü. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    chart: cpi
    label: Nahrungsmittel

  - id: de_vpi_energy
    block: preise
    source: bundesbank
    key: BBDP1/M.DE.N.VPI.C.NRGY00.I20.A
    title: VPI Energie (Haushaltsenergie und Kraftstoffe), Index
    unit: Index 2020=100
    frequency: M
    adjustment: nicht bereinigt

  - id: de_vpi_energy_yoy
    block: preise
    source: derived
    derive: {from: de_vpi_energy, op: yoy_pct}
    title: VPI Energie (Haushaltsenergie und Kraftstoffe), % ggü. Vorjahresmonat
    unit: "% ggü. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    chart: cpi
    label: Energie

  - id: de_vpi_goods
    block: preise
    source: bundesbank
    key: BBDP1/M.DE.N.VPI.C.GOODS0MFXE.I20.A
    title: VPI Gewerbliche Waren ohne Energie, Index
    unit: Index 2020=100
    frequency: M
    adjustment: nicht bereinigt

  - id: de_vpi_goods_yoy
    block: preise
    source: derived
    derive: {from: de_vpi_goods, op: yoy_pct}
    title: VPI Gewerbliche Waren ohne Energie, % ggü. Vorjahresmonat
    unit: "% ggü. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    chart: cpi
    label: Waren ohne Energie

  - id: de_vpi_serv
    block: preise
    source: bundesbank
    key: BBDP1/M.DE.N.VPI.C.SVXR.I20.A
    title: VPI Dienstleistungen ohne tatsächliche und unterstellte Wohnungsmieten, Index
    unit: Index 2020=100
    frequency: M
    adjustment: nicht bereinigt

  - id: de_vpi_serv_yoy
    block: preise
    source: derived
    derive: {from: de_vpi_serv, op: yoy_pct}
    title: VPI Dienstleistungen ohne tatsächliche und unterstellte Wohnungsmieten, % ggü. Vorjahresmonat
    unit: "% ggü. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    chart: cpi
    label: Dienstleistungen ohne Mieten

  - id: de_vpi_rent
    block: preise
    source: bundesbank
    key: BBDP1/M.DE.N.VPI.C.C2C041.I20.A
    title: VPI Tatsächliche Wohnungsmiete (Nettokaltmiete), Index
    unit: Index 2020=100
    frequency: M
    adjustment: nicht bereinigt

  - id: de_vpi_rent_yoy
    block: preise
    source: derived
    derive: {from: de_vpi_rent, op: yoy_pct}
    title: VPI Tatsächliche Wohnungsmiete (Nettokaltmiete), % ggü. Vorjahresmonat
    unit: "% ggü. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    chart: cpi
    label: Wohnungsmiete

  - id: de_ppi
    block: preise
    source: eurostat
    key: sts_inppd_m
    params: {geo: DE, indic_bt: PRC_PRR_DOM, nace_r2: B-E36, s_adj: NSA, unit: I21}
    title: Erzeugerpreise gewerblicher Produkte (Inlandsabsatz), Index
    unit: Index 2021=100
    frequency: M
    adjustment: nicht bereinigt

  - id: de_ppi_yoy
    block: preise
    source: derived
    derive: {from: de_ppi, op: yoy_pct}
    title: Erzeugerpreise, % ggü. Vorjahresmonat
    unit: "% ggü. Vorjahresmonat"
    frequency: M
    adjustment: nicht bereinigt
    chart: pipeline_prices
    label: Erzeugerpreise

  - id: de_import_prices
    block: preise
    source: bundesbank
    key: BBDP1/M.DE.Y.APE1.G.GP19SA000000.I21.A
    title: Einfuhrpreise, Index
    unit: Index 2021=100
    frequency: M
    adjustment: saison- und kalenderbereinigt (Bundesbank)

  - id: de_import_prices_yoy
    block: preise
    source: derived
    derive: {from: de_import_prices, op: yoy_pct}
    title: Einfuhrpreise, % ggü. Vorjahresmonat
    unit: "% ggü. Vorjahresmonat"
    frequency: M
    adjustment: saison- und kalenderbereinigt (Bundesbank)
    chart: pipeline_prices
    label: Einfuhrpreise

  # --- Arbeit --------------------------------------------------------------
  - id: de_alq_sa
    block: arbeit
    source: bundesbank
    key: BBDL1/M.DE.Y.UNE.UBA000.A0000.A01.D00.0.R00.A
    title: Arbeitslosenquote (BA, registriert)
    unit: "% der zivilen Erwerbspersonen"
    frequency: M
    adjustment: saison- und kalenderbereinigt (Bundesbank)
    start: "1991-01-01"
    chart: labour
    label: Arbeitslosenquote

  - id: de_alo_sa
    block: arbeit
    source: bundesbank
    key: BBDL1/M.DE.Y.UNE.UBA000.A0000.A01.D00.0.ABA.A
    title: Registrierte Arbeitslose (BA)
    unit: Tsd. Personen
    frequency: M
    adjustment: saison- und kalenderbereinigt (Bundesbank)
    start: "1991-01-01"
    chart: labour_flows
    label: Arbeitslose

  - id: de_vac_sa
    block: arbeit
    source: bundesbank
    key: BBDL1/M.DE.Y.VAC.VBA000.A0000.A00.D00.0.ABA.A
    title: Gemeldete Arbeitsstellen (BA)
    unit: Tsd. Personen
    frequency: M
    adjustment: saison- und kalenderbereinigt (Bundesbank)
    start: "1991-01-01"
    chart: labour_flows
    label: Offene Stellen (gemeldet)

  - id: de_ka_sa
    block: arbeit
    source: bundesbank
    key: BBDL1/M.DE.Y.LMP.LKA100.A0000.A02.D00.0.ABA.A
    title: Kurzarbeiter, konjunkturell (§ 96 SGB III)
    unit: Personen
    frequency: M
    adjustment: saison- und kalenderbereinigt (Bundesbank)
    start: "1991-01-01"
    note: Personen, nicht Vollzeitäquivalente; jüngste Monate vorläufig.
    chart: kurzarbeit
    label: "Kurzarbeiter"

  - id: de_ka_fte_ratio
    block: arbeit
    source: static
    key: ba_ka_fte_ratio
    title: Arbeitsausfall je Kurzarbeiter (Anteil der Arbeitszeit)
    unit: Anteil
    frequency: M
    adjustment: nicht bereinigt
    start: "1991-01-01"
    stale_after_months: 24
    note: Aus der BA-Statistik der realisierten Kurzarbeit, gewichtet mit den Klassenmitten der Ausfallklassen.

  - id: de_sahm
    block: arbeit
    source: derived
    derive: {from: de_alq_sa, op: sahm, part: min, with: {level: de_alo_sa, vac: de_vac_sa, ka: de_ka_sa, ka_ratio: de_ka_fte_ratio}}
    title: Rezessionssignal (Michaillat und Saez, mit Kurzarbeit)
    unit: Pp
    frequency: M
    adjustment: saison- und kalenderbereinigt
    chart: sahm
    label: Rezessionssignal

  - id: de_employment
    block: arbeit
    source: eurostat
    key: namq_10_pe
    params: {geo: DE, na_item: EMP_DC, unit: THS_PER, s_adj: SCA}
    title: Erwerbstätige (Inland)
    unit: Tsd. Personen
    frequency: Q
    adjustment: saison- und kalenderbereinigt
    chart: employment
    label: Erwerbstätige

  # --- Industrie -----------------------------------------------------------
  - id: de_ip
    block: industrie
    source: bundesbank
    key: BBDE1/M.DE.Y.BAA1.A2P300000.G.C.I21.A
    title: Produktion der Industrie
    unit: Index 2021=100
    frequency: M
    adjustment: saison- und kalenderbereinigt (Bundesbank)
    chart: industry
    label: Produktion

  - id: de_orders
    block: industrie
    source: bundesbank
    key: BBDE1/M.DE.Y.AEA1.A2P300000.F.C.I21.A
    title: Auftragseingang der Industrie, real
    unit: Index 2021=100
    frequency: M
    adjustment: saison- und kalenderbereinigt (Bundesbank)
    chart: industry
    label: Aufträge

  - id: de_orders_dom
    block: industrie
    source: bundesbank
    key: BBDE1/M.DE.Y.AEB1.A2P300000.F.C.I21.A
    title: Auftragseingang der Industrie aus dem Inland, real
    unit: Index 2021=100
    frequency: M
    adjustment: saison- und kalenderbereinigt (Bundesbank)
    chart: orders_split
    label: Inland

  - id: de_orders_for
    block: industrie
    source: bundesbank
    key: BBDE1/M.DE.Y.AEB5.A2P300000.F.C.I21.A
    title: Auftragseingang der Industrie aus dem Ausland, real
    unit: Index 2021=100
    frequency: M
    adjustment: saison- und kalenderbereinigt (Bundesbank)
    chart: orders_split
    label: Ausland

  # --- Konsum --------------------------------------------------------------
  - id: de_retail
    block: konsum
    source: bundesbank
    key: BBDE1/M.DE.Y.GUA1.N2G470000.A.C.I21.A
    title: Umsatz im Einzelhandel (ohne Kfz), real
    unit: Index 2021=100
    frequency: M
    adjustment: saison- und kalenderbereinigt (Bundesbank)
    chart: retail
