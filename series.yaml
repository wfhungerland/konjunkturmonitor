    stale_after_months: 60
    license: "UN Comtrade: Nutzungsbedingungen der Vereinten Nationen; Quellenangabe erforderlich"
    note: "Summe über alle HS-Kapitel (ohne 98 und 99) des kleineren Anteils an den Warenexporten in die Welt; Meldungen der Exportländer."

  - id: esi_fra
    block: export
    source: static
    key: esi_fra
    params: {source_name: "Eigene Berechnung aus UN Comtrade"}
    title: "Exportähnlichkeit Deutschland–Frankreich (Finger-Kreinin, HS-Kapitel)"
    unit: "Index 0–100"
    frequency: A
    adjustment: nicht bereinigt
    chart: esi
    label: "Frankreich"
    start: "1995-01-01"
    stale_after_months: 60
    license: "UN Comtrade: Nutzungsbedingungen der Vereinten Nationen; Quellenangabe erforderlich"
    note: "Summe über alle HS-Kapitel (ohne 98 und 99) des kleineren Anteils an den Warenexporten in die Welt; Meldungen der Exportländer."

  - id: esi_ita
    block: export
    source: static
    key: esi_ita
    params: {source_name: "Eigene Berechnung aus UN Comtrade"}
    title: "Exportähnlichkeit Deutschland–Italien (Finger-Kreinin, HS-Kapitel)"
    unit: "Index 0–100"
    frequency: A
    adjustment: nicht bereinigt
    chart: esi
    label: "Italien"
