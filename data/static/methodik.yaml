      - "Bis 1991 gilt alles für Westdeutschland, ab 1992 für Deutschland; Prognose und erste Meldung haben immer dasselbe Gebiet."
      - "Wo kein Verbraucherpreisindex gedruckt ist, steht der Deflator des privaten Verbrauchs; die Spalte konzept nennt je Zeile die Größe."
      - "Wechselt das Konzept zwischen Prognose und Meldung, bleibt die erste Meldung leer (Flag Konzeptbruch)."
  gd_alo:
    methode: "Die Gemeinschaftsdiagnose ist die gemeinsame Prognose führender Wirtschaftsforschungsinstitute, seit 1950 zweimal im Jahr, im Frühjahr und im Herbst. Der Monitor hat alle vorliegenden Gutachten von 1950 bis zum Frühjahr 2026 ausgewertet, dazu die frei zugänglichen Fassungen der Gutachten Frühjahr 1997 bis Frühjahr 2007 und Herbst 2012 und das Archiv der Anhangstabellen 1965-2017 für Runden, deren Gutachten fehlen. Jeder Wert wurde zweimal unabhängig gelesen, aus Textschicht oder Texterkennung und am Seitenbild; bei Abweichung entschied das Seitenbild. Je Tabelle wurde zusätzlich mindestens ein Fünftel der Zellen neu am Seitenbild gelesen, ohne Kenntnis der erfassten Werte; alle 891 blinden Prüflesungen stimmten. Eine Gegenprobe von Hand steht noch aus. Was sich nicht sicher lesen ließ, trägt im Datensatz ein Flag und keinen Wert. Als Ist-Wert dient die erste Meldung: der Wert, den das Frühjahrsgutachten des Folgejahres für das abgelaufene Jahr druckt, mit demselben Konzept und Gebiet wie die Prognose. So gehen spätere Revisionen der Statistik nicht in den Fehler ein. Der Datensatz data/static/gd_prognosen.csv führt alle Runden, Horizonte und Größen mit Fundstelle, dazu den heutigen Datenstand. Für 43 Zieljahre von 1983 bis 2025 lag die Herbstprognose im Mittel nahe an der ersten Meldung, der mittlere absolute Fehler beträgt rund 175 000 Personen. Die Regel, dass die Zahl gleich bleibt, hätte in 42 vergleichbaren Jahren rund 220 000 Personen erreicht."
