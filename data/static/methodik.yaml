# Methodentexte für die Methodenblätter (site/methodik/<abbildung>.html).
# charts: Abbildung -> methode (Absatz, wie gerechnet und warum) und grenzen (Liste der wichtigsten Einschränkungen).
# Alles Übrige (Quellen, Kennungen, Einheiten, Rechenschritte aus der Konfiguration) erzeugt der Bau automatisch.

charts:
  gd_bip:
    methode: "Die Gemeinschaftsdiagnose ist die gemeinsame Prognose führender Wirtschaftsforschungsinstitute, seit 1950 zweimal im Jahr, im Frühjahr und im Herbst. Der Monitor hat alle vorliegenden Gutachten von 1950 bis zum Frühjahr 2026 ausgewertet, dazu die frei zugänglichen Fassungen der Gutachten Frühjahr 1997 bis Frühjahr 2007 und Herbst 2012 und das Archiv der Anhangstabellen 1965-2017 für Runden, deren Gutachten fehlen. Jeder Wert wurde zweimal unabhängig gelesen, aus Textschicht oder Texterkennung und am Seitenbild; bei Abweichung entschied das Seitenbild. Je Tabelle wurde zusätzlich mindestens ein Fünftel der Zellen neu am Seitenbild gelesen, ohne Kenntnis der erfassten Werte; alle 891 blinden Prüflesungen stimmten. Eine Gegenprobe von Hand steht noch aus. Was sich nicht sicher lesen ließ, trägt im Datensatz ein Flag und keinen Wert. Als Ist-Wert dient die erste Meldung: der Wert, den das Frühjahrsgutachten des Folgejahres für das abgelaufene Jahr druckt, mit demselben Konzept und Gebiet wie die Prognose. So gehen spätere Revisionen der Statistik nicht in den Fehler ein. Der Datensatz data/static/gd_prognosen.csv führt alle Runden, Horizonte und Größen mit Fundstelle, dazu den heutigen Datenstand. Über 60 Zieljahre von 1963 bis 2025 lag die Herbstprognose für das Wachstum im Mittel 0,5 Prozentpunkte über der ersten Meldung, der mittlere absolute Fehler beträgt 1,4 Prozentpunkte. Die Regel, dass das Wachstum so hoch ist wie die erste Meldung des Vorjahres, hätte in 57 vergleichbaren Jahren 1,9 Prozentpunkte erreicht."
    grenzen:
      - "Bis 1991 gilt alles für Westdeutschland, ab 1992 für Deutschland; Prognose und erste Meldung haben immer dasselbe Gebiet."
      - "Bis etwa 1991 prognostizierten die Institute meist das reale Bruttosozialprodukt, danach das Bruttoinlandsprodukt; die Preisbasis wechselt mehrfach."
      - "Die Gutachten 1950-1962 sind fast nur Fließtext; Jahreswerte sind dort selten."
      - "Spannen stehen als Mitte, Brüche wie 2½ als Dezimalzahl; der gedruckte Wortlaut steht im Datensatz."
