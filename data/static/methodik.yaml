# Methodentexte für die Methodenblätter (site/methodik/<abbildung>.html).
# charts: Abbildung -> methode (Absatz, wie gerechnet und warum) und grenzen (Liste der wichtigsten Einschränkungen).
# Alles Übrige (Quellen, Kennungen, Einheiten, Rechenschritte aus der Konfiguration) erzeugt der Bau automatisch.

charts:
  gd_rat:
    methode: "Ausgewertet sind alle Gutachten der Gemeinschaftsdiagnose mit Text von 1950 bis zum Herbst 2026; Runden, die nur als Tabellenanhang vorliegen (vor allem 1970-1974), fehlen. Je Gutachten haben zwei Prüfer unabhängig voneinander eingeordnet, ohne die Einordnung des anderen zu kennen. Waren sie uneins, ordnete ein dritter Prüfer blind ein, und es gilt die Mehrheit von zwei aus drei; die wenigen Fälle ohne Mehrheit stehen ohne Einordnung und werden von Hand entschieden. Lehnt ein Gutachten nur eine geplante Ausweitung von Schutz oder Leistungen ab, gilt das wie beim Sachverständigenrat als beibehalten. Gelesen wurde, was die Institute im Herbstgutachten für das Folgejahr empfehlen, getrennt nach Lohnpolitik, Geldpolitik, Finanzpolitik sowie Arbeitsmarkt und Sozialstaat, mit derselben dreistufigen Skala wie beim Sachverständigenrat. Maßstab ist die Richtung gegenüber dem damaligen Stand. Es zählt nur die gemeinsame Position; bei einem Patt steht keine Einordnung. Abweichende Voten einzelner Institute sind getrennt erfasst, je Sachpunkt eine Stelle, aus beiden Gutachten des Jahres."
    grenzen:
      - "Die Einordnung ist eine Deutung des Textes; Grenzfälle sind in der Tabelle mit niedriger Sicherheit markiert."
      - "Die frühen Gutachten enthalten wenige ausdrückliche Empfehlungen; leere Felder sind dort häufig."
      - "Die Gutachten 1950-1958 liegen nur als Texterkennung vor; Voten können dort übersehen sein."
