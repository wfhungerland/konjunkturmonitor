      - "Bis etwa 1991 prognostizierten die Institute meist das reale Bruttosozialprodukt, danach das Bruttoinlandsprodukt; die Preisbasis wechselt mehrfach."
      - "Ein Jahrzehnt mit weniger als fünf Werten erhält keine Stufe."
  gd_ziel:
    methode: "Die Gemeinschaftsdiagnose ist die gemeinsame Prognose führender Wirtschaftsforschungsinstitute, seit 1950 zweimal im Jahr, im Frühjahr und im Herbst. Der Monitor hat alle vorliegenden Gutachten von 1950 bis zum Frühjahr 2026 ausgewertet, dazu die frei zugänglichen Fassungen der Gutachten Frühjahr 1997 bis Frühjahr 2007 und Herbst 2012 und das Archiv der Anhangstabellen 1965-2017 für Runden, deren Gutachten fehlen. Jeder Wert wurde zweimal unabhängig gelesen, aus Textschicht oder Texterkennung und am Seitenbild; bei Abweichung entschied das Seitenbild. Je Tabelle wurde zusätzlich mindestens ein Fünftel der Zellen neu am Seitenbild gelesen, ohne Kenntnis der erfassten Werte; alle 891 blinden Prüflesungen stimmten. Eine Gegenprobe von Hand steht noch aus. Was sich nicht sicher lesen ließ, trägt im Datensatz ein Flag und keinen Wert. Als Ist-Wert dient die erste Meldung: der Wert, den das Frühjahrsgutachten des Folgejahres für das abgelaufene Jahr druckt, mit demselben Konzept und Gebiet wie die Prognose. So gehen spätere Revisionen der Statistik nicht in den Fehler ein. Der Datensatz data/static/gd_prognosen.csv führt alle Runden, Horizonte und Größen mit Fundstelle, dazu den heutigen Datenstand. Für jedes Zieljahr sind alle Runden gezeigt, die eine Jahreszahl für dieses Jahr drucken, auf dem Abschlussdatum des Gutachtens. Die Auswahl der vier jüngsten Zieljahre folgt allein dem Datum."
    grenzen:
      - "Seit 2016 reicht die Herbstprognose teils drei Jahre voraus; die Zahl der Punkte je Linie schwankt deshalb."
  svr_bip:
    methode: "Der Sachverständigenrat zur Begutachtung der gesamtwirtschaftlichen Entwicklung legt seit 1964 jedes Jahr im November ein Jahresgutachten vor. Darin steht eine Prognose für das folgende Jahr. Der Monitor hat für jedes Gutachten von 1964/65 bis 2025/26 die Prognose von Hand erfasst, mit Ziffer oder Tabelle und gedruckter Seite, und jeden Wert an der Druckfassung geprüft. Als Ist-Wert dient die erste Meldung: der Wert, den das Jahresgutachten ein Jahr später für das abgelaufene Jahr druckt. So kommen Prognose und Ist aus derselben Quelle, Gebiet und Rechenweg passen zusammen, und spätere Revisionen der Statistik gehen nicht zulasten des Rats. Für das Zieljahr 2025 fehlt das Folgegutachten; dort steht der amtliche Stand von 2026. Die Tabelle data/static/svr_prognosen.csv führt zusätzlich den heutigen Datenstand und beide Fehler. Über 59 Zieljahre von 1966 bis 2025 lag die Wachstumsprognose im Mittel 0,4 Prozentpunkte über der ersten Meldung, der mittlere absolute Fehler beträgt 1,2 Prozentpunkte. Eine einfache Regel, nach der das Wachstum so hoch ist wie im Vorjahr, hätte 1,9 Prozentpunkte erreicht."
    grenzen:
      - "Bis etwa 1990 prognostizierte der Rat meist das reale Bruttosozialprodukt, danach das Bruttoinlandsprodukt; als Ist-Wert steht jeweils dieselbe Größe, soweit gedruckt."
      - "Bis 1991 gilt alles für Westdeutschland, die Wachstumsprognosen für 1992 bis 1994 für das frühere Bundesgebiet."
      - "Für 1965 und 1968 gab der Rat nur Halbjahresprognosen; diese Jahre fehlen."
      - "Die violette Fläche nimmt an, dass künftige Fehler so verteilt sind wie die 59 Fehler seit 1966 (16. bis 84. Perzentil); sie ist keine Wahrscheinlichkeitsaussage des Rats."
      - "Spannen wie 3½ bis 4 vH stehen als Mitte, Angaben wie knapp oder gut als gedruckte Zahl; der Wortlaut steht in der Tabelle."
  svr_rat:
    methode: "Für jedes Jahresgutachten von 1964/65 bis 2025/26 wurde gelesen, was die Mehrheit des Sachverständigenrats für das folgende Jahr empfiehlt, getrennt nach vier Fragen: Lohnpolitik, Geldpolitik, Finanzpolitik sowie Arbeitsmarkt und Sozialstaat. Jede Empfehlung steht auf einer festen dreistufigen Skala, gemessen am damaligen Stand, mit einem Satz in eigenen Worten, Ziffer, gedruckter Seite und einer Angabe zur Sicherheit der Einordnung. Minderheitsvoten gehen nicht in die Einordnung ein; sie sind getrennt erfasst und als Zahl der Stellen je Gutachten gezählt, je Sachpunkt eine Stelle. Kurzfassungen, nachgedruckte Sondergutachten und bloße Verweise zählen nicht mit. Beide Tabellen stehen im Repository: data/static/svr_positionen_dauerfragen.csv und data/static/svr_minderheitsvoten.csv."
    grenzen:
      - "Die Einordnung ist eine Deutung des Textes; Grenzfälle zwischen zwei Stufen sind in der Tabelle als mittlere oder niedrige Sicherheit markiert."
      - "Die Skala misst die Richtung der Empfehlung gegenüber dem damaligen Stand, nicht ihr Ausmaß."
      - "Die Gutachten 1964 bis 1973 und 1999 wurden per Texterkennung gelesen; Ziffern aus zweispaltigem Satz können um eins abweichen."
      - "Weiß heißt, dass keine Empfehlung erkennbar ist; in frühen Jahren beruht das beim Arbeitsmarkt teils auf einer Stichwortsuche."
  svr_fiskal:
    methode: "Die Balken zeigen die Wachstumsprognose des Sachverständigenrats für das Folgejahr aus dem Jahresgutachten im November. Die Farbe gibt den Kurs der Finanzpolitik an, den derselbe Rat im selben Gutachten für dieses Jahr empfahl, nach der Einordnung in der Abbildung zu den Empfehlungen. So zeigt die Abbildung, welchen Kurs der Rat bei welcher erwarteten Konjunktur riet. Von 56 Jahren mit Prognose und Einordnung erwartete er in zehn weniger als 1 % Wachstum; in sechs davon empfahl er eine restriktivere Finanzpolitik."
    grenzen:
      - "Gemessen wird die erwartete, nicht die tatsächliche Konjunktur; sie entspricht der Lage, in der der Rat seine Empfehlung gab."
      - "Eine Konsolidierungsforderung kann mittelfristig gemeint sein; als Konsolidierung zählt sie nur, wenn sie für das Folgejahr gilt."
      - "Bis 1991 Westdeutschland; bis etwa 1990 meist reales Bruttosozialprodukt."
  svr_vpi:
    methode: "Der Sachverständigenrat zur Begutachtung der gesamtwirtschaftlichen Entwicklung legt seit 1964 jedes Jahr im November ein Jahresgutachten vor. Darin steht eine Prognose für das folgende Jahr. Der Monitor hat für jedes Gutachten von 1964/65 bis 2025/26 die Prognose von Hand erfasst, mit Ziffer oder Tabelle und gedruckter Seite, und jeden Wert an der Druckfassung geprüft. Als Ist-Wert dient die erste Meldung: der Wert, den das Jahresgutachten ein Jahr später für das abgelaufene Jahr druckt. So kommen Prognose und Ist aus derselben Quelle, Gebiet und Rechenweg passen zusammen, und spätere Revisionen der Statistik gehen nicht zulasten des Rats. Für das Zieljahr 2025 fehlt das Folgegutachten; dort steht der amtliche Stand von 2026. Die Tabelle data/static/svr_prognosen.csv führt zusätzlich den heutigen Datenstand und beide Fehler. Über 59 Zieljahre lag die Inflationsprognose im Mittel fast genau auf der ersten Meldung, der mittlere absolute Fehler beträgt 0,7 Prozentpunkte. Die Regel, dass die Inflation so hoch bleibt wie im Vorjahr, hätte 0,9 Prozentpunkte erreicht."
    grenzen:
      - "In einigen frühen Jahren prognostizierte der Rat den Deflator des privaten Verbrauchs statt des Preisindex für die Lebenshaltung; dort ist auch der Ist-Wert der Deflator."
      - "Druckt das Folgegutachten keine Jahresrate, etwa für 1984 bis 1986, steht der heutige Stand des Verbraucherpreisindex."
      - "Werte im Jahresverlauf, also Dezember gegen Dezember, sind nicht erfasst; gezeigt ist nur der Jahresdurchschnitt."
  svr_alo:
    methode: "Der Sachverständigenrat zur Begutachtung der gesamtwirtschaftlichen Entwicklung legt seit 1964 jedes Jahr im November ein Jahresgutachten vor. Darin steht eine Prognose für das folgende Jahr. Der Monitor hat für jedes Gutachten von 1964/65 bis 2025/26 die Prognose von Hand erfasst, mit Ziffer oder Tabelle und gedruckter Seite, und jeden Wert an der Druckfassung geprüft. Als Ist-Wert dient die erste Meldung: der Wert, den das Jahresgutachten ein Jahr später für das abgelaufene Jahr druckt. So kommen Prognose und Ist aus derselben Quelle, Gebiet und Rechenweg passen zusammen, und spätere Revisionen der Statistik gehen nicht zulasten des Rats. Für das Zieljahr 2025 fehlt das Folgegutachten; dort steht der amtliche Stand von 2026. Die Tabelle data/static/svr_prognosen.csv führt zusätzlich den heutigen Datenstand und beide Fehler. Für 42 Zieljahre mit gedruckter Zahl lag die Prognose im Mittel nahe an der ersten Meldung, der mittlere absolute Fehler beträgt rund 170 000 Personen. Die Regel, dass die Zahl gleich bleibt, hätte rund 250 000 Personen erreicht."
    grenzen:
      - "Bis 1991 Westdeutschland, danach Deutschland; der Sprung 1991/92 kommt aus dem Gebiet."
      - "Seit 2005 zählen auch Bezieher von Arbeitslosengeld II als arbeitslos; das hebt die Zahl, die Prognose für 2005 war davon überholt."
      - "Nennt ein Gutachten nur die Veränderung, eine Quote oder eine unscharfe Grenze wie nicht nennenswert unter einer Million, ist das Jahr nicht gezeigt; die Angabe steht in der Tabelle."
  enso_comm:
    methode: "Für jeden Monat seit 1975 ordnet der Monitor die Phase nach dem Relativen Oceanic Niño Index (RONI) der NOAA ein: El Niño ab 0,5 °C, neutral zwischen −0,5 und 0,5 °C, La Niña wird nicht gezeigt. Für jeden dieser Monate nimmt er die Veränderung des Weltmarktpreises ggü. dem Vorjahr, gemessen sechs Monate später, und mittelt sie getrennt nach Phasen. Die Preise stammen aus dem Pink Sheet der Weltbank (Monatswerte in US-Dollar). Ein Welch-t-Test vergleicht die Mittelwerte; ein Stern markiert |t| > 1,96. Die Idee folgt einer Auswertung der Weltbank (Prospects Group, Daten 1970 bis 2025, Niño-3.4-Index); hier rechnet der Monitor selbst und laufend neu."
    grenzen:
      - "Aufeinanderfolgende Monate hängen eng zusammen; der t-Test überschätzt deshalb die Zahl unabhängiger Beobachtungen, die Sterne sind eher großzügig."
      - "El Niño fällt oft mit anderen Ereignissen zusammen, etwa Ölpreisschocks oder Wechselkursbewegungen; die Abbildung zeigt einen Zusammenhang, keinen Beweis."
      - "Der RONI misst die Temperatur im Pazifik relativ zum tropischen Mittel und weicht leicht vom klassischen ONI ab, den die Weltbank verwendet."
  gdp_contrib:
    methode: "Das Statistische Bundesamt meldet das reale BIP und seine Verwendungsseite: Konsum der Haushalte und des Staates, Investitionen, Vorratsveränderung, Exporte und Importe. Der Beitrag eines Bestandteils ist seine Veränderung gegenüber dem Vorquartal, gewichtet mit seinem Anteil am BIP; Eurostat veröffentlicht diese Beiträge aus den Daten des Statistischen Bundesamts saison- und kalenderbereinigt. Importe gehen mit negativem Vorzeichen ein, weil sie nicht im Inland erzeugt wurden. Der Monitor fasst Bestandteile zu Gruppen zusammen und stellt sie neben die Wachstumsrate des BIP."
    grenzen:
      - "Die Vorratsveränderung enthält statistische Restgrößen und schwankt deshalb stark."
      - "Die Beiträge für das jüngste Quartal erscheinen später als die Schnellmeldung des BIP; die Linie kann deshalb ein Quartal weiter reichen als die Balken."
  gdp_rev:
    methode: "Die Echtzeitdatenbank der Bundesbank speichert jeden veröffentlichten Rechenstand des BIP. Für jedes Quartal vergleicht der Monitor die Wachstumsrate aus der ersten Meldung mit der Rate im jüngsten Rechenstand; die Differenz ist die Korrektur. Das graue Band zeigt den Durchschnitt der Korrekturen ohne Vorzeichen und damit, wie stark sich eine erste Meldung typischerweise noch ändert."
    grenzen:
      - "Junge Quartale sind meist erst wenig überarbeitet; ihre Korrekturen wachsen mit der Zeit."
      - "Große Revisionen der Volkswirtschaftlichen Gesamtrechnungen ändern viele Quartale auf einmal."
  downturns:
    methode: "Ausgangspunkt jeder Episode ist ein Hoch der Industrieproduktion. Für frühere Krisen ist es gesetzt (Finanzkrise Januar 2008, Corona Februar 2020); für den laufenden Abschwung wählt der Monitor den höchsten Stand der letzten fünf Jahre. Von diesem Zeitpunkt an zeigt jedes Feld den Verlauf: Produktion und BIP als Index mit dem Hoch = 100, die Arbeitslosenquote als Veränderung in Prozentpunkten."
    grenzen:
      - "Die Zeitpunkte der Hochs sind gesetzt und keine amtliche Datierung."
      - "Die Energiekrise ab Ende 2021 geht in den laufenden Abschwung über und ist deshalb nicht eigens gezeigt."
  downturns_hist:
    methode: "Für Jahreswerte seit 1871 liefert die Global Macro Database (Müller, Xu, Lehbib und Chen 2025) reales BIP und Arbeitslosenquote für Deutschland. Als Hoch gilt das letzte Jahr vor einem Rückgang des realen BIP. Ab diesem Jahr zeigt die Abbildung den Verlauf über die folgenden Jahre: BIP als Index (Jahr des Hochs = 100), Arbeitslosenquote als Veränderung in Prozentpunkten. Den laufenden Abschwung rechnet der Monitor mit amtlichen Jahreswerten: Jahresmittel des vierteljährlichen BIP-Index und der Erwerbslosenquote nach ILO, jeweils nur für vollständige Jahre."
    grenzen:
      - "Deutschland in den jeweiligen Grenzen: Gebietsänderungen 1871, 1918, 1945 und 1990 brechen die Reihen."
      - "Kriegsjahre sind ausgelassen; Verläufe enden vor 1914 und 1939."
      - "Die historische Arbeitslosenquote wechselt Quelle und Abgrenzung; vor 1950 ist sie nur grob vergleichbar."
      - "Der laufende Abschwung beruht auf anderen Quellen als die historischen Episoden."
      - "Die Global Macro Database steht unter CC BY-NC-SA 4.0; diese Abbildung und ihr Download deshalb ebenso."
  cpi_contrib:
    methode: "Der Beitrag eines Bereichs zur Inflationsrate ist seine Preisveränderung, gewichtet mit seinem Anteil am Warenkorb des Verbraucherpreisindex. Der Monitor rechnet die Beiträge aus den Teilindizes und den Wägungsanteilen des Statistischen Bundesamts; Dienstleistungen und Mieten sind zusammengefasst. Die Summe der Beiträge ergibt bis auf eine kleine Restgröße die Inflationsrate."
    grenzen:
      - "Die Gewichte ändern sich mit jeder Neuberechnung des Warenkorbs; die Restgröße entsteht aus Rundung und Verkettung."
  enso:
    methode: "Als sehr starkes El-Niño-Ereignis gilt eine Folge von mindestens fünf Dreimonatswerten des Relative Oceanic Niño Index der NOAA ab 0,5 °C mit einem Höchstwert ab 2 °C; Beginn ist der erste Monat der Folge. Ab diesem Monat zeigt die Abbildung die realen Nahrungsmittelpreise (Nahrungsmittelindex im Verhältnis zum Gesamtindex) und die realen Erzeugerpreise landwirtschaftlicher Produkte, jeweils mit dem Beginn = 100."
    grenzen:
      - "Wenige Episoden; andere Einflüsse wie Energiepreise oder Wechselkurse überlagern den Effekt."
  sahm:
    methode: "Eigene Berechnung nach Michaillat und Saez (2025). Erster Teil: Dreimonatsmittel der Arbeitslosenquote einschließlich Kurzarbeit in Vollzeitäquivalenten minus ihr Tief der letzten zwölf Monate. Zweiter Teil: Hoch der Quote offener Stellen in den letzten zwölf Monaten minus ihr Dreimonatsmittel. Das Signal ist der kleinere der beiden Teile; es steigt nur, wenn die Arbeitslosigkeit zunimmt und zugleich die offenen Stellen abnehmen."
    grenzen:
      - "Die Schwelle von 0,25 Prozentpunkten ist eigene Wahl für Deutschland."
      - "Das Signal kam in früheren Rezessionen teils mit Verzögerung."
  wai:
    methode: "Der Wöchentliche Aktivitätsindex der Bundesbank schätzt aus wöchentlichen Daten (unter anderem Lkw-Maut, Stromverbrauch, Suchanfragen), wie stark die Wirtschaftsleistung in den letzten 13 Wochen gegenüber den 13 Wochen davor gewachsen ist. Der Monitor übernimmt die Werte unverändert."
    grenzen:
      - "Eine Schätzung; sie wird mit neuen Daten überarbeitet."
  clock:
    methode: "Die Konjunkturuhr verbindet zwei Fragen der EU-Unternehmensumfrage in der Industrie: die Beurteilung der Auftragsbestände (waagerecht) und die Produktionserwartungen für die nächsten drei Monate (senkrecht). Beide Salden werden als Abstand zu ihrem Mittel 2005 bis 2019 gezeigt; im typischen Zyklus läuft der Punkt im Uhrzeigersinn durch Aufschwung, Boom, Abschwung und Rezession."
    grenzen:
      - "Umfragesalden messen die Richtung, nicht die Höhe der Produktion."
  diffusion:
    methode: "Ein Diffusionsindex misst, wie breit eine Bewegung ist. Für jede Branche des Verarbeitenden Gewerbes vergleicht der Monitor den Durchschnitt der letzten drei Monate mit dem der drei Monate davor (saison- und kalenderbereinigte Indizes der Bundesbank). Der Index ist der Anteil der Branchen mit einem Zuwachs, in %. Grundlage sind 24 Branchen der Produktion (Wirtschaftszweige 10 bis 33) und 9 Branchen des Auftragseingangs, für die die Bundesbank Indizes veröffentlicht."
    grenzen:
      - "Ungewichtet: eine kleine Branche wie die Tabakverarbeitung zählt so viel wie der Maschinenbau. Der Index zeigt die Breite, nicht die Stärke des Wachstums."
      - "Kleine Branchen schwanken stark; die Monatswerte springen deshalb. Aussagekräftiger ist das Dreimonatsmittel."
      - "Beim Auftragseingang beruhen die Werte auf nur 9 Branchen und ändern sich in Schritten von rund 11 Prozentpunkten."
  ez_ip:
    methode: "Eurostat veröffentlicht die Produktion im Verarbeitenden Gewerbe (NACE C) für alle EU-Länder nach einheitlicher Methode. Gezeigt ist die Veränderung ggü. dem Vorjahresmonat aus kalenderbereinigten Indizes (Datensatz sts_inpr_m, Einheit PCH_SM). Der Euroraum umfasst seit Januar 2026 einschließlich Bulgarien 21 Länder (EA21)."
    grenzen:
      - "Für Deutschland meldet die Bundesbank saison- und kalenderbereinigte Werte; Eurostat zeigt hier nur kalenderbereinigte. Die Raten ggü. dem Vorjahresmonat liegen deshalb nahe beieinander, aber nicht gleich."
      - "Großaufträge und Sondereffekte einzelner Länder, etwa in Irland, schlagen auf den Euroraum durch."
  ez_esi:
    methode: "Die Wirtschaftliche Einschätzung (Economic Sentiment Indicator, ESI) der EU-Kommission fasst die Vertrauensindikatoren aus Industrie (Gewicht 40 %), Dienstleistungen (30 %), Verbrauchern (20 %), Einzelhandel (5 %) und Bau (5 %) zusammen. Jedes Land ist auf seinen eigenen langjährigen Durchschnitt = 100 normiert, mit einer Standardabweichung von 10. Datensatz ei_bssi_m_r2, saisonbereinigt."
    grenzen:
      - "Der Vergleich zeigt, wo die Stimmung besser oder schlechter als üblich ist, nicht, wo sie absolut besser ist."
      - "Umfragen messen Einschätzungen, keine Produktion; sie laufen der Produktion oft voraus, aber nicht immer."
  proj_gap:
    methode: "Die Projektion der Bundesregierung nennt eine Jahresrate des realen BIP, unbereinigt. Diese Rate ist näherungsweise das gewogene Mittel der unbereinigten Raten ggü. dem Vorjahresquartal; Gewicht jedes Quartals ist sein Anteil am BIP des Vorjahres (aus dem saison- und kalenderbereinigten Index). Aus den schon gemeldeten Quartalen und dem Jahresziel folgt die Rate, die jedes noch fehlende Quartal erreichen müsste. Für das nächste Quartal rechnet der Monitor diese Rate zusätzlich in eine bereinigte Rate ggü. dem Vorquartal um: nötiges Niveau = Vorjahresquartal mal (1 + nötige Rate), verglichen mit dem jüngsten bereinigten Stand. Maßgeblich ist die jüngste Projektion, die eine Zahl für das Jahr des jüngsten Quartals enthält (data/static/prognosen.yaml); für 2025 ergibt die Näherung 0,2 % wie die amtliche Jahresrate."
    grenzen:
      - "Die Quartalsraten sind auf eine Nachkommastelle gerundet; die Näherung weicht deshalb um bis zu etwa 0,1 Prozentpunkte ab."
      - "Die Umrechnung in eine Rate ggü. dem Vorquartal unterstellt, dass das Quartal keinen Kalendereffekt hat."
      - "Revisionen früherer Quartale verschieben die nötige Rate; die Projektion selbst rechnet mit dem Datenstand ihres Stichtags."
  forecast:
    methode: "Der Monitor sammelt die jüngsten Prognosen von Bundesregierung, Instituten und internationalen Organisationen (data/static/prognosen.yaml) mit Datum und Quelle. Je Herausgeber gilt die jüngste Prognose; die Bundesregierung ist hervorgehoben, weil ihre Projektion Grundlage für Haushalt und Steuerschätzung ist."
    grenzen:
      - "Prognosen haben unterschiedliche Stichtage; ältere Prognosen sind heller gezeichnet."
      - "Einzelne Werte stammen aus Presseberichten zu den Veröffentlichungen."
  forecast_infl:
    methode: "Wie bei den Wachstumsprognosen: je Herausgeber die jüngste Prognose der Inflationsrate. Meist ist das der Verbraucherpreisindex; die Bundesbank prognostiziert den europäischen HVPI."
    grenzen:
      - "VPI und HVPI unterscheiden sich in Abgrenzung und Gewichten, meist nur wenig."
  potential:
    methode: "Drei Institutionen schätzen das Produktionspotenzial Deutschlands und veröffentlichen die Reihen frei: die Europäische Kommission (AMECO, Potenzial-BIP OVGDP, Produktionsfunktion aus Arbeitsvolumen, Kapitalbestand und Produktivität), die OECD (Economic Outlook, Potenzial-BIP GDPVTR, ebenfalls Produktionsfunktion) und der IWF (World Economic Outlook). Der IWF veröffentlicht das Potenzial nicht direkt; der Monitor leitet sein Wachstum aus dem realen BIP-Wachstum g und der Produktionslücke L in % des Potenzials ab: (1 + g) mal (1 + L Vorjahr) geteilt durch (1 + L) minus 1. Aus den Niveaus von AMECO und OECD rechnet der Monitor die Wachstumsrate ggü. dem Vorjahr. Die Fläche reicht je Jahr von der niedrigsten bis zur höchsten Schätzung, sobald mindestens zwei vorliegen. Alle drei Reihen ruft der Monitor wöchentlich ab; eine neue Ausgabe ersetzt die alte vollständig."
    grenzen:
      - "Das Potenzial ist nicht beobachtbar; Schätzungen werden oft deutlich überarbeitet, gerade für die jüngsten Jahre."
      - "Die drei Schätzungen haben verschiedene Stichtage; die Spanne mischt deshalb Ausgaben aus Frühjahr und Herbst."
      - "Die Spanne zeigt die Uneinigkeit der Schätzer, keine statistische Unsicherheit."
  esi:
    methode: "Exportähnlichkeitsindex nach Finger und Kreinin (1979): je Warengruppe zählt der kleinere der beiden Exportanteile; die Summe über alle Gruppen ergibt einen Wert zwischen 0 (keine Überschneidung) und 100 (identische Warenstruktur)."
    grenzen:
      - "Die Ähnlichkeit hängt von der Feinheit der Warengliederung ab."
  uncertainty:
    methode: "Index der wirtschaftspolitischen Unsicherheit nach Baker, Bloom und Davis: Anteil der Zeitungsartikel, die Begriffe zu Wirtschaft, Politik und Unsicherheit zugleich enthalten, normiert auf ein Mittel von 100 in den Jahren 1997 bis 2015."
    grenzen:
      - "Misst Berichterstattung, nicht Unsicherheit selbst; die Reihen enden nicht im selben Monat."
  hdd:
    methode: "Heizgradtage nach VDI 3807: Für jeden Tag mit einem Mittel unter 15 °C zählt die Differenz zu 20 °C Raumtemperatur; die Summe je Monat ergibt die Gradtage in Kelvin mal Tagen. Der Deutsche Wetterdienst veröffentlicht sie je Station; der Monitor bildet das ungewichtete Mittel aller Stationen."
    grenzen:
      - "Ungewichtetes Stationsmittel, kein amtlicher Deutschlandwert."
  rhine:
    methode: "Tagesmittel des Wasserstands am Pegel Kaub. Bis Ende des Vorjahres geprüfte Daten der Wasserstraßen- und Schifffahrtsverwaltung über die Bundesanstalt für Gewässerkunde, danach vorläufige Werte aus PEGELONLINE."
    grenzen:
      - "Der Pegelstand ist nicht die Wassertiefe der Fahrrinne; die Marke von 78 cm ist eine Faustregel."
  rhine_low:
    methode: "Zahl der Tage je Kalenderjahr, an denen das Tagesmittel am Pegel Kaub unter 78 cm lag; das laufende Jahr reicht bis zum jüngsten Tag und ist heller gezeichnet."
    grenzen:
      - "Das laufende Jahr ist unvollständig."
  insolv_claims:
    methode: "Voraussichtliche Forderungen der Gläubiger aus beantragten Unternehmensinsolvenzen je Monat, in jeweiligen Preisen. Einzelne Großinsolvenzen lassen die Monatswerte springen; das Zwölfmonatsmittel gleicht das aus."
    grenzen:
      - "Beträge nominal; die Preise sind seit 2019 um rund ein Viertel gestiegen."
  insolv_land:
    methode: "Je Land die Zahl der beantragten Unternehmensinsolvenzen der jüngsten zwölf (umschaltbar: sechs) Monate gegenüber demselben Zeitraum ein Jahr zuvor. Die Sätze nennen nur die größere Hälfte der Länder, weil Prozentwerte kleiner Länder auf wenigen Fällen beruhen."
    grenzen:
      - "Kleine Länder schwanken stark; die absoluten Zahlen stehen im Tooltip."
  spf:
    methode: "Mittel der Punktprognosen für die Inflationsrate im Euroraum in vier bis fünf Jahren aus der vierteljährlichen Umfrage der EZB unter Fachleuten (Survey of Professional Forecasters)."
    grenzen:
      - "Euroraum, nicht Deutschland; die Zahl der Teilnehmer schwankt."
  gas:
    methode: "Der IWF veröffentlicht den Großhandelspreis für Erdgas in Europa (Handelsplatz TTF) als Monatsmittel in US-Dollar je MMBtu. Der Monitor rechnet in Euro je Megawattstunde um: Preis ÷ Monatsmittel des EZB-Referenzkurses (US-Dollar je Euro) ÷ 0,293071 MWh je MMBtu."
    grenzen:
      - "Monatsmittel glätten kurzfristige Preisspitzen."
  cit:
    methode: "Tarifliche Gesamtsteuerbelastung von Kapitalgesellschaften nach der OECD (Corporate Tax Statistics): Körperschaftsteuer einschließlich Zuschlägen und Steuern nachgeordneter Ebenen, in Deutschland die Gewerbesteuer mit durchschnittlichem Hebesatz."
    grenzen:
      - "Tarifliche Sätze, nicht die tatsächlich gezahlte Steuer; Bemessungsgrundlagen unterscheiden sich."
  tarif:
    methode: "Index der tariflichen Monatsverdienste mit Sonderzahlungen für die Gesamtwirtschaft (Statistisches Bundesamt) und Verbraucherpreisindex, jeweils als Veränderung gegenüber dem Vorjahresmonat. Liegt die Tarifrate über der Inflationsrate, steigen die Tariflöhne real."
    grenzen:
      - "Einmalzahlungen wie die Inflationsausgleichsprämie lassen die Reihe springen."
  emp_sector:
    methode: "Erwerbstätige je Wirtschaftsbereich, saison- und kalenderbereinigt (Eurostat). Je Bereich die Veränderung vom 2. Quartal 2022 bis zum jüngsten Quartal in Tausend, in Klammern in Prozent des Stands im 2. Quartal 2022."
    grenzen:
      - "Erwerbstätige zählen Köpfe, nicht Arbeitsstunden."
  infl_hist:
    methode: "Als Inflationshoch gilt das Jahr mit der höchsten Jahresinflationsrate eines Schubs. Ab diesem Jahr zeigt die Abbildung die Rate selbst in den folgenden Jahren; so wird sichtbar, wie lange es bis zur Rückkehr nahe 2 % dauerte. Historische Raten aus der Global Macro Database, den laufenden Schub rechnet der Monitor als Jahresmittel des harmonisierten Verbraucherpreisindex (HVPI) für vollständige Jahre."
    grenzen:
      - "Historisch wechseln Preisindex und Abgrenzung; ab den 1990er Jahren entspricht die Reihe weitgehend dem HVPI."
      - "Die Global Macro Database steht unter CC BY-NC-SA 4.0; diese Abbildung und ihr Download deshalb ebenso."
  long_rr:
    methode: "Realzins im Nachhinein (ex post): Rendite langfristiger Staatsanleihen minus Inflationsrate desselben Jahres, beide aus der Global Macro Database. Die Jahre 1914 bis 1924 und 1939 bis 1950 sind ausgelassen, weil Krieg, Hyperinflation und Währungsreform die Werte unbrauchbar machen (1923: Realzins weit unter −100 %)."
    grenzen:
      - "Die erwartete Inflation ist nicht beobachtbar; der Ex-post-Realzins kann von dem abweichen, mit dem Anleger rechneten."
      - "Die Anleihen und ihre Laufzeiten wechseln über die Zeit."
  long_debt:
    methode: "Bruttoschulden des Gesamtstaats in % des BIP aus der Global Macro Database. Kriegs- und Inflationsjahre sind ausgelassen, weil Schulden und BIP dort nicht sinnvoll vergleichbar sind."
    grenzen:
      - "Vor 1950 umfasst der Gesamtstaat nicht überall dieselben Ebenen."
  long_growth:
    methode: "Je Jahr das durchschnittliche jährliche Wachstum des realen BIP je Einwohner über die zehn Jahre davor: ((Wert ÷ Wert zehn Jahre zuvor) hoch 1/10 − 1) × 100. Der Durchschnitt glättet Konjunkturschwankungen und zeigt den Trend."
    grenzen:
      - "Gebietsänderungen verändern Bevölkerung und BIP zugleich; je Einwohner mildert das, beseitigt es aber nicht."
  long_inv:
    methode: "Investitionen in % des BIP in jeweiligen Preisen aus der Global Macro Database. Vor 1950 beruhen die Werte auf historischen Schätzungen."
    grenzen:
      - "Abgrenzung der Investitionen und des BIP wechseln über die Zeit."
  long_open:
    methode: "Exporte von Waren und Dienstleistungen und Saldo der Leistungsbilanz, jeweils in % des BIP, aus der Global Macro Database."
    grenzen:
      - "Gebietsänderungen verändern, was als Außenhandel zählt (etwa Handel zwischen den beiden deutschen Staaten vor 1990)."
  long_hpi:
    methode: "Index der Hauspreise bereinigt um die Verbraucherpreise aus der Global Macro Database."
    grenzen:
      - "Die zugrunde liegenden Preisreihen und ihre Abgrenzung wechseln über die Zeit; der Index zeigt Trends, keine genauen Niveaus."
