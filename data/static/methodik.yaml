      - "Bis 1991 gilt alles für Westdeutschland, ab 1992 für Deutschland; Prognose und erste Meldung haben immer dasselbe Gebiet."
      - "Die Anhangstabellen enthalten keine Arbeitslosen; für Runden, die nur dort vorliegen (vor allem 1970-1974), fehlt die Prognose."
      - "Arbeitslose, die in Millionen gedruckt sind, stehen in Tausend."
  gd_saldo:
    methode: "Die Gemeinschaftsdiagnose ist die gemeinsame Prognose führender Wirtschaftsforschungsinstitute, seit 1950 zweimal im Jahr, im Frühjahr und im Herbst. Der Monitor hat alle vorliegenden Gutachten von 1950 bis zum Frühjahr 2026 ausgewertet, dazu die frei zugänglichen Fassungen der Gutachten Frühjahr 1997 bis Frühjahr 2007 und Herbst 2012 und das Archiv der Anhangstabellen 1965-2017 für Runden, deren Gutachten fehlen. Jeder Wert wurde zweimal unabhängig gelesen, aus Textschicht oder Texterkennung und am Seitenbild; bei Abweichung entschied das Seitenbild. Je Tabelle wurde zusätzlich mindestens ein Fünftel der Zellen neu am Seitenbild gelesen, ohne Kenntnis der erfassten Werte; alle 891 blinden Prüflesungen stimmten. Eine Gegenprobe von Hand steht noch aus. Was sich nicht sicher lesen ließ, trägt im Datensatz ein Flag und keinen Wert. Als Ist-Wert dient die erste Meldung: der Wert, den das Frühjahrsgutachten des Folgejahres für das abgelaufene Jahr druckt, mit demselben Konzept und Gebiet wie die Prognose. So gehen spätere Revisionen der Statistik nicht in den Fehler ein. Der Datensatz data/static/gd_prognosen.csv führt alle Runden, Horizonte und Größen mit Fundstelle, dazu den heutigen Datenstand. Für 54 Zieljahre von 1970 bis 2025 lag die Herbstprognose für den Finanzierungssaldo im Mittel fast genau auf der ersten Meldung, der mittlere absolute Fehler beträgt 0,9 Prozentpunkte. Wo ein Gutachten den Saldo in Mrd. druckt, aber keine Quote, ist sie berechnet: Saldo durch nominales Sozialprodukt desselben Gutachtens mal 100, eine Nachkommastelle. Bis 1993 ist der Nenner das Bruttosozialprodukt, weil die Gutachten vorher kein nominales BIP drucken, 1994 und 1995 das BIP. Die erste Meldung ist genauso gerechnet."
    grenzen:
      - "Bis 1993 ist die Quote auf das Bruttosozialprodukt bezogen; der Unterschied zum BIP beträgt in Westdeutschland meist weniger als 1 % des Niveaus und ändert die Quote kaum."
      - "Sondereffekte wie die Übernahme der Treuhand-Schulden oder die UMTS-Erlöse 2000 sind je Zeile vermerkt."
  gd_fehler:
    methode: "Die Gemeinschaftsdiagnose ist die gemeinsame Prognose führender Wirtschaftsforschungsinstitute, seit 1950 zweimal im Jahr, im Frühjahr und im Herbst. Der Monitor hat alle vorliegenden Gutachten von 1950 bis zum Frühjahr 2026 ausgewertet, dazu die frei zugänglichen Fassungen der Gutachten Frühjahr 1997 bis Frühjahr 2007 und Herbst 2012 und das Archiv der Anhangstabellen 1965-2017 für Runden, deren Gutachten fehlen. Jeder Wert wurde zweimal unabhängig gelesen, aus Textschicht oder Texterkennung und am Seitenbild; bei Abweichung entschied das Seitenbild. Je Tabelle wurde zusätzlich mindestens ein Fünftel der Zellen neu am Seitenbild gelesen, ohne Kenntnis der erfassten Werte; alle 891 blinden Prüflesungen stimmten. Eine Gegenprobe von Hand steht noch aus. Was sich nicht sicher lesen ließ, trägt im Datensatz ein Flag und keinen Wert. Als Ist-Wert dient die erste Meldung: der Wert, den das Frühjahrsgutachten des Folgejahres für das abgelaufene Jahr druckt, mit demselben Konzept und Gebiet wie die Prognose. So gehen spätere Revisionen der Statistik nicht in den Fehler ein. Der Datensatz data/static/gd_prognosen.csv führt alle Runden, Horizonte und Größen mit Fundstelle, dazu den heutigen Datenstand. Gezeigt ist der Betrag der Differenz zwischen Herbstprognose und erster Meldung. Die Stufen sind einfache Mittel je Jahrzehnt: 1970er 1,8, 1980er 1,1, 1990er 1,0, 2000er 1,4, 2010er 0,8 und 2020-2025 2,2 Prozentpunkte."
