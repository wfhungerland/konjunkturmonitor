# Veröffentlichungskalender: übliche Termine nach dem Rhythmus der Quellen.
# Die Termine sind geschätzt. Verbindlich sind die Kalender der Quellen (siehe links).
# Regeln: workday: n  -> n-ter Werktag des Monats; last_workday: n -> n Werktage vor dem letzten Werktag (0 = letzter);
#         weekday: 1   -> jeden Dienstag (0 = Montag); months: nur in diesen Monaten.
links:
  - {name: "Destatis, Veröffentlichungskalender", url: "https://www.destatis.de/DE/Presse/Termine/_inhalt.html"}
  - {name: "Bundesagentur für Arbeit, Veröffentlichungskalender", url: "https://statistik.arbeitsagentur.de/DE/Navigation/Service/Veroeffentlichungskalender/Veroeffentlichungskalender-Nav.html"}
  - {name: "Eurostat, Release calendar", url: "https://ec.europa.eu/eurostat/news/release-calendar"}
  - {name: "Deutsche Bundesbank, Wöchentlicher Aktivitätsindex", url: "https://www.bundesbank.de/de/statistiken/konjunktur-und-preise/woechentlicher-aktivitaetsindex"}
items:
  - {name: "Auftragseingang Industrie", source: Destatis, rule: {workday: 4}, topic: industrie}
  - {name: "Produktion im Produzierenden Gewerbe", source: Destatis, rule: {workday: 5}, topic: industrie}
  - {name: "Außenhandel", source: Destatis, rule: {workday: 6}, topic: export}
  - {name: "Unternehmensinsolvenzen", source: Destatis, rule: {workday: 8}, topic: insolvenzen}
  - {name: "Verbraucherpreise, endgültig", source: Destatis, rule: {workday: 9}, topic: preise}
  - {name: "Erzeugerpreise", source: Destatis, rule: {workday: 14}, topic: preise}
  - {name: "BIP, ausführliche Ergebnisse", source: Destatis, rule: {workday: 17, months: [2, 5, 8, 11]}, topic: wachstum}
  - {name: "Einfuhrpreise", source: Destatis, rule: {last_workday: 4}, topic: preise}
  - {name: "Wirtschaftsklima (ESI)", source: EU-Kommission, rule: {last_workday: 1}, topic: stimmung}
  - {name: "Einzelhandelsumsatz", source: Destatis, rule: {last_workday: 1}, topic: konsum}
  - {name: "Arbeitsmarkt", source: BA, rule: {last_workday: 0}, topic: arbeit}
  - {name: "Verbraucherpreise, vorläufig", source: Destatis, rule: {last_workday: 0}, topic: preise}
  - {name: "BIP, Schnellmeldung", source: Destatis, rule: {last_workday: 0, months: [1, 4, 7, 10]}, topic: wachstum}
