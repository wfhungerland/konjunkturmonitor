# Wichtige geldpolitische Ereignisse für den Schalter „Ereignisse“ in den Geldpolitik-Abbildungen.
# date: Tag der Entscheidung oder Rede; label: Kurzname über der Linie; text: ein Satz beim Darauffahren; url: Quelle (Klick).
# Neue Einträge nur bei großen Wendepunkten; Links vor dem Eintragen aufrufen.
events:
  - date: "2008-10-08"
    label: "Vollzuteilung"
    label_en: "Full allotment"
    text: "Die EZB teilt Banken ab Oktober 2008 so viel Geld zu, wie sie zum Festzins nachfragen."
    text_en: "From October 2008 the ECB gives banks as much money as they request at a fixed rate."
    url: "https://www.ecb.europa.eu/press/pr/date/2008/html/pr081008_2.en.html"
  - date: "2010-05-10"
    label: "SMP"
    label_en: "SMP"
    text: "Mit dem Programm für die Wertpapiermärkte (SMP) kauft die EZB erstmals Staatsanleihen angeschlagener Euroländer."
    text_en: "With the Securities Markets Programme (SMP) the ECB buys government bonds of stressed euro countries for the first time."
    url: "https://www.ecb.europa.eu/press/pr/date/2010/html/pr100510.en.html"
  - date: "2011-04-07"
    label: "Zinserhöhung 2011"
    label_en: "2011 hike"
    text: "Die EZB erhöht die Leitzinsen mitten in der Schuldenkrise; im Herbst 2011 nimmt sie die Schritte zurück."
    text_en: "The ECB raises policy rates in the middle of the debt crisis and reverses the move in autumn 2011."
    url: "https://www.ecb.europa.eu/press/pr/date/2011/html/pr110407.en.html"
  - date: "2011-12-08"
    label: "Dreijahrestender"
    label_en: "3-year LTRO"
    text: "Die EZB leiht Banken Geld für drei Jahre (Dreijahrestender) und lockert die Anforderungen an Sicherheiten."
    text_en: "The ECB lends to banks for three years (LTRO) and eases collateral rules."
    url: "https://www.ecb.europa.eu/press/pr/date/2011/html/pr111208_1.en.html"
  - date: "2012-07-26"
    label: "Whatever it takes"
    label_en: "Whatever it takes"
    text: "Mario Draghi sagt in London, die EZB werde alles Nötige tun, um den Euro zu erhalten. Die Spreads fallen danach deutlich."
    text_en: "Mario Draghi says in London that the ECB will do whatever it takes to preserve the euro. Spreads then fall sharply."
    url: "https://www.ecb.europa.eu/press/key/date/2012/html/sp120726.en.html"
  - date: "2012-09-06"
    label: "OMT"
    label_en: "OMT"
    text: "Die EZB beschließt Outright Monetary Transactions (OMT): unbegrenzte Käufe von Staatsanleihen eines Landes unter Auflagen. Genutzt wurde OMT nie."
    text_en: "The ECB adopts Outright Monetary Transactions (OMT): unlimited purchases of a country's bonds under conditions. OMT was never used."
    url: "https://www.ecb.europa.eu/press/pr/date/2012/html/pr120906_1.en.html"
  - date: "2014-06-05"
    label: "Negativzins"
    label_en: "Negative rate"
    text: "Der Einlagesatz sinkt erstmals unter null, auf −0,10 %."
    text_en: "The deposit rate falls below zero for the first time, to −0.10%."
    url: "https://www.ecb.europa.eu/press/pr/date/2014/html/pr140605.en.html"
  - date: "2015-01-22"
    label: "QE"
    label_en: "QE"
    text: "Die EZB beschließt breite Anleihekäufe (Quantitative Easing, QE), vor allem Staatsanleihen; die Käufe beginnen im März 2015."
    text_en: "The ECB launches broad bond purchases (quantitative easing, QE), mainly of government bonds; purchases start in March 2015."
    url: "https://www.ecb.europa.eu/press/pr/date/2015/html/pr150122_1.en.html"
  - date: "2018-12-13"
    label: "Ende Nettokäufe"
    label_en: "End of net purchases"
    text: "Die EZB beendet die Nettokäufe im Ankaufprogramm APP zum Jahresende 2018; fällige Anleihen ersetzt sie weiter."
    text_en: "The ECB ends net purchases under the APP at the end of 2018 but keeps reinvesting maturing bonds."
    url: "https://www.ecb.europa.eu/press/pr/date/2018/html/ecb.mp181213.en.html"
  - date: "2019-09-12"
    label: "QE wieder"
    label_en: "QE restart"
    text: "Die EZB senkt den Einlagesatz auf −0,50 % und nimmt die Anleihekäufe ab November 2019 wieder auf."
    text_en: "The ECB cuts the deposit rate to −0.50% and restarts bond purchases from November 2019."
    url: "https://www.ecb.europa.eu/press/pr/date/2019/html/ecb.mp190912~08de50b4d2.en.html"
  - date: "2020-03-18"
    label: "PEPP"
    label_en: "PEPP"
    text: "In der Pandemie startet das Notfallkaufprogramm PEPP, zunächst über €750 Mrd."
    text_en: "In the pandemic the ECB launches the emergency purchase programme PEPP, initially worth €750bn."
    url: "https://www.ecb.europa.eu/press/pr/date/2020/html/ecb.pr200318_1~3949d6f266.en.html"
  - date: "2022-07-21"
    label: "Zinswende, TPI"
    label_en: "Hikes, TPI"
    text: "Erste Zinserhöhung seit 2011 um 0,50 Prozentpunkte. Zugleich schafft die EZB das Instrument zum Schutz der Transmission (TPI): Sie kann Anleihen eines Landes kaufen, wenn dessen Zinsen ohne Grund stark steigen."
    text_en: "First rate hike since 2011, by 0.50 percentage points. The ECB also creates the Transmission Protection Instrument (TPI) to buy a country's bonds if its yields rise sharply without justification."
    url: "https://www.ecb.europa.eu/press/pr/date/2022/html/ecb.pr220721~973e6e7273.en.html"
  - date: "2023-06-15"
    label: "QT"
    label_en: "QT"
    text: "Die EZB ersetzt fällige Anleihen im APP ab Juli 2023 nicht mehr; die Bestände schrumpfen (Quantitative Tightening, QT)."
    text_en: "From July 2023 the ECB stops reinvesting maturing APP bonds; holdings shrink (quantitative tightening, QT)."
    url: "https://www.ecb.europa.eu/press/pr/date/2023/html/ecb.mp230615~d34cddb4c6.en.html"
  - date: "2024-06-06"
    label: "Erste Senkung"
    label_en: "First cut"
    text: "Erste Zinssenkung nach dem Anstieg 2022 und 2023: Der Einlagesatz sinkt auf 3,75 %."
    text_en: "First rate cut after the 2022–2023 hikes: the deposit rate falls to 3.75%."
    url: "https://www.ecb.europa.eu/press/pr/date/2024/html/ecb.mp240606~2148ecdb3c.en.html"
