# Satzbausteine für die automatischen Sätze: grammatischer Satzgegenstand je Reihe.
# series: Reihen-ID -> [Satzgegenstand mit Artikel im Nominativ, s (Einzahl) oder p (Mehrzahl)]
#         oder {tpl: "..."} für einen ganzen Satz. Platzhalter: {when} (Im Oktober 2026), {v} (Wert mit Einheit),
#         {abs} (Betrag ohne Vorzeichen), {ueber} (über/unter), {hoeher} (höher/niedriger).
# charts: Abbildung -> Muster mit {label} für Reihen, die gleich gebaut sind (etwa Länder).
# labels: Beschriftung -> Satzgegenstand, für Beitragsbalken und Balken der jüngsten Veränderung.
# Die Satzform folgt der Einheit: Veränderungsraten „stiegen um … %“, Indizes „lag … % über dem Vorjahresmonat“,
# Quoten und Salden „lag bei …, … Pp höher als ein Jahr zuvor“, Mengen „lag bei …, … mehr als ein Jahr zuvor“.

