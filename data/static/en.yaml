charts:
  enso_comm:
    title: "Commodity prices after El Niño and in neutral phases"
    ask: "Which commodities become dearer after El Niño?"
    caption: "The chart shows the average change in world market prices on a year earlier, measured six months after months with El Niño (dark) and after neutral months (grey). El Niño here means NOAA's Relative Oceanic Niño Index (RONI) of at least 0.5 °C; neutral means between −0.5 and 0.5 °C. Prices in US dollars come from the World Bank Pink Sheet. A star marks a statistically clear difference that chance can hardly explain (Welch t-test, |t| > 1.96). The idea follows an analysis by the World Bank (Prospects Group); the calculation is our own."
  downturns_hist:
    title: "Downturns since 1879 compared, annual data"
    ask: "How deep were the downturns since the 19th century?"
    caption: "The chart shows annual data from the peak year, the last year before real economic output (gross domestic product) fell: on the left economic output with the peak year = 100, on the right the change in the unemployment rate in percentage points since that year. Highlighted are the Great Depression, the financial crisis, COVID and the current downturn (thick); grey is the range of the other downturns with peaks in 1879, 1898, 1966, 1974, 1981, 1992 and 2001. War years are left out, and the paths end before 1914 and 1939. Historical values come from the Global Macro Database (Müller, Xu, Lehbib and Chen 2025), with Germany within its borders at the time and the unemployment rate changing source and definition over time; the current downturn rests on official annual data (gross domestic product from the Federal Statistical Office, ILO unemployment rate as an annual mean) and is therefore not fully comparable. This chart and its download are licensed under CC BY-NC-SA 4.0, as the Global Macro Database requires."
  infl_hist:
    title: "Inflation surges since 1945 compared, annual data"
    ask: "How quickly did earlier inflation surges subside?"
    caption: "The lines show the annual inflation rate from the year of the inflation peak: after the Korean War boom in 1951 (grey), the oil crises of 1974 and 1981, reunification in 1992 and in the current surge since 2022 (thick). This shows how many years it took each time for the rate to return close to 2%. The historical values come from the Global Macro Database (Müller, Xu, Lehbib and Chen 2025). The current surge is the annual mean of the harmonised index of consumer prices (Deutsche Bundesbank), complete years only. This chart and its download are licensed under CC BY-NC-SA 4.0, as the Global Macro Database requires."
  long_rr:
    title: "Real interest rate since 1871"
    ask: "Are real interest rates high by historical standards?"
    caption: "The real interest rate here is the yield on long-term government bonds minus the inflation rate of the same year, in %, so it is measured after the fact. The axis ends at plus and minus 30%; during the hyperinflation of the early 1920s, when money lost its value at breakneck speed, the real rate was far lower. Light grey is the average per decade, the current decade's average dotted; a switch shows banking crises (red) and recessions (grey), here years with falling real economic output. The world wars 1914 to 1918 and 1939 to 1945 are left out; later gaps come from the database. Source: the Global Macro Database (Müller, Xu, Lehbib and Chen 2025), also for the banking crises, Germany within its borders at the time; This chart and its download are licensed under CC BY-NC-SA 4.0, as the Global Macro Database requires."
  long_debt:
    title: "Government debt since 1871"
    ask: "How high was government debt in the past?"
    caption: "The chart shows general government gross debt as a percentage of economic output; dashed grey is the Maastricht Treaty reference value. After both world wars, inflation and currency reform largely wiped out the debt. Light grey is the average per decade, the current decade dotted; banking crises (red) and recessions (grey) can be shown, here years with falling real gross domestic product. The long series and the banking crises come from the Global Macro Database (Müller, Xu, Lehbib and Chen 2025), for Germany within its borders at the time; the world wars 1914 to 1918 and 1939 to 1945 are left out, and later gaps come from the database. Because this database requires it, the chart and its download are licensed under CC BY-NC-SA 4.0."
  long_growth:
    title: "Growth per capita since 1871, ten-year average"
    ask: "Is such a long period of weak growth unusual by historical standards?"
    caption: "The line shows the average annual growth of real economic output (gross domestic product) per person over the ten years up to the year shown, in %; per person, so that changes in population and territory do not distort the comparison. Light grey is the average per decade, the current decade's average dotted; a switch shows banking crises (red) and recessions (grey), here years with falling real economic output. The world wars 1914 to 1918 and 1939 to 1945 are left out; ten-year values after them still include the war years. Source: the Global Macro Database (Müller, Xu, Lehbib and Chen 2025), also for the banking crises, Germany within its borders at the time; This chart and its download are licensed under CC BY-NC-SA 4.0, as the Global Macro Database requires."
  long_inv:
    title: "Investment ratio since 1871"
    ask: "Does Germany invest less today than in the past?"
    caption: "The chart shows investment as a percentage of economic output, at current prices: until 1950 gross investment from historical estimates, thereafter national accounts figures, and the definitions change over time. Light grey is the average per decade, the current decade dotted; banking crises (red) and recessions (grey) can be shown, here years with falling real gross domestic product. The long series and the banking crises come from the Global Macro Database (Müller, Xu, Lehbib and Chen 2025), for Germany within its borders at the time; the world wars 1914 to 1918 and 1939 to 1945 are left out, and later gaps come from the database. Because this database requires it, the chart and its download are licensed under CC BY-NC-SA 4.0."
  long_open:
    title: "Export ratio and current account since 1871"
    ask: "How dependent on foreign trade is Germany today?"
    caption: "The chart shows exports of goods and services and the current-account balance, each as a percentage of gross domestic product, that is economic output. The long series come from the Global Macro Database (Müller, Xu, Lehbib and Chen 2025) and show Germany within its borders at the time. Light grey: average per decade, the current decade dotted; banking crises (red) according to the same database and recessions (grey), here years with falling real gross domestic product, can be shown. The world wars 1914 to 1918 and 1939 to 1945 are left out; gaps after them come from the database. This chart and its download are licensed under CC BY-NC-SA 4.0, as the Global Macro Database requires this licence."
  long_hpi:
    title: "Real house prices since 1871"
    ask: "How expensive is residential property in the long run?"
    caption: "The index shows house prices adjusted for consumer prices; because the underlying price series change over time, it shows trends and no exact levels. The long series come from the Global Macro Database (Müller, Xu, Lehbib and Chen 2025), Germany within its borders at the time. Light grey: average per decade, the current one dotted; banking crises (red) according to the same database and recessions (grey), here years with falling price-adjusted economic output, can be shown. The world wars 1914 to 1918 and 1939 to 1945 are left out; later gaps come from the database. This chart and its download are licensed under CC BY-NC-SA 4.0, as the Global Macro Database requires."
  gdp_rev:
    title: "Revision of GDP growth since the first release"
    ask: "How much is GDP growth revised after the first release?"
    caption: "The bars show by how many percentage points growth in real economic output (gross domestic product) on the previous quarter was revised between the Federal Statistical Office's first release and the latest vintage; positive means revised up. The grey band shows the mean revision ignoring the sign over the period shown. The tooltip gives the first release and the current figure; both are also in the download. The basis is the stored vintages of the Bundesbank's real-time database since 2005. The first release of a quarter rests on incomplete information; later vintages and major revisions often change it by several tenths."
  alq_land:
    title: "Unemployment rate by state"
    ask: "In which states is unemployment high, where is it rising?"
    what: "unemployment rate"
    caption: "The map shows the unemployment rate by federal state, annual average, relative to the civilian labour force, that is, everyone who works or is looking for work, excluding soldiers (Federal Employment Agency via the Federal Statistical Office). The number gives the rate, the colour the change on the previous year: orange means up, blue down. The official database offers no monthly figures by state, so the map changes only once a year."
  tarif:
    title: "Agreed pay and consumer prices"
    ask: "Is agreed pay rising faster than prices?"
    caption: "Collectively agreed earnings are the wages that trade unions and employers agree in collective agreements. The chart shows collectively agreed monthly earnings including special payments in the economy as a whole (Federal Statistical Office) and consumer prices, each on the same month a year earlier. If agreed earnings rise faster than inflation, agreed pay rises in real terms, that is, even after allowing for price increases. One-off payments such as the inflation compensation bonus in 2023 and 2024 cause jumps in the series."
  ulc:
    title: "Unit labour costs"
    ask: "Are unit labour costs rising faster than in the euro area?"
    caption: "Unit labour costs show what labour costs per unit of output: compensation per employee relative to real output per person employed. The chart shows the change on the same quarter a year earlier (Eurostat). They rise when wages grow faster than productivity, that is, output per person employed. If they rise persistently faster in Germany than in the euro area, the German economy loses price competitiveness."
  spf:
    title: "Long-term inflation expectations of experts"
    ask: "Do experts trust that inflation will return to 2%?"
    caption: "The chart shows the inflation rate that experts expect for the euro area in four to five years. It is the average of point forecasts from the European Central Bank's quarterly survey of experts from banks, research and associations (Survey of Professional Forecasters). Blue dashed: the European Central Bank's 2% target. If expectations are close to the target, inflation expectations are considered anchored, that is firmly tied to the target."
  downturns:
    title: "Downturns compared"
    ask: "How deep is the current downturn compared with earlier crises?"
    caption: "The lines show the path from the peak in industrial production before earlier crises and in the current downturn (dark blue, thick). Production and economic output (gross domestic product) appear as an index with the peak = 100, the unemployment rate as the change in percentage points since that peak. The current peak is the highest level of production in the last five years. The peak dates are set by the monitor and are not an official dating. The energy crisis from late 2021 is not shown separately, because it runs into the current downturn."
  energy_intensive:
    title: "Output of energy-intensive industries"
    ask: "How are the energy-intensive industries producing?"
    caption: "The chart shows the output of the five energy-intensive industries: paper, coke and refined petroleum, chemicals, glass and ceramics, and basic metals. The index comes from the Federal Statistical Office via the Bundesbank, is seasonally and calendar adjusted and sets 2021 = 100. These industries use most of the energy consumed by industry and react strongly to gas and electricity prices. Each panel highlights one industry in dark blue and has its own scale; with “Common scale” the others appear in grey behind it for comparison. Thin: monthly values, thick: three-month moving average."
  gdp_contrib:
    title: "Where growth comes from"
    ask: "Which components of demand are driving growth?"
    caption: "The bars show how many percentage points each part of demand contributes to growth on the previous quarter. These parts are household and government consumption, investment, net trade (exports minus imports) and the change in inventories, that is, stocks built up or run down. The line shows total growth of gross domestic product (economic output) in per cent. Apart from rounding, the bars add up to the line."
  wai:
    title: "Weekly activity index"
    ask: "What do the weekly data show about economic output?"
    caption: "The Bundesbank's activity index estimates how much economic output grew in the latest 13 weeks compared with the 13 weeks before. It uses weekly data for this, such as truck tolls, electricity consumption and internet searches. It is available earlier than gross domestic product, but remains an estimate."
  maut:
    title: "Truck toll mileage index"
    ask: "How much are trucks driving on the motorways?"
    caption: "The index shows how much toll-liable trucks with four or more axles drive on motorways; it is based on toll data. It is available a few days after the end of the month. It closely tracks industrial production, because these trucks mainly carry intermediate inputs (parts and materials for other firms) and goods. Thick: three-month moving average; thin: monthly values (can be hidden with the button)."
  maut_d:
    title: "Truck toll mileage index, daily"
    ask: "How much are trucks driving in recent weeks?"
    caption: "The index shows the daily mileage of trucks, calendar and seasonally adjusted, that is, without the usual effects of public holidays and seasons. It is experimental and comes from Destatis and the Federal Office for Logistics and Mobility (BALM); the Bundesbank adjusts it. It is available with a delay of five to twelve days and is updated on Thursdays. Thin: daily values, thick: seven-day moving average. The daily values swing widely and cannot be compared directly with the monthly index."
  gdp_level:
    title: "Economic output, level"
    ask: "Where does economic output stand in a longer comparison?"
    caption: "The chart shows economic output, price adjusted (that is, without the effect of rising prices), 2020 = 100. The slump in 2020 was caused by the covid-19 pandemic. The change on a year earlier is seasonally and calendar adjusted here. The overview, like the flash estimate of the Federal Statistical Office, gives the unadjusted rate instead. So the two may differ by 0.1 percentage points."
  gdp_use:
    title: "Expenditure components of output in the latest quarter"
    ask: "How did the expenditure components develop in the latest quarter?"
    caption: "The bars show how each part of demand changed in the latest quarter, price adjusted. The diamond shows the value for the quarter before. Investment is split into equipment (machinery, vehicles, weapons systems), construction and other assets (mainly software and research)."
  cpi:
    title: "Inflation rate (CPI) and components"
    ask: "Which areas are becoming more expensive?"
    caption: "The chart shows the inflation rate based on the consumer price index of the Federal Statistical Office (Destatis), overall and for five components. Each panel highlights one component in dark blue and has its own scale; with “Common scale” the others appear in grey behind it for comparison. Above each panel are the latest value with the trend on the previous month and the averages of the last 3 and 12 months. Dashed: 2%, the target of the European Central Bank; it refers to the European harmonised index of consumer prices, which in Germany is usually close to the national index. ‘Services excluding rents’ leaves out actual and imputed rents (for owner-occupied housing) and therefore differs from the rate for all services reported by the Federal Statistical Office."
  cpi_contrib:
    title: "What the inflation rate is made of"
    ask: "What makes up the inflation rate?"
    caption: "The chart shows how many percentage points each component contributes to the inflation rate. You can switch between comparison with a year earlier and comparison with the previous month. The values are our own calculation: the component weights are estimated from the sub-indices of the consumer price index since 2020. The remainder covers rounding and parts not recorded separately."
  cpi_core:
    title: "Core rate compared with the HICP"
    ask: "How strong is underlying price pressure?"
    caption: "The thick line shows the core rate: inflation in the consumer price index excluding the volatile prices of energy and food. It shows the underlying price trend. The thin lines show the overall consumer price index and the European harmonised index of consumer prices, to which the European Central Bank's target refers. Dashed: 2%, that target."
  deflator:
    title: "Prices in the national accounts"
    ask: "How are prices developing in the national accounts?"
    caption: "The chart shows two national accounts deflators, that is price measures from the national accounts. The gross domestic product deflator shows how the prices of all goods and services produced domestically develop, the second deflator the prices of private consumption."
  pipeline_prices:
    title: "Upstream prices"
    ask: "Are prices rising at earlier stages?"
    caption: "The chart shows prices at the stages before goods reach consumers: producer prices for domestic sales and import prices. Producer prices are the prices that manufacturers charge for their goods. These prices often lead consumer prices."
  pipeline_core:
    title: "Upstream prices excluding energy, and agricultural prices"
    ask: "Are cost increases spreading beyond energy?"
    caption: "Upstream prices are prices before goods reach consumers. Excluding energy, they show whether cost increases are spreading beyond energy. Agricultural prices feed through to food prices with a lag."
  enso:
    title: "Food and agricultural prices after very strong El Niño events"
    ask: "Is El Niño driving food prices?"
    caption: "The chart is an event study: it follows prices from the start of very strong El Niño events (month 0 = 100), adjusted for general inflation. On the left is food in the consumer price index relative to the overall index (from 1995), on the right producer prices of agricultural products relative to consumer prices (up to 1990 former West Germany, there relative to the OECD consumer price index). The grey area shows the range of earlier very strong events, the lines individual events, the current one thick. An event starts in the first month of a sequence in which NOAA's Relative Oceanic Niño Index (RONI) reaches at least 0.5 °C; very strong means a peak of 2 °C or more. El Niño, a warming of the tropical Pacific, reduces harvests through droughts and heavy rain, mainly in South Asia, Africa and South America; in Germany the effect works through world market prices for grain, vegetable oils, cocoa and coffee, damped and delayed."
  price_exp:
    title: "Price expectations of businesses and consumers"
    ask: "What prices do businesses and consumers expect?"
    caption: "The chart shows the balance of the share of respondents expecting rising prices and the share expecting falling prices (EU surveys). Businesses look at the next three months, consumers at the next twelve months. Each panel highlights one sector in dark blue and has its own scale; with “Common scale” the others appear in grey behind it for comparison. Above each panel are the latest value with the trend on the previous month and the averages of the last 3 and 12 months."
  labour:
    title: "Unemployment rate"
    ask: "How high is unemployment?"
    caption: "The chart shows two measures of unemployment, both seasonally adjusted. The registered rate of the Federal Employment Agency counts people registered as unemployed with an employment agency or a job centre. The unemployment rate as defined by the International Labour Organization (ILO) is based on a survey: a person is unemployed if they have no work, are actively looking and are available at short notice. In Germany it is markedly lower and is internationally comparable. Since 2020 it has been based on the redesigned microcensus, a large official household survey; the switch is a break in the series."
  labour_flows:
    title: "Unemployed and vacancies"
    ask: "How are unemployment and vacancies developing?"
    caption: "The chart shows the number of unemployed people and of vacancies. If unemployment rises while the number of vacancies falls, this points to a cooling labour market."
  indeed:
    title: "Job postings on Indeed"
    ask: "Are firms advertising more or fewer jobs?"
    caption: "The chart shows the number of job postings on the Indeed platform in Germany, seasonally adjusted, 1 February 2020 = 100. The values are a trailing seven-day average and are updated weekly. The series is available weeks before the statistics of the Federal Employment Agency, but covers only one platform. Source: Indeed Hiring Lab, licence CC BY 4.0."
  employment_m:
    title: "Persons in employment and employees subject to social security contributions"
    ask: "How many people are in work?"
    caption: "Persons in employment also include the self-employed and civil servants; employees subject to social security contributions make up the largest part. The chart shows the change on the same month a year earlier, in per cent."
  sahm:
    title: "Recession signal"
    ask: "Is the labour market pointing to a recession?"
    caption: "Own calculation following Michaillat and Saez (2025): the signal rises only if unemployment increases and vacancies decrease at the same time. It is the smaller of two values, namely the rise of the unemployment rate including short-time work above its low of the past twelve months and the fall of the vacancy rate below its high of the past twelve months, each using three-month moving averages. Red dashed is the threshold of 0.25 percentage points, our own choice for Germany; Michaillat and Saez give 0.29 for the United States. Grey areas show recessions as dated by the German Council of Economic Experts; every recession since 2001 crossed the threshold, some with a considerable lag. References: Michaillat, P. and Saez, E. (2025), Has the Recession Started?, Oxford Bulletin of Economics and Statistics; Sahm, C. (2019), Direct Stimulus Payments to Individuals, Brookings Institution."
  kurzarbeit:
    title: "Short-time work for cyclical reasons"
    ask: "How many employees are on short-time work?"
    caption: "The chart shows employees on short-time work for cyclical, that is, economic reasons (§ 96 of Book III of the Social Code), in thousands. Short-time work keeps employees in the firm when orders are temporarily lacking. In downturns it rises earlier than unemployment. The latest months are based on projections by the Federal Employment Agency."
    unit: "thousand people"
  sv_yoy:
    title: "Employment subject to social security contributions by sector"
    ask: "In which sectors is employment growing?"
    caption: "The chart shows employees subject to social security contributions by sector, as the change on the same month a year earlier. Temporary agency work is the first to react to weaker demand, because firms shed agency workers first."
  industry:
    title: "Industrial production and orders"
    ask: "How are industrial production and orders developing?"
    caption: "Thin: monthly values, thick: three-month moving average. New orders lead production, because what is ordered today is usually made later."
  orders_split:
    title: "Orders from Germany, the euro area and elsewhere"
    ask: "Where do orders come from: Germany, the euro area or elsewhere?"
    caption: "The lines show new manufacturing orders by origin: domestic, euro area and rest of the world. They are adjusted for prices, season and calendar. Large orders, for example for aircraft, ships or military equipment, cause occasional sharp spikes. Thick: three-month moving average; thin: monthly values (can be hidden with the button)."
  orders_euro:
    title: "Orders from the euro area and from outside"
    ask: "How are orders from the euro area and from outside developing?"
    caption: "Orders from abroad, split into the euro area and the rest of the world. Thick: three-month moving average; thin: monthly values (can be hidden with the button)."
  rhine:
    title: "Rhine at the Kaub gauge, daily mean"
    ask: "Is the Rhine easily navigable for cargo ships?"
    caption: "The chart shows the water level at the Kaub gauge as a daily mean, in centimetres; Kaub is the bottleneck for Rhine shipping between Mainz and Koblenz. The chemical, steel, oil and coal industries ship large volumes on the Rhine. Red dashed is the 78 centimetre mark: if the level stays below it for a month, industrial production falls by about 1%, according to a rule of thumb from the Kiel Institute (IfW Kiel). Up to the end of the previous year the values come from verified gauge data of the Federal Waterways and Shipping Administration (WSV, Federal Institute of Hydrology), thereafter from PEGELONLINE."
  rhine_low:
    title: "Low-water days on the Rhine per year"
    ask: "How often has the Rhine been too shallow since 1970?"
    caption: "The chart counts, per calendar year, the days on which the daily mean water level at the Kaub gauge was below 78 centimetres; the current year runs up to the latest day. Long low-water spells such as in 2018 and 2022 made transport more expensive and held back industry. The values are verified gauge data of the Federal Waterways and Shipping Administration (WSV), provided by the Federal Institute of Hydrology (R package hyd1d); the latest values come from PEGELONLINE."
  branch_heat:
    title: "Production by industry"
    ask: "Which industries are producing more, and which less?"
    caption: "The table shows production by industry, in per cent on the same month a year earlier; orange means an increase, blue a decrease. It is sorted by the three-month comparison, that is, the last three months against the three months before. The right-hand columns show this three-month comparison and the level against the 2019 average. Both values appear as bars in the following chart."
  orders_heat:
    title: "New orders by industry"
    ask: "Which industries are receiving more orders?"
    caption: "The table shows new orders by industry, in per cent on the same month a year earlier, price adjusted; orange means an increase, blue a decrease. It is sorted by the three-month comparison, that is, the last three months against the three months before. The right-hand columns show this three-month comparison and the level against the 2019 average; both appear as bars in the following chart. Large orders, especially in other transport equipment (such as aircraft, ships and rail vehicles), distort individual months."
  prod_groups:
    title: "Production by type of goods"
    ask: "Which types of goods are carrying production?"
    caption: "Intermediate goods are processed further, such as steel or chemicals. Capital goods are mainly machinery and vehicles. Consumer goods are bought by private households. Thick: three-month moving average; thin: monthly values (can be hidden with the button)."
  sales:
    title: "Industrial turnover, nominal"
    ask: "How is industrial turnover developing?"
    caption: "Industrial turnover at current prices, i.e. not price adjusted; total, by sales market and for capital goods. Thick: three-month moving average; thin: monthly values (can be hidden with the button)."
  bau_orders:
    title: "Orders in the main construction sector"
    ask: "How are construction orders developing?"
    caption: "The lines show orders in the main construction sector (mainly building and civil engineering), price adjusted, in total and by type of construction. Individual large projects cause sharp spikes. Thick: three-month moving average; thin: monthly values (can be hidden with the button)."
  permits:
    title: "Building permits for dwellings"
    ask: "Will more be built soon?"
    caption: "The chart shows how many dwellings are approved each month, in thousands (Federal Statistical Office). It counts dwellings in new buildings and those created by construction work on existing buildings. Permits lead housing construction by about one to two years. Not every permit is actually built."
  house_prices:
    title: "Residential property prices"
    ask: "How are residential property prices developing?"
    caption: "The house price index of the Federal Statistical Office shows prices of newly built and existing residential property, that is, houses and owner-occupied flats. The chart shows the change on the same quarter a year earlier. The figures are published about three months after the end of a quarter."
  weather:
    title: "Weather in Germany"
    ask: "Was the weather unusual for construction?"
    caption: "The chart shows monthly values from the German Weather Service for Germany as a whole. Temperature is shown as the deviation from the 1991 to 2020 average for the same month, in °C, precipitation as a percentage of the 1991 to 2020 average for the same month; the dashed line in the precipitation panel marks 100% of the average. A very cold, frosty or wet winter month depresses construction output, a mild one lifts it; the swings usually even out in the following months. Unusual months appear in the construction output chart under ‘Swings and special effects’."
  bau_prod:
    title: "Construction output"
    ask: "How much is being built?"
    caption: "The chart shows construction output. The finishing trades cover installation, electrical work and interior finishing. Thick: three-month moving average; thin: monthly values (can be hidden with the button)."
  services:
    title: "Output of service providers"
    ask: "How is output of service providers developing?"
    caption: "The chart shows price-adjusted output of selected service sectors. ‘Total’ covers transport and storage, accommodation and food services, information and communication, real estate, and professional, technical and other business services. Trade, finance and government are not included. Service providers generate a good two-thirds of value added, but monthly data cover them only patchily. Thick: three-month moving average; thin: monthly values (can be hidden with the button)."
  retail:
    title: "Retail sales, real"
    ask: "How much are retailers selling?"
    caption: "The chart shows retail sales excluding motor vehicle trade, price adjusted, that is, the volume sold. Retail accounts for about a third of private consumption; services, rents and cars are not included. Thick: three-month moving average; thin: monthly values (can be hidden with the button)."
  retail_split:
    title: "Retail sales by product range, real"
    ask: "Which product ranges are selling better?"
    caption: "The chart shows retail sales by product range, adjusted for price changes. The data come from the Federal Statistical Office via Eurostat. Food here means retail sale of food, beverages and tobacco; non-food excludes petrol stations. Thick: three-month moving average, that is the average over three months; thin: monthly values, which can be hidden with the button."
  hospitality:
    title: "Hospitality, real"
    ask: "How is the hospitality sector doing?"
    caption: "The chart shows the turnover of restaurants and hotels, adjusted for price changes. Thick: three-month moving average, that is the average over three months; thin: monthly values, which can be hidden with the button."
  cars:
    title: "New cars registered by private owners"
    ask: "Are households buying new cars?"
    caption: "The chart shows how many new passenger cars private owners register each month, in thousands. The number indicates whether households are willing to make larger purchases. Thick: three-month moving average, that is the average over three months; thin: monthly values, which can be hidden with the button."
  consumer:
    title: "Consumer confidence"
    ask: "How confident are consumers?"
    caption: "The line shows the balance, that is the difference between positive and negative responses from households. If it is below zero, negative assessments prevail."
  wages:
    title: "Nominal and real wages"
    ask: "Are wages rising faster than prices?"
    caption: "The nominal wage index measures average gross monthly earnings including special payments. The real wage index is the nominal wage index adjusted for the change in consumer prices. Each line shows the change on the same quarter a year earlier. If real wage growth is above zero, wages are rising faster than prices."
  hh_income:
    title: "Real disposable income per head"
    ask: "How are household incomes developing?"
    caption: "The chart shows the disposable income of private households per inhabitant, 2010 = 100. It includes wages, profits, property income (such as interest and dividends) and social benefits, after taxes and contributions. The income is adjusted for the change in consumption prices."
  saving:
    title: "Household saving ratio"
    ask: "How much are households saving?"
    caption: "The saving ratio is the share of disposable income that households do not spend on consumption. When it rises, this dampens consumption; households often save in this way out of caution in uncertain times. The chart shows the gross saving ratio as defined by Eurostat: saving including depreciation (the loss in value of buildings and equipment) relative to gross disposable income. The better-known saving ratio of the Federal Statistical Office is defined differently and is markedly lower."
  profit_share:
    title: "Corporate profit share"
    ask: "How is value added split between profits and wages?"
    caption: "The profit share is the gross operating surplus of non-financial corporations, that is, all firms except banks and insurers, as a percentage of their value added. If the profit share rises, a larger part of value added goes to profits and a smaller part to wages."
  trade:
    title: "Trade in goods"
    ask: "How are exports and imports developing?"
    caption: "The chart shows goods exports, goods imports and their balance (exports minus imports) in billions of euros per month. Thick: three-month moving average, that is the average over three months; thin: monthly values, which can be hidden with the button. The values are nominal, that is in current prices; part of the change is therefore due to prices (see the chart on foreign trade prices)."
  trade_region:
    title: "Exports by region"
    ask: "Where does Germany export to?"
    caption: "The chart shows goods exports to the main customer regions in billions of euros per month. Thick: three-month moving average, that is the average over three months; thin: monthly values, which can be hidden with the button. The values are nominal, that is in current prices."
  trade_prices:
    title: "Foreign trade prices"
    ask: "How are foreign trade prices developing?"
    caption: "The chart shows export prices and the terms of trade, that is export prices relative to import prices. If the terms of trade rise, Germany can pay for more imports with the same volume of exports."
  balances:
    title: "Current-account balance"
    ask: "How large is the current-account surplus?"
    caption: "The chart shows the current-account balance in billions of euros. The current account covers goods, services, and primary and secondary income. Each value is the sum of the latest twelve months; this smooths out the strong seasonal swings in the monthly values."
  esi:
    title: "Export similarity with Germany"
    ask: "Who competes with goods similar to Germany's?"
    caption: "The value measures how similar a country's exports are to Germany's by type of goods: 0 means no overlap, 100 an identical mix. It is calculated following Finger and Kreinin (1979): for each product group the smaller of the two shares counts. High values mean that both countries compete with similar goods on world markets. China is highlighted."
  world_gdp:
    title: "Growth in major economies"
    ask: "How fast are the major economies growing?"
    caption: "The chart shows real gross domestic product, that is economic output without price effects, compared with the same quarter a year earlier. The euro area takes about 37% of German goods exports, the United States about 10%."
  ez_gdp:
    title: "Growth compared across the euro area"
    ask: "Is Germany growing faster or more slowly than its neighbours?"
    caption: "The chart shows real gross domestic product compared with the same quarter a year earlier for Germany, France, Italy, Spain and the euro area, seasonally and calendar adjusted (Eurostat). Each panel highlights one country in dark blue and has its own scale; with “Common scale” the others appear in grey behind it for comparison. Together the four countries generate about three-quarters of euro-area output."
  ez_hicp:
    title: "Inflation compared across the euro area (HICP)"
    ask: "Is inflation in Germany higher than in neighbouring countries?"
    caption: "The chart shows the harmonised index of consumer prices compared with the same month a year earlier (Eurostat; from 2026 based on the new product classification ECOICOP 2). This index is internationally comparable and is the basis of the European Central Bank's inflation target of 2% (dashed). For Germany it usually differs only slightly from the national consumer price index. Each panel shows one country on its own scale; with “Common scale” the other countries appear in grey behind it for comparison."
  ez_unemp:
    title: "Unemployment compared across the euro area"
    ask: "How high is unemployment by comparison?"
    caption: "The chart shows the unemployment rate as defined by the International Labour Organization (ILO), seasonally adjusted (Eurostat; for the euro area: European Central Bank). It gives the unemployed as a share of the labour force, that is everyone who works or is looking for work. The rate is internationally comparable and in Germany is markedly below the registered unemployment rate of the Federal Employment Agency. Each panel shows one country on its own scale; with “Common scale” the other countries appear in grey behind it for comparison."
  ez_ip:
    title: "Industrial production compared across the euro area"
    ask: "Is German industry doing worse than its neighbours?"
    caption: "The chart shows manufacturing output compared with the same month a year earlier, calendar adjusted (Eurostat), for Germany, France, Italy, Spain and the euro area (21 countries since 2026). The figures for Germany may differ slightly from the Bundesbank data in the industry section because they are adjusted differently. Each panel shows one country on its own scale; with “Common scale” the other countries appear in grey behind it for comparison."
  ez_esi:
    title: "Economic sentiment compared across the euro area (ESI)"
    ask: "Is sentiment in Germany worse than in neighbouring countries?"
    caption: "The chart shows the Economic Sentiment Indicator (ESI) of the European Commission, seasonally adjusted. The indicator is a weighted average of surveys in industry, services, retail and construction and among consumers. 100 is each country's long-term average (dashed); the indicator therefore shows whether sentiment is better or worse than usual. It does not show the gap between countries. Each panel shows one country on its own scale; with “Common scale” the other countries appear in grey behind it for comparison."
  uncertainty:
    title: "Economic policy uncertainty"
    ask: "How uncertain is economic policy?"
    caption: "The index of Baker, Bloom and Davis measures economic policy uncertainty: it is based on how often relevant terms appear in newspaper articles; the 1997 to 2015 average is 100. When uncertainty is high, firms postpone investment. The series are updated with different time lags and so do not end in the same month."
  clock:
    title: "Business cycle clock for industry"
    ask: "Which phase of the business cycle is industry in?"
    caption: "Horizontally: how industrial firms rate their order books today; vertically: what they expect for the next three months, both as the gap to the 2005 to 2019 average. The trail shows the last 24 months, the large dot the latest month, the arrows the direction. In a typical business cycle the dot moves clockwise through the four shaded phases: upswing, boom, downswing, recession."
  sentiment:
    title: "Sentiment by sector"
    ask: "What is the mood in the different sectors?"
    caption: "The chart shows, for each sector, the balance of positive and negative responses in EU surveys. The levels of the sectors cannot be compared directly, because the questions differ. What matters is the change."
  sector_now:
    title: "Current situation by sector"
    ask: "How do the sectors assess their current situation?"
    caption: "The chart shows how the sectors assess their business over the past three months, as the balance of positive and negative responses (EU surveys). Each panel highlights one sector in dark blue and has its own scale. With the “Common scale” button the other sectors appear in grey behind it for comparison. Above each panel are the latest value with the trend on the previous month and the averages of the last 3 and 12 months."
  sector_next:
    title: "Expectations by sector"
    ask: "What do the sectors expect for the coming months?"
    caption: "The chart shows what the sectors expect for the coming three months, as the balance of positive and negative responses (EU surveys). For construction the survey asks about employment plans here. Each panel highlights one sector in dark blue and has its own scale. With the “Common scale” button the other sectors appear in grey behind it for comparison. Above each panel are the latest value with the trend on the previous month and the averages of the last 3 and 12 months."
  capacity:
    title: "Capacity utilisation in industry"
    ask: "How fully is industrial capacity being used?"
    caption: "The chart shows in per cent how fully industry uses its production capacity, that is how much of what it could produce it actually produces. It is based on a survey held every quarter. Grey dashed: average 2005 to 2019."
  insolv:
    title: "Business insolvencies per month"
    ask: "How many businesses are filing for insolvency?"
    caption: "The chart shows how many businesses file for insolvency proceedings each month. Thin: monthly values. Thick: twelve-month moving average, which smooths out seasonal swings. Dashed: pre-crisis level, the average of the same month in the years 2015 to 2019."
  insolv_land:
    title: "Insolvencies by state"
    ask: "In which states are insolvencies rising?"
    caption: "The chart shows for each state how business insolvency filings have changed on the same period a year earlier. A switch toggles between periods of 12 and 6 months. Orange means an increase, blue a decrease. The list on the right ranks the states by change."
    what: "Number of insolvency filings"
  insolv_emp:
    title: "Employees affected by insolvencies per month"
    ask: "How many employees are affected?"
    caption: "The chart shows how many people work in businesses that have filed for insolvency. Single large insolvencies cause sharp spikes. Thin: monthly values, thick: twelve-month moving average, which smooths out seasonal swings. Dashed: pre-crisis level, the average of the same month in the years 2015 to 2019."
  insolv_claims:
    title: "Expected creditor claims per month"
    ask: "How large are creditors' claims?"
    caption: "The chart shows how much money creditors in insolvency proceedings are expected to claim, in billions of euros. Thin: monthly values, thick: twelve-month moving average, which smooths out seasonal swings. Dashed: the usual level before COVID, the average of the same month in the years 2015 to 2019. The amounts are not adjusted for prices; prices have risen by about a quarter since 2019."
  gruend_land:
    title: "Business start-ups by state"
    ask: "Where are more businesses being started?"
    caption: "The chart shows for each state how start-ups of businesses of greater economic significance (head offices) have changed on the same period a year earlier. Orange means an increase, blue a decrease. The list on the right ranks the states by change."
    what: "Number of business start-ups"
  aufgabe_land:
    title: "Business closures by state"
    ask: "Where are more businesses closing?"
    caption: "The chart shows for each state how the number of businesses of greater economic significance (head offices) that close completely has changed on the same period a year earlier. Orange means an increase, blue a decrease. The list on the right ranks the states by change."
    what: "Number of business closures"
  credit_rates:
    title: "Interest rates on new bank loans"
    ask: "How expensive are loans?"
    caption: "The chart shows the effective interest rate banks in Germany charge on newly granted loans, weighted across all maturities. It covers loans to companies outside the financial sector and loans to private households for house purchase. The rates follow the European Central Bank's policy rates and capital-market rates with a lag. Source: the European Central Bank's MFI interest rate statistics."
  credit_growth:
    title: "Growth in bank lending"
    ask: "Are banks lending more?"
    caption: "The chart shows how fast the stock of bank loans in Germany grows on the same month a year earlier: loans to companies outside the financial sector and housing loans to private households. The figures are adjusted for reclassifications and valuation changes (European Central Bank, balance sheet statistics). Weak credit growth points to low investment or tight lending."
  yields:
    title: "Federal bond yields"
    ask: "How high are yields on federal bonds?"
    caption: "The chart shows the yield on federal bonds with 10 or 2 years left until repayment, as a monthly average. The yield is the annual return a bond brings to someone buying it today. It affects how much government, businesses and private home builders pay for their financing."
  yields_d:
    title: "Federal bond yields and overnight rate, daily"
    ask: "How have interest rates moved in recent weeks?"
    caption: "The chart shows daily values for the yield on federal bonds with 10 or 2 years left until repayment (Bundesbank term structure). It also shows the euro short-term rate €STR: the rate at which banks lend to each other overnight. The €STR closely follows the European Central Bank's deposit rate, the rate banks receive on money held at the central bank."
  ecb_rates:
    title: "ECB policy rates"
    ask: "Where are the ECB's policy rates?"
    caption: "The chart shows the European Central Bank's three policy rates as monthly averages. Banks receive the deposit facility rate on money they leave at the central bank overnight. At the main refinancing rate they borrow for one week, at the marginal lending rate overnight. Since banks have held very large amounts of money at the central bank, the deposit rate has mainly steered money-market rates. The chart also shows the euro short-term rate €STR, at which banks lend to each other overnight."
  ecb_bs:
    title: "Eurosystem balance sheet"
    ask: "How large is the central banks' balance sheet?"
    caption: "The area shows the asset side of the Eurosystem, i.e. the European Central Bank and the national central banks of the euro area, in trillions of euros. Together the parts add up to total assets. Bond purchases are securities from the purchase programmes APP (from 2009, broad from 2015) and PEPP (from 2020). Loans to banks come from monetary policy operations such as the targeted longer-term operations (TLTRO). Other securities are held for non-monetary purposes. The “Events” switch shows key decisions. Monthly averages of the weekly financial statements."
  qe_prog:
    title: "ECB bond holdings by programme"
    ask: "What has the ECB bought with its programmes?"
    caption: "The area shows the Eurosystem's holdings under its purchase programmes at the end of each month, in trillions of euros, at book value. The public sector purchase programme (PSPP) is the largest part of the APP launched in 2015. It is joined by corporate bonds (CSPP), covered bank bonds (CBPP3) and asset-backed securities (ABSPP). The pandemic programme PEPP ran from 2020. Since July 2023 the ECB no longer replaces maturing APP bonds, and since early 2025 no longer PEPP bonds either; holdings are shrinking. Source: the European Central Bank's monthly data on the purchase programmes."
  qe_land:
    title: "Government bond purchases by country"
    ask: "Whose government bonds has the ECB bought?"
    caption: "The lines show how much the Eurosystem has spent since 2015 on government bonds of the four largest euro countries, net of maturing bonds it did not replace, in billions of euros. They cover the public sector purchase programme (PSPP) and the public part of the pandemic programme (PEPP). The ECB buys roughly in line with the countries' shares in its capital, not in line with their debt. The values are cumulated net purchases at book value; valuation changes are not included. Source: the European Central Bank's monthly data on the purchase programmes."
  tpi:
    title: "Conditions for the TPI"
    ask: "Which countries could get help from the TPI?"
    caption: "Since July 2022 the Transmission Protection Instrument (TPI) allows the ECB to buy a country's government bonds if its yields rise sharply without good reason. The ECB names no fixed yield threshold. It does set four conditions: the country complies with the EU fiscal rules, has no severe economic imbalances, its debt is sustainable, and it implements its reform commitments. The table shows two measurable parts: whether an EU excessive deficit procedure is ongoing (European Commission page) and the government budget balance and debt in the latest year (Eurostat). Red marks an ongoing procedure, a deficit above 3% and debt above 60% of GDP, the limits of the Stability and Growth Pact. An ongoing procedure does not rule out the TPI if the country follows the recommendations; the ECB checks this case by case. The spread over Bunds is the ten-year government bond yield minus Germany's, in the latest month. Click a column header to sort the table."
  fr_gauge:
    title: "How close is France to the euro crisis?"
    ask: "How close is France to the 2011 euro crisis?"
    caption: "Each row shows how far an indicator has moved from its normal level (0%, the 2015–2019 average) towards its worst value in the euro crisis (100%, July 2011 to December 2012). Solid dot: latest value; hollow dot: a year earlier. Above 100% a value is worse than in the euro crisis. The spread is the ten-year government bond yield minus Germany's (ECB). The budget deficit is the general government balance in the latest year (Eurostat). Financial market stress is the ECB's Composite Indicator of Systemic Stress (CISS), which condenses volatility and risk premia in equity, bond, money and foreign exchange markets into a number between 0 and 1. The debt ratio is left out because it was lower in 2011/12 than later; it is now about 116% of GDP against about 92% in 2012. The chart shows the distance to a past crisis, not the probability of a new one. For Germany what matters most is whether stress spreads to other countries; the lower group measures that."
  fr_stress:
    title: "Financial stress in France and neighbouring countries"
    ask: "Is stress rising in France's financial markets?"
    caption: "The lines show the European Central Bank's Composite Indicator of Systemic Stress (CISS) for France, Germany, Italy and Spain, as monthly averages. The index condenses volatility and risk premia in equity, bond, money and foreign exchange markets into a number between 0 and 1; 1 is maximum stress. If the lines rise together, stress spreads from one country to others, as in 2008 and 2011. The “Events” switch shows key monetary policy decisions."
  fr_exports:
    title: "France's share of German exports"
    ask: "How important is France for German exports?"
    caption: "The line shows France's share of all German goods exports, calculated over the latest twelve months, in per cent. A crisis in France would hit Germany first through this trade: if demand there falls, German exports fall. Losses for banks and investors holding French bonds would come on top; no freely usable monthly data exist for that. Source: Deutsche Bundesbank foreign trade statistics, not adjusted; the share is our own calculation."
  spreads:
    title: "Yield spread over Bunds"
    ask: "How much more do other euro countries pay than Germany?"
    caption: "The chart shows by how many percentage points the yield on ten-year government bonds of Italy, France and Spain exceeds the yield on German Bunds, as a monthly average. A wider spread shows that investors demand more interest for a country's risk. In the euro crisis of 2011 and 2012 it rose above 5 percentage points for Italy and Spain. The yields come from the European Central Bank's statistics on the interest-rate criterion of the convergence assessment."
  zinskurven:
    title: "Government bond yield curves"
    ask: "What do governments pay for short and long maturities?"
    caption: "The lines show the yield on government bonds of Germany, Italy and Spain by residual maturity, in per cent. Solid is the latest month, dotted the same month a year earlier. If the line rises to the right, long maturities pay more than short ones; that is the normal case. A higher line means investors demand more interest from that country. Values are monthly averages; for Italy they are the yields of the benchmark bond for each maturity. Sources are the Deutsche Bundesbank, the Banca d'Italia and the Banco de España. France is missing because no freely usable data exist: the Banque de France curve (TEC indices) may not be redistributed without the consent of the index provider Euronext."
  curve_slope:
    title: "Gap between long and short rates"
    ask: "Do long maturities pay more than short ones?"
    caption: "The lines show for each country the yield on ten-year government bonds minus the yield on three-year bonds, in percentage points, monthly. Above zero long maturities pay more than short ones; that is the normal case. Below zero investors usually expect policy rates to fall; this has often preceded a recession. If a country's gap widens sharply, a higher risk premium on long maturities may also be behind it. Sources are the Deutsche Bundesbank, the Banca d'Italia and the Banco de España."
  corp_yields:
    title: "Corporate bond yields"
    ask: "How much do companies pay on bonds?"
    caption: "The chart shows the yield on outstanding domestic bonds of companies outside the banking sector and of public-sector bonds, as a monthly value across all residual maturities. The yield on outstanding bonds is the return that bonds already traded bring to buyers today. In May 2020 the Bundesbank adjusted the set of corporate bonds included."
  corp_spread:
    title: "Corporate bond spread"
    ask: "What premium do investors demand from companies?"
    caption: "The chart shows by how many percentage points the yield on outstanding domestic corporate bonds (excluding banks) exceeds the yield on public-sector bonds. If the spread widens, investors demand more compensation for companies' default risk, as in the financial crisis of 2008 and 2009. The residual maturities of the two groups differ, so the spread is only a rough measure. In May 2020 the Bundesbank adjusted the set of corporate bonds included."
  bls_std:
    title: "Banks' credit standards"
    ask: "Are banks tightening lending?"
    caption: "The chart shows from the Eurosystem's Bank Lending Survey whether banks in Germany tightened or eased their credit standards over the past three months. The balance is the share of banks with tighter standards minus the share with easier ones, in per cent. Above zero means: more banks have tightened. Around 35 banks are surveyed every quarter."
  bls_dem:
    title: "Loan demand at banks"
    ask: "Are businesses and households asking for more loans?"
    caption: "The chart shows from the Eurosystem's Bank Lending Survey how demand for loans at banks in Germany developed over the past three months. The balance is the share of banks reporting rising demand minus the share reporting falling demand, in per cent. Above zero means: more banks see rising demand."
  fx_usd:
    title: "Euro in US dollars, daily values"
    ask: "How many US dollars does a euro cost?"
    caption: "Reference rate of the European Central Bank: how many US dollars one euro costs, set at around 16:00 on each working day. If the line rises, the euro becomes more expensive: imports from the dollar area, including crude oil and gas, become cheaper in euro terms, and German exports become more expensive in the dollar area."
  fx_eer:
    title: "Effective exchange rate of the euro, daily values"
    ask: "Is the euro becoming more expensive against all trading partners?"
    caption: "The chart shows the European Central Bank's nominal effective exchange rate: an average of the euro's exchange rates against the currencies of the euro area's trading partners, weighted by their share of trade, with 1999 Q1 = 100. The broad group comprises 41 partners, the narrow one 18 (including the United States, China, the United Kingdom, Switzerland and Japan). If the index rises, the euro becomes more expensive on average; this makes exports dearer and imports cheaper. The broad group is higher because many emerging-market currencies have lost value against the euro since 1999. What matters for price competitiveness is the real rate, which also takes price developments into account."
  fx:
    title: "Euro against four currencies, daily values"
    ask: "How is the euro moving against major currencies?"
    caption: "The chart shows the European Central Bank's reference rates for each working day: how many units of a currency you get for one euro. Each panel shows one currency on its own scale, because the rates differ widely in level. If a line rises, the euro becomes more expensive against that currency. Above each panel are the latest rate with the trend on the previous day and the averages of the last 3 and 12 months."
  oil:
    title: "Oil price"
    ask: "How expensive is crude oil?"
    caption: "The chart shows the price of a barrel (159 litres) of North Sea Brent crude oil as a monthly average. The price is quoted in US dollars, as is customary internationally."
  fuel:
    title: "Prices of petrol, diesel and heating oil"
    ask: "How much do petrol, diesel and heating oil cost?"
    caption: "The chart shows consumer prices in Germany in euros per litre, including taxes and duties. The prices apply to Monday of each week. Source: European Commission, Weekly Oil Bulletin."
  oil_d:
    title: "Oil price, daily"
    ask: "How expensive is crude oil?"
    caption: "The chart shows the price of a barrel (159 litres) of North Sea Brent crude oil in US dollars, as is customary internationally. Thin: daily values on trading days, thick: moving average over five trading days. The daily values appear with a lag of about one week."
  power:
    title: "Electricity: consumption and wholesale price"
    ask: "How much electricity is being used, and what does it cost on the wholesale market?"
    caption: "The chart shows electricity consumption (grid load) in Germany compared with the same month a year earlier, and the wholesale electricity price on the day-ahead market (Germany/Luxembourg bidding zone), as a monthly average in euros per megawatt hour. On the day-ahead market, electricity is traded for the next day. Consumption closely tracks industrial production, but is available just a few days after the end of the month. Weather and public holidays distort individual months. Source: Federal Network Agency | SMARD.de, licence CC BY 4.0."
  power_d:
    title: "Electricity: consumption and wholesale price, daily"
    ask: "How much electricity has been used in recent weeks, and what does it cost?"
    caption: "The chart shows electricity consumption (grid load) in gigawatt hours per day and the wholesale price on the day-ahead market (Germany/Luxembourg bidding zone), as a daily average in euros per megawatt hour. On the day-ahead market, electricity is traded for the next day. Thin: daily values, thick: seven-day moving average. Weekends and public holidays push down consumption and price. Source: Bundesnetzagentur | SMARD.de, licence CC BY 4.0."
  gas_storage:
    title: "Gas storage fill level, daily values"
    ask: "How full are the gas storage facilities?"
    caption: "The chart shows daily how full German gas storage facilities are, in % of working gas capacity, that is the usable storage volume. The facilities are filled in summer and drawn down in winter. If the level is low at the start of winter, the risk of price spikes rises. The law sets minimum fill levels on reference dates in the autumn. Source: GIE (AGSI)."
  hdd:
    title: "Heating degree days"
    ask: "How much heating is needed?"
    caption: "Heating degree days measure how much heating is needed: the colder a day below 15 °C, the more degree days it counts (VDI 3807, room temperature 20 °C), here per month in kelvin times days. The bars show the monthly values, the black marks the average for the same month 2015 to 2019; a bar reaching above the mark means the month was colder than usual. Summer months carry little weight, as little heating is needed then. A cold winter raises consumption of gas and heating oil and energy generation, a mild one lowers them. The values are the unweighted average of all stations of the German Weather Service, as it does not publish a figure for Germany as a whole."
  gas:
    title: "Natural gas price in Europe"
    ask: "How expensive is natural gas?"
    caption: "The chart shows the wholesale price of natural gas in Europe at the TTF trading hub as a monthly average. The International Monetary Fund reports the price in US dollars per MMBtu, an energy unit common in the United States. Here it is converted into euros per megawatt hour, the unit customary in Europe, using the monthly average of the European Central Bank's reference rate (1 MMBtu = 0.293071 megawatt hours)."
  diffusion:
    title: "Breadth: share of manufacturing industries growing"
    ask: "Is industry growing across the board or only in a few industries?"
    caption: "The lines show the share of manufacturing industries whose output (24 industries) or orders (9 industries) in the last three months were higher than in the three months before, in %. Each industry counts equally, whatever its size. Above 50%, most industries are growing. The lines are three-month moving averages; monthly values can be shown. Grey areas show recessions as dated by the German Council of Economic Experts."
  proj_gap:
    title: "GDP and the Federal Government's projection"
    ask: "Is growth on track for the Federal Government's projection?"
    caption: "The bars show growth in real economic output (gross domestic product) on the same quarter a year earlier in %, unadjusted like the annual rate of the Federal Government's projection. The light bars show the rate each remaining quarter of the year would have to reach for the year to meet the latest projection (dashed line); revisions to earlier quarters change this required rate. The annual figure is the sum of the four quarters; the calculation uses the unadjusted volume index, not rounded rates. Once all four quarters are in, the chart shows the outcome of the past year until the first quarter of the following year. A switch changes to the seasonally and calendar adjusted rate on the previous quarter: the light bars then show the same rate in each missing quarter with which the adjusted year reaches the projection's calendar-adjusted rate. The switch is missing if the projection gives no calendar-adjusted rate."
  forecast:
    title: "Growth forecasts"
    ask: "What do the forecasts expect for growth?"
    caption: "Each dot is a forecaster's latest forecast for growth in real, that is price-adjusted, economic output (gross domestic product) on the previous year, by target year. Dark blue with figure is the Federal Government's projection, on which the budget and the tax revenue estimate are based; grey are other forecasters, light grey if their forecast is more than four months old. The grey field shows the range from the lowest to the highest value. The tooltip, the box that appears when you point at a dot, names forecaster and date and marks some values that come from press reports on the publications. The Joint Economic Forecast is the joint forecast by DIW, ifo, IfW Kiel, IWH and RWI."
  forecast_infl:
    title: "Inflation forecasts"
    ask: "What do the forecasts expect for inflation?"
    caption: "Each dot is a forecaster's latest forecast for the inflation rate on the previous year, by target year, usually measured by the consumer price index. The Bundesbank forecasts the European harmonised index of consumer prices, which is usually close to the consumer price index. Dark blue with figure is the Federal Government; grey are other forecasters, light grey if their forecast is more than four months old. The grey field shows the range of all latest forecasts. The tooltip that appears when you point at a dot names forecaster and date and marks some values taken from press reports."
  forecast_core:
    title: "Core inflation forecasts"
    ask: "What do the forecasts expect for core inflation?"
    caption: "The chart shows forecasts for the inflation rate excluding energy and food, known as core inflation. It is shown only once at least two forecasters have published a value."
  potential:
    title: "Growth and potential output"
    ask: "Is the economy growing faster than its potential?"
    caption: "Potential output is the economic output that would be possible with normal use of workers and machinery; it cannot be observed, so it is estimated. The shaded area shows the range of estimates by the European Commission (AMECO), the OECD and the International Monetary Fund, lighter in forecast years; the individual values are in the tooltip. The estimates differ in method and data vintage and are revised with every edition. If economic output (bars) grows faster than potential, utilisation rises; the gap between the two levels is called the output gap. If it is positive, inflation becomes more likely; if it is negative, capacity is left unused."
  productivity:
    title: "Labour productivity"
    ask: "How is productivity developing?"
    caption: "The chart shows real economic output per person employed and per hour worked, that is how much a person in work or an hour of work produces on average, adjusted for prices. In the long run, this productivity determines prosperity."
  inv_ratio:
    title: "Investment ratio"
    ask: "How much does Germany invest compared with the EU?"
    caption: "The chart shows how much Germany and the European Union invest, as a percentage of economic output (gross domestic product). This means gross fixed capital formation: spending on machinery, buildings, software and research."
  emp_sector:
    title: "Persons in employment by economic sector"
    ask: "In which sectors are jobs being created?"
    caption: "The chart shows how the number of people in work in each economic sector has changed since the second quarter of 2022, in thousands. In brackets is the same change as a percentage of the 2022 second-quarter level. This shows how employment is shifting from industry to services."
    unit: "thousand people, change since 2022 Q2"
  migration:
    title: "Net migration"
    ask: "How many people are moving to Germany?"
    caption: "The chart shows arrivals minus departures across Germany's borders, in millions of people and including statistical adjustment. Since 2011 immigration has contributed substantially to the growth of the labour force. The years 2015 and 2022 are marked by people fleeing Syria and Ukraine."
    unit: "million people"
  migration_groups:
    title: "Net migration by citizenship"
    ask: "Who is moving in, and who is moving out?"
    caption: "The chart shows arrivals minus departures by citizenship, in thousands. Germans have been net emigrants for years: more Germans leave than arrive. Immigration from outside the EU is shaped by refugee flows, that from within the EU mainly by labour migration. The figures exclude statistical adjustment, so the total differs from the net migration chart."
    unit: "thousand people"
  cit:
    title: "Tax rates on corporate profits"
    ask: "How heavily does Germany tax corporate profits by comparison?"
    caption: "The chart compares, using OECD figures, the combined statutory tax rate on the profits of corporations. This covers corporate income tax with surcharges and taxes at sub-central levels, in Germany the local business tax. The hollow dot shows the rate in the first year of the series, the filled dot with figure the latest rate; the years are in the legend. Countries are ordered by the latest rate, with Germany highlighted."
  gov_balance:
    title: "General government balance"
    ask: "How large is the government deficit?"
    caption: "The chart shows revenue minus expenditure of federal, state and local government and social security, as a percentage of economic output, quarterly and seasonally adjusted (without the usual swings over the year). A value below zero means the state spends more than it takes in: it runs a deficit. Dashed grey is the Maastricht Treaty reference value of −3% of economic output. It applies to the deficit of a whole year, not to single quarters."
  gov_spend:
    title: "Government interest expenditure and investment"
    ask: "How much does the government spend on interest and investment?"
    caption: "The chart shows how much the state spends on interest and how much it invests (gross fixed capital formation), each as a percentage of economic output and as annual values. When interest rates rise, less room is left for investment."
  gov_debt:
    title: "Government debt"
    ask: "How high is government debt?"
    caption: "The chart shows general government gross debt as a percentage of economic output, as defined in the Maastricht Treaty. Dashed grey is the treaty's reference value of 60%."
  gov_debt_level:
    title: "Debt by level of government"
    ask: "Who in government holds the debt?"
    caption: "The lines show the gross debt of the federal government, the Länder, municipalities and social security as a percentage of economic output, as defined in the Maastricht Treaty. The federal government includes its special funds and extra-budgetary entities. Each level is counted on its own, so loans between levels appear twice and the sum is slightly above total government debt."
  gov_debt_instr:
    title: "Debt by instrument"
    ask: "In what form does the government borrow?"
    caption: "The bars split general government gross debt at year-end into securities (bonds, notes and bills), loans (mainly bank loans to Länder and municipalities) and currency and deposits (mainly coins), each as a percentage of economic output."
  gov_debt_holder:
    title: "Debt by creditor"
    ask: "Who does the government owe?"
    caption: "The bars split general government gross debt at year-end by who holds the bonds and loans, as a percentage of economic output. The Bundesbank holds government bonds mainly from the Eurosystem's purchase programmes since 2015. Rest of the world covers all creditors outside Germany, including foreign central banks and funds."
  gov_debt_mat:
    title: "Maturity of government debt"
    ask: "How long does government debt run?"
    caption: "The lines show how many years government debt at year-end still has to run on average, weighted by amount. The longer, the more slowly higher interest rates feed through to the budget. Eurostat reports values for France, Italy and Spain only from 2020."
  stx_pk:
    title: "Government spending per inhabitant"
    ask: "How much does the government spend per inhabitant, and on what?"
    caption: "The bars show spending by the federal government, Länder, municipalities and social security per inhabitant and year, in euros at current prices, by function. Social protection covers pensions, family benefits and unemployment benefit; administration includes interest on government debt; other functions are defence, public order, economic affairs and transport, environment, housing and culture. Prices have risen by about two thirds since 1995, so part of the increase is inflation."
  hh_wealth:
    title: "Net wealth per household"
    ask: "How much does a typical household own?"
    caption: "The lines show net wealth per household, that is property, savings and securities minus debt, in thousand euros at current prices. The median is the wealth of the household in the middle: half of households own more, half less. The mean is far higher because a few very wealthy households pull it up. The ECB estimates the figures by aligning the Bundesbank's household survey with the national wealth accounts."
  hh_balance:
    title: "Assets and debt of the middle household"
    ask: "What does the wealth of a middle household consist of?"
    caption: "The bars show the assets and debt of a household in the middle fifth of the wealth distribution, in thousand euros per household: above zero what it owns, below zero what it owes. The line is net wealth. The middle fifth are the households between the richest 40% and the poorest 40%."
  hh_share:
    title: "Distribution of wealth"
    ask: "How unequally is wealth distributed?"
    caption: "The lines show the share of total household net wealth held by the richest 10% and by the poorer half of households. The ECB additionally estimates the top of the distribution from rich lists, because very wealthy people rarely appear in surveys."
  hh_spend:
    title: "Consumption by purpose"
    ask: "What do households spend their money on?"
    caption: "The lines show four large spending categories of private households as a percentage of their total consumption, according to the national accounts. Housing and energy includes the rental value of owner-occupied homes. These are averages across all households; individual households differ widely by income and housing."
  gov_debt_cost:
    title: "Interest on government debt"
    ask: "How expensive is government debt?"
    caption: "The thick line shows the average interest rate on all government debt: interest spending in a year as a percentage of the previous year's debt. The thin line shows the monthly yield on ten-year Bunds, roughly the rate on new debt. When the yield is above the average rate, interest spending rises as old bonds mature and are refinanced."
  stx_share:
    title: "Government spending by function, share of spending"
    ask: "What does the government spend its money on?"
    caption: "The panels show the share of the ten functions in government spending, in percent, as annual values. Government covers federal, state and local government and social security; payments between them are netted out. The functions follow the United Nations classification COFOG (Classification of the Functions of Government). Interest counts as administration. 1995 includes the federal takeover of the debt of the Treuhandanstalt (about EUR 130 billion, in economic affairs and transport)."
  stx_share_gdp:
    title: "Government spending by function, % of GDP"
    ask: "How much does the government spend on each function, measured against economic output?"
    caption: "The panels show government spending on each function as a percentage of economic output (gross domestic product)."
  aufnahme_karte:
    title: "Construction workers per inhabitant, in the district and in its catchment area"
    ask: "Where are construction workers within reach scarce?"
    unit: "Index, Germany = 100"
    caption: "The maps show employees subject to social security contributions in construction (NACE section F) per 1,000 inhabitants as an index, Germany = 100, by place of work. On the left, only employees in the district itself count. On the right, the catchment area counts: construction firms also work in neighbouring districts, so each district's employees are spread over all districts they reach, in proportion to travel time and population. How strongly activity declines with travel time is estimated from some 38,000 public construction contracts above the EU threshold: between two districts the flow of contracts halves every 28 minutes of driving. Each employee counts only once. Orange means fewer than in Germany as a whole, blue more. Conurbations draw capacity from their surroundings; sparsely populated and border districts therefore often reach half the national level. Firms and demand across the border are missing. In 13 districts the Federal Employment Agency withholds the value; there it is estimated from construction occupations. The map is updated by hand; method: docs/aufnahme.md in the repository."
  stx_tree:
    title: "Floor plan of government spending"
    ask: "How is government spending divided up in detail?"
    caption: "The treemap shows government spending by ten functions and 69 groups; area equals spending. Each function has one colour, its groups lighter shades. Tap a function to zoom in; the slider picks the year, ‘Play’ shows 2000 to 2024 as a film. Values are converted to 2024 prices with the price index of government consumption; the area grows with real spending, the dashed frame marks the highest level. Eurostat publishes the groups from 2000. Group names in English, from Eurostat."
  stx_levels:
    title: "Spending of federal government, Länder, municipalities and social security"
    ask: "How much do federal government, Länder, municipalities and social security spend?"
    caption: "The lines show the spending of each level of government as a percentage of economic output. The values include payments to other levels, such as the federal grant to pension insurance or the Länder grants to municipalities. They therefore do not add up to total government spending; together they exceed it by 14 to 24%."
  bund_tree:
    title: "Floor plan of the federal budget"
    ask: "What does the federal government spend on in detail?"
    caption: "The treemap shows federal spending; area equals spending, tap a block to zoom in. The switch ‘Breakdown’ changes between three views: function by the function plan (in three levels), economic type by the group plan (personnel, material spending, grants, investment, in three levels) and ministry by budget sections and chapters; sections 60 (general financial administration) and 32 (federal debt) belong to no ministry. The sum can differ slightly between views because negative items are netted within a block. Outturn is the result of the budget accounts, plan the adopted budget, draft the government draft. Outturn and plan are only partly comparable: the plan is a ceiling and contains global items that are spread over functions only in the outturn; negative items such as global spending cuts are missing from the map. Shown is the core budget. The switch ‘with special funds’ adds the spending of the special funds, mainly the Bundeswehr fund, the climate and transformation fund and the infrastructure and climate neutrality fund (hatched); payments from the core budget to special funds and between them are netted out. EU own resources, EU pass-through funds and the pension reserves for civil servants stay out. For 2024 the budget accounts file contains no special funds. Function names below the top level are in German, as published."
  calendar:
    title: "Release calendar: the next twelve weeks"
    ask: "When are which figures released?"
    caption: "The dates are estimated from the sources' usual release schedules and marked with a superscript e. The linked calendars of the sources are authoritative. The links lead to the charts that receive new values on that date."

  svr_bip:
    title: "Growth forecasts of the Council of Economic Experts and first release"
    ask: "How well did the Council of Economic Experts forecast growth?"
    caption: "The chart compares the forecast of the German Council of Economic Experts (Sachverständigenrat) for real gross domestic product growth in the following year, from its annual report each November, with the first release for the same year as printed in the annual report a year later. The purple area shows the usual range around the forecast: in two thirds of the years since 1966 the first release fell inside it. The area reaches further down than up (forecast minus 1.7 to plus 1.0 percentage points), because the Council overestimated growth on average. Until 1991 the chart shows West Germany, and the forecasts for 1992 to 1994 also cover the former West German territory; until about 1990 it is mostly real gross national product. The forecast is missing for 1965 and 1968, as the Council gave only half-year forecasts then; all references are in the repository under data/static/svr_prognosen.csv."
    unit: "% on previous year"
  svr_vpi:
    title: "Inflation forecasts of the Council of Economic Experts and first release"
    ask: "How well did the Council of Economic Experts forecast inflation?"
    caption: "The chart compares the forecast of the Council of Economic Experts for the annual average rise in consumer prices in the following year with the first release from the annual report a year later. Where the Council forecast only the private consumption deflator, a price measure for private consumption, the deflator is also used as the outcome. West Germany until 1991. Where the next report gives no annual rate, today's figure is shown; the consumer price index is hardly ever revised."
    unit: "% on previous year"
  svr_alo:
    title: "Unemployment forecasts of the Council of Economic Experts and first release"
    ask: "How well did the Council of Economic Experts forecast unemployment?"
    caption: "The chart compares the forecast of the Council of Economic Experts for registered unemployment (annual average) in the following year with the first release from the annual report a year later. West Germany until 1991, Germany afterwards; the jump in 1991/92 comes from the change of territory. From 2005 recipients of unemployment benefit II are included, which raises the count. The forecast line shows only years for which the Council printed a figure; years with only a change or a vague threshold are missing there."
    unit: "thousand people"
  svr_treff:
    title: "Accuracy of the Council of Economic Experts' forecasts"
    ask: "How accurate were the Council's forecasts?"
    caption: "Each panel shows how far the Council's forecast for the following year, from its annual report, deviated from the first release: above zero too high, below zero too low. Growth and inflation in percentage points, unemployment in thousand people. The individual forecasts and releases are under \"Downloads\"."
    unit: "deviation"
  svr_rat:
    title: "Recommendations of the Council of Economic Experts on four standing questions"
    ask: "What did the Council of Economic Experts recommend on wages, money, public finances and the labour market?"
    caption: "The top line gives the Council of Economic Experts' latest recommendation in words. Below, each row shows what it recommended for the following year in its annual report. Red stands for socially progressive recommendations: stronger wages, looser monetary policy, fiscal stimulus, more protection in the labour market. Blue stands for conservative-liberal ones: wage restraint, tighter monetary policy, saving, more flexibility. Grey means unchanged. The political reading is our own. Wide bands are phases of three years or more, thin strokes single years, gaps years without a recommendation. The bars below count the passages with a minority vote. At the bottom are the latest turning points with references. Tapping shows the recommendation with its source; the classification is our own analysis."
    unit: "level -1, 0, +1"
  svr_fiskal:
    title: "Recommended fiscal stance and expected growth"
    ask: "Did the Council of Economic Experts advise austerity even when growth was weak?"
    caption: "The bars show the real gross domestic product growth the Council of Economic Experts expected in its annual report for the following year. The colour shows the fiscal stance it recommended for that year in the same report: blue consolidation (cutting the deficit), grey cyclically neutral (let automatic stabilisers work), red stimulus, light grey no recommendation discernible. West Germany until 1991. Tap for the recommendation with paragraph and page."
    unit: "% on previous year"
  gd_bip:
    rail: "Growth forecasts"
    title: "Growth forecasts of the Joint Economic Forecast and first release"
    ask: "How well did the institutes forecast growth?"
    caption: "The chart compares the forecast of the Joint Economic Forecast (Gemeinschaftsdiagnose), the shared forecast of the economic research institutes, for real gross domestic product growth in the following year from the autumn report with the first release for the same year as printed in the spring report half a year later. West Germany until 1991, Germany from 1992; until about 1991 it is mostly real gross national product. No autumn forecast with an annual figure exists for 1960 to 1962, 1964, 1965 and 1968; where a report is missing (1970 to 1974 and single rounds), values come from the archive of appendix tables. Tapping also shows today's data vintage. Every value is documented with file, page and table; all references are in the repository under data/static/gd_prognosen.csv."
    unit: "% on previous year"
  gd_vpi:
    rail: "Inflation forecasts"
    title: "Inflation forecasts of the Joint Economic Forecast and first release"
    ask: "How well did the institutes forecast inflation?"
    caption: "The chart compares the forecast of the Joint Economic Forecast for the annual average rise in consumer prices in the following year from the autumn report with the first release from the next spring report. Where a report gives no consumer price index (1960s, mostly autumn 1986 to spring 1996, all values from the appendix tables), the private consumption deflator, a price measure for private consumption, is shown, with the same measure as first release. Where the measure changes between forecast and release, the first release is missing (1976, 1978, 1979 and 1986). For 2022 the first release follows the old weighting scheme, that is the old weights in the basket of goods (7.9%), because the forecasts were based on it; the new scheme gives 6.9%. West Germany until 1991; every value is documented with file, page and table, and all references are in the repository under data/static/gd_prognosen.csv."
    unit: "% on previous year"
  gd_alo:
    rail: "Unemployment forecasts"
    title: "Unemployment forecasts of the Joint Economic Forecast and first release"
    ask: "How well did the institutes forecast unemployment?"
    caption: "The chart compares the forecast of the Joint Economic Forecast for registered unemployment (annual average) in the following year from the autumn report with the first release from the next spring report. West Germany until 1991, Germany afterwards; the jump from 1991 to 1992 comes from the change of territory. From 2005 recipients of unemployment benefit II are included. There is no forecast with a firm figure for 1982, and no first release for 1981. Every value is documented with file, page and table; all references are in the repository under data/static/gd_prognosen.csv."
    unit: "thousand people"
  gd_saldo:
    rail: "Government balance forecasts"
    title: "Joint Economic Forecast: forecasts of the government balance"
    ask: "How well did the institutes forecast the government balance?"
    caption: "The chart compares the forecast of the Joint Economic Forecast for the general government balance in the following year from the autumn report with the first release from the next spring report. The balance is revenue minus expenditure of federal, state and local government and social security as a percentage of economic output; negative values are deficits. Until 1993 the reports print the balance only in billion D-Mark; the ratio is calculated there with the nominal gross national product in the same report, for 1994 and 1995 with nominal gross domestic product, with forecast and first release always calculated the same way. Figures for 1974 and 1975 are missing, West Germany until 1991, and for 2000 forecast and first release exclude the proceeds from the mobile phone (UMTS) licences. Every value is documented with file, page and table; all references are in the repository under data/static/gd_prognosen.csv."
    unit: "% of GDP, until 1993 of GNP"
  gd_fehler:
    rail: "Forecast errors by decade"
    title: "Errors of the Joint Economic Forecast growth forecasts"
    ask: "Have growth forecasts become more accurate over the decades?"
    caption: "The chart shows how far the autumn forecast of the Joint Economic Forecast for real gross domestic product growth in the following year lay from the first release, in percentage points and without direction, that is whether too high or too low. The grey steps show the average per decade where at least five years are available, the current decade dotted; the 1960s have only four values and no step. West Germany until 1991. Every value is documented with file, page and table; all references are in the repository under data/static/gd_prognosen.csv."
    unit: "percentage points"
  gd_ziel:
    rail: "Forecasts for a target year"
    title: "Joint Economic Forecast growth forecasts for a target year"
    ask: "How did the institutes change their forecast for a given year?"
    caption: "Each line shows the real gross domestic product growth the Joint Economic Forecast expected for a given year, from the first forecast to the autumn of that year. Each point is one report, placed at its closing date; the open circle is the first release in the spring report of the following year. The four most recent target years are shown, and the first release for 2026 is still pending; all target years since 1950 are in the dataset. Every value is documented with file, page and table; all references are in the repository under data/static/gd_prognosen.csv."
    unit: "% on previous year"

  hybrid:
    title: "Russian sabotage and subversion in Europe"
    ask: "How often does Russian sabotage hit targets in Europe?"
    caption: "Counted are sabotage, arson, reconnaissance and attack plots that authorities or reliable reports attribute to Russia. Cyber attacks and espionage are mostly missing. Dark blue marks cases with a target in Germany. Other databases use other definitions and arrive at other figures. Many cases only become known later, so the latest quarters are too low."
  gpr:
    title: "Geopolitical risk"
    ask: "How much do newspapers report on the threat of war?"
    caption: "The index measures how often major English-language newspapers report on the threat of war, war and terrorism. The value for Germany counts only articles that also mention Germany. 100 is the average of 1985 to 2019. Thick: three-month average, thin: monthly values. In studies, high values go along with lower investment."
  milex:
    title: "Military expenditure"
    ask: "How high is military spending by comparison?"
    caption: "Military expenditure in percent of economic output, as defined by the Stockholm International Peace Research Institute (SIPRI). It includes military pensions and military aid. NATO's targets of 2 percent and 3.5 percent by 2035 rest on a different definition. By NATO's count, Germany is usually somewhat higher. Germany is highlighted."
  arms_turnover:
    title: "Turnover of makers of weapons and ammunition"
    ask: "How much do makers of weapons and ammunition sell?"
    caption: "Turnover of plants making weapons and ammunition, summed over the previous twelve months, in billion euros; establishments with 50 or more employees. Counted per plant, not per company, so a reclassification of companies does not shift the figures. Tanks and other fighting vehicles are missing because the Federal Statistical Office keeps their data confidential. Foreign turnover covers deliveries to customers outside Germany."
  arms_overview:
    title: "Defence money in Germany: from budget to factory"
    ask: "How much money flows into defence, and what reaches the factory?"
    caption: "The table follows defence money from the budget through orders to the factory, in billion euros per year. The column on the right shows the change since 2021, the bar the multiple. Government spending from Eurostat is available up to 2024. Orders by the contractor's seat; about €31 bn of unclear origin are missing. Makers cover only weapons and ammunition, because the Federal Statistical Office keeps tanks and other fighting vehicles confidential. The federal plan covers only the federal level and is therefore not comparable with government spending."
  arms_cycle:
    title: "Defence: orders and production"
    ask: "Is production keeping up with defence orders?"
    caption: "Both lines show twelve months compared with 2021 (= 100). Orders: federal defence orders in euros (Kiel Institute). Production: manufacture of weapons and ammunition (Eurostat). Orders have almost quadrupled, production has only roughly doubled. The orders line jumps because large contracts arrive at once. The gap is the order backlog; tanks, aircraft and ships are not part of production, though."
  def_use:
    title: "What the state spends defence money on"
    ask: "What does the state spend defence money on?"
    caption: "Spending of federal, state and local government on defence by type, in billion euros. Since 2021, material, maintenance and operations grew most, that is spare parts, ammunition and services. Investment in new weapon systems stayed flat because it only counts on delivery. The jump in transfers to others coincides with military aid to Ukraine. The data do not show how much of it stays in Germany."
  orders_origin:
    title: "Defence contracts by contractor's home country"
    ask: "How much defence money goes to companies at home?"
    caption: "Federal defence contracts by year of announcement and the contractor's headquarters, in billion euros. \"German with partner\" means a German and a foreign company together, or a foreign company producing in Germany. Headquarters do not show where production takes place; foreign supplies to contractors are not covered. The share of contractors outside Europe fell from 42 percent in 2022 to 4 percent in 2025. Contracts of unclear origin, about €31bn since 2020, are missing."
  arms_prod:
    title: "Production of weapons and ammunition"
    ask: "How fast is the production of weapons and ammunition growing?"
    caption: "Production of weapons and ammunition compared with industry as a whole, 2021 = 100, seasonally and calendar adjusted. Tanks, aircraft and ships belong to other industries and are missing here. Thick: three-month average, thin: monthly values."
  milex_gov:
    title: "Military spending in the government budget"
    ask: "What priority does defence have in the budget?"
    caption: "Share of military expenditure in all government spending, that is federal, state and local government and social security. Definition of the peace research institute SIPRI, government spending according to the International Monetary Fund. Germany is highlighted."
  milex_eu_ru:
    title: "Military spending of Europe and Russia"
    ask: "Does Europe spend more on defence than Russia?"
    caption: "Military expenditure in billion US dollars at 2024 prices and exchange rates. Central and Western Europe is Europe without Russia, Belarus, Ukraine and Moldova. Since 2023 SIPRI estimates Russian spending because parts of the budget are secret. In dollars, Russia's budget looks smaller than its purchasing power at home."
  cinc:
    title: "Germany's share of the world's material capabilities"
    ask: "How much weight does Germany carry among the world's powers?"
    caption: "The index of the Correlates of War research project (CINC) measures a state's material weight. It averages world shares in population, urban population, steel, energy use, soldiers and military expenditure. Germany, Prussia until 1870, reached 14 percent in 1913 and 20 percent in 1941; in 2022 it was 1.5 percent. From 1955 to 1989 West and East Germany are combined. The index measures mass, not technology or alliances."
  trade_harm:
    title: "Harmful trade interventions against German interests"
    ask: "How many harmful trade interventions affect Germany?"
    caption: "Counted are interventions that Global Trade Alert rates as harmful to trade and that hit German exports: tariffs, subsidies, public procurement rules and export bans. Each intervention counts once, regardless of how much trade it affects. Measures of the European Union are missing because Germany is a member. New cases are often recorded late, so the latest year tends to be too low."
  trade_ru:
    title: "Exports to Russia and neighbouring countries"
    ask: "Do exports reach Russia via neighbouring countries?"
    caption: "German goods exports, summed over the previous twelve months, in billion euros. Exports to Russia and Belarus collapsed after the war began in 2022. Exports to Armenia, Georgia, Kazakhstan, Kyrgyzstan, Tajikistan and Uzbekistan rose strongly at the same time. Studies by the European Bank for Reconstruction and Development (EBRD) see this partly as goods diverted to Russia."
  ukraine_aid:
    title: "German aid to Ukraine"
    ask: "How much aid does Germany allocate to Ukraine?"
    caption: "German aid that has been delivered or firmly earmarked for delivery, in billion euros per quarter. Military aid includes money for arms purchases. Missing are Germany's share of aid from the European Union and the costs of refugees. Large packages are often fixed for several years at once."
  gd_treff:
    title: "Accuracy of the Joint Economic Forecast"
    ask: "How accurate were the institutes' forecasts?"
    caption: "Each panel shows how far the institutes' autumn forecast for the following year deviated from the first release: above zero too high, below zero too low. Growth, inflation and the government balance in percentage points, unemployment in thousand people. The individual forecasts and releases are under \"Downloads\"."
    unit: "deviation"
  gd_rat:
    votes_label: "Dissenting votes of single institutes"
    rail: "Recommendations"
    title: "Recommendations of the Joint Economic Forecast on four standing questions"
    ask: "What did the institutes recommend on wages, money, public finances and the labour market?"
    caption: "The top line gives the institutes' latest recommendation in words. Below, each row shows what they recommended for the following year in their autumn report. Red stands for socially progressive recommendations: stronger wages, looser monetary policy, fiscal stimulus, more protection in the labour market. Blue stands for conservative-liberal ones: wage restraint, tighter monetary policy, saving, more flexibility. Grey means unchanged. The political reading is our own. Wide bands are phases of three years or more, thin strokes single years, gaps years without a recommendation. The bars below count dissenting votes by individual institutes. At the bottom are the latest turning points with references. Two reviewers classified each recommendation independently; tap to see it with its reference."
    unit: "level -1, 0, +1"
  gd_vergleich:
    rail: "Comparison with the Council"
    title: "Recommendations of the Joint Economic Forecast and the Council of Economic Experts compared"
    ask: "Did the institutes recommend the same as the Council of Economic Experts?"
    caption: "Each question has two rows: the institutes on top, the Council of Economic Experts below. The same colour means: they gave the same advice. Red stands for socially progressive recommendations: stronger wages, looser monetary policy, fiscal stimulus, more protection in the labour market. Blue stands for conservative-liberal ones: wage restraint, tighter monetary policy, saving, more flexibility. Grey means unchanged. The political reading is our own. Only years in which both gave a recommendation are counted. Tapping shows the recommendation with its source."
    unit: "level -1, 0, +1"
  gd_themen:
    rail: "Topics"
    title: "Topics of the Joint Economic Forecast: share of pages"
    ask: "What did the institutes write about?"
    caption: "Share of pages per topic in all reports of a year, excluding the statistical appendix; the darker, the more space. Each section belongs to exactly one topic from a fixed catalogue. Until the 1990s the reports are less finely structured, so shares are only partly comparable. Tapping shows the share and sections. Two reviewers classified each section independently. Sources in data/static/gd_themen.csv."
    unit: "% of pages"
  gd_schwerpunkte:
    rail: "Special topics"
    title: "Special topics of the Joint Economic Forecast"
    ask: "Which special topics did the institutes take up?"
    caption: "One dot per year and topic when a report has its own chapter or a section headed as focus, special topic or excursus; boxes do not count. Tapping shows title and pages. Sources in data/static/gd_schwerpunkte.csv."
    unit: ""
  gd_dissens:
    rail: "Dissenting votes"
    title: "Dissenting votes of single institutes in the Joint Economic Forecast"
    ask: "How often did the institutes disagree?"
    caption: "Number of points at which single institutes departed from the joint position in the reports of a year, one per point, on the forecast and on policy. Ties, separate reports and abstentions are included. Tapping shows institutes and topic. Sources in data/static/gd_voten.csv."
    unit: "count"

