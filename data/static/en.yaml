# English translation of the Konjunkturmonitor texts.
# Keys match the German ids in monitor.yaml and series.yaml. Placeholders such as {geo_name} stay unchanged.

questions:
  wachstum:
    ask: "Is the economy growing?"
    explain: "Gross domestic product (GDP) is the value of all goods and services produced in Germany. When it rises, more is produced and more income is earned."
  preise:
    ask: "Are prices rising?"
    explain: "The inflation rate shows by what percentage the prices of a typical basket of goods are higher than a year earlier. It is measured with the consumer price index (CPI) of the Federal Statistical Office (Destatis). The European Central Bank aims for 2% over the medium term."
  arbeit:
    ask: "How is the labour market doing?"
    explain: "The unemployment rate is the number of unemployed people registered with the Federal Employment Agency as a share of the civilian labour force."
  industrie:
    ask: "How is industry doing?"
    explain: "Production measures how much industry makes. New orders measure fresh demand; they lead production by a few months."
  konsum:
    ask: "How is private consumption doing?"
    explain: "Price-adjusted retail sales measure how much shops sell. Consumer confidence is based on a survey of households about their financial situation and their expectations."
  export:
    ask: "How are exports doing?"
    explain: "Exports are goods sold abroad. In Germany exports of goods and services amount to almost half of gross domestic product."
  stimmung:
    ask: "How do businesses and households judge the situation?"
    explain: "Every month the European Commission asks businesses and households about their situation and their expectations. The economic sentiment indicator is scaled so that 100 equals the long-term average; higher values indicate above-average sentiment."
  insolvenzen:
    ask: "How many businesses are filing for insolvency?"
    explain: "Insolvency proceedings are filed when a business is unable to pay its debts or is over-indebted. Because the number of filings fluctuates over the year, the monitor compares with the same month in earlier years."
  zinsen:
    ask: "How are interest rates moving?"
    explain: "The yield on federal bonds (Bunds) is the interest rate the federal government pays on new borrowing in the capital market. It serves as a benchmark for long-term loans to businesses and for mortgages."
    name: "the yield on ten-year federal bonds"
  energie:
    ask: "How are energy prices moving?"
    explain: "Oil and gas prices quickly affect consumer prices for fuel and heating and, with a lag, industry's costs. The prices are traded in US dollars; a weaker euro makes them more expensive in euro terms."
    name: "the price of Brent crude oil"

topics:
  wachstum: {title: "Growth"}
  preise: {title: "Prices"}
  arbeit: {title: "Labour"}
