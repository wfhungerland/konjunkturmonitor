name: Daten holen und Seite veröffentlichen

on:
  schedule:
    - cron: "23 7 * * 1-5"    # werktags vormittags (nach den 8-Uhr-Meldungen)
    - cron: "23 12 * * 1-5"   # werktags mittags
  workflow_dispatch:
  push:
    branches: [main]
    paths: [series.yaml, monitor.yaml, "monitor/**", "data/static/**", .github/workflows/update.yml]
  pull_request:

permissions:
  contents: write

concurrency:
  group: update-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Probe (temporär)
        env:
          GENESIS_USER: ${{ secrets.GENESIS_USER }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_PASSWORD }}
        run: |
          python probe/probe_enso.py
          exit 1
      - name: Daten holen und Seite bauen
        env:
          GENESIS_USER: ${{ secrets.GENESIS_USER }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_PASSWORD }}
        run: python -m monitor run --no-cache
      - name: Grafiken für die Word-Datei
        continue-on-error: true
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
          python -m monitor.shots site
      - name: Daten committen
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "konjunkturmonitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/archive data/static/rhine_*.csv data/static/dwd_*.csv
          git diff --cached --quiet && exit 0
          git commit -m "Daten aktualisiert ($(date -u +%Y-%m-%d))"
          git push origin "HEAD:${{ github.ref_name }}" || echo "::warning::Push abgelehnt (Branch geändert); nächster Lauf holt das nach."
      - name: Pages-Artefakt
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
