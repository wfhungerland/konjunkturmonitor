name: Daten holen und Seite veröffentlichen

on:
  schedule:
    - cron: "23 7 * * 1-5"    # werktags vormittags (nach den 8-Uhr-Meldungen)
    - cron: "23 12 * * 1-5"   # werktags mittags
  workflow_dispatch:
  push:
    branches: [main]
    paths: [series.yaml, monitor.yaml, "monitor/**", "data/static/**", .github/workflows/update.yml]
  pull_request:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Probe (temporär)
        run: |
          pip install -q pyreadr
          python - <<'PY'
          import urllib.request, re, tarfile, io, pyreadr, tempfile, os
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Konjunkturmonitor/1.0"}), timeout=120); return r.read()
              except Exception as e:
                  print("FEHLER", u, e); return b""
          idx = get("https://cran.r-project.org/web/packages/hyd1d/index.html").decode("utf-8", "replace")
          v = re.findall(r"hyd1d_([0-9.\-]+)\.tar\.gz", idx); print("CRAN-Versionen", v[:3])
          print(re.sub(r"<[^>]+>", " ", idx)[:1500])
          if v:
              tb = get(f"https://cran.r-project.org/src/contrib/hyd1d_{v[0]}.tar.gz")
              tf = tarfile.open(fileobj=io.BytesIO(tb))
              names = tf.getnames(); print([n for n in names if "/data/" in n or "DESCRIPTION" in n or "gauging_data" in n][:30])
              print(tf.extractfile("hyd1d/DESCRIPTION").read().decode()[:1500])
              for n in names:
                  if n.endswith("df.gauging_data.Rd"): print(tf.extractfile(n).read().decode()[:2500])
              for n in names:
                  if n.endswith("df.gauging_data.rda") or n.endswith("df.gauging_data.RData"):
                      d = tempfile.mkdtemp(); tf.extract(n, d); res = pyreadr.read_r(os.path.join(d, n))
                      for k, df in res.items():
                          print(k, df.shape, df.columns.tolist()); print(df["gauging_station"].value_counts().head(40) if "gauging_station" in df else df.head())
                          kb = df[df.iloc[:, 0].astype(str).str.upper() == "KAUB"]; print("KAUB", kb.shape, kb.head(), kb.tail())
          for u in ["https://hyd1d.bafg.de/downloads/", "https://hyd1d.bafg.de/downloads/df.gauging_data_latest_v2.RDS", "https://hyd1d.bafg.de/downloads/df.gauging_data_latest.RDS", "https://dgj-daten.bafg.de/Rhein/Kaub/"]:
              b = get(u); print(u, len(b)); print(b[:600].decode("utf-8", "replace") if b[:1] != b"\x1f" else "gz-Daten")
              if len(b) > 100000 and u.endswith(".RDS"):
                  open("/tmp/g.rds", "wb").write(b); df = pyreadr.read_r("/tmp/g.rds")[None]
                  print(df.shape, df.columns.tolist()); kb = df[df["gauging_station"].astype(str).str.upper() == "KAUB"]
                  print("KAUB", kb.shape, kb["date"].min(), kb["date"].max()); print(kb.tail())
          PY
          exit 1
      - name: Daten holen und Seite bauen
        env:
          GENESIS_USER: ${{ secrets.GENESIS_USER }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_PASSWORD }}
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
        run: python -m monitor run --no-cache
      - name: Daten committen
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "konjunkturmonitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/archive data/static/rhine_*.csv data/static/dwd_*.csv data/static/enso_roni.csv data/static/smard_*.csv data/static/gie_*.csv
          git diff --cached --quiet && exit 0
          git commit -m "Daten aktualisiert ($(date -u +%Y-%m-%d))"
          git push origin "HEAD:${{ github.ref_name }}" || echo "::warning::Push abgelehnt (Branch geändert); nächster Lauf holt das nach."
      - name: Seitentest im Browser
        run: |
          npm install --no-save --silent playwright@1.63.0
          npx playwright install --with-deps chromium > /dev/null
          node tests/smoke.js site/index.html
      - name: Ticket bei Ausfällen
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m monitor.alert
      - name: Pages-Artefakt
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
