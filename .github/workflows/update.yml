name: Daten holen und Seite veröffentlichen

on:
  schedule:
    - cron: "23 7 * * 1-5"    # werktags vormittags (nach den 8-Uhr-Meldungen)
    - cron: "23 12 * * 1-5"   # werktags mittags
  workflow_dispatch:
  push:
    branches: [main]
    paths: [series.yaml, monitor.yaml, pyproject.toml, "monitor/**", "data/static/**", .github/workflows/update.yml]

# Pull Requests prüft pruefung.yml, ohne Schreibrecht. Rechte stehen je Job; ohne Angabe hat ein Job keine.
permissions: {}

concurrency:
  group: update-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # Daten committen, wöchentliches Archiv
      issues: write     # Tickets bei Ausfällen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # das Token bekommt nur der Schritt, der es braucht
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: ./tools/install.sh   # feste Versionen mit Prüfsummen (requirements.txt)
      - name: Tests
        run: pytest -q
      - name: Daten holen und Seite bauen
        id: daten
        env:
          GENESIS_USER: ${{ secrets.GENESIS_USER }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_PASSWORD }}
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
        run: python -m monitor run --no-cache
      - name: Vorschaubilder und Seitentest im Browser
        run: |
          npm ci --silent   # Version und Prüfsummen aus package-lock.json
          npx playwright install --with-deps chromium > /dev/null
          node monitor/previews.js site  # Vorschaubilder je Grafik; die Seite lädt die lebendige Grafik erst beim Überfahren oder Antippen
          python -m monitor.csp site     # Content-Security-Policy eintragen, nach den Vorschaubildern (die ändern die Seite noch)
          node tests/smoke.js site/index.html
          if [ -f site/en/index.html ]; then node tests/smoke.js site/en/index.html; fi
      - name: Manifest der Seite (Prüfsummen)
        run: python -m monitor.manifest site   # site/manifest.json und data/archive/manifest.sha256
      - name: Daten und Manifest committen
        # auch wenn der Seitentest scheitert: Die Daten gehören ins Archiv; das Manifest ändert sich dann nicht
        if: ${{ !cancelled() && steps.daten.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "konjunkturmonitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/archive data/static/rhine_*.csv data/static/rhine_kaub_bfg.txt data/static/gdp_rt_*.csv data/static/dwd_*.csv data/static/enso_roni.csv data/static/smard_*.csv data/static/gie_*.csv data/static/*_potential_de.csv data/static/wb_*.csv data/static/gpr_*.csv data/static/de_exp_*.csv data/static/def_*.csv data/static/arms_prod_12m.csv
          git diff --cached --quiet && exit 0
          git commit -m "Daten aktualisiert ($(date -u +%Y-%m-%d))"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}" || echo "::warning::Push abgelehnt (Branch geändert); nächster Lauf holt das nach."
      - name: Wöchentlicher Datenstand (Archiv)
        if: ${{ !cancelled() && steps.daten.outcome == 'success' && github.event_name == 'schedule' && github.ref_name == github.event.repository.default_branch }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="daten-$(date -u +%G-KW%V)"
          gh release view "$tag" > /dev/null 2>&1 && exit 0
          mkdir -p archiv && gzip -c data/processed/observations.csv > archiv/observations.csv.gz
          cp data/processed/run_status.json series.yaml monitor.yaml archiv/
          gh release create "$tag" archiv/* --title "Datenstand $(date -u +%d.%m.%Y) (KW $(date -u +%V))" --notes "Vollständiger Datenstand des Konjunkturmonitors, Code-Stand ${GITHUB_SHA}. Nachrechnen: Repository auf diesen Commit setzen, observations.csv.gz nach data/processed/observations.csv entpacken, python -m monitor build."
      - name: Ticket bei Ausfällen
        if: github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m monitor.alert
      - name: Pages-Artefakt
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: site

  deploy:
    needs: update
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
