name: Daten holen und Seite veröffentlichen

on:
  schedule:
    - cron: "23 7 * * 1-5"    # werktags vormittags (nach den 8-Uhr-Meldungen)
    - cron: "23 12 * * 1-5"   # werktags mittags
  workflow_dispatch:
  push:
    branches: [main]
    paths: [series.yaml, monitor.yaml, pyproject.toml, "monitor/**", "data/static/**", .github/workflows/update.yml]
  pull_request:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Daten holen und Seite bauen
        env:
          GENESIS_USER: ${{ secrets.GENESIS_USER }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_PASSWORD }}
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
        run: python -m monitor run --no-cache
      - name: Daten committen
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "konjunkturmonitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/archive data/static/rhine_*.csv data/static/rhine_kaub_bfg.txt data/static/gdp_rt_*.csv data/static/dwd_*.csv data/static/enso_roni.csv data/static/smard_*.csv data/static/gie_*.csv data/static/*_potential_de.csv data/static/wb_*.csv data/static/gpr_*.csv
          git diff --cached --quiet && exit 0
          git commit -m "Daten aktualisiert ($(date -u +%Y-%m-%d))"
          git push origin "HEAD:${{ github.ref_name }}" || echo "::warning::Push abgelehnt (Branch geändert); nächster Lauf holt das nach."
      - name: Wöchentlicher Datenstand (Archiv)
        if: github.event_name == 'schedule' && github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="daten-$(date -u +%G-KW%V)"
          gh release view "$tag" > /dev/null 2>&1 && exit 0
          mkdir -p archiv && gzip -c data/processed/observations.csv > archiv/observations.csv.gz
          cp data/processed/run_status.json series.yaml monitor.yaml archiv/
          gh release create "$tag" archiv/* --title "Datenstand $(date -u +%d.%m.%Y) (KW $(date -u +%V))" --notes "Vollständiger Datenstand des Konjunkturmonitors, Code-Stand ${GITHUB_SHA}. Nachrechnen: Repository auf diesen Commit setzen, observations.csv.gz nach data/processed/observations.csv entpacken, python -m monitor build."
      - name: Vorschaubilder und Seitentest im Browser
        run: |
          npm install --no-save --silent playwright@1.63.0
          npx playwright install --with-deps chromium > /dev/null
          node monitor/previews.js site  # Vorschaubilder je Grafik; die Seite lädt die lebendige Grafik erst beim Überfahren oder Antippen
          node tests/smoke.js site/index.html
          if [ -f site/en/index.html ]; then node tests/smoke.js site/en/index.html; fi
      - name: Ticket bei Ausfällen
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m monitor.alert
      - name: Pages-Artefakt
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
