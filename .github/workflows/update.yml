name: Daten holen und Seite veröffentlichen

on:
  schedule:
    - cron: "23 7 * * 1-5"    # werktags vormittags (nach den 8-Uhr-Meldungen)
    - cron: "23 12 * * 1-5"   # werktags mittags
  workflow_dispatch:
  push:
    branches: [main]
    paths: [series.yaml, monitor.yaml, "monitor/**", "data/static/**", .github/workflows/update.yml]
  pull_request:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Probe (temporär)
        run: |
          python - <<'PY'
          import urllib.request, re, tarfile, io
          get = lambda u: urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Konjunkturmonitor/1.0"}), timeout=120).read()
          tf = tarfile.open(fileobj=io.BytesIO(get("https://cran.r-project.org/src/contrib/hyd1d_0.5.5.tar.gz")))
          d = tf.extractfile("hyd1d/DESCRIPTION").read().decode(); print([l for l in d.splitlines() if l.startswith(("License", "URL", "Copyright"))])
          for n in tf.getnames():
              if n.endswith(("REFERENCES.bib", "LICENSE", "LICENCE", "COPYRIGHTS")):
                  s = tf.extractfile(n).read().decode("utf-8", "replace")
                  if n.endswith(".bib"):
                      for k in ("wsv_pegeldaten_2021", "wsv_pegelonline_2018"):
                          m = re.search(r"@\w+\{" + k + r".*?\n\}", s, re.S); print(m.group(0) if m else k + " fehlt")
                  else: print(n, s[:800])
          for n in tf.getnames():
              if n.endswith("updateGaugingData.Rd"): print(tf.extractfile(n).read().decode()[:1500])
          PY
          exit 1
      - name: Daten holen und Seite bauen
        env:
          GENESIS_USER: ${{ secrets.GENESIS_USER }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_PASSWORD }}
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
        run: python -m monitor run --no-cache
      - name: Daten committen
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "konjunkturmonitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/archive data/static/rhine_*.csv data/static/dwd_*.csv data/static/enso_roni.csv data/static/smard_*.csv data/static/gie_*.csv
          git diff --cached --quiet && exit 0
          git commit -m "Daten aktualisiert ($(date -u +%Y-%m-%d))"
          git push origin "HEAD:${{ github.ref_name }}" || echo "::warning::Push abgelehnt (Branch geändert); nächster Lauf holt das nach."
      - name: Seitentest im Browser
        run: |
          npm install --no-save --silent playwright@1.63.0
          npx playwright install --with-deps chromium > /dev/null
          node tests/smoke.js site/index.html
      - name: Ticket bei Ausfällen
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m monitor.alert
      - name: Pages-Artefakt
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
