name: Sonde Pink Sheet (einmalig, wird wieder entfernt)
on:
  push:
    branches: [claude/konjunkturmonitor-aufbau]
    paths: [tools/sonde_pink.py, .github/workflows/sonde.yml]
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas openpyxl && python tools/sonde_pink.py
