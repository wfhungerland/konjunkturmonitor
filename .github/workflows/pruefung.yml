name: Prüfung im Pull Request

# Baut und testet die Seite für einen Pull Request. Nur Leserecht: Dieser Lauf kann nichts committen, kein Ticket anlegen
# und nichts veröffentlichen. Pull Requests aus fremden Kopien (Forks) bekommen von GitHub keine Zugangsdaten.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pruefung-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  pruefung:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: ./tools/install.sh
      - name: Tests
        run: pytest -q
      - name: Einmalige Prüfung der GENESIS-Tabellen zu Rüstungsbranchen (vor dem Mergen wieder entfernen)
        continue-on-error: true
        env:
          GENESIS_USER: ${{ secrets.GENESIS_USER }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_PASSWORD }}
        run: python tools/genesis_probe.py
      - name: Daten holen und Seite bauen
        env:
          GENESIS_USER: ${{ secrets.GENESIS_USER }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_PASSWORD }}
          GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
        run: python -m monitor run --no-cache
      - name: Vorschaubilder und Seitentest im Browser
        run: |
          npm ci --silent
          npx playwright install --with-deps chromium > /dev/null
          node monitor/previews.js site
          python -m monitor.csp site     # Content-Security-Policy eintragen, nach den Vorschaubildern (die ändern die Seite noch)
          node tests/smoke.js site/index.html
          if [ -f site/en/index.html ]; then node tests/smoke.js site/en/index.html; fi
          node tests/onepager.js site/index.html "$RUNNER_TEMP/onepager.docx"  # Lesezeichen als Word-Seite: Download auslösen und Datei prüfen
          python tests/check_onepager.py "$RUNNER_TEMP/onepager.docx"
          if [ -f site/en/index.html ]; then node tests/onepager.js site/en/index.html "$RUNNER_TEMP/onepager-en.docx" && python tests/check_onepager.py "$RUNNER_TEMP/onepager-en.docx"; fi
