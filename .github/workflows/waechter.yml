name: Wächter

# Prüft täglich, ob die veröffentlichte Seite erreichbar und aktuell ist; meldet Probleme als Issue und schließt es wieder.
on:
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet --require-hashes -r requirements.txt
      - name: Seite prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m monitor.waechter
